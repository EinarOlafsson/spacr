context:
  version: "1.4.9.8"

package:
  name: spacr
  version: ${{ version }}

source:
  url: https://github.com/EinarOlafsson/spacr/archive/refs/tags/v${{ version }}.tar.gz
  sha256: 2eff332d28b86b9cddb5c8f71ecf490a9d1f0164824bd9c1cd4bb8c8de6834eb

build:
  noarch: python
  number: 0
  script: python -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python >=3.9,<3.15,!=3.14.1
    - pip
    - setuptools >=64
    - wheel
  run:
    - python >=3.9,<3.15,!=3.14.1
    - numpy >=1.26.4,<3.0
    - pandas >=2.2.1,<3.0
    - scipy >=1.12.0,<2.0
    - numba >=0.60,<1.0
    - llvmlite >=0.43,<1.0
    - cellpose >=4.0,<5.0
    - scikit-image >=0.22.0,<0.28
    - scikit-learn >=1.5.0,<2.0
    - scikit-posthocs >=0.10.0,<0.20
    - trackpy >=0.6.2,<1.0
    - statsmodels >=0.13.0,<0.15
    - patsy >=0.5.6,<2.0
    - shap >=0.45.0,<1.0
    - pytorch >=2.0,<3.0
    - tensorboard >=2.21,<3.0
    - torchvision >=0.15,<1.0
    - captum >=0.7.0,<1.0
    - seaborn >=0.13.2,<1.0
    - matplotlib-base >=3.8.3,<4.0
    - matplotlib-venn >=1.1,<2.0
    - adjusttext >=1.2.0,<2.0
    - bottleneck >=1.3.6,<2.0
    - numexpr >=2.8.4,<3.0
    - opencv >=4.9.0,<5.0
    - pillow >=10.2.0,<13
    - tifffile >=2023.4.12
    - nd2reader >=3.3.0,<4.0
    - czifile
    - readlif
    - openpyxl >=3.1,<4.0
    - imageio >=2.34.0,<3.0
    - pingouin >=0.5.5,<0.6
    - umap-learn >=0.5.11,<1.0
    - xgboost >=2.0.3,<4
    - biopython >=1.80,<2.0
    - lxml >=5.1.0
    - psutil >=5.9.8,<8
    - gputil >=1.4.0,<2.0
    - pynvml >=11.5,<14
    - pytables >=3.8.0,<4.0
    - screeninfo >=0.8.1,<1.0
    - fastremap >=1.14.1
    - tqdm >=4.65.0
    - requests >=2.28,<3.0
    - joblib >=1.2,<2.0
    - natsort >=8.0,<9.0
    - sympy >=1.12,<2.0
    - ipython >=8.18.1,<10
    - ipywidgets >=8.1.2,<9.0
    - huggingface_hub >=0.25,<1.0
    - protobuf >=5.28.3

tests:
  - python:
      imports:
        - spacr
      pip_check: true
  - script:
      - spacr-run --list

about:
  homepage: https://github.com/EinarOlafsson/spacr
  summary: Spatial phenotype analysis of CRISPR screens
  description: |
    spaCR is an end-to-end toolkit for microscopy segmentation,
    measurement, timelapse analysis, computer vision, image embeddings,
    barcode mapping, and integrated perturbation-screen analysis.
  license: MIT
  license_file: LICENSE
  documentation: https://einarolafsson.github.io/spacr/
  repository: https://github.com/EinarOlafsson/spacr

extra:
  recipe-maintainers:
    - EinarOlafsson
