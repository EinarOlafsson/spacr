schema_version: 1

context:
  version: "1.5.1.4"

package:
  name: spacr
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/spacr/spacr-${{ version }}.tar.gz
  sha256: 32113621263f931862d5ab63fb507819d2172276edb3bfdf42210bf3e7eea7bb

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . --no-deps --no-build-isolation -vv
  python:
    entry_points:
      - spacr = spacr.qt:run
      - spacr-qt = spacr.qt:run
      - spacr-nightly = spacr.qt:run
      - spaceout = spacr.qt.spaceout:main
      - safespacr = spacr.qt.safespacr:main
      - spacr-server = spacr.qt:run_without_setup
      - spacr-tutorial = spacr.qt.tutorial.__main__:main
      - spacr-repro = spacr.cli_repro:main
      - spacr-workspace = spacr.cli_workspace:main
      - spacr-make-masks = spacr.cli_make_masks:main
      - spacr-run = spacr.cli:main
      - spacr-download = spacr.cli_download:main
      - spacr-remote = spacr.cli_remote:main
      - spacr-plugins = spacr.cli_plugins:main
      - spacr-leakage = spacr.cli_leakage:main
      - spacr-db-audit = spacr.cli_database:main
      - spacr-doctor = spacr.doctor:main

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=64
    - wheel
  run:
    - python >=${{ python_min }},<3.15,!=3.14.1
    - packaging >=21.3
    - cloudpickle >=3.1.2,<4
    - czifile
    - numpy >=1.26.4,<3.0
    - pandas >=2.2.1,<4.0
    - scipy >=1.12.0,<2.0
    - cellpose >=4.0.7,<5.0
    # cellpose 4.1.1 imports this at runtime but its current conda-forge
    # package omits the dependency.
    - segment-anything >=1.0,<2.0
    - scikit-image >=0.22.0,<0.28
    - pywavelets >=1.4,<2
    - scikit-learn >=1.5.0,<2.0
    - scikit-posthocs >=0.10.0,<0.20
    - trackpy >=0.6.2,<1.0
    - statsmodels >=0.14.0,<0.15
    - patsy >=0.5.6,<2.0
    - shap >=0.47.0,<1.0
    - pytorch >=2.0,<3.0
    - pyfixest >=0.40.1,<1
    - glum >=3.1.2,<4
    - gpytorch >=1.11,<2
    - tensorboard >=2.21,<3.0
    - numba >=0.60,<1.0
    - llvmlite >=0.43,<1.0
    - torchvision >=0.15,<1.0
    - captum >=0.7.0,<1.0
    - seaborn >=0.13.2,<1.0
    - matplotlib-base >=3.8.3,<4.0
    - matplotlib-venn >=1.1,<2.0
    - pypdf >=6.16.1,<7.0
    - cycler >=0.10,<1
    - pyqtgraph >=0.13.3,<1
    - mpmath >=1.3,<2
    - vispy >=0.14,<1.0
    - adjusttext >=1.2.0,<2.0
    - bottleneck >=1.3.6,<2.0
    - numexpr >=2.8.4,<3.0
    - opencv >=4.9.0,<5.0
    - pillow >=10.2.0,<13
    - tifffile >=2023.4.12
    - nd2reader >=3.3.0,<4.0
    - readlif
    - openpyxl >=3.1,<4.0
    - imageio >=2.34.0,<3.0
    - umap-learn >=0.5.11,<1.0
    - xgboost >=2.0.3,<4
    - biopython >=1.80,<2.0
    - lxml >=5.1.0
    - psutil >=5.9.8,<8
    - gputil >=1.4.0,<2.0
    - nvidia-ml-py >=11.450.51,<14
    - pytables >=3.8.0,<4.0
    - screeninfo >=0.8.1,<1.0
    - fastremap >=1.14.1
    - tqdm >=4.65.0
    - requests >=2.28,<3.0
    - joblib >=1.2,<2.0
    - natsort >=8.0,<9.0
    - sympy >=1.12,<2.0
    - ipython >=8.18.1,<10
    - ipywidgets >=8.1.2,<9.0
    - huggingface_hub >=0.25,<1.0
    - protobuf >=5.28.3
    # The conda package exposes the desktop entry point, so its GUI runtime
    # must be explicit rather than relying on cellpose to pull a Qt binding.
    - pyside6 >=6.6,<7
    - qtawesome >=1.3,<2

tests:
  - python:
      imports:
        - spacr
      # conda-forge's segment-anything package provides the importable module
      # without PyPI dist-info, so pip check reports a false missing dependency.
      # The script test below imports segment_anything and the spaCR GUI directly.
      pip_check: false
      python_version:
        - ${{ python_min }}
        - "*"
  - requirements:
      run:
        - python ${{ python_min }}.*
    script:
      - python -c "import cellpose, segment_anything, torch; from spacr import measure; from spacr.qt import run; assert callable(run)"
      - python -c "import shutil; names = ('spacr', 'spacr-qt', 'spacr-nightly', 'spaceout', 'safespacr', 'spacr-server', 'spacr-tutorial', 'spacr-repro', 'spacr-workspace', 'spacr-make-masks', 'spacr-run', 'spacr-download', 'spacr-remote', 'spacr-plugins', 'spacr-leakage', 'spacr-db-audit', 'spacr-doctor'); assert all(shutil.which(name) for name in names)"
      - spacr-run --list

about:
  summary: Spatial phenotype analysis of CRISPR screens
  license: BSD-3-Clause
  license_file: LICENSE
  homepage: https://github.com/EinarOlafsson/spacr
  repository: https://github.com/EinarOlafsson/spacr
  documentation: https://einarolafsson.github.io/spacr/

extra:
  recipe-maintainers:
    - EinarOlafsson
