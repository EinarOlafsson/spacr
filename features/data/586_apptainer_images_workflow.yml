# PROPOSED, NOT ACTIVE. Item 586. For the maintainer to review and, if wanted,
# copy to .github/workflows/apptainer-images.yml. Nothing in the repository
# calls this file where it is.
#
# Builds the Apptainer images FROM the Docker images docker-images.yml has
# already pushed for a release, runs the SIF's own %test (the no-model smoke
# test) and, for the CPU image, the Mask + Measure smoke test, and only then
# pushes each SIF to GHCR as an ORAS artifact beside the Docker image:
#
#   apptainer pull oras://ghcr.io/einarolafsson/spacr-sif:<version>-cpu
#   apptainer pull oras://ghcr.io/einarolafsson/spacr-sif:<version>-cuda12.4
#
# The CUDA SIF is built and %test-ed on a CPU runner; hosted runners have no
# GPU, so its --nv run is the maintainer's local check (see the item file).
#
# Wire it into release.yml after the docker-images job, e.g.
#
#   apptainer:
#     needs: docker
#     uses: ./.github/workflows/apptainer-images.yml
#     with: { release_version: ${{ needs.version.outputs.version }} }
#     permissions: { contents: read, packages: write }
#
# As with the Docker images, GHCR makes a new package private; flip
# spacr-sif to public once after the first push.

name: apptainer-images

on:
  workflow_call:
    inputs:
      release_version:
        description: Version whose Docker images the SIFs are built from
        required: true
        type: string
      publish:
        description: Push the built SIFs to GHCR
        required: false
        type: boolean
        default: true
  workflow_dispatch:
    inputs:
      release_version:
        description: Version whose Docker images the SIFs are built from
        required: true
        type: string
      publish:
        description: Push the built SIFs to GHCR
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

concurrency:
  group: apptainer-images-${{ inputs.release_version }}
  cancel-in-progress: false

jobs:
  sif:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: cpu
            tag_suffix: cpu
          - variant: cuda
            tag_suffix: cuda12.4
    env:
      VERSION: ${{ inputs.release_version }}
      VARIANT: ${{ matrix.variant }}
      SUFFIX: ${{ matrix.tag_suffix }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v${{ inputs.release_version }}

      - uses: eWaterCycle/setup-apptainer@v2
        with:
          apptainer-version: 1.5.4

      - name: Free disk for the CUDA image
        if: matrix.variant == 'cuda'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          df -h /

      - name: Work out the source image and the SIF reference
        id: ref
        run: |
          set -euo pipefail
          owner=$(printf '%s' "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "image=ghcr.io/$owner/spacr:$VERSION-$SUFFIX" >> "$GITHUB_OUTPUT"
          echo "sif=oras://ghcr.io/$owner/spacr-sif:$VERSION-$SUFFIX" >> "$GITHUB_OUTPUT"

      - name: Build (runs the definition's %test)
        env:
          IMAGE: ${{ steps.ref.outputs.image }}
        run: |
          set -euo pipefail
          apptainer build --build-arg "IMAGE=$IMAGE" \
              "spacr-$VARIANT.sif" packaging/apptainer/spacr.def

      - name: Version inside the SIF matches the release
        run: |
          set -euo pipefail
          got=$(apptainer exec "spacr-$VARIANT.sif" spacr --version | tr -d '\r' | awk '{print $NF}')
          test "$got" = "$VERSION" || { echo "::error::SIF holds $got, release is $VERSION"; exit 1; }

      - name: Mask + Measure smoke test (CPU)
        run: |
          set -euo pipefail
          apptainer exec --cleanenv "spacr-$VARIANT.sif" \
              python /opt/spacr/smoke_pipeline.py --mask

      - name: Push
        if: inputs.publish
        env:
          SIF_REF: ${{ steps.ref.outputs.sif }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "$TOKEN" | apptainer registry login \
              --username "${{ github.actor }}" --password-stdin oras://ghcr.io
          apptainer push "spacr-$VARIANT.sif" "$SIF_REF"
