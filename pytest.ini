[pytest]
testpaths = tests
addopts =
    -ra
    --strict-markers
    --strict-config
# NO -q HERE, deliberately. Verbosity is CUMULATIVE: a -q in addopts plus the
# -q that CI and every developer types on the command line makes -qq, and -qq
# suppresses pytest's "N passed / N failed" summary line entirely. A run then
# prints a row of dots, exits 1, and looks fine.
#
# That is not hypothetical. It is how a ratchet test that had been closed at
# zero offenders on 2026-08-03 regressed unnoticed until 2026-08-10, and two
# agents auditing fixes had to parse --junitxml to get a number a summary line
# should have given them. CI's own logs carried no count for the same reason.
#
# Anyone who wants quiet output should pass -q; they will now get the summary
# with it, which is what -q means on its own.
filterwarnings =
    error::FutureWarning:pandas\..*
    error::DeprecationWarning:pandas\..*
    error::FutureWarning:sklearn\..*
    error::DeprecationWarning:sklearn\..*
    error::pandas.errors.SettingWithCopyWarning
    error:Downcasting object dtype arrays.*:FutureWarning
    error:Setting an item of incompatible dtype is deprecated.*:FutureWarning
    ignore::DeprecationWarning:tensorflow.*
    ignore::DeprecationWarning:tensorboard.*
    ignore::UserWarning:matplotlib.*
    ignore::DeprecationWarning:pydantic.*
    ignore::FutureWarning:statsmodels.*
    ignore:invalid escape sequence:DeprecationWarning
markers =
    integration: test crosses module, process, database, or complete workflow boundaries
    qt: test exercises the supported PySide6 interface
    gpu: test requires CUDA and auto-skips when no usable GPU is detected
    nas: test requires configured NAS data and auto-skips when unavailable
    network: test auto-runs when its endpoint is reachable, otherwise skips
    heavy: test is slow or resource-heavy (>10s / >1GB memory)
    slow: end-to-end pipeline / training test (>30s wall-clock)
    gui: test drives a live Tk main loop (needs a display)
