name: lightweight online installers

on:
  workflow_call:
    inputs:
      source_ref:
        description: Commit containing the version to build
        required: false
        type: string
        default: ""
      target_branch:
        description: Branch that receives spacr/application and README links
        required: false
        type: string
        default: ""
      publish_to_repository:
        description: Commit the generated installers into the target branch
        required: false
        type: boolean
        default: false
    outputs:
      release_commit:
        description: Commit containing the collected installers
        value: ${{ jobs.collect.outputs.commit_sha }}
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    name: Linux online installer
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_ref || github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build versioned .run installer
        run: packaging/online/build_linux_online.sh
      - name: Validate shell syntax and dry-run contract
        run: |
          installer=$(find dist/online -name '*Linux*x86_64*Online.run' -print -quit)
          test -n "$installer"
          bash -n "$installer"
          "$installer" \
            --dry-run \
            --torch-backend cpu \
            --launcher-dir "$RUNNER_TEMP/bin" \
            --skip-system-deps \
            --no-launch \
            --install-root "$RUNNER_TEMP/spacr"
      - name: Install and import the released Linux application
        run: |
          installer=$(find dist/online -name '*Linux*x86_64*Online.run' -print -quit)
          "$installer" \
            --torch-backend cpu \
            --launcher-dir "$RUNNER_TEMP/bin" \
            --skip-system-deps \
            --no-launch \
            --install-root "$RUNNER_TEMP/spacr"
          test -s "$RUNNER_TEMP/spacr/install.log"
          "$RUNNER_TEMP/spacr/venv/bin/python" -I -c \
            "import spacr, PySide6, torch; assert torch.version.cuda is None"
      - uses: actions/upload-artifact@v6
        with:
          name: spacr-online-linux
          path: dist/online/*Linux*x86_64*Online.run
          if-no-files-found: error

  windows:
    name: Windows online installer
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_ref || github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install NSIS
        shell: powershell
        run: choco install nsis --yes --no-progress
      - name: Validate PowerShell bootstrap dry run
        shell: powershell
        run: |
          $VersionMatch = Select-String -Path "setup.py" -Pattern '^VERSION\s*=\s*["'']([^"'']+)'
          $Version = $VersionMatch.Matches[0].Groups[1].Value
          & .\packaging\online\install_spacr_windows.ps1 `
            -DryRun `
            -InstallRoot (Join-Path $env:RUNNER_TEMP "SpaCR") `
            -Version $Version `
            -TorchBackend cpu
      - name: Install and import the released Windows application
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $VersionMatch = Select-String -Path "setup.py" -Pattern '^VERSION\s*=\s*["'']([^"'']+)'
          $Version = $VersionMatch.Matches[0].Groups[1].Value
          $InstallRoot = Join-Path $env:RUNNER_TEMP "SpaCR"
          & .\packaging\online\install_spacr_windows.ps1 `
            -InstallRoot $InstallRoot `
            -Version $Version `
            -TorchBackend cpu
          if (-not (Test-Path (Join-Path $InstallRoot "install.log"))) {
            throw "The installer did not preserve install.log"
          }
          & (Join-Path $InstallRoot "venv\Scripts\python.exe") -I -c `
            "import spacr, PySide6, torch; assert torch.version.cuda is None"
      - name: Build small NSIS web installer
        shell: powershell
        run: .\packaging\online\build_windows_online.ps1
      - uses: actions/upload-artifact@v6
        with:
          name: spacr-online-windows
          path: dist/online/*Windows*Online-Setup.exe
          if-no-files-found: error

  macos:
    name: macOS universal online installer
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_ref || github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build small .pkg web installer
        run: packaging/online/build_macos_online.sh
      - name: Inspect package and bootstrap scripts
        run: |
          pkg=$(find dist/online -name '*macOS*Online.pkg' -print -quit)
          test -n "$pkg"
          pkgutil --check-signature "$pkg" || true
          pkgutil --payload-files "$pkg" | grep 'Applications/SpaCR.app'
          bash -n packaging/online/install_spacr_unix.sh
          packaging/online/install_spacr_unix.sh \
            --platform macos \
            --dry-run \
            --torch-backend cpu \
            --launcher-dir "$RUNNER_TEMP/bin" \
            --no-launch \
            --install-root "$RUNNER_TEMP/spacr"
      - name: Install and import the released macOS application
        run: |
          version=$(python packaging/release.py version)
          packaging/online/install_spacr_unix.sh \
            --platform macos \
            --package-spec "spacr[qt]==$version" \
            --torch-backend cpu \
            --launcher-dir "$RUNNER_TEMP/bin" \
            --no-launch \
            --install-root "$RUNNER_TEMP/spacr"
          test -s "$RUNNER_TEMP/spacr/install.log"
          "$RUNNER_TEMP/spacr/venv/bin/python" -I -c \
            "import spacr, PySide6, torch; assert torch.version.cuda is None"
      - uses: actions/upload-artifact@v6
        with:
          name: spacr-online-macos
          path: dist/online/*macOS*Online.pkg
          if-no-files-found: error

  collect:
    name: Store installers and update README
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_call' && inputs.publish_to_repository)
    needs: [linux, windows, macos]
    runs-on: ubuntu-24.04
    outputs:
      commit_sha: ${{ steps.commit.outputs.commit_sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          fetch-depth: 0
      - uses: actions/download-artifact@v6
        with:
          pattern: spacr-online-*
          path: installers
          merge-multiple: true
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Collect current installers and rewrite README links
        env:
          TARGET_BRANCH: ${{ inputs.target_branch || github.ref_name }}
        run: |
          python -m pip install "packaging>=24"
          python packaging/release.py collect \
            --source installers \
            --destination spacr/application \
            --readme README.rst \
            --branch "$TARGET_BRANCH"
      - name: Commit generated application installers
        id: commit
        env:
          TARGET_BRANCH: ${{ inputs.target_branch || github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.rst spacr/application
          if git diff --cached --quiet; then
            echo "Installer files and links are already current."
          else
            version=$(python packaging/release.py version)
            git commit -m "chore(release): add SpaCR $version installers"
            git push origin "HEAD:$TARGET_BRANCH"
          fi
          echo "commit_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
