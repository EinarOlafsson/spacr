name: lightweight online installers

on:
  workflow_call:
    inputs:
      source_ref:
        description: Commit containing the version to build
        required: false
        type: string
        default: ""
      target_branch:
        description: Branch that receives spacr/application and README links
        required: false
        type: string
        default: ""
      publish_to_repository:
        description: Commit the generated installers into the target branch
        required: false
        type: boolean
        default: false
    outputs:
      release_commit:
        description: Commit containing the collected installers
        value: ${{ jobs.collect.outputs.commit_sha }}
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    name: Linux online installer
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_ref || github.sha }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build versioned .run installer
        run: packaging/online/build_linux_online.sh
      - name: Validate shell syntax and dry-run contract
        run: |
          installer=$(find dist/online -name '*Linux*x86_64*Online.run' -print -quit)
          test -n "$installer"
          bash -n "$installer"
          for language in en sv de es zh_CN pt hi ko is fr; do
            SPACR_INSTALL_LANGUAGE="$language" "$installer" \
              --dry-run \
              --torch-backend cpu \
              --launcher-dir "$RUNNER_TEMP/bin" \
              --skip-system-deps \
              --no-launch \
              --install-root "$RUNNER_TEMP/spacr-dry-$language"
          done
      - name: Install and import the checked-out Linux application
        run: |
          installer=$(find dist/online -name '*Linux*x86_64*Online.run' -print -quit)
          "$installer" \
            --package-spec "$GITHUB_WORKSPACE[qt]" \
            --torch-backend cpu \
            --launcher-dir "$RUNNER_TEMP/bin" \
            --no-launch \
            --install-root "$RUNNER_TEMP/spacr"
          test -s "$RUNNER_TEMP/spacr/install.log"
          test -s "$RUNNER_TEMP/spacr/install-profile.json"
          "$RUNNER_TEMP/spacr/venv/bin/python" -I -c \
            "import json, pathlib, spacr, PySide6, torch; p=json.loads(pathlib.Path('$RUNNER_TEMP/spacr/install-profile.json').read_text()); assert torch.version.cuda is None; assert p['requested_backend'] == 'cpu'; assert p['active_backend'] == 'cpu'; assert not any(p['consent'].values())"
          "$RUNNER_TEMP/spacr/venv/bin/python" -I -c \
            "import pathlib; from spacr.updater import upgrade_command; c=upgrade_command(); assert pathlib.Path(c[0]).resolve() == pathlib.Path('$RUNNER_TEMP/spacr/bootstrap/uv').resolve(); assert c[1:3] == ['pip', 'install']; assert '-m' not in c"
          "$RUNNER_TEMP/spacr/venv/bin/python" -I \
            packaging/online/smoke_installed.py
      - uses: actions/upload-artifact@v7
        with:
          name: spacr-online-linux
          path: dist/online/*Linux*x86_64*Online.run
          if-no-files-found: error

  windows:
    name: Windows online installer
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_ref || github.sha }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install NSIS
        shell: powershell
        run: choco install nsis --yes --no-progress
      - name: Validate PowerShell bootstrap dry run
        shell: powershell
        run: |
          python .\packaging\i18n\render.py
          if ($LASTEXITCODE -ne 0) {
            throw "Installer locale generation failed with exit code $LASTEXITCODE"
          }
          $CatalogPath = (Resolve-Path ".\packaging\online\generated\installer_messages.ps1").Path
          $CatalogText = [System.IO.File]::ReadAllText(
            $CatalogPath,
            [System.Text.Encoding]::UTF8
          )
          [System.IO.File]::WriteAllText(
            $CatalogPath,
            $CatalogText,
            (New-Object System.Text.UTF8Encoding($true))
          )
          $ParserInputs = @(
            ".\packaging\online\install_spacr_windows.ps1",
            ".\packaging\online\generated\installer_messages.ps1"
          )
          foreach ($ParserInput in $ParserInputs) {
            $Tokens = $null
            $ParseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $ParserInput).Path,
              [ref]$Tokens,
              [ref]$ParseErrors
            ) | Out-Null
            if ($ParseErrors.Count -ne 0) {
              $ParseErrors | ForEach-Object { Write-Host $_.Message }
              throw "PowerShell parser rejected $ParserInput"
            }
          }
          $VersionMatch = Select-String -Path "setup.py" -Pattern '^VERSION\s*=\s*["'']([^"'']+)'
          $Version = $VersionMatch.Matches[0].Groups[1].Value
          $Languages = @("en", "sv", "de", "es", "zh_CN", "pt", "hi", "ko", "is", "fr")
          foreach ($Language in $Languages) {
            $DryRunRoot = Join-Path $env:RUNNER_TEMP "spaCR-dry-$Language"
            & powershell.exe -NoProfile -ExecutionPolicy Bypass `
              -File .\packaging\online\install_spacr_windows.ps1 `
              -DryRun `
              -InstallRoot $DryRunRoot `
              -Version $Version `
              -TorchBackend cpu `
              -Language $Language
            if ($LASTEXITCODE -ne 0) {
              throw "PowerShell dry run failed for $Language"
            }
          }
      - name: Build small NSIS web installer
        shell: powershell
        run: .\packaging\online\build_windows_online.ps1
      - name: Install and import the checked-out Windows application
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $InstallRoot = Join-Path $env:RUNNER_TEMP "spaCR"
          $env:SPACR_PACKAGE_SPEC = "$((Resolve-Path .).Path)[qt]"
          $Installer = Get-ChildItem "dist\online\*Windows*Online-Setup.exe" |
            Select-Object -First 1
          if (-not $Installer) {
            throw "The NSIS installer was not built"
          }
          $Process = Start-Process `
            -FilePath $Installer.FullName `
            -ArgumentList @("/S", "/D=$InstallRoot") `
            -Wait `
            -PassThru
          $InstallLog = Join-Path $InstallRoot "install.log"
          if ($Process.ExitCode -ne 0 -or -not (Test-Path $InstallLog)) {
            Write-Host "NSIS process exit code: $($Process.ExitCode)"
            $CandidateRoots = @(
              $InstallRoot,
              (Join-Path $env:LOCALAPPDATA "spaCR")
            ) | Select-Object -Unique
            foreach ($CandidateRoot in $CandidateRoots) {
              Write-Host "Installer candidate root: $CandidateRoot"
              if (Test-Path $CandidateRoot) {
                Get-ChildItem $CandidateRoot -Force | Format-Table -AutoSize
                Get-ChildItem $CandidateRoot `
                  -Filter "*bootstrap*.txt" `
                  -Force `
                  -ErrorAction SilentlyContinue | ForEach-Object {
                    Write-Host "--- $($_.FullName)"
                    Get-Content $_.FullName
                  }
                $CandidateLog = Join-Path $CandidateRoot "install.log"
                if (Test-Path $CandidateLog) {
                  Write-Host "--- $CandidateLog (tail)"
                  Get-Content $CandidateLog -Tail 100
                }
              }
            }
            throw "NSIS install failed or did not preserve install.log"
          }
          if (-not (Test-Path (Join-Path $InstallRoot "spacr.ico"))) {
            throw "The installer did not install the spaCR application icon"
          }
          if (-not (Test-Path (Join-Path $InstallRoot "install-profile.json"))) {
            throw "The installer did not record its backend/consent profile"
          }
          & (Join-Path $InstallRoot "venv\Scripts\python.exe") -I -c `
            "import json, pathlib, spacr, PySide6, torch; p=json.loads((pathlib.Path(r'$InstallRoot')/'install-profile.json').read_text()); assert torch.version.cuda is None; assert p['requested_backend'] == 'cpu'; assert p['active_backend'] == 'cpu'; assert not any(p['consent'].values())"
          & (Join-Path $InstallRoot "venv\Scripts\python.exe") -I -c `
            "import pathlib; from spacr.updater import upgrade_command; c=upgrade_command(); assert pathlib.Path(c[0]).resolve() == (pathlib.Path(r'$InstallRoot')/'bootstrap'/'uv.exe').resolve(); assert c[1:3] == ['pip', 'install']; assert '-m' not in c"
          & (Join-Path $InstallRoot "venv\Scripts\python.exe") -I `
            packaging\online\smoke_installed.py
      - uses: actions/upload-artifact@v7
        with:
          name: spacr-online-windows
          path: dist/online/*Windows*Online-Setup.exe
          if-no-files-found: error

  macos:
    name: macOS universal online installer
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_ref || github.sha }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build small .pkg web installer
        run: packaging/online/build_macos_online.sh
      - name: Inspect package and bootstrap scripts
        run: |
          pkg=$(find dist/online -name '*macOS*Online.pkg' -print -quit)
          test -n "$pkg"
          pkgutil --check-signature "$pkg" || true
          pkgutil --payload-files "$pkg" | grep 'Applications/spaCR.app'
          bash -n packaging/online/install_spacr_unix.sh
          packaging/online/install_spacr_unix.sh \
            --platform macos \
            --dry-run \
            --torch-backend cpu \
            --launcher-dir "$RUNNER_TEMP/bin" \
            --no-launch \
            --install-root "$RUNNER_TEMP/spacr"
      - name: Install and import the checked-out macOS application
        run: |
          pkg=$(find dist/online -name '*macOS*Online.pkg' -print -quit)
          sudo installer -verboseR -pkg "$pkg" -target /
          test -s "/Applications/spaCR.app/Contents/Resources/spaCR.icns"
          test -L /usr/local/bin/spacr
          SPACR_NO_RELAUNCH=1 \
            SPACR_PACKAGE_SPEC="$GITHUB_WORKSPACE[qt]" \
            "/Library/Application Support/spaCR/install-for-user.sh"
          runtime="$HOME/Library/Application Support/spaCR"
          test -s "$runtime/install.log"
          test -s "$runtime/install-profile.json"
          "$runtime/venv/bin/python" -I -c \
            "import numpy as np, spacr, PySide6, torch; \
             assert torch.backends.mps.is_available(); \
             assert torch.from_numpy(np.zeros(1, dtype=np.float32)).numel() == 1"
          "$runtime/venv/bin/python" -I -c \
            "import json, pathlib; p=json.loads((pathlib.Path.home()/'Library/Application Support/spaCR/install-profile.json').read_text()); assert p['requested_backend'] == 'auto'; assert p['active_backend'] == 'mps'; assert not any(p['consent'].values())"
          "$runtime/venv/bin/python" -I -c \
            "import pathlib; from spacr.updater import upgrade_command; c=upgrade_command(); assert pathlib.Path(c[0]).resolve() == (pathlib.Path.home()/'Library/Application Support/spaCR/bootstrap/uv').resolve(); assert c[1:3] == ['pip', 'install']; assert '-m' not in c"
          "$runtime/venv/bin/python" -I packaging/online/smoke_installed.py
      - uses: actions/upload-artifact@v7
        with:
          name: spacr-online-macos
          path: dist/online/*macOS*Online.pkg
          if-no-files-found: error

  collect:
    name: Store installers and update README
    if: >-
      github.event_name == 'workflow_call' && inputs.publish_to_repository
    needs: [linux, windows, macos]
    runs-on: ubuntu-24.04
    outputs:
      commit_sha: ${{ steps.commit.outputs.commit_sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          pattern: spacr-online-*
          path: installers
          merge-multiple: true
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Collect current installers and rewrite README links
        env:
          TARGET_BRANCH: ${{ inputs.target_branch || github.ref_name }}
        run: |
          python -m pip install "packaging>=24"
          python packaging/release.py collect \
            --source installers \
            --destination spacr/application \
            --readme README.rst \
            --localized-readme-dir docs/i18n/readme \
            --branch "$TARGET_BRANCH"
      # `collect` above rewrote the README's three links to the version just
      # released, so the previous version is now unreachable from anywhere in
      # the project. The archive page is the only path back to it, and it is
      # regenerated from the published release list rather than edited --
      # a hand-maintained table of download links is wrong one release later.
      - name: Regenerate the installer archive page
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python packaging/release.py index --output docs/source/installers.rst
      - name: Commit generated application installers
        id: commit
        env:
          TARGET_BRANCH: ${{ inputs.target_branch || github.ref_name }}
        run: |
          git config user.name "Einar Olafsson"
          git config user.email "einar.olafsson@gmail.com"
          git add README.rst \
            docs/i18n/readme/README.{sv,de,es,zh_CN,pt,hi,ko,is,fr}.rst \
            docs/source/installers.rst \
            spacr/application
          if git diff --cached --quiet; then
            echo "Installer files and links are already current."
          else
            version=$(python packaging/release.py version)
            git commit -m "chore(release): add spaCR $version installers"
            git push origin "HEAD:$TARGET_BRANCH"
          fi
          echo "commit_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
