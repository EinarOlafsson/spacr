name: compat-matrix

# ---------------------------------------------------------------------------
# The compatibility grid.
#
# spaCR claims Python 3.10-3.12 on Linux, macOS and Windows. Before this
# workflow existed, exactly one cell of that grid had ever been executed:
# ubuntu-22.04 / CPython 3.10, in tests.yml. Every other claim in the
# classifiers, the README and the install docs was inference from wheel
# metadata — strong inference for "will it install", no evidence at all for
# "will it run".
#
# This workflow converts the inference into builds. It deliberately does NOT
# run the 45-minute suite on every platform (tests.yml owns that on Linux);
# it runs the cheap, decisive part — does it install, does `import spacr`
# succeed, is the packaging metadata self-consistent — and then runs the full
# suite on the non-Linux platforms as an *informational* step that reports
# but never decides.
#
# Honesty rules for this file:
#   * A cell whose failure is already understood is marked
#     `experimental: true` and carries a `why:` naming the reason and the
#     remediation wave that clears it. It shows yellow, not green.
#   * A cell with no known blocker is blocking. If it goes red, that is a
#     finding, not a flake.
#   * Nothing is excluded from the grid silently. Platforms that cannot be
#     tested here (Intel macOS, Windows-on-ARM) are documented in comments
#     below with the reason, so nobody re-derives it.
#
# Not run on every branch push: the grid is wide and most of it is slow.
# main/nightly, PRs to main, a weekly cron, and manual dispatch.
# ---------------------------------------------------------------------------

on:
  push:
    branches: [main, nightly, spacr-nightly]
  pull_request:
    branches: [main]
  schedule:
    # Mondays 05:00 UTC. Upstream wheel availability is the thing most
    # likely to change under us; a weekly run notices it without anybody
    # having to remember to look.
    - cron: "0 5 * * 1"
  workflow_dispatch:

jobs:
  # -------------------------------------------------------------------------
  # 1. Packaging metadata. Cheap, fast, blocking. No scientific stack.
  # -------------------------------------------------------------------------
  metadata:
    name: Packaging metadata
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install packaging tooling only
        # Deliberately NOT `pip install -e .` — this job must prove the
        # metadata is right without the 4 GB of torch that would hide a
        # metadata bug behind a resolver failure.
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine pytest packaging

      - name: Build sdist and wheel
        run: python -m build --outdir dist .

      - name: twine check
        run: python -m twine check dist/*

      - name: Assert the built metadata carries Requires-Python
        # The regression this guards: setup.py used to declare no
        # python_requires at all, and pyproject.toml was three lines of
        # build-system. `pip install spacr` on 3.13 therefore resolved,
        # downloaded several hundred MB, and died inside a source build of
        # numpy 1.26.4 with a compiler error. If this assertion ever fails,
        # that experience is back.
        run: |
          python - <<'PY'
          import glob, zipfile, sys
          wheels = glob.glob("dist/*.whl")
          assert wheels, "no wheel was built"
          z = zipfile.ZipFile(wheels[0])
          name = next(n for n in z.namelist() if n.endswith("dist-info/METADATA"))
          md = z.read(name).decode()
          lines = [l for l in md.splitlines() if l.startswith("Requires-Python:")]
          assert lines, "built wheel has no Requires-Python -- pip cannot decline early"
          print(lines[0])
          assert "Operating System :: OS Independent" not in md, \
              "OS Independent classifier is back; it is not true (no Windows-on-ARM support)"
          PY

      - name: Packaging self-consistency tests
        # These import nothing from spacr; they read setup.py and
        # pyproject.toml as data. That is why they can run in a job with no
        # scientific stack installed.
        run: python -m pytest tests/test_packaging_metadata.py -q --no-header

  # -------------------------------------------------------------------------
  # 2. Python 3.13 installs, and installs WITHOUT A COMPILER.
  #
  # This job is the inversion of the one it replaces. Until 2026-07-27 it was
  # called "3.13 install is refused cleanly" and it was GREEN when pip
  # DECLINED: 3.13 was outside `requires-python`, and the job asserted that
  # pip said so in one sentence rather than grinding through a source build of
  # numpy 1.26.4 and dying on a compiler error.
  #
  # That assertion is now false by design. numpy is `>=1.26.4,<3.0`, mahotas
  # (no cp313 wheel, ever) is in the `zernike` extra and torchcam (which
  # declares `numpy<2.0.0`) is in the `attribution` extra, so 3.13 resolves to
  # wheels the whole way down. Keeping the old job would have made this
  # workflow red the moment requires-python widened — which is exactly what
  # the note in pyproject.toml warned about.
  #
  # Two assertions, and the second is the one that matters:
  #
  #   a) the resolve succeeds on 3.13 at all; and
  #   b) it succeeds with `--only-binary :all:`, i.e. every package in the
  #      graph has a cp313 wheel and NOTHING is built from source.
  #
  # (b) is the real user-facing promise. The failure mode this whole exercise
  # existed to kill was never "pip refuses" — it was a scientist on a cluster
  # login node with no gcc watching a numpy or mahotas sdist explode fifteen
  # minutes in. A green (a) with a red (b) means we have moved the compiler
  # requirement rather than removed it, so (b) is blocking too.
  #
  # Deliberately `--dry-run`: this job answers "does the graph resolve to
  # wheels", and it must answer in under a minute. The *real* 3.13 install and
  # import sweep is a cell in the matrix below.
  # -------------------------------------------------------------------------
  python-313-installs:
    name: 3.13 installs, from wheels only
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: pip must accept spacr on 3.13
        run: |
          python -m pip install --upgrade pip
          set +e
          out=$(python -m pip install --dry-run --no-deps . 2>&1)
          rc=$?
          set -e
          echo "$out"
          if [ $rc -ne 0 ]; then
            echo "::error::pip refused spacr on Python 3.13. requires-python claims >=3.10,<3.14 and the classifiers claim 3.13."
            exit 1
          fi
          echo "OK: pip accepted spacr on 3.13."

      - name: no COMPILED dependency may build from source
        # --only-binary :all: makes pip fail rather than fall back to a source
        # build. That is the entire point: a user without a C++ toolchain must
        # be able to `pip install spacr` on 3.13.
        #
        # Three core dependencies are exempted by --no-binary, and the reason
        # is not "they were in the way". trackpy, matplotlib-venn and gputil
        # publish an sdist and no wheel AT ALL, on any Python — trackpy's
        # newest wheel is 0.3.3, matplotlib-venn and GPUtil have never shipped
        # one. All three are pure Python: their "build" is setuptools copying
        # .py files, it needs no compiler, and it is what every spaCR install
        # on every version has always done. Excluding them keeps this step
        # asking the question that matters (does anything need a COMPILER)
        # instead of a question with a known, harmless answer.
        #
        # If you add a package here, prove it is pure Python first. A wheel-less
        # package with a C extension is exactly the failure this step exists to
        # catch, and adding it to this list is how you would hide one.
        #
        # torch comes from the CPU index because the default CUDA wheel is
        # ~2.5 GB and would exhaust the runner disk; it is not part of what is
        # being tested here.
        #
        # Verified by hand on 2026-07-27 in throwaway conda envs on CPython
        # 3.10.20, 3.11.15, 3.12.13 and 3.13.14: all four resolve, landing on
        # numpy 2.2.6 (3.10) and numpy 2.4.6 (3.11-3.13).
        run: |
          set +e
          out=$(python -m pip install --dry-run \
                  --only-binary :all: \
                  --no-binary trackpy,matplotlib-venn,gputil \
                  --extra-index-url https://download.pytorch.org/whl/cpu \
                  ".[qt]" 2>&1)
          rc=$?
          set -e
          echo "$out"
          if [ $rc -ne 0 ]; then
            echo "::error::spacr does not resolve to wheels on Python 3.13 -- something in the graph needs a compiler."
            echo "::error::Find the package with no cp313 wheel in the log above and move it to an extra, the way mahotas and torchcam were."
            exit 1
          fi
          echo "$out" | grep -oE "Would install .*" | tr ' ' '\n' | grep -E "^numpy-" || true
          echo "OK: every compiled package in the core+qt graph has a cp313 wheel."

      - name: mahotas and torchcam must NOT be in the core resolve
        # The two packages whose absence from the core install is what makes
        # 3.13 work. If either reappears in `dependencies`, the step above
        # would still pass on a runner that has gcc -- it would just silently
        # start compiling. This step names them, so the regression is legible
        # instead of showing up as a slow build.
        run: |
          python - <<'PY'
          import ast, pathlib, re, sys
          tree = ast.parse(pathlib.Path("setup.py").read_text(encoding="utf-8"))
          deps = next(
              ast.literal_eval(n.value)
              for n in tree.body
              if isinstance(n, ast.Assign)
              and any(getattr(t, "id", None) == "dependencies" for t in n.targets)
          )
          names = {re.split(r"[<>=!~;\[ ]", d.strip())[0].lower() for d in deps}
          back = sorted({"mahotas", "torchcam"} & names)
          if back:
              print(f"::error::{back} is back in setup.py's core dependencies. "
                    f"mahotas has no cp313 wheel at any version and torchcam "
                    f"declares numpy<2.0.0; either one re-breaks Python 3.13.")
              sys.exit(1)
          print("OK: mahotas and torchcam are extras-only.")
          PY

  # -------------------------------------------------------------------------
  # 3. The platform grid: install, import, and (off Linux) the full suite as
  #    an informational step.
  #
  # Platforms deliberately absent, with reasons, so nobody re-derives them:
  #
  #   * macOS x86-64 (Intel). GitHub retired the `macos-13` hosted runner;
  #     macos-14/15/26 are all Apple silicon. Intel macOS therefore CANNOT be
  #     tested on hosted runners at any price. It is also the matrix's worst
  #     cell: the last torch with any macOS x86_64 wheel is 2.2.2, so
  #     `torch>=2.0,<3.0` silently backtracks to a torch released two years
  #     before the Cellpose 4 code that runs on it. The install SUCCEEDS,
  #     which is what makes it dangerous. Verify by hand on an Intel Mac, or
  #     drop the `Operating System :: MacOS` claim to arm64 only.
  #
  #   * Windows-on-ARM (`windows-11-arm`). The runner exists; the platform
  #     does not. torch has never published a win_arm64 wheel for any
  #     version, and neither has numpy<2.0, opencv-python-headless, mahotas,
  #     pylibCZIrw or aicspylibczi. PySide6 *does* ship win_arm64, which is
  #     the trap: the GUI layer installs and the compute layer cannot. A cell
  #     here would be permanently yellow and would teach nobody anything.
  #
  #   * CUDA and ROCm. No hosted runner has a GPU. tests/test_gpu_pipeline.py
  #     and the `gpu` mark exist for a self-hosted runner; wire one up and
  #     this is where its cell goes.
  # -------------------------------------------------------------------------
  install:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    continue-on-error: ${{ matrix.experimental }}

    strategy:
      fail-fast: false
      matrix:
        include:
          # --- control cell -------------------------------------------------
          # Same platform as tests.yml, cheaper path. Its only job is to make
          # a red macOS/Windows cell attributable to the platform rather than
          # to this workflow.
          - label: "Linux x86-64 / py3.12 (control)"
            os: ubuntu-22.04
            python-version: "3.12"
            experimental: false
            why: "control"

          # --- Linux x86-64 / 3.13 ------------------------------------------
          # The newest Python spaCR claims, and the reason this workflow was
          # rewritten. BLOCKING, not experimental: 3.13 now has a classifier
          # and a requires-python that admits it, so if this cell is red the
          # claim is false and we want to know loudly.
          #
          # It installs `.[qt,dev,zernike]` rather than `.[qt,dev]` on purpose.
          # mahotas has no cp313 wheel and builds from sdist; this runner has
          # a toolchain, so asking for the extra here is what keeps
          # spacr.measure and the Zernike features under test on 3.13 instead
          # of quietly untested. The promise that a 3.13 user needs no
          # compiler is a promise about the CORE install, and the
          # `python-313-installs` job above proves that separately with
          # `--only-binary :all:`.
          - label: "Linux x86-64 / py3.13"
            os: ubuntu-22.04
            python-version: "3.13"
            experimental: false
            why: "newest claimed Python; blocking"

          # --- Linux ARM64 --------------------------------------------------
          # Previously expected red, for two reasons that are now both gone:
          #   * mahotas 1.4.18 publishes NO aarch64 wheel at all (the last
          #     aarch64 build was 1.4.13, cp36-cp39). It has left the core
          #     dependencies for the `zernike` extra, so a core install on ARM
          #     no longer compiles it.
          #   * psutil 5.9.8 (the old `<6.0` pin, which admitted exactly one
          #     release) publishes manylinux x86_64 and i686 only. The pin is
          #     now `<8`, and psutil 6/7 publish aarch64.
          # It stays `experimental: true` for one more run rather than being
          # promoted on the strength of the argument: no aarch64 install has
          # actually been observed green yet. Promote it the first time it
          # passes, and delete this paragraph when you do.
          - label: "Linux ARM64 / py3.11"
            os: ubuntu-24.04-arm
            python-version: "3.11"
            experimental: true
            why: "both known aarch64 blockers (mahotas, psutil<6.0) are resolved; awaiting a first green run before promoting to blocking"

          # --- Windows x86-64 -----------------------------------------------
          # The install is expected to succeed. The *suite* is expected to
          # find things, because spaCR is full of POSIX assumptions: cv2
          # .imwrite return values dropped on the crop path, mixed '/' and
          # '\' separators written into png_list.png_path, console output
          # unencodable in the Windows codepage, MAX_PATH overflow at ~116
          # characters of source path, and the spawn re-import tax with an
          # uncapped n_jobs. None of that is fatal at install; all of it is
          # fatal at use. That is why the full suite runs here as an
          # informational step.
          - label: "Windows x86-64 / py3.11"
            os: windows-2022
            python-version: "3.11"
            experimental: true
            why: "POSIX assumptions in paths, encodings and multiprocessing"

          # --- macOS Apple silicon ------------------------------------------
          # Installs and runs. On the CPU. Always. `torch.backends.mps`,
          # `torch.mps` and the string 'mps' appear zero times under spacr/;
          # all 17 `torch.device(...)` sites resolve `cuda ? cuda : cpu`, and
          # spaCR passes an explicit `device=torch.device('cpu')` into
          # Cellpose, which overrides Cellpose's own working MPS detection.
          # A green cell here means "it ran", not "it used the GPU".
          # Cleared by: the device-resolver work (not in this workflow's
          # scope) — this cell will keep passing either way, which is the
          # honest limit of what CI can tell you here.
          - label: "macOS arm64 / py3.11"
            os: macos-15
            python-version: "3.11"
            experimental: true
            why: "no MPS support in spacr; CPU-only, and Cellpose MPS is actively overridden"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install system libraries (Linux only)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          # Installed one at a time and tolerantly: the Qt runtime package
          # names differ between 22.04 and 24.04 (libasound2 became
          # libasound2t64 in the t64 transition), and a single unknown name
          # would otherwise abort the whole list.
          for pkg in \
            libegl1 libxkbcommon0 libdbus-1-3 libpulse0 \
            libx11-xcb1 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-sync1 \
            libxcb-xfixes0 libxcb-xinerama0 libxcb-xkb1 libxkbcommon-x11-0 \
            libgl1 libglib2.0-0 libnss3 libxcomposite1 libxcursor1 \
            libxdamage1 libxi6 libxtst6 libasound2t64 libasound2 \
            libsm6 libxext6 libxrender1 ffmpeg ; do
            sudo apt-get install --no-install-recommends -y "$pkg" || \
              echo "skip: $pkg not available on this release"
          done

      - name: Install CPU-only torch (Linux, Windows)
        if: runner.os != 'macOS'
        shell: bash
        run: |
          python -m pip install --upgrade pip
          # The CUDA wheel is ~2.5 GB and would exhaust the runner disk.
          python -m pip install --index-url https://download.pytorch.org/whl/cpu \
            "torch>=2.0" "torchvision"

      - name: Install torch (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          python -m pip install --upgrade pip
          # No separate CPU index for macOS: the PyPI macOS wheels are the
          # CPU/MPS build. (On Intel macOS this is where pip would silently
          # backtrack to torch 2.2.2 — see the comment above about why that
          # cell cannot be tested on hosted runners.)
          python -m pip install "torch>=2.0" "torchvision"

      - name: Install spacr
        # `zernike` is requested explicitly because mahotas is no longer a
        # core dependency, and spacr/measure.py still imports
        # `mahotas.features.zernike_moments` at module scope. Without the
        # extra, `import spacr.measure` in the next step would fail on EVERY
        # cell, which would say nothing about the platform. On 3.13 this
        # compiles mahotas from sdist (no cp313 wheel exists); these runners
        # have a toolchain, and the no-compiler promise for the core install
        # is proved by the `python-313-installs` job instead.
        shell: bash
        run: python -m pip install -e ".[qt,dev,zernike]"

      - name: Show the pins that gate this cell
        shell: bash
        run: |
          python -c "import sys, platform; print(sys.version); print(platform.platform(), platform.machine())"
          python -m pip list --format=freeze | grep -Ei \
            '^(numpy|scipy|torch|torchvision|cellpose|mahotas|opencv-python-headless|pillow|psutil|lxml|PySide6|pandas|scikit-image)=' || true

      - name: Import spacr
        # `import spacr` alone is a meaningful test on a new platform: it is
        # what fails when a module-scope `from mahotas.features import
        # zernike_moments` or `from pylibCZIrw import czi` has no wheel.
        #
        # spacr.timelapse is listed explicitly because it was the single
        # module that failed to import under numpy 2 (a `np.trapz` that numpy
        # 2.0 removed, behind a `scipy.integrate.trapz` fallback that SciPy
        # 1.14 had already removed). With numpy widened to `<3.0` this is the
        # import that proves the fix on every platform rather than just on the
        # machine where it was written.
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
          MPLBACKEND: Agg
        run: |
          python -c "import spacr; print('spacr', spacr.__version__)"
          python -c "import spacr.io, spacr.measure, spacr.utils, spacr.timelapse; print('core modules import')"
          python -c "import numpy; print('numpy', numpy.__version__)"

      - name: Packaging + smoke subset (decides this cell)
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
          MPLBACKEND: Agg
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python -m pytest tests/test_packaging_metadata.py tests/test_smoke.py \
            -q --no-header -m "not slow and not heavy and not gpu and not network"

      - name: Full suite (informational, never decides)
        # Linux already runs this in tests.yml; running it again here would
        # double the bill for no new information.
        if: runner.os != 'Linux'
        continue-on-error: true
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
          MPLBACKEND: Agg
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python -m pytest tests/ \
            --ignore=tests/test_gpu_pipeline.py \
            -m "not slow and not heavy and not gpu and not network" \
            -q --no-header --tb=short

  # -------------------------------------------------------------------------
  # 4. Upstream wheel availability. Informational, never blocking.
  #
  # Every "cannot support Python 3.13" and "cannot install on ARM Linux"
  # claim in the compatibility plan rests on which wheels exist on PyPI --
  # facts that change without warning and in our favour. This job restates
  # them as a table in the run summary each week, so the day mahotas ships a
  # cp313 wheel somebody notices, instead of the ceiling staying at 3.12 out
  # of habit.
  #
  # Note for whoever reads the table: a naive "is there a cp313 tag" scan
  # UNDER-reports. `abi3` wheels (opencv-python-headless ships cp37-abi3,
  # PySide6 ships cp310-abi3) and `py3-none-any` wheels (cellpose, xgboost,
  # btrack, umap-learn, seaborn, transformers, tifffile, monai, captum) work
  # on every later Python unchanged. The script below counts those as
  # compatible, because treating them as blockers is how you talk yourself
  # out of a version you already support.
  # -------------------------------------------------------------------------
  wheel-availability:
    name: Upstream wheel availability (informational)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true

    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Query PyPI
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, urllib.request

          # The packages that actually gate the matrix. Not the whole
          # dependency list -- the ones a plan decision hangs on.
          PACKAGES = [
              "numpy", "mahotas", "psutil", "pylibCZIrw", "torch",
              "torchvision", "opencv-python-headless", "pillow", "lxml",
              "scipy", "PySide6",
          ]
          PYTAGS = ["cp310", "cp311", "cp312", "cp313", "cp314"]
          PLATS = {
              "linux-x86_64": ("manylinux", "x86_64"),
              "linux-aarch64": ("manylinux", "aarch64"),
              "macos-arm64": ("macosx", "arm64"),
              "macos-x86_64": ("macosx", "x86_64"),
              "win-amd64": ("win", "amd64"),
              "win-arm64": ("win", "arm64"),
          }

          def files(pkg):
              url = f"https://pypi.org/pypi/{pkg}/json"
              with urllib.request.urlopen(url, timeout=30) as r:
                  data = json.load(r)
              ver = data["info"]["version"]
              return ver, data["releases"].get(ver, [])

          print("## Upstream wheel availability\n")
          print("`any` = pure-Python (`py3-none-any`) or `abi3`; works on every")
          print("later CPython unchanged. `-` = no wheel, source build only.\n")
          header = "| package | latest | " + " | ".join(PYTAGS) + " | platforms |"
          print(header)
          print("|" + "---|" * (len(PYTAGS) + 3))

          for pkg in PACKAGES:
              try:
                  ver, fs = files(pkg)
              except Exception as exc:                      # informational job
                  print(f"| {pkg} | query failed: {exc} | | | | | | |")
                  continue
              names = [f["filename"] for f in fs if f["filename"].endswith(".whl")]
              universal = any("py3-none-any" in n or "abi3" in n for n in names)
              cells = []
              for tag in PYTAGS:
                  if universal:
                      cells.append("any")
                  else:
                      cells.append("yes" if any(f"-{tag}-" in n for n in names) else "-")
              plats = [k for k, (a, b) in PLATS.items()
                       if any(a in n and b in n for n in names)]
              print(f"| {pkg} | {ver} | " + " | ".join(cells) + " | "
                    + (", ".join(plats) or "none") + " |")
          PY
