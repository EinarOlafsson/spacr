name: compat-matrix

# ---------------------------------------------------------------------------
# The compatibility grid.
#
# spaCR claims Python 3.9-3.14 on Linux, macOS and Windows. Before this
# workflow existed, exactly one cell of that grid had ever been executed:
# ubuntu-24.04 / CPython 3.10, in tests.yml. Every other claim in the
# classifiers, the README and the install docs was inference from wheel
# metadata — strong inference for "will it install", no evidence at all for
# "will it run".
#
# This workflow converts the inference into builds. It deliberately does NOT
# run the 45-minute suite on every platform (tests.yml owns that on Linux);
# it runs the cheap, decisive part — does it install, does `import spacr`
# succeed, is the packaging metadata self-consistent — and then runs the full
# suite on the non-Linux platforms as an *informational* step that reports
# but never decides.
#
# Honesty rules for this file:
#   * A cell whose failure is already understood is marked
#     `experimental: true` and carries a `why:` naming the reason and the
#     remediation wave that clears it. It shows yellow, not green.
#   * A cell with no known blocker is blocking. If it goes red, that is a
#     finding, not a flake.
#   * Nothing is excluded from the grid silently. Platforms that cannot be
#     tested here (Intel macOS, Windows-on-ARM) are documented in comments
#     below with the reason, so nobody re-derives it.
#
# Not run on every branch push: the grid is wide and most of it is slow.
# main/nightly, PRs to main, a weekly cron, and manual dispatch.
# ---------------------------------------------------------------------------

on:
  push:
    branches: [main, nightly]
  pull_request:
    branches: [main]
  schedule:
    # Mondays 05:00 UTC. Upstream wheel availability is the thing most
    # likely to change under us; a weekly run notices it without anybody
    # having to remember to look.
    - cron: "0 5 * * 1"
  workflow_dispatch:

# One run per ref, newest wins. The grid is wide and slow, so a run of pushes
# to the same branch is the most expensive thing that can happen to the
# runner pool: on 5 August it queued a full grid per commit, starved every
# runner for hours, and held the docs deploy behind it. Only the newest
# commit on a branch is worth the grid.
#
# SPLIT BY EVENT, for the reason written out at length in tests.yml: the
# informational sweep here is capped at 90 minutes and pushes to nightly land
# every 5-25, so a grid triggered by anything slower than the push cadence is
# cancelled every time and the workflow reports nothing at all. This file has
# a second victim tests.yml does not: the Monday cron. A scheduled run shared
# the group with pushes to the same ref, so the one run whose entire purpose
# is to notice upstream wheel availability without anybody remembering to
# look could be destroyed by an unrelated commit, silently and weekly.
#
# A push still cancels the previous PUSH grid, so the 5 August protection is
# exactly as it was. Only a deliberately dispatched run is exempt, and cron
# now merely gets a lane of its own rather than an exemption.
concurrency:
  group: compat-matrix-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  # -------------------------------------------------------------------------
  # 1. Packaging metadata. Cheap, fast, blocking. No scientific stack.
  # -------------------------------------------------------------------------
  metadata:
    name: Packaging metadata
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      # A failed-job re-run can reuse a successful metadata job from an older
      # run attempt. Passing the name as a job output makes that re-run fetch
      # the artifact which actually exists, not reconstruct a newer name.
      distribution_artifact: ${{ steps.distribution_name.outputs.name }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install packaging tooling only
        # Deliberately NOT `pip install -e .` — this job must prove the
        # metadata is right without the 4 GB of torch that would hide a
        # metadata bug behind a resolver failure.
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine pytest packaging

      - name: Build sdist and wheel
        run: python -m build --outdir dist .

      - name: twine check
        run: python -m twine check dist/*

      - name: Audit built artifact inventories
        run: |
          python - <<'PY'
          import subprocess
          import tarfile
          import zipfile
          from pathlib import Path

          wheel = next(Path("dist").glob("*.whl"))
          sdist = next(Path("dist").glob("*.tar.gz"))
          tracked = set(subprocess.check_output(
              ["git", "ls-files", "spacr"], text=True).splitlines())

          pruned_roots = (
              "spacr/resources/home/",
              "spacr/resources/icons/backup_icons/",
          )
          excluded_files = {
              "spacr/resources/.DS_Store",
              "spacr/resources/icons/.DS_Store",
              "spacr/resources/icons/loading_spinner_1.gif",
              "spacr/resources/icons/loading_spinner_logo.gif",
              "spacr/resources/icons/loading_spinner_logo (1).gif",
              "spacr/resources/icons/loading_spinner_logo",
          }

          def is_runtime_python(name):
              return name.endswith(".py") and not name.startswith(pruned_roots)

          def is_runtime_resource(name):
              if (name in excluded_files
                      or name.startswith(pruned_roots)
                      or name.startswith("spacr/resources/models/")):
                  return False
              return (
                  (name.startswith("spacr/resources/data/")
                   and name.endswith(".csv"))
                  or name.startswith("spacr/resources/icons/")
                  or name.startswith("spacr/resources/font/")
                  or name.startswith("spacr/resources/setting_animations/")
                  or (name.startswith("spacr/resources/themes/")
                      and name.endswith(".jpg"))
              )

          required = {
              name for name in tracked
              if is_runtime_python(name) or is_runtime_resource(name)
          }
          with zipfile.ZipFile(wheel) as archive:
              wheel_names = set(archive.namelist())
          with tarfile.open(sdist) as archive:
              sdist_names = {
                  name.split("/", 1)[1]
                  for name in archive.getnames()
                  if "/" in name
              }

          forbidden_roots = pruned_roots + ("spacr/resources/models/",)
          for label, names in (("wheel", wheel_names), ("sdist", sdist_names)):
              missing = sorted(required - names)
              forbidden = sorted(
                  name for name in names
                  if name in excluded_files or name.startswith(forbidden_roots)
              )
              assert not missing, f"{label} omits runtime files: {missing}"
              assert not forbidden, f"{label} ships excluded files: {forbidden}"
              print(f"{label}: {len(required)} required runtime files present")
          PY

      - name: Name this immutable distribution bundle
        id: distribution_name
        shell: bash
        run: echo "name=spacr-distributions-${{ github.run_id }}-${{ github.run_attempt }}" >> "$GITHUB_OUTPUT"

      - name: Upload the exact distributions for the platform grid
        uses: actions/upload-artifact@v7
        with:
          # run_attempt prevents a re-run from colliding with the first
          # attempt's immutable artifact; the matrix downloads this exact name.
          name: ${{ steps.distribution_name.outputs.name }}
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error
          retention-days: 7

      - name: Install and run the built wheel and sdist
        shell: bash
        run: |
          set -euo pipefail
          expected=$(python packaging/release.py version)
          wheel=$(find dist -maxdepth 1 -type f -name '*.whl' -print -quit)
          sdist=$(find dist -maxdepth 1 -type f -name '*.tar.gz' -print -quit)
          test -n "$wheel"
          test -n "$sdist"

          for artifact in "$wheel" "$sdist"; do
            artifact_name=$(basename "$artifact")
            environment="$RUNNER_TEMP/spacr-artifact-${artifact_name//[^A-Za-z0-9]/-}"
            python -m venv "$environment"
            "$environment/bin/python" -m pip install --upgrade pip
            "$environment/bin/python" -m pip install --no-deps "$artifact"

            EXPECTED_VERSION="$expected" SPACR_DISABLE_PLUGINS=1 \
              "$environment/bin/python" -I - <<'PY'
          import importlib.metadata
          import os
          import site
          from pathlib import Path

          import spacr

          installed = Path(spacr.__file__).resolve()
          roots = tuple(Path(path).resolve() for path in site.getsitepackages())
          assert any(installed.is_relative_to(root) for root in roots), (
              f"spacr resolved outside the isolated install: {installed}"
          )
          assert spacr.__version__ == os.environ["EXPECTED_VERSION"]
          assert importlib.metadata.version("spacr") == spacr.__version__
          print(f"installed {spacr.__version__} from {installed}")
          PY

            version=$(SPACR_DISABLE_PLUGINS=1 \
              "$environment/bin/spacr-run" --version)
            test "$version" = "$expected"
            listing=$(SPACR_DISABLE_PLUGINS=1 \
              "$environment/bin/spacr-run" --list)
            grep -q '^  measure' <<<"$listing"
          done

      - name: Assert the built metadata carries Requires-Python
        # The regression this guards: setup.py used to declare no
        # python_requires at all, and pyproject.toml was three lines of
        # build-system. `pip install spacr` on 3.13 therefore resolved,
        # downloaded several hundred MB, and died inside a source build of
        # numpy 1.26.4 with a compiler error. If this assertion ever fails,
        # that experience is back.
        run: |
          python - <<'PY'
          import glob, zipfile, sys
          wheels = glob.glob("dist/*.whl")
          assert wheels, "no wheel was built"
          z = zipfile.ZipFile(wheels[0])
          name = next(n for n in z.namelist() if n.endswith("dist-info/METADATA"))
          md = z.read(name).decode()
          lines = [l for l in md.splitlines() if l.startswith("Requires-Python:")]
          assert lines, "built wheel has no Requires-Python -- pip cannot decline early"
          print(lines[0])
          assert "Operating System :: OS Independent" not in md, \
              "OS Independent classifier is back; it is not true (no Windows-on-ARM support)"
          PY

      - name: Packaging self-consistency tests
        # These import nothing from spacr; they read setup.py and
        # pyproject.toml as data. That is why they can run in a job with no
        # scientific stack installed.
        run: >-
          python -m pytest --noconftest
          tests/test_packaging_metadata.py -q --no-header

  # -------------------------------------------------------------------------
  # 2. Newest Python versions install, and install WITHOUT A COMPILER.
  #
  # This job is the inversion of the one it replaces. Until 2026-07-27 it was
  # called "3.13 install is refused cleanly" and it was GREEN when pip
  # DECLINED: 3.13 was outside `requires-python`, and the job asserted that
  # pip said so in one sentence rather than grinding through a source build of
  # numpy 1.26.4 and dying on a compiler error.
  #
  # That assertion is now false by design. numpy is `>=1.26.4,<3.0`, mahotas
  # (no cp313 wheel, ever) is in the `zernike` extra and torchcam (which
  # declares `numpy<2.0.0`) is in the `attribution` extra, so 3.13 resolves to
  # wheels the whole way down. Keeping the old job would have made this
  # workflow red the moment requires-python widened — which is exactly what
  # the note in pyproject.toml warned about.
  #
  # Two assertions per interpreter, and the second is the one that matters:
  #
  #   a) the resolve succeeds at all; and
  #   b) it succeeds with `--only-binary :all:`, i.e. every compiled package
  #      in the graph has a compatible wheel and NOTHING is built from source.
  #
  # (b) is the real user-facing promise. The failure mode this whole exercise
  # existed to kill was never "pip refuses" — it was a scientist on a cluster
  # login node with no gcc watching a numpy or mahotas sdist explode fifteen
  # minutes in. A green (a) with a red (b) means we have moved the compiler
  # requirement rather than removed it, so (b) is blocking too.
  #
  # Deliberately `--dry-run`: this job answers "does the graph resolve to
  # wheels", and it must answer in under a minute. Real install and import
  # sweeps are cells in the matrix below.
  # -------------------------------------------------------------------------
  current-python-installs:
    name: ${{ matrix.python-version }} installs, from wheels only
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # spaCR deliberately admits the next interpreter before Qt does. PySide6
    # 6.11.2 declares <3.15, so this cell is expected to fail at the dependency
    # resolve until a compatible Qt release appears; its weekly run tells us
    # when that blocker has moved.
    continue-on-error: ${{ matrix.python-version == '3.15' }}
    strategy:
      fail-fast: false
      matrix:
        # THE WHOLE CLAIMED RANGE, not just the top of it. pyproject says
        # requires-python = ">=3.9,<3.16", and this job is the cheap check
        # that the claim is true -- it asks whether pip accepts spacr and
        # resolves to wheels. The 3.15 forward cell is informational until
        # PySide6 admits that interpreter; the other six remain blocking.
        #
        # It was ["3.13", "3.14"], which verified the two newest and left
        # 3.9 through 3.12 asserted by the metadata and tested by nothing.
        # A claimed floor nobody exercises is the same defect as the
        # cellpose one: pip resolves it happily and the failure lands on a
        # user instead of on CI.
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: pip must accept spacr on Python ${{ matrix.python-version }}
        run: |
          python -m pip install --upgrade pip
          set +e
          out=$(python -m pip install --dry-run --no-deps . 2>&1)
          rc=$?
          set -e
          echo "$out"
          if [ $rc -ne 0 ]; then
            echo "::error::pip refused spacr on Python ${{ matrix.python-version }}, which is claimed by Requires-Python and the classifiers."
            exit 1
          fi
          echo "OK: pip accepted spacr on Python ${{ matrix.python-version }}."

      - name: no COMPILED dependency may build from source
        # --only-binary :all: makes pip fail rather than fall back to a source
        # build. That is the entire point: a user without a C++ toolchain must
        # be able to `pip install spacr` on 3.13.
        #
        # Three core dependencies are exempted by --no-binary, and the reason
        # is not "they were in the way". trackpy, matplotlib-venn and gputil
        # publish an sdist and no wheel AT ALL, on any Python — trackpy's
        # newest wheel is 0.3.3, matplotlib-venn and GPUtil have never shipped
        # one. All three are pure Python: their "build" is setuptools copying
        # .py files, it needs no compiler, and it is what every spaCR install
        # on every version has always done. Excluding them keeps this step
        # asking the question that matters (does anything need a COMPILER)
        # instead of a question with a known, harmless answer.
        #
        # If you add a package here, prove it is pure Python first. A wheel-less
        # package with a C extension is exactly the failure this step exists to
        # catch, and adding it to this list is how you would hide one.
        #
        # torch comes from the CPU index because the default CUDA wheel is
        # ~2.5 GB and would exhaust the runner disk; it is not part of what is
        # being tested here.
        #
        # Verified by hand on 2026-07-27 in throwaway conda envs on CPython
        # 3.9.25, 3.10.20, 3.11.15, 3.12.13 and 3.13.14: all five resolve,
        # landing on the newest compatible NumPy line for each interpreter.
        run: |
          set +e
          out=$(python -m pip install --dry-run \
                  --only-binary :all: \
                  --no-binary trackpy,matplotlib-venn,gputil \
                  --extra-index-url https://download.pytorch.org/whl/cpu \
                  . 2>&1)
          rc=$?
          set -e
          echo "$out"
          if [ $rc -ne 0 ]; then
            echo "::error::spacr does not resolve to wheels on Python ${{ matrix.python-version }} -- something in the graph needs a compiler."
            echo "::error::Find the package without a compatible wheel in the log above and move optional native functionality behind a feature extra."
            exit 1
          fi
          echo "$out" | grep -oE "Would install .*" | tr ' ' '\n' | grep -E "^numpy-" || true
          echo "OK: every compiled package in the core+qt graph has a compatible wheel."

      - name: optional native features must NOT be in the core resolve
        # The two packages whose absence from the core install is what makes
        # 3.13 work. If either reappears in `dependencies`, the step above
        # would still pass on a runner that has gcc -- it would just silently
        # start compiling. This step names them, so the regression is legible
        # instead of showing up as a slow build.
        run: |
          python - <<'PY'
          import ast, pathlib, re, sys
          tree = ast.parse(pathlib.Path("setup.py").read_text(encoding="utf-8"))
          deps = next(
              ast.literal_eval(n.value)
              for n in tree.body
              if isinstance(n, ast.Assign)
              and any(getattr(t, "id", None) == "dependencies" for t in n.targets)
          )
          names = {re.split(r"[<>=!~;\[ ]", d.strip())[0].lower() for d in deps}
          back = sorted({"mahotas", "torchcam", "pylibczirw", "btrack"} & names)
          if back:
              print(f"::error::{back} is back in setup.py's core dependencies. "
                    f"One or more optional native features would re-break "
                    f"the newest supported Python.")
              sys.exit(1)
          print("OK: optional native features are extras-only.")
          PY

      - name: Install the core graph and import spaCR
        # The dry-run above proves that the graph resolves without a compiler;
        # this step proves the resulting environment really imports.  It is a
        # fresh setup-python environment with no spaCR extras installed, on
        # every interpreter claimed by Requires-Python.
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu \
            "torch>=2.0,<3.0" "torchvision>=0.15,<1.0"
          python -m pip install \
            --extra-index-url https://download.pytorch.org/whl/cpu .
          python - <<'PY'
          import importlib.metadata as metadata
          import spacr

          assert spacr.__version__
          absent = []
          for distribution in (
              "trackastra", "ultrack", "torchcam", "mahotas",
              "pylibCZIrw", "btrack", "catboost", "lightgbm",
          ):
              try:
                  metadata.version(distribution)
              except metadata.PackageNotFoundError:
                  absent.append(distribution)
          assert len(absent) == 8, (
              "an extras-only distribution leaked into the core install: "
              + ", ".join(sorted(set((
                  "trackastra", "ultrack", "torchcam", "mahotas",
                  "pylibCZIrw", "btrack", "catboost", "lightgbm",
              )) - set(absent)))
          )
          print("core-only import OK", spacr.__version__)
          PY

  # -------------------------------------------------------------------------
  # 3. The advertised fractal extra constructs the shipped default renderer.
  #
  # VisPy is core because DEFAULT_PATTERN is Mandelbrot, but the historical
  # `fractal` extra remains a supported spelling.  Installing it is not proof
  # that its dynamically loaded Qt/OpenGL backend can start, so this cell uses
  # Mesa under Xvfb and constructs the real widget rather than importing a
  # module or mocking the backend.
  # -------------------------------------------------------------------------
  fractal-runtime:
    name: Fractal extra constructs the default renderer
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install a software OpenGL display
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            xvfb libegl1 libgl1 libgl1-mesa-dri libx11-xcb1 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-sync1 \
            libxcb-xfixes0 libxcb-xinerama0 libxcb-xkb1 \
            libxkbcommon-x11-0

      - name: Install the advertised fractal extra
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu \
            "torch>=2.0,<3.0" "torchvision>=0.15,<1.0"
          python -m pip install \
            --extra-index-url https://download.pytorch.org/whl/cpu \
            ".[fractal]"

      - name: Verify Qt xcb plugin dependencies resolve
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess

          from PySide6.QtCore import QLibraryInfo

          plugin = (
              Path(QLibraryInfo.path(QLibraryInfo.PluginsPath))
              / "platforms"
              / "libqxcb.so"
          )
          assert plugin.is_file(), f"Qt xcb platform plugin is absent: {plugin}"
          result = subprocess.run(
              ["ldd", str(plugin)],
              check=True,
              capture_output=True,
              text=True,
          )
          print(result.stdout, end="")
          assert "not found" not in result.stdout, (
              "Qt xcb plugin has unresolved shared-library dependencies"
          )
          PY

      - name: Construct and paint the default renderer
        env:
          QT_QPA_PLATFORM: xcb
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          xvfb-run -a python - <<'PY'
          from PySide6.QtWidgets import QApplication

          from spacr.qt.fractal_defaults import DEFAULT_PATTERN
          from spacr.qt.widgets.fractal_travel import (
              Settings,
              create_fractal_widget,
          )

          assert DEFAULT_PATTERN == "mandelbrot"
          app = QApplication.instance() or QApplication([])
          widget = create_fractal_widget(Settings())
          try:
              widget.resize(320, 200)
              widget.show()
              for _ in range(12):
                  app.processEvents()
              assert widget.backend_name == "gpu", (
                  "the installed default silently fell back to CPU"
              )
              assert widget.isVisible()
              print("default fractal renderer constructed and painted")
          finally:
              widget.shutdown()
              widget.close()
              app.processEvents()
          PY

  # -------------------------------------------------------------------------
  # 4. The platform grid: install, import, and (off Linux) the full suite as
  #    an informational step.
  #
  # Platforms deliberately absent, with reasons, so nobody re-derives them:
  #
  #   * macOS x86-64 (Intel). GitHub retired the `macos-13` hosted runner;
  #     macos-14/15/26 are all Apple silicon. Intel macOS therefore CANNOT be
  #     tested on hosted runners at any price. It is also the matrix's worst
  #     cell: the last torch with any macOS x86_64 wheel is 2.2.2, so
  #     `torch>=2.0,<3.0` silently backtracks to a torch released two years
  #     before the Cellpose 4 code that runs on it. The install SUCCEEDS,
  #     which is what makes it dangerous. Verify by hand on an Intel Mac, or
  #     drop the `Operating System :: MacOS` claim to arm64 only.
  #
  #   * Windows-on-ARM (`windows-11-arm`). The runner exists; the platform
  #     does not. torch has never published a win_arm64 wheel for any
  #     version, and neither has numpy<2.0, opencv-python-headless, mahotas,
  #     pylibCZIrw or aicspylibczi. PySide6 *does* ship win_arm64, which is
  #     the trap: the GUI layer installs and the compute layer cannot. A cell
  #     here would be permanently yellow and would teach nobody anything.
  #
  #   * CUDA and ROCm. No hosted runner has a GPU. tests/test_gpu_pipeline.py
  #     and the `gpu` mark exist for a self-hosted runner; wire one up and
  #     this is where its cell goes.
  # -------------------------------------------------------------------------
  install:
    name: ${{ matrix.label }}
    needs: metadata
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    continue-on-error: ${{ matrix.experimental }}

    strategy:
      fail-fast: false
      matrix:
        include:
          # --- control cell -------------------------------------------------
          # Same platform as tests.yml, cheaper path. Its only job is to make
          # a red macOS/Windows cell attributable to the platform rather than
          # to this workflow.
          - label: "Linux x86-64 / py3.12 (control)"
            os: ubuntu-24.04
            python-version: "3.12"
            extras: "qt,dev,zernike"
            experimental: false
            why: "control"

          # --- Linux x86-64 / 3.9 and 3.10 ----------------------------------
          # The BOTTOM of the claimed range, which until now was asserted by
          # metadata and tested by nobody. 3.9 had only the install job and
          # 3.10 had nothing at all, so `requires-python = ">=3.9"` rested on
          # pip accepting the package rather than on the package working.
          #
          # Added only after checking these could go green, because a job
          # that cannot is worse than no job:
          #   * all 1027 files parse under `feature_version=(3, 9)`;
          #   * ZERO PEP 604 unions (`int | None`) sit in runtime-evaluated
          #     annotations, which is the usual way a tree that parses on 3.9
          #     still dies importing on it;
          #   * no post-3.9 stdlib API is used -- the 33 `override` hits a
          #     naive scan reports are a local variable, not `typing.override`;
          #   * every one of the 51 declared floors has a release in range
          #     with wheels for 3.9, checked against PyPI, and both install
          #     jobs are green.
          #
          # `experimental: true` for a first run anyway. The checks above rule
          # out the syntax and stdlib classes of failure; they say nothing
          # about a DEPENDENCY behaving differently on an older interpreter,
          # which is exactly what running the suite here is for. Promote to
          # blocking once green, or -- if it is not fixable -- narrow
          # requires-python and the README rather than deleting the cell.
          - label: "Linux x86-64 / py3.9 (floor)"
            os: ubuntu-24.04
            python-version: "3.9"
            extras: "qt,dev"
            experimental: false
            why: "the declared floor; green on its first suite run, so >=3.9 is a claim spaCR keeps and this cell enforces it"

          - label: "Linux x86-64 / py3.10"
            os: ubuntu-24.04
            python-version: "3.10"
            extras: "qt,dev,zernike"
            experimental: false
            why: "green on its first suite run; the claimed range is now blocking end to end"

          # --- Linux x86-64 / 3.13 ------------------------------------------
          # The newest Python spaCR claims, and the reason this workflow was
          # rewritten. BLOCKING, not experimental: 3.13 now has a classifier
          # and a requires-python that admits it, so if this cell is red the
          # claim is false and we want to know loudly.
          #
          # It requests `qt,dev,zernike` so the optional-dependency marker is
          # exercised too. mahotas has no cp313 wheel, so the zernike extra
          # deliberately excludes it at 3.13; the installed-artifact smoke
          # below proves core measurement still imports without that optional
          # backend. The compiler-free CORE promise is proved separately by
          # `current-python-installs` with `--only-binary :all:`.
          - label: "Linux x86-64 / py3.13"
            os: ubuntu-24.04
            python-version: "3.13"
            extras: "qt,dev,zernike"
            experimental: false
            why: "newest claimed Python; blocking"

          # --- Linux x86-64 / 3.14 ------------------------------------------
          # Core spaCR and Qt are blocking on the newest claimed interpreter.
          # This compiler-free smoke cell deliberately keeps only core + Qt;
          # optional native packages have their own dependency contracts, and
          # pylibCZIrw remains outside the tested 3.14 profile.
          - label: "Linux x86-64 / py3.14"
            os: ubuntu-24.04
            python-version: "3.14"
            extras: "qt,dev"
            experimental: false
            why: "newest claimed Python; blocking core and Qt support"

          # --- Linux ARM64 --------------------------------------------------
          # Previously expected red, for two reasons that are now both gone:
          #   * mahotas 1.4.18 publishes NO aarch64 wheel at all (the last
          #     aarch64 build was 1.4.13, cp36-cp39). It has left the core
          #     dependencies for the `zernike` extra, so a core install on ARM
          #     no longer compiles it.
          #   * psutil 5.9.8 (the old `<6.0` pin, which admitted exactly one
          #     release) publishes manylinux x86_64 and i686 only. The pin is
          #     now `<8`, and psutil 6/7 publish aarch64.
          # It stays `experimental: true` for one more run rather than being
          # promoted on the strength of the argument: no aarch64 install has
          # actually been observed green yet. Promote it the first time it
          # passes, and delete this paragraph when you do.
          - label: "Linux ARM64 / py3.11"
            os: ubuntu-24.04-arm
            python-version: "3.11"
            extras: "qt,dev,zernike"
            experimental: false
            why: "both known aarch64 blockers (mahotas, psutil<6.0) are resolved and the awaited green run has happened"

          # --- Windows x86-64 -----------------------------------------------
          # The install is expected to succeed. The *suite* is expected to
          # find things, because spaCR is full of POSIX assumptions: cv2
          # .imwrite return values dropped on the crop path, mixed '/' and
          # '\' separators written into png_list.png_path, console output
          # unencodable in the Windows codepage, MAX_PATH overflow at ~116
          # characters of source path, and the spawn re-import tax with an
          # uncapped n_jobs. None of that is fatal at install; all of it is
          # fatal at use. That is why the full suite runs here as an
          # informational step.
          - label: "Windows x86-64 / py3.11"
            os: windows-2022
            python-version: "3.11"
            extras: "qt,dev,zernike"
            experimental: true
            why: "POSIX assumptions in paths, encodings and multiprocessing"

          # --- macOS Apple silicon ------------------------------------------
          # Installs and runs. On the CPU. Always. `torch.backends.mps`,
          # `torch.mps` and the string 'mps' appear zero times under spacr/;
          # all 17 `torch.device(...)` sites resolve `cuda ? cuda : cpu`, and
          # spaCR passes an explicit `device=torch.device('cpu')` into
          # Cellpose, which overrides Cellpose's own working MPS detection.
          # A green cell here means "it ran", not "it used the GPU".
          # Cleared by: the device-resolver work (not in this workflow's
          # scope) — this cell will keep passing either way, which is the
          # honest limit of what CI can tell you here.
          - label: "macOS arm64 / py3.11"
            os: macos-15
            python-version: "3.11"
            extras: "qt,dev,zernike"
            experimental: true
            why: "no MPS support in spacr; CPU-only, and Cellpose MPS is actively overridden"

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Download the exact wheel and sdist built by metadata
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.metadata.outputs.distribution_artifact }}
          path: ${{ runner.temp }}/spacr-dist

      - name: Install system libraries (Linux only)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          # Installed one at a time and tolerantly: the Qt runtime package
          # names differ between 22.04 and 24.04 (libasound2 became
          # libasound2t64 in the t64 transition), and a single unknown name
          # would otherwise abort the whole list.
          for pkg in \
            libegl1 libxkbcommon0 libdbus-1-3 libpulse0 \
            libx11-xcb1 libxcb-cursor0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-sync1 \
            libxcb-xfixes0 libxcb-xinerama0 libxcb-xkb1 libxkbcommon-x11-0 \
            libgl1 libglib2.0-0 libnss3 libxcomposite1 libxcursor1 \
            libxdamage1 libxi6 libxtst6 libasound2t64 libasound2 \
            libsm6 libxext6 libxrender1 ffmpeg ; do
            sudo apt-get install --no-install-recommends -y "$pkg" || \
              echo "skip: $pkg not available on this release"
          done

      - name: Install OpenMP runtime (macOS only)
        if: runner.os == 'macOS'
        shell: bash
        run: brew install libomp

      - name: Install CPU-only torch (Linux, Windows)
        if: runner.os != 'macOS'
        shell: bash
        run: |
          python -m pip install --upgrade pip
          # The CUDA wheel is ~2.5 GB and would exhaust the runner disk.
          python -m pip install --index-url https://download.pytorch.org/whl/cpu \
            "torch>=2.0" "torchvision"

      - name: Install torch (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          python -m pip install --upgrade pip
          # No separate CPU index for macOS: the PyPI macOS wheels are the
          # CPU/MPS build. (On Intel macOS this is where pip would silently
          # backtrack to torch 2.2.2 — see the comment above about why that
          # cell cannot be tested on hosted runners.)
          python -m pip install "torch>=2.0" "torchvision"

      - name: Install and smoke the exact wheel and sdist
        # matrix.extras keeps each cell's existing feature profile: cells that
        # admit mahotas exercise Zernike, while the newest-Python cells prove
        # the lazy optional backend does not prevent core measurement import.
        # The no-compiler promise for the core graph is still owned by the
        # `current-python-installs` job above.
        # The harness resolves dependencies once from the downloaded wheel,
        # uninstalls spaCR, then makes each distribution the final project in
        # turn.  Its child probes use ``python -I`` from a temporary directory,
        # verify direct_url.json names the input archive, construct a real
        # AppScreen, and exercise the installed spacr-run entry point.  Exact
        # timings are evidence only; the 180-second guard catches a hang rather
        # than trying to compare unlike hosted-runner hardware.
        shell: bash
        run: |
          python -I packaging/smoke_distribution_artifacts.py \
            --dist-dir "${{ runner.temp }}/spacr-dist" \
            --extras "${{ matrix.extras }}" \
            --report "${{ runner.temp }}/spacr-installed-smoke.json"

      - name: Upload installed-artifact smoke evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          # job-index makes every matrix upload unique even when two cells use
          # the same Python. run_attempt keeps workflow re-runs immutable too.
          name: spacr-installed-smoke-${{ github.run_id }}-${{ github.run_attempt }}-${{ strategy.job-index }}
          path: ${{ runner.temp }}/spacr-installed-smoke.json
          if-no-files-found: warn
          retention-days: 14

      - name: Show the pins that gate this cell
        shell: bash
        run: |
          python -c "import sys, platform; print(sys.version); print(platform.platform(), platform.machine())"
          python -m pip list --format=freeze | grep -Ei \
            '^(numpy|scipy|torch|torchvision|cellpose|mahotas|opencv-python-headless|pillow|psutil|lxml|PySide6|pandas|scikit-image)=' || true

      - name: Recheck the final sdist install in isolated Python
        # `import spacr` alone is a meaningful test on a new platform: it is
        # what fails when a module-scope `from mahotas.features import
        # zernike_moments` or `from pylibCZIrw import czi` has no wheel.
        #
        # spacr.timelapse is listed explicitly because it was the single
        # module that failed to import under numpy 2 (a `np.trapz` that numpy
        # 2.0 removed, behind a `scipy.integrate.trapz` fallback that SciPy
        # 1.14 had already removed). With numpy widened to `<3.0` this is the
        # import that proves the fix on every platform rather than just on the
        # machine where it was written.
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
          MPLBACKEND: Agg
        run: |
          python -I -c "import spacr; print('spacr', spacr.__version__)"
          python -I -c "import spacr.io, spacr.measure, spacr.utils, spacr.timelapse; print('core modules import')"
          python -I -c "import numpy; print('numpy', numpy.__version__)"

      - name: Packaging + smoke subset (decides this cell)
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
          MPLBACKEND: Agg
        run: |
          python -m pytest tests/test_packaging_metadata.py tests/test_smoke.py \
            -q --no-header -m "not slow and not heavy"

      - name: Full suite (informational, never decides)
        # Linux already runs this in tests.yml; running it again here would
        # double the bill for no new information.  The Windows sweep is
        # intentionally expected to find failures.  Stop after 25 so an
        # xdist worker lost to a native access violation cannot leave the
        # surviving workers waiting until the 90-minute *job* timeout, whose
        # cancellation bypasses both continue-on-error guards and makes this
        # otherwise-informational matrix cell cancel the whole workflow.
        if: runner.os != 'Linux'
        continue-on-error: true
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
          MPLBACKEND: Agg
          OMP_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
          OPENBLAS_NUM_THREADS: "1"
        run: |
          python -m pytest tests/ \
            -m "not slow and not heavy" \
            --ignore=tests/test_perf_guard.py \
            -n 3 --dist loadfile --maxfail=25 \
            -q --no-header --tb=short
          python -m pytest tests/test_perf_guard.py \
            -m "not slow and not heavy" -q --no-header --tb=short
          python -m pytest tests/ \
            -m "(slow or heavy) and (gpu or network or nas)" \
            -n 3 --dist loadfile -q --no-header --tb=short

  # -------------------------------------------------------------------------
  # 5. Upstream wheel availability. Informational, never blocking.
  #
  # Every "cannot support Python 3.13" and "cannot install on ARM Linux"
  # claim in the compatibility plan rests on which wheels exist on PyPI --
  # facts that change without warning and in our favour. This job restates
  # them as a table in the run summary each week, so the day mahotas ships a
  # cp313 wheel somebody notices, instead of the ceiling staying at 3.12 out
  # of habit.
  #
  # Note for whoever reads the table: a naive "is there a cp313 tag" scan
  # UNDER-reports. `abi3` wheels (opencv-python-headless ships cp37-abi3,
  # PySide6 ships cp310-abi3) and `py3-none-any` wheels (cellpose, xgboost,
  # btrack, umap-learn, seaborn, transformers, tifffile, monai, captum) work
  # on every later Python unchanged. The script below counts those as
  # compatible, because treating them as blockers is how you talk yourself
  # out of a version you already support.
  # -------------------------------------------------------------------------
  wheel-availability:
    name: Upstream wheel availability (informational)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true

    steps:
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Query PyPI
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, urllib.request

          # The packages that actually gate the matrix. Not the whole
          # dependency list -- the ones a plan decision hangs on.
          PACKAGES = [
              "numpy", "mahotas", "psutil", "pylibCZIrw", "torch",
              "torchvision", "opencv-python-headless", "pillow", "lxml",
              "scipy", "PySide6",
          ]
          PYTAGS = ["cp310", "cp311", "cp312", "cp313", "cp314"]
          PLATS = {
              "linux-x86_64": ("manylinux", "x86_64"),
              "linux-aarch64": ("manylinux", "aarch64"),
              "macos-arm64": ("macosx", "arm64"),
              "macos-x86_64": ("macosx", "x86_64"),
              "win-amd64": ("win", "amd64"),
              "win-arm64": ("win", "arm64"),
          }

          def files(pkg):
              url = f"https://pypi.org/pypi/{pkg}/json"
              with urllib.request.urlopen(url, timeout=30) as r:
                  data = json.load(r)
              ver = data["info"]["version"]
              return ver, data["releases"].get(ver, [])

          print("## Upstream wheel availability\n")
          print("`any` = pure-Python (`py3-none-any`) or `abi3`; works on every")
          print("later CPython unchanged. `-` = no wheel, source build only.\n")
          header = "| package | latest | " + " | ".join(PYTAGS) + " | platforms |"
          print(header)
          print("|" + "---|" * (len(PYTAGS) + 3))

          for pkg in PACKAGES:
              try:
                  ver, fs = files(pkg)
              except Exception as exc:                      # informational job
                  print(f"| {pkg} | query failed: {exc} | | | | | | |")
                  continue
              names = [f["filename"] for f in fs if f["filename"].endswith(".whl")]
              universal = any("py3-none-any" in n or "abi3" in n for n in names)
              cells = []
              for tag in PYTAGS:
                  if universal:
                      cells.append("any")
                  else:
                      cells.append("yes" if any(f"-{tag}-" in n for n in names) else "-")
              plats = [k for k, (a, b) in PLATS.items()
                       if any(a in n and b in n for n in names)]
              print(f"| {pkg} | {ver} | " + " | ".join(cells) + " | "
                    + (", ".join(plats) or "none") + " |")
          PY
