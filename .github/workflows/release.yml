name: release spaCR

on:
  push:
    branches: [main]
    paths:
      - "setup.py"
  workflow_dispatch:
    inputs:
      version:
        description: New PEP 440 version (for example 1.4.9.9)
        required: true
        type: string
      target_branch:
        description: Branch to release
        required: true
        type: choice
        default: main
        options:
          - main

permissions:
  contents: write
  id-token: write

concurrency:
  group: spacr-release
  cancel-in-progress: false

jobs:
  bump:
    name: Prepare repository version
    if: github.event_name != 'push' || github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      commit_sha: ${{ steps.finalize.outputs.commit_sha }}
      branch: ${{ steps.finalize.outputs.branch }}
      pypi_exists: ${{ steps.availability.outputs.pypi_exists }}
      release_required: ${{ steps.version.outputs.release_required }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.target_branch || github.ref_name }}
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Validate release version
        id: version
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          python -m pip install "packaging>=24"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            version=$(python packaging/release.py bump \
              --allow-current "$REQUESTED_VERSION")
            release_required=true
          else
            version=$(python packaging/release.py version)
            release_required=true
            if git cat-file -e "$BEFORE_SHA:setup.py" 2>/dev/null; then
              git show "$BEFORE_SHA:setup.py" > "$RUNNER_TEMP/setup-before.py"
              previous=$(python packaging/release.py version \
                --setup "$RUNNER_TEMP/setup-before.py")
              if [ "$version" = "$previous" ]; then
                echo "::notice::setup.py changed but VERSION remains $version."
                release_required=false
              else
                python - "$previous" "$version" <<'PY'
          import sys
          from packaging.version import Version

          previous, current = map(Version, sys.argv[1:])
          if current <= previous:
              raise SystemExit(
                  f"VERSION must increase on a release push: {previous} -> {current}"
              )
          PY
              fi
            fi
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "release_required=$release_required" >> "$GITHUB_OUTPUT"

      - name: Commit version increment
        id: commit
        if: github.event_name == 'workflow_dispatch'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TARGET_BRANCH: ${{ inputs.target_branch }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add setup.py
          if git diff --cached --quiet; then
            echo "setup.py already declares $VERSION; continuing idempotently."
          else
            git commit -m "chore(release): bump version to $VERSION"
            git push origin "HEAD:$TARGET_BRANCH"
          fi

      - name: Check whether this version is already on PyPI
        id: availability
        if: steps.version.outputs.release_required == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          status=$(curl --proto '=https' --tlsv1.2 --silent \
            --retry 3 --retry-all-errors --output /dev/null \
            --write-out '%{http_code}' \
            "https://pypi.org/pypi/spacr/$VERSION/json")
          case "$status" in
            200) echo "pypi_exists=true" >> "$GITHUB_OUTPUT" ;;
            404) echo "pypi_exists=false" >> "$GITHUB_OUTPUT" ;;
            *)
              echo "::error::PyPI availability check returned HTTP $status."
              exit 1
              ;;
          esac

      - name: Export exact release source
        id: finalize
        if: steps.version.outputs.release_required == 'true'
        env:
          TARGET_BRANCH: ${{ inputs.target_branch || github.ref_name }}
        run: |
          echo "branch=$TARGET_BRANCH" >> "$GITHUB_OUTPUT"
          echo "commit_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  package:
    name: Build and validate PyPI distributions
    if: needs.bump.outputs.release_required == 'true'
    needs: bump
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.bump.outputs.commit_sha }}

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Build wheel and source distribution
        run: |
          python -m pip install --upgrade pip
          # pillow is here for tests/test_online_installers.py, which opens the
          # application icon to check its background and transparent corners.
          # This job builds in a bare environment rather than installing spaCR,
          # so the package's own `pillow>=10.2.0,<13` never arrives. The icon
          # test landed in 66e150b2 an hour after the last green release, so it
          # had never run here: the first release attempted after 30 July was
          # always going to fail on `ModuleNotFoundError: No module named 'PIL'`
          # with a wheel that had already built and passed `twine check`.
          python -m pip install build twine pytest packaging pyyaml "setuptools>=64" pillow
          python -m build
          python -m twine check dist/*
          python -m pytest --noconftest \
            tests/test_packaging_metadata.py \
            tests/test_online_installers.py \
            tests/test_conda_forge_recipe.py -q --tb=short

      - uses: actions/upload-artifact@v7
        with:
          name: pypi-distributions
          path: dist/*
          if-no-files-found: error

  publish-pypi:
    name: Publish to PyPI
    if: needs.bump.outputs.pypi_exists != 'true'
    needs: [bump, package]
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/project/spacr/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: pypi-distributions
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1

  verify-pypi:
    name: Verify release is available on PyPI
    if: >-
      always() &&
      needs.bump.result == 'success' &&
      needs.package.result == 'success' &&
      (needs.publish-pypi.result == 'success' ||
       needs.publish-pypi.result == 'skipped')
    needs: [bump, package, publish-pypi]
    runs-on: ubuntu-24.04
    steps:
      - name: Wait for the immutable PyPI release
        env:
          VERSION: ${{ needs.bump.outputs.version }}
        run: |
          for attempt in $(seq 1 18); do
            status=$(curl --proto '=https' --tlsv1.2 --silent \
              --retry 3 --retry-all-errors --output /dev/null \
              --write-out '%{http_code}' \
              "https://pypi.org/pypi/spacr/$VERSION/json")
            if [ "$status" = "200" ]; then
              echo "spacr $VERSION is available on PyPI."
              exit 0
            fi
            echo "Attempt $attempt/18: PyPI returned HTTP $status; retrying."
            sleep 10
          done
          echo "::error::spacr $VERSION was not available on PyPI after 3 minutes."
          exit 1

  installers:
    name: Build and store native installers
    if: >-
      always() &&
      needs.bump.result == 'success' &&
      needs.verify-pypi.result == 'success' &&
      needs.bump.outputs.release_required == 'true'
    needs: [bump, verify-pypi]
    uses: ./.github/workflows/online-installers.yml
    with:
      source_ref: ${{ needs.bump.outputs.commit_sha }}
      target_branch: ${{ needs.bump.outputs.branch }}
      publish_to_repository: true
    secrets: inherit

  github-release:
    name: Publish GitHub release
    if: >-
      always() &&
      needs.bump.result == 'success' &&
      needs.package.result == 'success' &&
      (needs.publish-pypi.result == 'success' ||
       needs.publish-pypi.result == 'skipped') &&
      needs.verify-pypi.result == 'success' &&
      needs.installers.result == 'success'
    needs: [bump, package, publish-pypi, verify-pypi, installers]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.installers.outputs.release_commit }}
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          pattern: spacr-online-*
          path: release-assets
          merge-multiple: true
      - uses: actions/download-artifact@v8
        with:
          name: pypi-distributions
          path: release-assets
      - name: Create checksums
        run: |
          cd release-assets
          sha256sum * > SHA256SUMS.txt
      - name: Tag exact release commit
        env:
          RELEASE_TAG: ${{ needs.bump.outputs.tag }}
          RELEASE_SHA: ${{ needs.installers.outputs.release_commit }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git rev-parse "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            tagged_sha=$(git rev-list -n 1 "$RELEASE_TAG")
            if [ "$tagged_sha" != "$RELEASE_SHA" ]; then
              echo "::error::$RELEASE_TAG points to $tagged_sha, not $RELEASE_SHA."
              exit 1
            fi
          else
            git tag -a "$RELEASE_TAG" "$RELEASE_SHA" \
              -m "spaCR ${RELEASE_TAG#v}"
            git push origin "$RELEASE_TAG"
          fi
      - name: Publish release notes and downloadable installers
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.bump.outputs.tag }}
          RELEASE_SHA: ${{ needs.installers.outputs.release_commit }}
          VERSION: ${{ needs.bump.outputs.version }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release-assets/* --clobber
          else
            gh release create "$RELEASE_TAG" release-assets/* \
              --target "$RELEASE_SHA" \
              --title "spaCR $VERSION" \
              --generate-notes \
              --verify-tag
          fi
