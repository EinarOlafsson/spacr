name: N47 serial Qt acceptance

on:
  workflow_dispatch:
    inputs:
      native_batch_replay:
        description: Replay the pinned Coverage0 batch 3 for native diagnostics only
        required: false
        type: boolean
        default: false
  push:
    branches: [nightly]
    paths: [.github/workflows/qt-serial-acceptance.yml]

permissions:
  contents: read

concurrency:
  group: n47-serial-${{ github.ref }}${{ github.event_name == 'workflow_dispatch' && inputs.native_batch_replay && '-native-batch-replay' || '' }}
  cancel-in-progress: false

jobs:
  serial-qt:
    if: github.event_name != 'workflow_dispatch' || !inputs.native_batch_replay
    name: Uninterrupted serial tests/qt (10.8 GiB guard)
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      CUDA_VISIBLE_DEVICES: ""
      QT_QPA_PLATFORM: offscreen
      MPLBACKEND: Agg
      PYTHONPATH: ${{ github.workspace }}
      NUMBA_CACHE_DIR: /tmp/spacr-numba-cache
      XDG_CACHE_HOME: /tmp/spacr-xdg-cache
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      SPACR_TEST_MEMORY_GB: "10.8"

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Qt and scientific system libraries
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libegl1 libxkbcommon0 libdbus-1-3 libpulse0 \
            libx11-xcb1 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-sync1 \
            libxcb-xfixes0 libxcb-xinerama0 libxcb-xkb1 libxkbcommon-x11-0 \
            libgl1 libglib2.0-0t64 libnss3 libxcomposite1 libxcursor1 \
            libxdamage1 libxi6 libxtst6 libasound2t64 \
            libsm6 libxext6 libxrender1 libopencc1.1 libopencc-data ffmpeg gdb zstd

      - name: Install the existing hosted Qt test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu \
            "torch>=2.0" torchvision
          python -m pip install -e ".[dev,zernike,attribution,btrack,czi]"
          python -m pip install "pytest-timeout>=2.3,<3"
          python -m pip check
          python -c "import sys; print('python', sys.version)"
          python -m pip list --format=freeze | grep -Ei \
            '^(numpy|scipy|torch|torchvision|cellpose|mahotas|PySide6|pandas|pytest|pytest-timeout)=' || true

      - name: Record serial source and dependency provenance
        run: |
          python - <<'PY'
          import hashlib
          import importlib.metadata
          import json
          import os
          import pathlib
          import platform
          import subprocess
          import sys

          root = pathlib.Path(os.environ['GITHUB_WORKSPACE'])
          evidence = pathlib.Path(os.environ['RUNNER_TEMP']) / 'spacr-qt-serial'
          evidence.mkdir(parents=True, exist_ok=True)
          revision = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          assert revision == os.environ['GITHUB_SHA']
          paths = set(root.glob('spacr/**/*.py')) | set(root.glob('tests/qt/**/*.py'))
          paths.update(root / name for name in (
              'conftest.py', 'tests/conftest.py',
              'tools/run_qt_serial_acceptance.sh',
              'tools/pytest_plugins/qt_serial_rss_journal.py',
              '.github/workflows/qt-serial-acceptance.yml') if (root / name).is_file())
          versions = {}
          for name in ('PySide6', 'numpy', 'scipy', 'pandas', 'numba', 'torch',
                       'pytest', 'pytest-timeout', 'pytest-qt', 'pytest-xdist',
                       'btrack', 'cellpose'):
              try:
                  versions[name] = importlib.metadata.version(name)
              except importlib.metadata.PackageNotFoundError:
                  versions[name] = None
          record = {
              'source_revision': revision, 'python': sys.version,
              'platform': platform.platform(), 'package_versions': versions,
              'tracked_changes': subprocess.check_output(
                  ['git', 'status', '--porcelain', '--untracked-files=no'], text=True),
              'source_sha256': {str(path.relative_to(root)): hashlib.sha256(
                  path.read_bytes()).hexdigest() for path in sorted(paths)},
          }
          (evidence / 'source-provenance.json').write_text(
              json.dumps(record, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          PY

      - name: Run one guarded, original-order Qt process
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/spacr-qt-serial"
          mkdir -p "$evidence"
          bash tools/ci_memory_telemetry.sh 30 "$evidence/host-memory.log" &
          telemetry_pid=$!
          trap 'kill "$telemetry_pid" 2>/dev/null || true; wait "$telemetry_pid" 2>/dev/null || true' EXIT
          sudo -n systemd-run --scope --quiet \
            -p MemoryMax=12G -p MemorySwapMax=0 \
            /usr/sbin/runuser -u "$(id -un)" -- /usr/bin/env \
            "PATH=$PATH" "HOME=$HOME" \
            "GITHUB_SHA=$GITHUB_SHA" "GITHUB_WORKSPACE=$GITHUB_WORKSPACE" \
            "PYTHONPATH=$GITHUB_WORKSPACE" \
            "CUDA_VISIBLE_DEVICES=" "QT_QPA_PLATFORM=offscreen" \
            "MPLBACKEND=Agg" "PYTHONFAULTHANDLER=1" \
            "NUMBA_CACHE_DIR=$NUMBA_CACHE_DIR" \
            "XDG_CACHE_HOME=$XDG_CACHE_HOME" \
            "OMP_NUM_THREADS=1" "MKL_NUM_THREADS=1" \
            "OPENBLAS_NUM_THREADS=1" "SPACR_TEST_MEMORY_GB=10.8" \
            "SPACR_QT_SERIAL_RSS_JOURNAL=$evidence/file-rss.jsonl" \
            "SPACR_QT_SERIAL_FAULT_LOG=$evidence/fatal-python.log" \
            bash "$GITHUB_WORKSPACE/tools/run_qt_serial_acceptance.sh" \
            2>&1 | tee "$evidence/pytest.log"

      - name: Collect a native core backtrace if one exists
        if: failure()
        continue-on-error: true
        timeout-minutes: 3
        run: python tools/collect_qt_native_backtrace.py

      - name: Upload durable serial and host-memory evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: n47-qt-serial-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/spacr-qt-serial/pytest.log
            ${{ runner.temp }}/spacr-qt-serial/host-memory.log
            ${{ runner.temp }}/spacr-qt-serial/file-rss.jsonl
            ${{ runner.temp }}/spacr-qt-serial/fatal-python.log
            ${{ runner.temp }}/spacr-qt-serial/native-core-backtrace.txt
            ${{ runner.temp }}/spacr-qt-serial/source-provenance.json
          if-no-files-found: warn
          retention-days: 7

  native-batch-replay:
    if: github.event_name == 'workflow_dispatch' && inputs.native_batch_replay
    uses: ./.github/workflows/qt-native-replay.yml
    permissions:
      contents: read
