name: docs

on:
  push:
    branches: [main, nightly]
  workflow_dispatch:

# Deploys the sphinx-autoapi build directly through the GitHub Pages
# artifact upload API (modern approach — bypasses gh-pages, bypasses
# `main:/docs/` commit, bypasses branch protection).
#
# REQUIRES: Repository Settings → Pages → "Build and deployment" →
#           Source = "GitHub Actions" (not "Deploy from a branch").
# If it's still "Deploy from a branch", this workflow silently uploads
# but Pages keeps serving the old branch — flip the source once.
#
# ---------------------------------------------------------------------------
# PUBLISHING IS main-ONLY. That is load-bearing, not tidiness.
#
# The push trigger used to run every step on `nightly` as well, so each
# nightly push republished https://einarolafsson.github.io/spacr/ *from
# nightly*, overwriting whatever main had last deployed. The public site
# therefore documented unreviewed work, and re-running the main build was the
# only way to put it back — until the next nightly push minutes later.
#
# nightly still BUILDS, because a docs build that only runs on main finds a
# broken docstring after the merge instead of before. It just stops short of
# the Pages target: no configure-pages, no `github-pages` artifact, no deploy
# job — it fails the run if sphinx cannot produce index.html and then writes
# a job summary. Everything that can touch production Pages is guarded by
# `github.ref == 'refs/heads/main'`, which also covers workflow_dispatch
# (it carries the dispatching ref).
# ---------------------------------------------------------------------------

permissions:
  contents: read
  pages: write
  id-token: write

# Serialize per branch. A shared "pages" group here would let a nightly
# validation build hold the group while a real main deploy queues behind it;
# the genuine Pages serialization belongs on the deploy job, which only main
# ever reaches.
concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build Sphinx
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.10
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"
          cache: pip

      - name: Install spacr + Sphinx tooling
        run: |
          python -m pip install --upgrade pip
          # CPU-only torch first (matches tests.yml) so pip won't fetch
          # the CUDA wheel while resolving spacr's install_requires.
          python -m pip install --index-url https://download.pytorch.org/whl/cpu \
            "torch>=2.0" "torchvision"
          # Full install — autoapi's AST walker doesn't NEED to import
          # spacr modules, but sphinx-build's viewcode + import-checks
          # do, and half the docstring cross-refs break without the
          # full dep graph. Same install path as tests.yml so any
          # green-tests commit produces a green docs build too.
          python -m pip install -e ".[qt,dev]"
          # furo — dark-mode capable Sphinx theme
          # sphinx-design — grid / card directives on the landing page
          # sphinx-autoapi — AST-walk API reference generator
          python -m pip install sphinx furo sphinx-design sphinx-autoapi

      - name: Build docs
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          rm -rf docs/_build docs/source/api
          # --keep-going: continue past docutils errors in individual
          # docstrings (an unindented code block in one docstring should
          # not sink the whole site). Capture the build log for the
          # summary + check `index.html` was produced; if it was, we
          # ship it regardless of docutils warnings.
          set +e
          sphinx-build -E -b html --keep-going \
            docs/source docs/_build/html 2>&1 | tee /tmp/sphinx.log
          rc=${PIPESTATUS[0]}
          set -e
          echo "sphinx-build exit=$rc"
          if [ ! -f docs/_build/html/index.html ]; then
            echo "FATAL: no index.html produced"
            tail -80 /tmp/sphinx.log
            exit 1
          fi
          echo "produced $(find docs/_build/html -name '*.html' | wc -l) HTML pages"
          # Pages needs .nojekyll to preserve _static / _sources folders
          touch docs/_build/html/.nojekyll

      # --- production Pages path: main only ------------------------------
      - name: Configure Pages
        if: github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/_build/html

      # --- everything else: build only, and say so ------------------------
      # No artifact is uploaded on purpose. `html_extra_path = ['_extra']`
      # copies the staged tutorial player, posters, catalogs, and 1440p video
      # into every build. Narration and 4K masters are external, but uploading
      # the same build artifact for every nightly push still costs time and
      # storage for a preview nobody asked for. The build itself is the value
      # here — it fails the run if sphinx cannot produce index.html. If a
      # browsable nightly preview is ever wanted, deploy it to a target that
      # is not production Pages.
      - name: Report build-only outcome (non-main)
        if: github.ref != 'refs/heads/main'
        # The ref goes through the environment, not through `${{ }}`
        # interpolation into the shell: a branch name is attacker-influenced
        # text, and interpolated text becomes shell source.
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          pages=$(find docs/_build/html -name '*.html' | wc -l)
          size=$(du -sh docs/_build/html | cut -f1)
          {
            echo "### Docs built, not published"
            echo ""
            echo "Ref \`$REF_NAME\` is not \`main\`, so this build validated"
            echo "the documentation and stopped there. GitHub Pages is"
            echo "published from \`main\` only."
            echo ""
            echo "- HTML pages: $pages"
            echo "- Built size: $size"
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    # The single gate on the production site. Without it, nightly pushes
    # republish the public docs over main's build.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    # Real Pages deployments serialize against each other here rather than
    # in the workflow-level group, so a nightly validation build never
    # queues against a deploy.
    concurrency:
      group: "pages"
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
