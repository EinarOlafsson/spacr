name: tests

on:
  push:
    branches: [main, nightly, "**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

# The fast suite spans every supported Python. Expensive or environment-aware
# tests run once on Python 3.12 in distinct integration, slow, Qt, GPU,
# network, and NAS jobs. The marker expressions form a partition: a supported
# test belongs to the highest-requirement suite it declares, while GPU,
# network, and NAS tests decide at runtime whether their resource is actually
# available. Tests marked ``gui`` belong to the retired Tk interface and are
# deliberately outside this workflow.
#
# Breadth — macOS, Windows, ARM64, the requires-python guard, wheel
# availability — lives in .github/workflows/compat-matrix.yml, which runs a
# much cheaper install + import + packaging subset. Splitting them keeps the
# expensive suite on the platform that can actually finish it, while still
# proving the other platforms install and import.
#
# Every `Programming Language :: Python :: 3.x` classifier in pyproject.toml
# must have a cell somewhere across these two workflows. If you add a
# classifier, add the cell first.

# One run per ref, newest wins. Without this a run of pushes to the same
# branch queues a full suite for every commit and none of them get cancelled:
# ten tutorial-rebuild pushes on 5 August left ~30 jobs queued for hours,
# starved every runner, and blocked the docs deploy behind them -- the public
# site sat on a four-day-old build while CI churned through commits nobody
# was waiting on. Only the newest commit on a branch is worth testing.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast:
    name: Fast / Newest compatible (ubuntu-24.04, py${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        # 3.10 is the historical cell — before this matrix existed it was the
        # only cell of the 36 in the compatibility grid that had ever been
        # executed. It stays, unchanged, and stays blocking so nothing
        # regresses. 3.11 and 3.12 sit inside requires-python and every core
        # dependency publishes cp311/cp312 wheels, so both are *expected to
        # pass*.
        #
        # 3.13 and 3.14 exercise the numpy-2 code paths (np.trapezoid, np.ptp)
        # on the newest supported interpreters. Python 3.14 is a full,
        # blocking fast-suite cell rather than an install-only smoke test.
        # mahotas 1.4.18 builds successfully from its sdist and btrack 0.7.0
        # ships a working native tracker for CPython 3.14 on Linux.
        #
        # Every cell here is blocking. If one is red on first run that is a
        # real finding — do not paper over it with continue-on-error, which is
        # reserved for cells whose failure is already understood and
        # documented in compat-matrix.yml.
        # 3.9 is a supported resolver branch in active use. It lands on
        # torch 2.8 and the final compatible releases of several scientific
        # dependencies, so it is blocking rather than merely an install
        # smoke test.
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]

        # The extras each cell installs. They differ for measured packaging
        # constraints: the resolver cannot install `torchcam` on Python 3.13
        # or 3.14, and pylibCZIrw does not publish a CPython 3.14 wheel.
        # Every release satisfying `>=0.4.0,<1.0` declares `numpy<2.0.0`, and
        # no numpy satisfying that publishes a cp313 wheel. Both halves were
        # reproduced in a throwaway CPython 3.13.14 env on 2026-07-27, and
        # they fail DIFFERENTLY, which is why the extra is dropped rather than
        # merely expected to be slow:
        #
        #   with --only-binary :all: -> clean refusal
        #     ERROR: ResolutionImpossible
        #     torchcam 0.4.1 depends on numpy<2.0.0 and >=1.17.2
        #     ... no matching distributions available for your environment:
        #         numpy
        #
        #   without it -> pip backtracks and accepts, reporting
        #     Would install ... numpy-1.26.4 torchcam-0.4.1
        #   i.e. it would spend this job's 60-minute budget compiling numpy
        #   1.26.4 from source, and would then run the whole suite against
        #   numpy 1.x on the one cell that exists to test numpy 2.
        #
        # The five TorchCAM variants are installed without dependency
        # resolution below on 3.13/3.14. Its complete attribution test module
        # passes against NumPy 2; only the upstream dependency metadata is
        # stale.
        include:
          - python-version: "3.9"
            extras: "qt,dev,zernike,attribution,btrack,czi"
          - python-version: "3.10"
            extras: "qt,dev,zernike,attribution,btrack,czi"
          - python-version: "3.11"
            extras: "qt,dev,zernike,attribution,btrack,czi"
          - python-version: "3.12"
            extras: "qt,dev,zernike,attribution,btrack,czi"
          - python-version: "3.13"
            extras: "qt,dev,zernike,btrack,czi"
          - python-version: "3.14"
            extras: "qt,dev,zernike,btrack"

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install system libraries (Qt offscreen + scientific stack)
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libegl1 libxkbcommon0 libdbus-1-3 libpulse0 \
            libx11-xcb1 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-sync1 \
            libxcb-xfixes0 libxcb-xinerama0 libxcb-xkb1 libxkbcommon-x11-0 \
            libgl1 libglib2.0-0t64 libnss3 libxcomposite1 libxcursor1 \
            libxdamage1 libxi6 libxtst6 libasound2t64 \
            libsm6 libxext6 libxrender1 libopencc1.1 libopencc-data ffmpeg

      - name: Install spacr (full deps, CPU-only torch)
        run: |
          python -m pip install --upgrade pip
          # CPU-only torch first so pip doesn't fetch the CUDA wheel
          # that would OOM the runner.
          python -m pip install --index-url https://download.pytorch.org/whl/cpu \
            "torch>=2.0" "torchvision"
          # Full install pulls every dep from setup.py's install_requires:
          # IPython, czifile, readlif, statsmodels, cellpose, xgboost, umap,
          # seaborn, biopython, etc.
          #
          # `zernike` (and `attribution`, where it can be installed at all —
          # see the matrix note) are requested explicitly because mahotas and
          # torchcam are no longer core dependencies. They moved to extras so
          # that a plain `pip install spacr` on Python 3.13 needs no C++
          # toolchain (mahotas has never published a cp313 wheel) and is not
          # dragged back to numpy 1.26.4 (every torchcam release declares
          # `numpy<2.0.0`). The suite still has to exercise them:
          # spacr/measure.py imports mahotas at module scope, so without
          # `zernike` this whole suite would fail at collection, not degrade.
          python -m pip install -e ".[${{ matrix.extras }}]"

      - name: Install runtime-qualified TorchCAM around its stale NumPy cap
        if: matrix.python-version == '3.13' || matrix.python-version == '3.14'
        run: |
          # torchcam 0.4.1 declares numpy<2 even though its complete spaCR
          # attribution suite passes with NumPy 2 on CPython 3.13 and 3.14.
          # Installing without dependencies preserves the already-resolved
          # scientific stack while retaining CAM coverage on these cells.
          python -m pip install --no-deps "torchcam>=0.4.0,<1.0"

      - name: Show the pins that gate the compatibility matrix
        # One line per dependency whose wheel availability decides which
        # cells of the matrix can exist. When a cell goes red six months from
        # now, this log is the difference between "which version moved?" and
        # re-deriving the whole thing from scratch.
        run: |
          python -c "import sys; print('python', sys.version)"
          python -m pip list --format=freeze | grep -Ei \
            '^(numpy|scipy|torch|torchvision|cellpose|mahotas|opencv-python-headless|pillow|psutil|lxml|PySide6|pandas|scikit-image|scikit-learn|umap-learn|btrack)=' || true

      - name: Preflight low-core defaults and native integrations
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python - <<'PY'
          from spacr.settings import set_default_settings_preprocess_generate_masks
          settings = set_default_settings_preprocess_generate_masks({})
          assert settings["n_jobs"] >= 1, settings["n_jobs"]

          from spacr.utils import umap
          assert umap.UMAP is not None

          import btrack
          with btrack.BayesianTracker():
              pass
          print("low-core defaults, UMAP API, and btrack native library: OK")
          PY

      - name: Run fast tests
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python -m pytest tests/ \
            -m "not integration and not slow and not heavy and not qt and not gpu and not network and not nas and not gui" \
            -v --tb=short

  integration:
    name: Integration
    uses: ./.github/workflows/_pytest-suite.yml
    with:
      suite_name: Integration
      python_version: "3.12"
      extras: "qt,dev,zernike,attribution,btrack,czi"
      marker_expression: "integration and not slow and not heavy and not qt and not gpu and not network and not nas and not gui"
      timeout_minutes: 60

  slow:
    name: Slow
    uses: ./.github/workflows/_pytest-suite.yml
    with:
      suite_name: Slow
      python_version: "3.12"
      extras: "qt,dev,zernike,attribution,btrack,czi"
      marker_expression: "(slow or heavy) and not gpu and not network and not nas and not gui"
      timeout_minutes: 90

  qt:
    name: Qt
    uses: ./.github/workflows/_pytest-suite.yml
    with:
      suite_name: Qt
      python_version: "3.12"
      extras: "qt,dev,zernike,attribution,btrack,czi"
      marker_expression: "qt and not slow and not heavy and not gpu and not network and not nas and not gui"
      timeout_minutes: 60

  gpu:
    name: GPU
    uses: ./.github/workflows/_pytest-suite.yml
    with:
      suite_name: GPU
      python_version: "3.12"
      extras: "qt,dev,zernike,attribution,btrack,czi"
      marker_expression: "gpu and not gui"
      timeout_minutes: 120

  network:
    name: Network
    uses: ./.github/workflows/_pytest-suite.yml
    with:
      suite_name: Network
      python_version: "3.12"
      extras: "qt,dev,zernike,attribution,btrack,czi"
      marker_expression: "network and not nas and not gpu and not gui"
      timeout_minutes: 90

  nas:
    name: NAS
    uses: ./.github/workflows/_pytest-suite.yml
    with:
      suite_name: NAS
      python_version: "3.12"
      extras: "qt,dev,zernike,attribution,btrack,czi"
      marker_expression: "nas and not gpu and not gui"
      timeout_minutes: 90

  quality:
    name: Lint / types / complexity
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install quality tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            "ruff>=0.9,<1" \
            "mypy>=1.11,<2" \
            "xenon>=0.9,<1"

      - name: Enforce repository and maintained-code quality gates
        shell: bash
        run: |
          mapfile -t targets < <(
            grep -Ev '^[[:space:]]*(#|$)' .github/quality-targets.txt
          )
          test "${#targets[@]}" -gt 0

          # Fatal correctness errors are never grandfathered, even in legacy
          # modules that are not ready for the full style/type ratchet.
          python -m ruff check spacr tests --select E9,F63,F7,F82

          # The maintained target set is held to broader linting, static
          # typing, and a maximum per-block/module complexity rank of B.
          python -m ruff check "${targets[@]}"
          python -m mypy "${targets[@]}"
          python -m xenon \
            --max-absolute B \
            --max-modules B \
            --max-average A \
            "${targets[@]}"

  minimum-dependencies:
    name: Minimum dependencies (ubuntu-24.04, py3.9)
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v7

      # Python 3.9 is the oldest supported interpreter. Its constraints file
      # pins every lower-bounded direct dependency (and every extra installed
      # here) to the oldest mutually installable release. The normal matrix
      # above intentionally has no constraints and therefore exercises the
      # newest compatible resolution on all five supported interpreters.
      - name: Set up Python 3.9
        uses: actions/setup-python@v7
        with:
          python-version: "3.9"
          cache: pip

      - name: Install system libraries (Qt offscreen + scientific stack)
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libegl1 libxkbcommon0 libdbus-1-3 libpulse0 \
            libx11-xcb1 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-sync1 \
            libxcb-xfixes0 libxcb-xinerama0 libxcb-xkb1 libxkbcommon-x11-0 \
            libgl1 libglib2.0-0t64 libnss3 libxcomposite1 libxcursor1 \
            libxdamage1 libxi6 libxtst6 libasound2t64 \
            libsm6 libxext6 libxrender1 libopencc1.1 libopencc-data ffmpeg

      - name: Install spacr at minimum direct versions
        run: |
          python -m pip install --upgrade pip
          # Install the coupled CPU wheels together first. Their local
          # ``+cpu`` suffixes still satisfy the public-version constraints.
          python -m pip install \
            --index-url https://download.pytorch.org/whl/cpu \
            "torch==2.1.0" "torchvision==0.16.0"
          python -m pip install \
            -c .github/constraints/minimum-py39.txt \
            -e ".[qt,dev,zernike,attribution,btrack,czi]"
          python -m pip check

      - name: Verify installed minimum profile
        run: |
          python - <<'PY'
          from importlib.metadata import version
          from pathlib import Path
          from packaging.requirements import Requirement

          for line in Path(".github/constraints/minimum-py39.txt").read_text().splitlines():
              line = line.strip()
              if not line or line.startswith("#"):
                  continue
              expected = Requirement(line)
              actual = version(expected.name)
              assert actual in expected.specifier, (
                  f"{expected.name}: installed {actual}, expected {expected.specifier}"
              )
              print(f"{expected.name}=={actual}")
          PY

      - name: Preflight minimum native integrations
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python - <<'PY'
          from spacr.settings import set_default_settings_preprocess_generate_masks
          settings = set_default_settings_preprocess_generate_masks({})
          assert settings["n_jobs"] >= 1, settings["n_jobs"]

          from spacr.utils import umap
          assert umap.UMAP is not None

          import btrack
          with btrack.BayesianTracker():
              pass
          print("minimum dependency profile: OK")
          PY

      - name: Run tests at minimum direct versions
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python -m pytest tests/ \
            -m "not integration and not slow and not heavy and not qt and not gpu and not network and not nas and not gui" \
            -v --tb=short

  release-gate:
    name: Release gate / zero unexpected failures
    if: always()
    needs:
      - quality
      - fast
      - minimum-dependencies
      - integration
      - slow
      - qt
      - gpu
      - network
      - nas
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Require every blocking job to succeed
        env:
          NEEDS_CONTEXT: ${{ toJSON(needs) }}
        run: |
          python - <<'PY'
          import json
          import os
          import sys

          needs = json.loads(os.environ["NEEDS_CONTEXT"])
          failed = {
              name: details["result"]
              for name, details in needs.items()
              if details["result"] != "success"
          }
          if failed:
              for name, result in sorted(failed.items()):
                  print(f"::error::{name} finished with {result}")
              sys.exit("release gate failed: not every blocking job succeeded")
          print("release gate passed: every blocking job succeeded")
          PY
