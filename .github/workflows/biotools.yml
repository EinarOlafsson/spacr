name: sync bio.tools registry

# The bio.tools entry at https://bio.tools/spacr carries a version field, and
# a registry that claims an old version is worse than one that claims none:
# it tells a reader the project stopped. The release workflow calls this one
# once PyPI has confirmed the new version, so the registry moves with the
# release rather than by hand.
#
# ONLY the version is sent. bio.tools is curated -- ELIXIR curators may
# improve the EDAM terms, the functions or the description on their side --
# and a full PUT from this repository would silently overwrite that work
# every release. A PATCH of one field cannot.
#
# The token is a personal API token for the account that owns the entry,
# stored as the BIOTOOLS_TOKEN repository secret. It does not expire on its
# own, but logging out of bio.tools invalidates it, at which point this
# workflow fails and the secret has to be replaced.

on:
  workflow_call:
    inputs:
      version:
        description: Version to publish to bio.tools
        required: true
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: Version to publish. Empty reads it from setup.py.
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: spacr-biotools
  cancel-in-progress: false

jobs:
  sync:
    name: Update the version on bio.tools
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Resolve the version to publish
        id: version
        env:
          REQUESTED: ${{ inputs.version }}
        run: |
          set -euo pipefail
          version="$REQUESTED"
          if [ -z "$version" ]; then
            version=$(python packaging/release.py version)
          fi
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+(\.[0-9]+){2,3}$'; then
            echo "::error::'$version' is not a 3- or 4-component numeric version."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Publishing version $version to bio.tools."

      - name: Check whether a token is configured
        id: token
        env:
          TOKEN: ${{ secrets.BIOTOOLS_TOKEN }}
        run: |
          # An ABSENT token is a configuration choice and must not fail a
          # release that PyPI has already accepted. A token that is present
          # and REJECTED is a fault, and the patch step treats it as one.
          if [ -z "$TOKEN" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::BIOTOOLS_TOKEN is not set; bio.tools was not updated."
            echo "bio.tools was **not** updated: no BIOTOOLS_TOKEN secret." \
              >> "$GITHUB_STEP_SUMMARY"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Patch the version
        if: steps.token.outputs.configured == 'true'
        env:
          TOKEN: ${{ secrets.BIOTOOLS_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          status=$(curl --proto '=https' --tlsv1.2 --silent \
            --retry 3 --retry-all-errors \
            --output response.json --write-out '%{http_code}' \
            --request PATCH "https://bio.tools/api/tool/spacr/?format=json" \
            --header "Authorization: Token $TOKEN" \
            --header "Content-Type: application/json" \
            --data "{\"version\": [\"$VERSION\"]}")
          echo "bio.tools returned HTTP $status."
          if [ "$status" = "401" ] || [ "$status" = "403" ]; then
            echo "::error::bio.tools rejected the token. It is most likely"
            echo "::error::invalidated -- sign in and replace BIOTOOLS_TOKEN."
            exit 1
          fi
          # The POST that created this entry answered 500 after writing the
          # row successfully, so the status alone is not evidence either way.
          # The verification step below is what decides.
          if [ "$status" -ge 400 ]; then
            echo "::warning::bio.tools answered HTTP $status; body follows."
            head -c 2000 response.json || true
            echo
          fi

      - name: Verify the registry now reports that version
        if: steps.token.outputs.configured == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 6); do
            curl --proto '=https' --tlsv1.2 --silent --retry 3 \
              --retry-all-errors --output live.json \
              "https://bio.tools/api/tool/spacr/?format=json"
            if python - <<'PY'
          import json
          import os
          import sys

          live = json.load(open("live.json"))
          sys.exit(0 if os.environ["VERSION"] in (live.get("version") or []) else 1)
          PY
            then
              echo "bio.tools reports version $VERSION."
              echo "bio.tools now reports **$VERSION**." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "Attempt $attempt/6: not visible yet; retrying."
            sleep 10
          done
          echo "::error::bio.tools does not report $VERSION after 1 minute."
          echo "::error::Check https://bio.tools/spacr by hand."
          exit 1
