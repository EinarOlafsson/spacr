<svg xmlns="http://www.w3.org/2000/svg" width="830" height="191" viewBox="0 0 830 191" role="img" aria-labelledby="t d" data-source-sha256="8ce65ae5617d49b1b714042a3501e66fb742099df4c31b9efa20dcb43599f30c">
<title id="t">Modellzoo</title>
<desc id="d">Modellzoo. spaCR enthält einen Katalog trainierter Modelle und lädt sie bei Bedarf herunter. Öffnen Sie Model Zoo auf der Startseite, um Modelle zu durchsuchen und zu installieren, oder geben Sie einen Modellschlüssel in einer Einstellungsdatei an, etwa pathogen_model: toxoplasma_pv_v1. Das Modell wird bei der ersten Verwendung heruntergeladen und anhand seiner Prüfsumme verifiziert. Jeder veröffentlichte Eintrag enthält eine SHA-256-Prüfsumme. Ein Eintrag ohne Prüfsumme wird abgelehnt, da eine unvollständige oder ausgetauschte Checkpoint-Datei sonst nicht vom Original unterschieden werden kann.</desc>
<style>@font-face{font-family:'spacr-os';font-weight:300;font-style:normal;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'spacr-os';font-weight:400;font-style:normal;src:url(data:font/woff2;base64,) format('woff2')}text{font-family:'spacr-os', 'spacr-script', 'spacr-symbols', 'Open Sans', sans-serif;font-kerning:normal}</style>
<defs><linearGradient id="gmodel-zoo" x1="0" x2="1" y1="0" y2="0"><stop offset="0" stop-color="#2ec4b6"/><stop offset="1" stop-color="#6cb6ff"/></linearGradient><clipPath id="cmodel-zoo"><rect x="0" y="1" width="830" height="180" rx="12"/></clipPath></defs><filter id="smodel-zoo" x="-5%" y="-20%" width="110%" height="140%"><feDropShadow dx="0" dy="1" stdDeviation="1.2" flood-color="#1f2328" flood-opacity=".22"/></filter><rect x="0.5" y="1.5" width="829" height="179" rx="12" fill="#161b22" stroke="#30363d" filter="url(#smodel-zoo)"/><rect x="0" y="1" width="830" height="2" fill="url(#gmodel-zoo)" fill-opacity=".7" clip-path="url(#cmodel-zoo)"/><text y="36.2" xml:space="preserve"><tspan x="24.0" font-size="16" font-weight="400" fill="#e6edf3">Modellzoo</tspan></text><rect x="24" y="48.0" width="24" height="2" rx="1" fill="#2ec4b6"/><text y="75.5" xml:space="preserve"><tspan x="24.0" font-size="13.6" font-weight="300" fill="#c9d1d9">spaCR enthält einen Katalog trainierter Modelle und lädt sie bei Bedarf herunter. Öffnen Sie </tspan><tspan x="584.5" font-size="13.6" font-weight="400" fill="#e6edf3">Model Zoo</tspan><tspan x="652.0" font-size="13.6" font-weight="300" fill="#c9d1d9"> auf der Startseite, um</tspan></text><text y="95.9" xml:space="preserve"><tspan x="24.0" font-size="13.6" font-weight="300" fill="#c9d1d9">Modelle zu durchsuchen und zu installieren, oder geben Sie einen Modellschlüssel in einer Einstellungsdatei an, etwa</tspan></text><rect x="24.0" y="102.4" width="235.7" height="22.6" rx="5" fill="#2ec4b6" fill-opacity=".12"/><text y="116.3" xml:space="preserve"><tspan x="27.0" font-size="13.6" font-weight="400" fill="#2ec4b6">pathogen_model: toxoplasma_pv_v1</tspan><tspan x="259.7" font-size="13.6" font-weight="300" fill="#c9d1d9">. Das Modell wird bei der ersten Verwendung heruntergeladen und anhand seiner</tspan></text><text y="136.7" xml:space="preserve"><tspan x="24.0" font-size="13.6" font-weight="300" fill="#c9d1d9">Prüfsumme verifiziert. Jeder veröffentlichte Eintrag enthält eine SHA-256-Prüfsumme. Ein Eintrag ohne Prüfsumme wird</tspan></text><text y="157.1" xml:space="preserve"><tspan x="24.0" font-size="13.6" font-weight="300" fill="#c9d1d9">abgelehnt, da eine unvollständige oder ausgetauschte Checkpoint-Datei sonst nicht vom Original unterschieden werden kann.</tspan></text>
</svg>
