<title id="t">spaCR</title>
<desc id="d">Optionale Integrationen werden separat installiert, zum Beispiel spacr[zarr], spacr[omero], spacr[napari] und spacr[czi,nd2,lif]. Die vollständige Liste der Extras und die Kompatibilitätstabelle für Python-Versionen finden Sie in der Installationsanleitung (nightly, Englisch).</desc>
