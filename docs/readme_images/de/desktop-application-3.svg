<svg xmlns="http://www.w3.org/2000/svg" width="358" height="273" viewBox="0 0 358 273" role="img" aria-labelledby="t d" data-source-sha256="937e213bfc0de63a0bdeebb4ff3a706f9c9a6ddb43b33420f2f7b2d2fd49d364">
<title id="t">spaCR</title>
<desc id="d">Öffnen Sie unter macOS die Datei .pkg. Die aktuelle Beta ist nicht notarisiert. Wenn Gatekeeper sie blockiert, wählen Sie Systemeinstellungen → Datenschutz &amp; Sicherheit → Dennoch öffnen. Anleitungen zur Installation, Aktualisierung, Neuinstallation, Deinstallation, zum Offlinebetrieb und zur Fehlerbehebung finden Sie in der aktuellen Installationsanleitung auf nightly (Englisch). Die Systemanforderungen enthalten Empfehlungen für Arbeitsstationen und Server sowie Tabellen zur GPU-Kompatibilität.</desc>
<style>@font-face{font-family:'spacr-os';font-weight:300;font-style:normal;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'spacr-os';font-weight:400;font-style:normal;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'spacr-symbols';font-weight:400;font-style:normal;src:url(data:font/woff2;base64,) format('woff2')}text{font-family:'spacr-os', 'spacr-script', 'spacr-symbols', 'Open Sans', sans-serif;font-kerning:normal}</style>
