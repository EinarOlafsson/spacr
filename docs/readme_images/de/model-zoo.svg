<svg xmlns="http://www.w3.org/2000/svg" width="880" height="302" viewBox="0 0 880 302" role="img" aria-labelledby="t d" data-source-sha256="1d8631d1e45e21e1191aa1b96b447021766137cdefe1d95c198310fc594a32ad">
<title id="t">Modellzoo</title>
<desc id="d">Modellzoo. spaCR liefert einen Katalog von ausgebildeten Modellen und holt sie auf Anfrage ab. Öffnen Sie Model Zoo vom Home-Bildschirm, um sie zu durchsuchen und zu installieren, oder benennen Sie einen Schlüssel in einer Einstellungsdatei -- pathogen_model: toxoplasma_pv_v1 -- und das Modell wird heruntergeladen und Checksummen-verifiziert, wenn es zum ersten Mal benötigt wird. Jeder veröffentlichte Eintrag trägt eine SHA-256; ein Eintrag ohne einen wird abgelehnt, anstatt installiert, weil ein verkürzter oder ersetzter Checkpoint nicht vom realen angezeigt werden kann.</desc>
<style>@font-face{font-family:'spacr-os';font-weight:300;font-style:normal;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'spacr-os';font-weight:400;font-style:normal;src:url(data:font/woff2;base64,) format('woff2')}text{font-family:'spacr-os', 'spacr-script', 'spacr-symbols', 'Open Sans', sans-serif;font-kerning:normal}</style>
<defs><linearGradient id="gmodel-zoo" x1="0" x2="1" y1="0" y2="0"><stop offset="0" stop-color="#2ec4b6"/><stop offset="1" stop-color="#6cb6ff"/></linearGradient><clipPath id="cmodel-zoo"><rect x="0" y="1" width="880" height="291" rx="14"/></clipPath></defs><filter id="smodel-zoo" x="-5%" y="-20%" width="110%" height="140%"><feDropShadow dx="0" dy="1" stdDeviation="1.2" flood-color="#1f2328" flood-opacity=".22"/></filter><rect x="0.5" y="1.5" width="879" height="290" rx="14" fill="#161b22" stroke="#30363d" filter="url(#smodel-zoo)"/><rect x="0" y="1" width="880" height="2" fill="url(#gmodel-zoo)" fill-opacity=".7" clip-path="url(#cmodel-zoo)"/><text y="57.0" xml:space="preserve"><tspan x="40.0" font-size="26" font-weight="400" fill="#e6edf3">Modellzoo</tspan></text><rect x="40" y="76.0" width="36" height="3" rx="1.5" fill="#2ec4b6"/><text y="113.0" xml:space="preserve"><tspan x="40.0" font-size="17" font-weight="300" fill="#c9d1d9">spaCR liefert einen Katalog von ausgebildeten Modellen und holt sie auf Anfrage ab. Öffnen Sie </tspan><tspan x="765.3" font-size="17" font-weight="400" fill="#e6edf3">Model</tspan></text><text y="141.0" xml:space="preserve"><tspan x="40.0" font-size="17" font-weight="400" fill="#e6edf3">Zoo</tspan><tspan x="70.2" font-size="17" font-weight="300" fill="#c9d1d9"> vom Home-Bildschirm, um sie zu durchsuchen und zu installieren, oder benennen Sie einen</tspan></text><rect x="325.1" y="153.2" width="271.8" height="24.5" rx="5" fill="#2ec4b6" fill-opacity=".12"/><text y="169.0" xml:space="preserve"><tspan x="40.0" font-size="17" font-weight="300" fill="#c9d1d9">Schlüssel in einer Einstellungsdatei -- </tspan><tspan x="330.1" font-size="15.5" font-weight="400" fill="#2ec4b6">pathogen_model: toxoplasma_pv_v1</tspan><tspan x="596.9" font-size="17" font-weight="300" fill="#c9d1d9"> -- und das Modell wird</tspan></text><text y="197.0" xml:space="preserve"><tspan x="40.0" font-size="17" font-weight="300" fill="#c9d1d9">heruntergeladen und Checksummen-verifiziert, wenn es zum ersten Mal benötigt wird. Jeder</tspan></text><text y="225.0" xml:space="preserve"><tspan x="40.0" font-size="17" font-weight="300" fill="#c9d1d9">veröffentlichte Eintrag trägt eine SHA-256; ein Eintrag ohne einen wird abgelehnt, anstatt installiert, weil</tspan></text><text y="253.0" xml:space="preserve"><tspan x="40.0" font-size="17" font-weight="300" fill="#c9d1d9">ein verkürzter oder ersetzter Checkpoint nicht vom realen angezeigt werden kann.</tspan></text>
</svg>
