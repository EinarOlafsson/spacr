t Objektausschnitte in einem tastaturgesteuerten Raster und unterstützt</tspan></text><text y="260.0" xml:space="preserve"><tspan x="70.0" font-size="17" font-weight="300" fill="#c9d1d9">Active-Learning-Warteschlangen.</tspan></text><circle cx="52" cy="289.0" r="3" fill="#2ec4b6"/><text y="294.0" xml:space="preserve"><tspan x="70.0" font-size="17" font-weight="400" fill="#e6edf3">Classify</tspan><tspan x="129.2" font-size="17" font-weight="300" fill="#c9d1d9"> trainiert bild- oder messwertbasierte Modelle und speichert mit jedem Checkpoint die</tspan></text><text y="322.0" xml:space="preserve"><tspan x="70.0" font-size="17" font-weight="300" fill="#c9d1d9">Leistung auf zurückgehaltenen Daten.</tspan></text><circle cx="52" cy="351.0" r="3" fill="#2ec4b6"/><text y="356.0" xml:space="preserve"><tspan x="70.0" font-size="17" font-weight="400" fill="#e6edf3">Map Barcodes</tspan><tspan x="183.3" font-size="17" font-weight="300" fill="#c9d1d9"> ordnet FASTQ-Reads Wells und gRNAs zu und liefert QC für Häufigkeit, Kollisionen</tspan></text><text y="384.0" xml:space="preserve"><tspan x="70.0" font-size="17" font-weight="300" fill="#c9d1d9">und Abdeckung.</tspan></text><circle cx="52" cy="413.0" r="3" fill="#2ec4b6"/><text y="418.0" xml:space="preserve"><tspan x="70.0" font-size="17" font-weight="400" fill="#e6edf3">Regression</tspan><tspan x="156.9" font-size="17" font-weight="300" fill="#c9d1d9"> schätzt Guide-, Gen-, Bedingungs- und Kontrolleffekte mit Modellfamilien für</tspan></text><text y="446.0" xml:space="preserve"><tspan x="70.0" font-size="17" font-weight="300" fill="#c9d1d9">kontinuierliche Werte, Anteile und Zähldaten.</tspan></text>
