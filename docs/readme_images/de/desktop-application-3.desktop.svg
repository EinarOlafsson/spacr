<svg xmlns="http://www.w3.org/2000/svg" width="830" height="159" viewBox="0 0 830 159" role="img" aria-labelledby="t d" data-source-sha256="e1def578d721df36227bde65d291a68620f11789a0823ccb33b6012268ed0505">
<title id="t">spaCR</title>
<desc id="d">Öffnen Sie auf macOS das .pkg. Die aktuelle Beta wird nicht beglaubigt; wenn Gatekeeper sie blockiert, wählen Sie Systemeinstellungen → Datenschutz &amp; Sicherheit → Öffnen Sie trotzdem. Anleitungen zur Installation, Aktualisierung, Neuinstallation, Deinstallation, zum Offlinebetrieb und zur Fehlerbehebung finden Sie in der aktuellen Installationsanleitung auf nightly (Englisch). Die Systemanforderungen enthalten Empfehlungen für Arbeitsstationen und Server sowie Tabellen zur GPU-Kompatibilität.</desc>
