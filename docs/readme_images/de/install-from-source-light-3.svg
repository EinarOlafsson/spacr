<svg xmlns="http://www.w3.org/2000/svg" width="358" height="375" viewBox="0 0 358 375" role="img" aria-labelledby="t d" data-source-sha256="b5a27a2a52fd8e3323d960c070cf4167b267fd219473bb075deda9121649554c">
<title id="t">spaCR</title>
<desc id="d">--dir wählt den Pfad des Klons; --branch wählt einen Branch oder Tag; --no-install lädt die Dateien ohne Installation; --help zeigt die Optionen. packaging/source_install_excludes.txt führt alle ausgelassenen Pfade auf. Der vollständige nightly-Klon lud 9.25 GiB herunter. --filter=blob:none zum flachen Klon hinzuzufügen verkleinert das ausgecheckte Arbeitsverzeichnis nicht: Sein Git-Objektspeicher umfasst weiterhin 2032 MB. Git meldet bei Bedarf nachgeladene Objekte nicht, daher wurde keine Gesamtgröße des Downloads gemessen. Die versionierten Dateien von main belegen im ausgecheckten Arbeitsverzeichnis 5059 MB (gemessen am 2026-10-21), ohne Git-Historie. Downloadgröße und Dauer hängen vom Branch ab.</desc>
<style>@font-face{font-family:'spacr-os';font-weight:300;font-style:normal;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'spacr-os';font-weight:400;font-style:normal;src:url(data:font/woff2;base64,) format('woff2')}text{font-family:'spacr-os', 'spacr-script', 'spacr-symbols', 'Open Sans', sans-serif;font-kerning:normal}</style>
