<filter id="slanguage-translation-2" x="-5%" y="-20%" width="110%" height="140%"><feDropShadow dx="0" dy="1" stdDeviation="1.2" flood-color="#1f2328" flood-opacity=".22"/></filter><rect x="0.5" y="1.5" width="357" height="170" rx="12" fill="#161b22" stroke="#30363d" filter="url(#slanguage-translation-2)"/><text y="29.5" xml:space="preserve"><tspan x="16.0" font-size="13.6" font-weight="300" fill="#c9d1d9">Die neun nicht-englischen Kataloge werden von</tspan></text><text y="49.9" xml:space="preserve"><tspan x="16.0" font-size="13.6" font-weight="300" fill="#c9d1d9">einem Muttersprachler maschinengefertigt und</tspan></text><text y="70.3" xml:space="preserve"><tspan x="16.0" font-size="13.6" font-weight="300" fill="#c9d1d9">technisch überarbeitet, anstatt zu Ende zu lesen.</tspan></text><text y="90.7" xml:space="preserve"><tspan x="16.0" font-size="13.6" font-weight="300" fill="#c9d1d9">Die </tspan><tspan x="39.7" font-size="13.6" font-weight="400" fill="#6cb6ff">Überprüfungsspielraum</tspan><tspan x="191.8" font-size="13.6" font-weight="300" fill="#c9d1d9"> Aufzeichnungen,</tspan></text><text y="111.1" xml:space="preserve"><tspan x="16.0" font-size="13.6" font-weight="300" fill="#c9d1d9">welche Sprachen einen menschlichen Pass hatten</tspan></text><text y="131.5" xml:space="preserve"><tspan x="16.0" font-size="13.6" font-weight="300" fill="#c9d1d9">und jeder Begriff auf Englisch durch Entscheidung</tspan></text><text y="151.9" xml:space="preserve"><tspan x="16.0" font-size="13.6" font-weight="300" fill="#c9d1d9">übrig geblieben ist.</tspan></text><path d="M342 26l8-8M343.5 18h6.5v6.5" fill="none" stroke="#2ec4b6" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
