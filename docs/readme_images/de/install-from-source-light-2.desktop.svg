<svg xmlns="http://www.w3.org/2000/svg" width="830" height="149" viewBox="0 0 830 149" role="img" aria-labelledby="t d" data-source-sha256="41e608550ccc6727abe3c9e34e19838309b4161980832be4523be6d466a9ffaa">
<title id="t">spaCR</title>
<desc id="d">Der vollständige nightly-Klon lud 9.25 GiB herunter. --filter=blob:none zum flachen Klon hinzuzufügen verkleinert das ausgecheckte Arbeitsverzeichnis nicht: Sein Git-Objektspeicher umfasst weiterhin 2032 MB. Git meldet bei Bedarf nachgeladene Objekte nicht, daher wurde keine Gesamtgröße des Downloads gemessen. Die versionierten Dateien von nightly belegen im ausgecheckten Arbeitsverzeichnis 958 MB (gemessen am 2026-10-20), ohne Git-Historie. Downloadgröße und Dauer hängen vom Branch ab.</desc>
<style>@font-face{font-family:'spacr-os';font-weight:300;font-style:normal;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'spacr-os';font-weight:400;font-style:normal;src:url(data:font/woff2;base64,) format('woff2')}text{font-family:'spacr-os', 'spacr-script', 'spacr-symbols', 'Open Sans', sans-serif;font-kerning:normal}</style>
