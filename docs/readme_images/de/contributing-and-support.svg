<svg xmlns="http://www.w3.org/2000/svg" width="358" height="244" viewBox="0 0 358 244" role="img" aria-labelledby="t d" data-source-sha256="7cedfebcf1143a2e4f35c0950c7af188470118d8e001311beb1274a54b5f0ef2">
<title id="t">Beiträge und Support</title>
<desc id="d">Beiträge und Support. Übermitteln Sie Fehlerberichte und klar abgegrenzte Funktionswünsche über GitHub Issues. Geben Sie bei einer Fehlermeldung die spaCR-Version, das Betriebssystem, die Python-Version, die Moduleinstellungen und den relevanten Protokollauszug an. spacr-doctor erfasst den Großteil dieser Angaben; fügen Sie bei Leistungsproblemen den Hardwarebericht bei.</desc>
