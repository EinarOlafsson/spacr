<svg xmlns="http://www.w3.org/2000/svg" width="830" height="130" viewBox="0 0 830 130" role="img" aria-labelledby="t d" data-source-sha256="1c06c34230daca9a4e78f019736ad3334d1b169cddf4b8ae4212d85f01b8039a">
<title id="t">Animierte Einstellungshilfe</title>
<desc id="d">Animierte Einstellungshilfe. Einstellungen mit einer visuellen Erklärung bieten in ihrem Tooltip die Schaltfläche Animation. Durchsuchen Sie die Galerie der Einstellungsanimationen oder das Register der Einstellungsanimationen.</desc>
