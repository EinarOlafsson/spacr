<svg xmlns="http://www.w3.org/2000/svg" width="880" height="253" viewBox="0 0 880 253" role="img" aria-labelledby="t d" data-source-sha256="91d565c0fe10a5a5ae764c839fbda5642394dbbcc1be27bed9f5e5e22adb5025">
<title id="t">spaCR</title>
<desc id="d">spacr-doctor gibt pro Prüfung eine Zeile aus, mit einem Befehl, der bei jedem Fehler auszuführen ist. Außerdem meldet es, welches spacr im Pfad liegt. safespacr liest jede Einstellung mit ihrem Standardwert und schaltet Hintergrund, Animationen, ausführliche Protokollierung und Vorabladen ab. Verwenden Sie es, wenn eine gespeicherte Einstellung den Start verhindert. Im abgesicherten Modus gespeicherte Einstellungen werden normal geschrieben und bleiben erhalten.</desc>
