<svg xmlns="http://www.w3.org/2000/svg" width="830" height="139" viewBox="0 0 830 139" role="img" aria-labelledby="t d" data-source-sha256="b639e6faa69f19f9d3be662af6cbe3647523df00c6de228a4697f63c6512af6d">
<title id="t">spaCR</title>
<desc id="d">Speichert unter ~/.spacr/reports und gibt den Pfad aus. --quick überspringt die längeren Leistungstests; --out PATH legt den Speicherort fest. Liest keine Projektdaten. Misst die Dauer von Importen, numerischen Bibliotheksoperationen, Fensteraufbau und Animation und meldet x86_64-Emulation auf Apple Silicon sowie die BLAS-Implementierung von NumPy.</desc>
<style>@font-face{font-family:'spacr-os';font-weight:300;font-style:normal;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'spacr-os';font-weight:400;font-style:normal;src:url(data:font/woff2;base64,) format('woff2')}text{font-family:'spacr-os', 'spacr-script', 'spacr-symbols', 'Open Sans', sans-serif;font-kerning:normal}</style>
