<svg xmlns="http://www.w3.org/2000/svg" width="880" height="190" viewBox="0 0 880 190" role="img" aria-labelledby="t d" data-source-sha256="2a840e64e5752bfed2ea09c47f6a4e34bbda4231158633b1662d49941cd04f8b">
<title id="t">Einen Lauf untersuchen</title>
<desc id="d">Einen Lauf untersuchen. Jeder Lauf wird mit seinen Einstellungen, Hash-Eingängen, Ausgängen, Warnungen, Versionen und Samen auf ~/.spacr/runs tagebucht.</desc>
