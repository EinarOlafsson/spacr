<svg xmlns="http://www.w3.org/2000/svg" width="358" height="163" viewBox="0 0 358 163" role="img" aria-labelledby="t d" data-source-sha256="bac9747bf9ecac1718d043de84a2797ca1c759d8c54c9bd75446602592f143d8">
<title id="t">Einen Lauf untersuchen</title>
<desc id="d">Einen Lauf untersuchen. Jeder Lauf wird unter ~/.spacr/runs mit Einstellungen, Hashwerten der Eingaben, Ausgaben, Warnungen, Versionen und Zufallsstartwerten protokolliert.</desc>
<style>@font-face{font-family:'spacr-os';font-weight:300;font-style:normal;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'spacr-os';font-weight:400;font-style:normal;src:url(data:font/woff2;base64,) format('woff2')}text{font-family:'spacr-os', 'spacr-script', 'spacr-symbols', 'Open Sans', sans-serif;font-kerning:normal}</style>
