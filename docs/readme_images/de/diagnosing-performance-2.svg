eldet</tspan></text><text y="161.9" xml:space="preserve"><tspan x="16.0" font-size="13.6" font-weight="300" fill="#c9d1d9">x86_64-Emulation auf Apple Silicon sowie die</tspan></text><text y="182.3" xml:space="preserve"><tspan x="16.0" font-size="13.6" font-weight="300" fill="#c9d1d9">BLAS-Implementierung von NumPy.</tspan></text>
