d9">im kanonischen Englisch. Siehe die </tspan><tspan x="314.6" font-size="17" font-weight="400" fill="#6cb6ff">Richtlinie zur Kontexthilfe</tspan><tspan x="516.9" font-size="17" font-weight="300" fill="#c9d1d9">.</tspan></text><path d="M840 36l8-8M841.5 28h6.5v6.5" fill="none" stroke="#2ec4b6" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
