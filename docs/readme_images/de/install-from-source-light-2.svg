<svg xmlns="http://www.w3.org/2000/svg" width="358" height="202" viewBox="0 0 358 202" role="img" aria-labelledby="t d" data-source-sha256="49a106ed0db24198cd1b8f4a612f6ca1890a7bc2657d5f9484fd9a45bb90939f">
<title id="t">spaCR</title>
<desc id="d">Nur Laufzeitdateien: 104 MB auf dem Datenträger in 6 s (Git: 38 MB; Dateien: 66 MB). Historie, docs, tests, tools, features, Beispieldaten und erweiterte Oberflächenübersetzungen werden ausgelassen. --with-docs, --with-tests und --with-translations behalten die entsprechende Dokumentation, Tests und Übersetzungen bei. Die kompakten Oberflächenübersetzungen bleiben verfügbar.</desc>
