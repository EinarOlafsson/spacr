<svg xmlns="http://www.w3.org/2000/svg" width="358" height="233" viewBox="0 0 358 233" role="img" aria-labelledby="t d" data-source-sha256="5a3d3bc96b8a56f0c8b14698f4e03c2ccac35fdd55b93adf4e17a77ace2457a7">
<title id="t">spaCR</title>
<desc id="d">spacr-doctor prentar eina línu fyrir hverja athugun, með skipun til að keyra fyrir hverja bilun. Það segir einnig hvaða spacr er á slóðinni. safespacr les hverja stillingu sem sjálfgefið gildi hennar og slekkur á bakgrunni, hreyfimyndum, ítarlegri skráningu og forhleðslu. Notaðu það þegar vistuð stilling kemur í veg fyrir að forritið ræsist. Stillingar sem vistaðar eru í öruggum ham eru skrifaðar eins og venjulega og haldast.</desc>
<style>@font-face{font-family:'spacr-os';font-weight:300;font-style:normal;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'spacr-os';font-weight:400;font-style:normal;src:url(data:font/woff2;base64,) format('woff2')}text{font-family:'spacr-os', 'spacr-script', 'spacr-symbols', 'Open Sans', sans-serif;font-kerning:normal}</style>
