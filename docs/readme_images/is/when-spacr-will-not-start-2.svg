g kemur í veg fyrir að forritið ræsist.</tspan></text><text y="182.3" xml:space="preserve"><tspan x="16.0" font-size="13.6" font-weight="300" fill="#c9d1d9">Stillingar sem vistaðar eru í öruggum ham eru</tspan></text><text y="202.7" xml:space="preserve"><tspan x="16.0" font-size="13.6" font-weight="300" fill="#c9d1d9">skrifaðar eins og venjulega og haldast.</tspan></text>
