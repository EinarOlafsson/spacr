<svg xmlns="http://www.w3.org/2000/svg" width="830" height="129" viewBox="0 0 830 129" role="img" aria-labelledby="t d" data-source-sha256="0cb3ee4acb25c6ee96bb51bb69436f2e33a574812d4076030ed48058fb255e25">
<title id="t">spaCR</title>
<desc id="d">Full klónun nightly sótti 9.25 GiB. Að bæta --filter=blob:none við grunna klónið minnkar ekki vinnueintakið: Git-hlutasafnið tekur enn 2032 MB. Git tilkynnir ekki um hluti sem eru sóttir síðar eftir þörfum, svo heildarniðurhal var ekki mælt. Útgáfustýrðu skrárnar í nightly taka 958 MB í vinnueintakinu (mælt 2026-10-20), án Git-sögunnar. Stærð og tími niðurhals eru mismunandi eftir grein.</desc>
