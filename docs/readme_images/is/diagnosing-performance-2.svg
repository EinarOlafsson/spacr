<svg xmlns="http://www.w3.org/2000/svg" width="358" height="192" viewBox="0 0 358 192" role="img" aria-labelledby="t d" data-source-sha256="e045f995380a5197894ae8d16391e424eba49cfda969790b13b33cac58207730">
<title id="t">spaCR</title>
<desc id="d">Vistar í ~/.spacr/reports og prentar slóðina. --quick sleppir lengri afkastaprófunum; --out PATH tilgreinir vistunarstað. Les engin verkefnisgögn. Mælir tímann sem innflutningur, töluleg söfn, gerð glugga og hreyfimyndir taka og greinir frá x86_64-hermun á Apple Silicon og BLAS-útfærslu NumPy.</desc>
<style>@font-face{font-family:'spacr-os';font-weight:300;font-style:normal;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'spacr-os';font-weight:400;font-style:normal;src:url(data:font/woff2;base64,) format('woff2')}text{font-family:'spacr-os', 'spacr-script', 'spacr-symbols', 'Open Sans', sans-serif;font-kerning:normal}</style>
