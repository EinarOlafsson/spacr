<svg xmlns="http://www.w3.org/2000/svg" width="358" height="142" viewBox="0 0 358 142" role="img" aria-labelledby="t d" data-source-sha256="430602eb42fc1097839e1aaaeb184e1ad277420288b3841c9f717d3593c92bfe">
<title id="t">Skoða keyrslu</title>
<desc id="d">Skoða keyrslu. Hver keyrsla er skráð í ~/.spacr/runs með stillingum, tætigildum inntaksgagna, úttökum, viðvörunum, útgáfum og upphafsgildum slembitalna.</desc>
