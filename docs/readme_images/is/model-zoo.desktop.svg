<defs><linearGradient id="gmodel-zoo" x1="0" x2="1" y1="0" y2="0"><stop offset="0" stop-color="#2ec4b6"/><stop offset="1" stop-color="#6cb6ff"/></linearGradient><clipPath id="cmodel-zoo"><rect x="0" y="1" width="830" height="160" rx="12"/></clipPath></defs><filter id="smodel-zoo" x="-5%" y="-20%" width="110%" height="140%"><feDropShadow dx="0" dy="1" stdDeviation="1.2" flood-color="#1f2328" flood-opacity=".22"/></filter><rect x="0.5" y="1.5" width="829" height="159" rx="12" fill="#161b22" stroke="#30363d" filter="url(#smodel-zoo)"/><rect x="0" y="1" width="830" height="2" fill="url(#gmodel-zoo)" fill-opacity=".7" clip-path="url(#cmodel-zoo)"/><text y="36.2" xml:space="preserve"><tspan x="24.0" font-size="16" font-weight="400" fill="#e6edf3">Líkanasafn</tspan></text><rect x="24" y="48.0" width="24" height="2" rx="1" fill="#2ec4b6"/><text y="75.5" xml:space="preserve"><tspan x="24.0" font-size="13.6" font-weight="300" fill="#c9d1d9">spaCR inniheldur skrá yfir þjálfuð líkön og sækir þau eftir þörfum. Opnaðu </tspan><tspan x="475.0" font-size="13.6" font-weight="400" fill="#e6edf3">Model Zoo</tspan><tspan x="542.5" font-size="13.6" font-weight="300" fill="#c9d1d9"> á upphafsskjánum til að skoða og setja</tspan></text><rect x="377.9" y="82.0" width="235.7" height="22.6" rx="5" fill="#2ec4b6" fill-opacity=".12"/><text y="95.9" xml:space="preserve"><tspan x="24.0" font-size="13.6" font-weight="300" fill="#c9d1d9">upp líkön, eða tilgreindu líkanalykil í stillingaskrá, til dæmis </tspan><tspan x="380.9" font-size="13.6" font-weight="400" fill="#2ec4b6">pathogen_model: toxoplasma_pv_v1</tspan><tspan x="613.6" font-size="13.6" font-weight="300" fill="#c9d1d9">. Líkanið er sótt og staðfest</tspan></text><text y="116.3" xml:space="preserve"><tspan x="24.0" font-size="13.6" font-weight="300" fill="#c9d1d9">með gátsummu þegar fyrst er þörf á því. Hver birt færsla hefur SHA-256-gátsummu. Færslu án gátsummu er hafnað, þar sem</tspan></text><text y="136.7" xml:space="preserve"><tspan x="24.0" font-size="13.6" font-weight="300" fill="#c9d1d9">annars væri ekki hægt að greina ófullkomna eða útskipta líkanaskrá frá upprunalegu skránni.</tspan></text>
