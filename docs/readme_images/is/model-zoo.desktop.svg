<svg xmlns="http://www.w3.org/2000/svg" width="830" height="171" viewBox="0 0 830 171" role="img" aria-labelledby="t d" data-source-sha256="808cbcbdefbab61a7864d1eb2a2cf3de4efbcfa2d7928724ed2bd369c08bfb8c">
<title id="t">Líkanasafn</title>
<desc id="d">Líkanasafn. spaCR inniheldur skrá yfir þjálfuð líkön og sækir þau eftir þörfum. Opnaðu Model Zoo á upphafsskjánum til að skoða og setja upp líkön, eða tilgreindu líkanalykil í stillingaskrá, til dæmis pathogen_model: toxoplasma_pv_v1. Líkanið er sótt og staðfest með gátsummu þegar fyrst er þörf á því. Hver birt færsla hefur SHA-256-gátsummu. Færslu án gátsummu er hafnað, þar sem annars væri ekki hægt að greina ófullkomna eða útskipta líkanaskrá frá upprunalegu skránni.</desc>
