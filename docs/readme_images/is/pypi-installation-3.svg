<title id="t">spaCR</title>
<desc id="d">Opinlegri samsetningar eru settar sérstakt, t.d. spacr[zarr], spacr[omero],spacr[napari] og spacr[czi,nd2,lif]. Sjá uppsetningarleiðbeiningarnar (nightly, á ensku) fyrir fullkomna útgáfur og Python-version samskipti tól.</desc>
