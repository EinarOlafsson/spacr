<title id="t">spaCR</title>
<desc id="d">Valfrjálsar samþættingar eru settar upp sérstaklega, til dæmis spacr[zarr], spacr[omero], spacr[napari] og spacr[czi,nd2,lif]. Heildarlisti yfir viðbætur og tafla yfir samhæfi Python-útgáfa eru í uppsetningarleiðbeiningunum (nightly, á ensku).</desc>
