<svg xmlns="http://www.w3.org/2000/svg" width="880" height="155" viewBox="0 0 880 155" role="img" aria-labelledby="t d" data-source-sha256="0e87d038633275465f3da46950d1e9fdc4309a80320b139d300728ead0aaa3a2">
<title id="t">spaCR</title>
<desc id="d">Nín ekki Engleska sögu eru stutt og tæknilegt endurskoðað í stað þess að lesa end til end af heimilum tala. Sjáðu skammt skrá sem tungumálir hafa haft mannleg útgang og hvert orð eftir á Englesku eftir ákvörðun.</desc>
