<svg xmlns="http://www.w3.org/2000/svg" width="358" height="273" viewBox="0 0 358 273" role="img" aria-labelledby="t d" data-source-sha256="4a526224a30870de621882ab3da20e2f97c71df7242eb5a545efca2421c05546">
<title id="t">spaCR</title>
<desc id="d">Á macOS skaltu opna .pkg skrána. Núverandi beta-útgáfa hefur ekki fengið notarization-staðfestingu frá Apple. Ef Gatekeeper stöðvar hana skaltu velja System Settings → Privacy &amp; Security → Open Anyway. Leiðbeiningar um uppsetningu, uppfærslu, enduruppsetningu, fjarlægingu, notkun án nettengingar og bilanagreiningu eru í nýjustu uppsetningarleiðbeiningunum á nightly (á ensku). Í kerfiskröfunum eru ráðleggingar um vinnustöðvar og netþjóna og töflur um GPU-samhæfi.</desc>
