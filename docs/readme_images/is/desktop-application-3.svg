<svg xmlns="http://www.w3.org/2000/svg" width="880" height="225" viewBox="0 0 880 225" role="img" aria-labelledby="t d" data-source-sha256="c2a3c405aab55364d20b9d5b9310238edce5972fec95c88ea790a8ba4f78f287">
<title id="t">spaCR</title>
<desc id="d">Á macOS, opna .pkg. Núverandi beta er ekki notarið; ef Gatekeeper blokkir það, velja System Settings → Privacy &amp; Security → Open Anyway. Sjá uppsetningarleiðbeiningarnar fyrir leiðbeiningar um uppfærslu, fjarlægingu, notkun án nettengingar og bilanagreiningu. Í kerfiskröfunum eru ráðleggingar um vinnustöðvar og netþjóna og töflur um GPU-samhæfi.</desc>
