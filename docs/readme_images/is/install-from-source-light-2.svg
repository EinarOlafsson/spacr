<svg xmlns="http://www.w3.org/2000/svg" width="358" height="202" viewBox="0 0 358 202" role="img" aria-labelledby="t d" data-source-sha256="900ca97fab962efc40f0a010ee7c8465d25d8fdffedd3f69910460615fc2118a">
<title id="t">spaCR</title>
<desc id="d">Full klónun nightly sótti 9.25 GiB. Að bæta --filter=blob:none við grunna klónið minnkar ekki vinnueintakið: Git-hlutasafnið tekur enn 2032 MB. Git tilkynnir ekki um hluti sem eru sóttir síðar eftir þörfum, svo heildarniðurhal var ekki mælt. Útgáfustýrðu skrárnar í nightly taka 1178 MB í vinnueintakinu (mælt 2026-10-20), án Git-sögunnar. Stærð og tími niðurhals eru mismunandi eftir grein.</desc>
<style>@font-face{font-family:'spacr-os';font-weight:300;font-style:normal;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'spacr-os';font-weight:400;font-style:normal;src:url(data:font/woff2;base64,) format('woff2')}text{font-family:'spacr-os', 'spacr-script', 'spacr-symbols', 'Open Sans', sans-serif;font-kerning:normal}</style>
