<svg xmlns="http://www.w3.org/2000/svg" width="358" height="182" viewBox="0 0 358 182" role="img" aria-labelledby="t d" data-source-sha256="863d63e77fb5d85d40d69019a53b7213eb1cf07b44a1b0ba0929a87f6cc17f6f">
<title id="t">spaCR</title>
<desc id="d">Aðeins keyrsluskrár: 104 MB á diski á 6 s (Git: 38 MB; skrár: 66 MB). Sleppt er sögu, docs, tests, tools, features, dæmigögnum og ítarlegri þýðingum viðmótsins. --with-docs, --with-tests og --with-translations halda eftir samsvarandi leiðbeiningum, prófum og þýðingum. Grunnþýðingar viðmótsins eru áfram tiltækar.</desc>
