<svg xmlns="http://www.w3.org/2000/svg" width="830" height="179" viewBox="0 0 830 179" role="img" aria-labelledby="t d" data-source-sha256="f18c789c160d468adb3b1f2d21d7b5abe25d977683091057743358e6144dac82">
<title id="t">spaCR</title>
<desc id="d">--dir velur slóð klónunarinnar; --branch velur grein eða merki; --no-install sækir án þess að setja upp; --help sýnir valkostina. packaging/source_install_excludes.txt telur upp allar slóðir sem er sleppt. Full klónun nightly sótti 9.25 GiB. Að bæta --filter=blob:none við grunna klónið minnkar ekki vinnueintakið: Git-hlutasafnið tekur enn 2032 MB. Git tilkynnir ekki um hluti sem eru sóttir síðar eftir þörfum, svo heildarniðurhal var ekki mælt. Útgáfustýrðu skrárnar í nightly taka 467 MB í vinnueintakinu (mælt 2026-11-07), án Git-sögunnar. Stærð og tími niðurhals eru mismunandi eftir grein.</desc>
