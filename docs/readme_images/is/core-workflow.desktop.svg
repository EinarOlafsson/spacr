163.0" r="2.2" fill="#2ec4b6"/><text y="167.5" xml:space="preserve"><tspan x="38.0" font-size="13.6" font-weight="400" fill="#e6edf3">Classify</tspan><tspan x="85.3" font-size="13.6" font-weight="300" fill="#c9d1d9"> þjálfar líkön byggð á myndum eða mælingum og skráir frammistöðu á fráteknum gögnum með hverjum varðpunkti.</tspan></text><circle cx="28" cy="187.4" r="2.2" fill="#2ec4b6"/><text y="191.9" xml:space="preserve"><tspan x="38.0" font-size="13.6" font-weight="400" fill="#e6edf3">Map Barcodes</tspan><tspan x="128.7" font-size="13.6" font-weight="300" fill="#c9d1d9"> varpar FASTQ-lestrum á brunna og gRNA og veitir gæðamat fyrir magn, árekstra og þekju.</tspan></text><circle cx="28" cy="211.8" r="2.2" fill="#2ec4b6"/><text y="216.3" xml:space="preserve"><tspan x="38.0" font-size="13.6" font-weight="400" fill="#e6edf3">Regression</tspan><tspan x="107.5" font-size="13.6" font-weight="300" fill="#c9d1d9"> metur áhrif leiðarsameinda, gena, skilyrða og viðmiða með líkanafjölskyldum sem henta samfelldum gildum,</tspan></text><text y="236.7" xml:space="preserve"><tspan x="38.0" font-size="13.6" font-weight="300" fill="#c9d1d9">hlutföllum og talningum.</tspan></text>
</svg>
