<title id="t">Hreyfimyndaleiðbeiningar fyrir stillingar</title>
<desc id="d">Hreyfimyndaleiðbeiningar fyrir stillingar. Stillingar með sjónræna skýringu bjóða upp á Animation-stýringu í verkfæraábendingunni. Skoðaðu myndasafn stillingahreyfimynda eða skrá stillingahreyfimynda.</desc>
