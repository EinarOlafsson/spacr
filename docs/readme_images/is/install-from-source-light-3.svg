<svg xmlns="http://www.w3.org/2000/svg" width="358" height="314" viewBox="0 0 358 314" role="img" aria-labelledby="t d" data-source-sha256="fd9d912278287406ecb8cdaf7d72c16318fcd47e196e65ecea629d2d9ae44789">
<title id="t">spaCR</title>
<desc id="d">--dir velur slóð klónunarinnar; --branch velur grein eða merki; --no-install sækir án þess að setja upp; --help sýnir valkostina. packaging/source_install_excludes.txt telur upp allar slóðir sem er sleppt. Full klónun nightly sótti 9.25 GiB. Að bæta --filter=blob:none við grunna klónið minnkar ekki vinnueintakið: Git-hlutasafnið tekur enn 2032 MB. Git tilkynnir ekki um hluti sem eru sóttir síðar eftir þörfum, svo heildarniðurhal var ekki mælt. Útgáfustýrðu skrárnar í main taka 1265 MB í vinnueintakinu (mælt 2026-10-21), án Git-sögunnar. Stærð og tími niðurhals eru mismunandi eftir grein.</desc>
<style>@font-face{font-family:'spacr-os';font-weight:300;font-style:normal;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'spacr-os';font-weight:400;font-style:normal;src:url(data:font/woff2;base64,) format('woff2')}text{font-family:'spacr-os', 'spacr-script', 'spacr-symbols', 'Open Sans', sans-serif;font-kerning:normal}</style>
