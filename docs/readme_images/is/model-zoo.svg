<svg xmlns="http://www.w3.org/2000/svg" width="358" height="224" viewBox="0 0 358 224" role="img" aria-labelledby="t d" data-source-sha256="5327cf653e04c7fcd9bfc68c9299eca78d7f1c89b04aa49f0695a2e8f22c914d">
<title id="t">Líkanasafn</title>
<desc id="d">Líkanasafn. spaCR skipar listan af þjálfað mönnunum og snúa þeim á eftirspurn. Opna Mönnun Zoo frá heimaskjólum til að skoða og setja upp þá, eða nefna key í setningarfilenni - pathogen_model: toxoplasma_pv_v1 - og mönnin er hlaðið niður og checksum-verified fyrsta sinn sem það er nauðsynlegt.</desc>
