<svg xmlns="http://www.w3.org/2000/svg" width="880" height="232" viewBox="0 0 880 232" role="img" aria-labelledby="t d" data-source-sha256="f05e6a5af314601409bc24090c657daed75237fce8709fa3c0a5e0646fa2e05d">
<title id="t">Leyfi</title>
<desc id="d">Leyfi. spaCR er frelsað undir BSD 3-Klausur leyfi. Ef spaCR hjálpaði að útgáfa verk, er nefndur verðmæt og er ekki skilyrði fyrir leyfi — sjá Tilvísun í spaCR hér neðan.</desc>
