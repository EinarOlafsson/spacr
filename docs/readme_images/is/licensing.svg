<svg xmlns="http://www.w3.org/2000/svg" width="358" height="173" viewBox="0 0 358 173" role="img" aria-labelledby="t d" data-source-sha256="1bb64c4e8bfc438459cfb3a25b48d206742957c38d640cd8913c79481f0d0c90">
<title id="t">Leyfi</title>
<desc id="d">Leyfi. spaCR er gefið út undir BSD3-Clause-leyfinu. Ef spaCR nýttist við birt verk er tilvísun vel þegin, en hún er ekki skilyrði leyfisins; sjá Tilvísun í spaCR hér fyrir neðan.</desc>
