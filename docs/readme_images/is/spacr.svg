lokksmiðju mótmælur virkar einnig án sekkunararms.</tspan></text><text y="354.0" xml:space="preserve"><tspan x="46.0" font-size="17" font-weight="300" fill="#c9d1d9">Make Masks leiðréttir skiptingargrímur og merkir sjálfstæða rétthyrninga með flokkamerkjum með</tspan></text><text y="382.0" xml:space="preserve"><tspan x="46.0" font-size="17" font-weight="400" fill="#e6edf3">Box</tspan><tspan x="76.1" font-size="17" font-weight="300" fill="#c9d1d9"> verkfærinu fyrir YOLO-útflutning. Rammarnir halda eigin merkjum og sögu án þess að breyta</tspan></text><text y="410.0" xml:space="preserve"><tspan x="46.0" font-size="17" font-weight="300" fill="#c9d1d9">upprunamyndum eða grímum.</tspan></text><text y="452.0" xml:space="preserve"><tspan x="46.0" font-size="17" font-weight="300" fill="#c9d1d9">Hvert verkfæri er útskýrt í </tspan><tspan x="243.6" font-size="17" font-weight="400" fill="#6cb6ff">eiginleikahandbókinni</tspan><tspan x="417.6" font-size="17" font-weight="300" fill="#c9d1d9">.</tspan></text><text y="494.0" xml:space="preserve"><tspan x="46.0" font-size="17" font-weight="300" fill="#c9d1d9">Myndir, grímur og myndúrklippur eru skrár á diski. Mælingar, merkingar og spár líkana eru töflur í</tspan></text><rect x="298.9" y="506.2" width="142.1" height="24.5" rx="5" fill="#2ec4b6" fill-opacity=".12"/><text y="522.0" xml:space="preserve"><tspan x="46.0" font-size="17" font-weight="300" fill="#c9d1d9">SQLite-gagnagrunni verkefnisins, </tspan><tspan x="303.9" font-size="15.5" font-weight="400" fill="#2ec4b6">measurements.db</tspan><tspan x="441.0" font-size="17" font-weight="300" fill="#c9d1d9">.</tspan></text><text y="564.0" xml:space="preserve"><tspan x="46.0" font-size="17" font-weight="300" fill="#c9d1d9">Keyrist sem skjáborðsforrit eða án grafísks viðmóts á vinnustöð, þjóni eða reikniklasa.</tspan></text><path d="M840 36l8-8M841.5 28h6.5v6.5" fill="none" stroke="#2ec4b6" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
