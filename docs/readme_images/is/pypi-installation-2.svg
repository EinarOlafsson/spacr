<svg xmlns="http://www.w3.org/2000/svg" width="880" height="253" viewBox="0 0 880 253" role="img" aria-labelledby="t d" data-source-sha256="c357552be56cc5b3953cb5b50b45f2a106eb905622e8ad375ccdd2ee6d2399b3">
<title id="t">spaCR</title>
<desc id="d">spaCR styður Python 3.9 til 3.14, nema Python 3.14.1, sem torchvision útilokar. Mælt er með Linux fyrir þyngstu CUDA- og ROCm-verkflæðin; macOS og Windows eru einnig studd og nýta bæði GPU sín — macOS í gegnum Metal, sem nær yfir Apple Silicon og AMD-kortin í Intel-Mac-tölvum, og Windows í gegnum CUDA eða DirectML. Hefðbundin uppsetning inniheldur Qt-skjáborðsviðmótið. Á þjóni, reikniklasa eða CI-keyrsluumhverfi má keyra skipanalínuverkflæðin án þess að opna það:</desc>
