<svg xmlns="http://www.w3.org/2000/svg" width="358" height="223" viewBox="0 0 358 223" role="img" aria-labelledby="t d" data-source-sha256="acc699f76cd539e8e2c961da4b06a60ee6cf9ce2dea72bd4c6d48263344d8340">
<title id="t">spaCR</title>
<desc id="d">El clon completo de nightly descargó 9.25 GiB. Añadir --filter=blob:none al clon superficial no reduce la copia de trabajo: su almacén de objetos Git aún ocupa 2032 MB. Git no informa de las descargas diferidas de objetos, por lo que no se midió un total de descarga. Los archivos versionados de nightly ocupan 1178 MB en la copia de trabajo (medidos el 2026-10-20), sin el historial de Git. El tamaño y la duración de la descarga varían según la rama.</desc>
<style>@font-face{font-family:'spacr-os';font-weight:300;font-style:normal;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'spacr-os';font-weight:400;font-style:normal;src:url(data:font/woff2;base64,) format('woff2')}text{font-family:'spacr-os', 'spacr-script', 'spacr-symbols', 'Open Sans', sans-serif;font-kerning:normal}</style>
