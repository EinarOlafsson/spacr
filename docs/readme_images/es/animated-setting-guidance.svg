<svg xmlns="http://www.w3.org/2000/svg" width="358" height="163" viewBox="0 0 358 163" role="img" aria-labelledby="t d" data-source-sha256="b66e9aff3cccf2eb6aa42803962bda45d239683c6c097918dd0b577a712b3002">
<title id="t">Guía animada de ajustes</title>
<desc id="d">Guía animada de ajustes. Los ajustes con una explicación visual incluyen un control Animación en su información emergente. Consulte la galería de animaciones de ajustes o el registro de animaciones de ajustes.</desc>
