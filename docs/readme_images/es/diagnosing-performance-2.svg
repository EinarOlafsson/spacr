<svg xmlns="http://www.w3.org/2000/svg" width="358" height="212" viewBox="0 0 358 212" role="img" aria-labelledby="t d" data-source-sha256="cbbcbc2ebb07ee71b8a40b7f5e53544c47de7d72376648bb16bbe2ae88a0dac0">
<title id="t">spaCR</title>
<desc id="d">Guarda el informe en ~/.spacr/reports y muestra la ruta. --quick omite las pruebas de rendimiento más largas; --out PATH establece la ubicación. No lee datos del proyecto. Mide el tiempo de las importaciones, las bibliotecas numéricas, la creación de ventanas y la animación, e informa de la emulación x86_64 en Apple Silicon y de la implementación de BLAS que usa NumPy.</desc>
<style>@font-face{font-family:'spacr-os';font-weight:300;font-style:normal;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'spacr-os';font-weight:400;font-style:normal;src:url(data:font/woff2;base64,) format('woff2')}text{font-family:'spacr-os', 'spacr-script', 'spacr-symbols', 'Open Sans', sans-serif;font-kerning:normal}</style>
