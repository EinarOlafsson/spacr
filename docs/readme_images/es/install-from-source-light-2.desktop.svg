<svg xmlns="http://www.w3.org/2000/svg" width="830" height="129" viewBox="0 0 830 129" role="img" aria-labelledby="t d" data-source-sha256="a9632686b01ce845256a55421bab921de4972d6cee096046403c922e73319662">
<title id="t">spaCR</title>
<desc id="d">Solo archivos de ejecución: 104 MB en disco en 6 s (Git: 38 MB; archivos: 66 MB). Se omiten el historial, docs, tests, tools, features, los datos de ejemplo y las traducciones ampliadas de la interfaz. --with-docs, --with-tests y --with-translations conservan la documentación, las pruebas y las traducciones correspondientes. Las traducciones compactas de la interfaz siguen disponibles.</desc>
