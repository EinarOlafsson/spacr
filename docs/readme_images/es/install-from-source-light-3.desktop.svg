<svg xmlns="http://www.w3.org/2000/svg" width="830" height="179" viewBox="0 0 830 179" role="img" aria-labelledby="t d" data-source-sha256="c87246bb1e2e872c2f1398867d3192b127d9be707f9756f618e34c04b0407bf7">
<title id="t">spaCR</title>
<desc id="d">--dir elige la ruta del clon; --branch selecciona una rama o etiqueta; --no-install descarga sin instalar; --help muestra las opciones. packaging/source_install_excludes.txt enumera todas las rutas omitidas. El clon completo de nightly descargó 9.25 GiB. Añadir --filter=blob:none al clon superficial no reduce la copia de trabajo: su almacén de objetos Git aún ocupa 2032 MB. Git no informa de las descargas diferidas de objetos, por lo que no se midió un total de descarga. Los archivos versionados de nightly ocupan 720 MB en la copia de trabajo (medidos el 2026-10-21), sin el historial de Git. El tamaño y la duración de la descarga varían según la rama.</desc>
