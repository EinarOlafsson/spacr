y="84.3" xml:space="preserve"><tspan x="24.0" font-size="13.6" font-weight="300" fill="#c9d1d9">El clon completo de nightly descargó 9.25 GiB. Añadir </tspan><tspan x="355.1" font-size="13.6" font-weight="400" fill="#2ec4b6">--filter=blob:none</tspan><tspan x="468.5" font-size="13.6" font-weight="300" fill="#c9d1d9"> al clon superficial no reduce la copia de trabajo: su</tspan></text><text y="104.7" xml:space="preserve"><tspan x="24.0" font-size="13.6" font-weight="300" fill="#c9d1d9">almacén de objetos Git aún ocupa 2032 MB. Git no informa de las descargas diferidas de objetos, por lo que no se midió un</tspan></text><text y="125.1" xml:space="preserve"><tspan x="24.0" font-size="13.6" font-weight="300" fill="#c9d1d9">total de descarga. Los archivos versionados de nightly ocupan 720 MB en la copia de trabajo (medidos el 2026-10-21), sin el</tspan></text><text y="145.5" xml:space="preserve"><tspan x="24.0" font-size="13.6" font-weight="300" fill="#c9d1d9">historial de Git. El tamaño y la duración de la descarga varían según la rama.</tspan></text>
