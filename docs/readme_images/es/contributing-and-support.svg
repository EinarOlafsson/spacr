<svg xmlns="http://www.w3.org/2000/svg" width="880" height="246" viewBox="0 0 880 246" role="img" aria-labelledby="t d" data-source-sha256="b5334306396117a806f895819a8436e5f05915c87544985f4cbe895ffb00da73">
<title id="t">Contribuciones y soporte</title>
<desc id="d">Contribuciones y soporte. Envíe informes de errores y solicitudes de funciones concretas mediante GitHub Issues. Al informar de un fallo, incluya la versión de spaCR, el sistema operativo, la versión de Python, los ajustes del módulo y el fragmento de registro pertinente. spacr-doctor recopila la mayor parte de esta información; incluya el informe de hardware cuando notifique problemas de rendimiento.</desc>
