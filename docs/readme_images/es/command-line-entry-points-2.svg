<svg xmlns="http://www.w3.org/2000/svg" width="358" height="141" viewBox="0 0 358 141" role="img" aria-labelledby="t d" data-source-sha256="9049b7eee037264e8cc0f89ca2d3734cd44e84c68f02fb2f7156a3fe476ee74f">
<title id="t">spaCR</title>
<desc id="d">spacr-run --list enumera los módulos con puntos de entrada de línea de comandos para ejecutarse sin interfaz gráfica. Se omiten los módulos de anotación, curación, comparación y exploración disponibles únicamente en la interfaz gráfica.</desc>
<style>@font-face{font-family:'spacr-os';font-weight:300;font-style:normal;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'spacr-os';font-weight:400;font-style:normal;src:url(data:font/woff2;base64,) format('woff2')}text{font-family:'spacr-os', 'spacr-script', 'spacr-symbols', 'Open Sans', sans-serif;font-kerning:normal}</style>
