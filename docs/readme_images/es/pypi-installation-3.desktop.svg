<title id="t">spaCR</title>
<desc id="d">Las integraciones opcionales se instalan por separado, por ejemplo spacr[zarr], spacr[omero], spacr[napari] y spacr[czi,nd2,lif]. Consulte la guía de instalación (nightly, en inglés) para ver la lista completa de extras y la tabla de compatibilidad de versiones de Python.</desc>
