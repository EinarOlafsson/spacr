<svg xmlns="http://www.w3.org/2000/svg" width="358" height="182" viewBox="0 0 358 182" role="img" aria-labelledby="t d" data-source-sha256="841d791def2208d65e992ef4e253aaeeddc53e02f25f6cb1f3c5d9a7ec75966d">
<title id="t">spaCR</title>
<desc id="d">Los nueve catálogos no ingleses son redactados por máquina y revisados técnicamente en lugar de leer de extremo a extremo por un hablante nativo. Los registros ámbito de aplicación de la revisión que los idiomas han tenido un pase humano y cada término dejado en inglés por decisión.</desc>
