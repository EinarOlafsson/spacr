<svg xmlns="http://www.w3.org/2000/svg" width="880" height="225" viewBox="0 0 880 225" role="img" aria-labelledby="t d" data-source-sha256="11f851aba8f413b704d01611720a1ba12ba699da0d066845ff1b0d06ec600bd4">
<title id="t">spaCR</title>
<desc id="d">spacr-doctor imprime una línea por comprobación, con un comando para ejecutar por cada fallo. También informa qué spacr está en la ruta. safespacr lee cada preferencia con su valor predeterminado y desactiva el fondo, las animaciones, el registro detallado y la precarga. Úselo cuando una preferencia guardada impide el inicio. Las preferencias guardadas en modo seguro se escriben normalmente y se conservan.</desc>
