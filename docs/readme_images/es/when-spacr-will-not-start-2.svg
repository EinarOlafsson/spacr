<svg xmlns="http://www.w3.org/2000/svg" width="880" height="225" viewBox="0 0 880 225" role="img" aria-labelledby="t d" data-source-sha256="1f5bc7d8bbc5b2e2c16ca70f370c653661b4c2b87ab8b65d287d8aa56ec7d5f1">
<title id="t">spaCR</title>
<desc id="d">spacr-doctor imprime una línea por cheque, con un comando para ejecutar por cada fallo. También informa qué spacr está en la ruta. safespacr lee cada preferencia con su valor predeterminado y desactiva el fondo, las animaciones, el registro detallado y la precarga. Úselo cuando una preferencia guardada impide el inicio. Las preferencias guardadas en modo seguro se escriben normalmente y se conservan.</desc>
