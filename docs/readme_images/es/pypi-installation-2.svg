torio Qt. En un servidor, clúster o ejecutor de CI,</tspan></text><text y="243.5" xml:space="preserve"><tspan x="16.0" font-size="13.6" font-weight="300" fill="#c9d1d9">ejecute los flujos de trabajo de línea de comandos</tspan></text><text y="263.9" xml:space="preserve"><tspan x="16.0" font-size="13.6" font-weight="300" fill="#c9d1d9">sin abrirla:</tspan></text>
