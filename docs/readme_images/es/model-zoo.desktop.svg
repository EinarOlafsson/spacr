<svg xmlns="http://www.w3.org/2000/svg" width="830" height="171" viewBox="0 0 830 171" role="img" aria-labelledby="t d" data-source-sha256="82b1a1d7dfe35fb6232a60eb2c4e947ebdf7be68bc9fe472fa3f769a747229c2">
<title id="t">Biblioteca de modelos</title>
<desc id="d">Biblioteca de modelos. spaCR envía un catálogo de modelos entrenados y los trae a pedido. Abra Model Zoo desde la pantalla de inicio para navegar e instalarlos, o nombre una clave en un archivo de configuración -- pathogen_model: toxoplasma_pv_v1 -- y el modelo se descarga y comprueba la primera vez que es necesario. Cada entrada publicada lleva un SHA-256; una entrada sin uno se rechaza en lugar de instalarse, porque un puesto de control truncado o sustituido no se puede decir desde el real.</desc>
<style>@font-face{font-family:'spacr-os';font-weight:300;font-style:normal;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'spacr-os';font-weight:400;font-style:normal;src:url(data:font/woff2;base64,) format('woff2')}text{font-family:'spacr-os', 'spacr-script', 'spacr-symbols', 'Open Sans', sans-serif;font-kerning:normal}</style>
<defs><linearGradient id="gmodel-zoo" x1="0" x2="1" y1="0" y2="0"><stop offset="0" stop-color="#2ec4b6"/><stop offset="1" stop-color="#6cb6ff"/></linearGradient><clipPath id="cmodel-zoo"><rect x="0" y="1" width="830" height="160" rx="12"/></clipPath></defs><filter id="smodel-zoo" x="-5%" y="-20%" width="110%" height="140%"><feDropShadow dx="0" dy="1" stdDeviation="1.2" flood-color="#1f2328" flood-opacity=".22"/></filter><rect x="0.5" y="1.5" width="829" height="159" rx="12" fill="#161b22" stroke="#30363d" filter="url(#smodel-zoo)"/><rect x="0" y="1" width="830" height="2" fill="url(#gmodel-zoo)" fill-opacity=".7" clip-path="url(#cmodel-zoo)"/><text y="36.2" xml:space="preserve"><tspan x="24.0" font-size="16" font-weight="400" fill="#e6edf3">Biblioteca de modelos</tspan></text><rect x="24" y="48.0" width="24" height="2" rx="1" fill="#2ec4b6"/><text y="75.5" xml:space="preserve"><tspan x="24.0" font-size="13.6" font-weight="300" fill="#c9d1d9">spaCR envía un catálogo de modelos entrenados y los trae a pedido. Abra </tspan><tspan x="476.8" font-size="13.6" font-weight="400" fill="#e6edf3">Model Zoo</tspan><tspan x="544.3" font-size="13.6" font-weight="300" fill="#c9d1d9"> desde la pantalla de inicio para navegar e</tspan></text><rect x="421.4" y="82.0" width="235.7" height="22.6" rx="5" fill="#2ec4b6" fill-opacity=".12"/><text y="95.9" xml:space="preserve"><tspan x="24.0" font-size="13.6" font-weight="300" fill="#c9d1d9">instalarlos, o nombre una clave en un archivo de configuración -- </tspan><tspan x="424.4" font-size="13.6" font-weight="400" fill="#2ec4b6">pathogen_model: toxoplasma_pv_v1</tspan><tspan x="657.1" font-size="13.6" font-weight="300" fill="#c9d1d9"> -- y el modelo se</tspan></text><text y="116.3" xml:space="preserve"><tspan x="24.0" font-size="13.6" font-weight="300" fill="#c9d1d9">descarga y comprueba la primera vez que es necesario. Cada entrada publicada lleva un SHA-256; una entrada sin uno se</tspan></text><text y="136.7" xml:space="preserve"><tspan x="24.0" font-size="13.6" font-weight="300" fill="#c9d1d9">rechaza en lugar de instalarse, porque un puesto de control truncado o sustituido no se puede decir desde el real.</tspan></text>
</svg>
