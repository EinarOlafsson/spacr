f">política de ayuda contextual</tspan><tspan x="473.6" font-size="13.6" font-weight="300" fill="#c9d1d9">.</tspan></text><path d="M806 30l8-8M807.5 22h6.5v6.5" fill="none" stroke="#2ec4b6" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
