<svg xmlns="http://www.w3.org/2000/svg" width="830" height="171" viewBox="0 0 830 171" role="img" aria-labelledby="t d" data-source-sha256="13dd07ba3678dee9309850f315c2631d08f38623a99177e3bcd7204803b96fae">
<title id="t">Idioma y traducción</title>
<desc id="d">Idioma y traducción. La interfaz admite diez idiomas en la navegación y las preferencias. Los controles AI y LIVE, las descripciones de los módulos y la ayuda contextual revisada también se traducen. Cambie el idioma en spaCR → Preferencias → Idioma sin reiniciar. Los registros, las rutas, los valores de la base de datos y las mediciones nunca se traducen; los resultados científicos permanecen en inglés canónico. Consulte la política de ayuda contextual.</desc>
