font-weight="300" fill="#c9d1d9"> etiqueta recortes en una cuadrícula controlada con el teclado y admite colas de aprendizaje activo.</tspan></text><circle cx="28" cy="183.4" r="2.2" fill="#2ec4b6"/><text y="187.9" xml:space="preserve"><tspan x="38.0" font-size="13.6" font-weight="400" fill="#e6edf3">Classify</tspan><tspan x="85.3" font-size="13.6" font-weight="300" fill="#c9d1d9"> entrena modelos basados en imágenes o mediciones y registra con cada punto de control el rendimiento en los</tspan></text><text y="208.3" xml:space="preserve"><tspan x="38.0" font-size="13.6" font-weight="300" fill="#c9d1d9">datos reservados.</tspan></text><circle cx="28" cy="228.2" r="2.2" fill="#2ec4b6"/><text y="232.7" xml:space="preserve"><tspan x="38.0" font-size="13.6" font-weight="400" fill="#e6edf3">Map Barcodes</tspan><tspan x="128.7" font-size="13.6" font-weight="300" fill="#c9d1d9"> asigna las lecturas FASTQ a los pocillos y los gRNA, con controles de calidad de abundancia, colisiones y</tspan></text><text y="253.1" xml:space="preserve"><tspan x="38.0" font-size="13.6" font-weight="300" fill="#c9d1d9">cobertura.</tspan></text><circle cx="28" cy="273.0" r="2.2" fill="#2ec4b6"/><text y="277.5" xml:space="preserve"><tspan x="38.0" font-size="13.6" font-weight="400" fill="#e6edf3">Regression</tspan><tspan x="107.5" font-size="13.6" font-weight="300" fill="#c9d1d9"> estima los efectos de guías, genes, condiciones y controles con familias de modelos adecuadas para respuestas</tspan></text><text y="297.9" xml:space="preserve"><tspan x="38.0" font-size="13.6" font-weight="300" fill="#c9d1d9">continuas, fraccionarias y de recuento.</tspan></text>
</svg>
