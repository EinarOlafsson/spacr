<svg xmlns="http://www.w3.org/2000/svg" width="830" height="332" viewBox="0 0 830 332" role="img" aria-labelledby="t d" data-source-sha256="63ce9e8bc6d5c82d8b6a5efea163ff89be326e4034a3db28fe8d07e5c97d53c7">
<title id="t">Flujo de trabajo principal</title>
<desc id="d">Flujo de trabajo principal. El flujo de trabajo principal comprende seis módulos: Mask segmenta células, núcleos, patógenos y orgánulos con Cellpose. Measure guarda en SQLite características morfológicas, de intensidad, textura, espaciales y de colocalización, junto con recortes de objetos. Annotate etiqueta recortes en una cuadrícula controlada con el teclado y admite colas de aprendizaje activo. Classify entrena modelos basados en imágenes o mediciones y registra con cada punto de control el rendimiento en los datos reservados. Map Barcodes asigna las lecturas FASTQ a los pocillos y los gRNA, con controles de calidad de abundancia, colisiones y cobertura. Regression estima los efectos de guías, genes, condiciones y controles con familias de modelos adecuadas para respuestas continuas, fraccionarias y de recuento.</desc>
