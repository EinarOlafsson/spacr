<svg xmlns="http://www.w3.org/2000/svg" width="358" height="335" viewBox="0 0 358 335" role="img" aria-labelledby="t d" data-source-sha256="284d99897a4b1a7e21d392c7c962ea7f611023a61d0fc3e12b866dc373a846ac">
<title id="t">spaCR</title>
<desc id="d">--dir elige la ruta del clon; --branch selecciona una rama o etiqueta; --no-install descarga sin instalar; --help muestra las opciones. packaging/source_install_excludes.txt enumera todas las rutas omitidas. El clon completo de nightly descargó 9.25 GiB. Añadir --filter=blob:none al clon superficial no reduce la copia de trabajo: su almacén de objetos Git aún ocupa 2032 MB. Git no informa de las descargas diferidas de objetos, por lo que no se midió un total de descarga. Los archivos versionados de main ocupan 1265 MB en la copia de trabajo (medidos el 2026-10-21), sin el historial de Git. El tamaño y la duración de la descarga varían según la rama.</desc>
<style>@font-face{font-family:'spacr-os';font-weight:300;font-style:normal;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'spacr-os';font-weight:400;font-style:normal;src:url(data:font/woff2;base64,) format('woff2')}text{font-family:'spacr-os', 'spacr-script', 'spacr-symbols', 'Open Sans', sans-serif;font-kerning:normal}</style>
