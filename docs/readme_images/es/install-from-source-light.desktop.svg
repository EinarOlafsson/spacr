<svg xmlns="http://www.w3.org/2000/svg" width="830" height="189" viewBox="0 0 830 189" role="img" aria-labelledby="t d" data-source-sha256="5d6259ef514fba62de02252335c7a789154f1adf97bdc9b0516c92b6cc0fc406">
<title id="t">Instalación desde el código fuente (ligera)</title>
<desc id="d">Instalación desde el código fuente (ligera). Los colaboradores necesitan el historial de versiones; para ejecutar spaCR, elija una de las opciones siguientes. Mediciones de nightly en 05302fd5c el 2026-10-07, realizadas con packaging/measure_clone_forms.sh. Clon superficial: 2048 MB descargados en 140 s. Solo se conserva el último commit, por lo que git log, git blame y git bisect no tienen acceso al historial anterior. git pull funciona, pero el clon sigue siendo superficial; git fetch --unshallow obtiene el historial completo.</desc>
