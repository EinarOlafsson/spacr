c4b6" fill-opacity=".12"/><text y="223.0" xml:space="preserve"><tspan x="64.0" font-size="17" font-weight="400" fill="#e6edf3">conda-forge</tspan><tspan x="159.8" font-size="17" font-weight="300" fill="#c9d1d9">: </tspan><tspan x="173.2" font-size="15.5" font-weight="400" fill="#2ec4b6">conda install conda-forge::spacr</tspan><tspan x="408.1" font-size="17" font-weight="300" fill="#c9d1d9"> en un entorno de Conda.</tspan></text><circle cx="46" cy="252.0" r="3" fill="#2ec4b6"/><text y="257.0" xml:space="preserve"><tspan x="64.0" font-size="17" font-weight="400" fill="#e6edf3">Docker</tspan><tspan x="120.1" font-size="17" font-weight="300" fill="#c9d1d9">: los flujos de procesamiento de línea de comandos en un contenedor Linux, con la imagen</tspan></text><text y="285.0" xml:space="preserve"><tspan x="64.0" font-size="17" font-weight="300" fill="#c9d1d9">para CPU o la imagen para GPU NVIDIA:</tspan></text>
