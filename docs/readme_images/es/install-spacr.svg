<svg xmlns="http://www.w3.org/2000/svg" width="880" height="334" viewBox="0 0 880 334" role="img" aria-labelledby="t d" data-source-sha256="27eacec206871dad8deacc825f2644c195eccfa9711c1ccdce1782d340316c92">
<title id="t">Instalar spaCR</title>
<desc id="d">Instalar spaCR. Elija una vía de instalación: Aplicación de escritorio: un instalador para Linux, macOS o Windows con su propio Python. pip: python -m pip install spacr en un entorno de Conda. conda-forge: conda install conda-forge::spacr en un entorno de Conda. Docker: los flujos de procesamiento de línea de comandos en un contenedor Linux, con la imagen para CPU o la imagen para GPU NVIDIA:</desc>
