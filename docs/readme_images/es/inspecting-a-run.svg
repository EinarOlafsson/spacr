<title id="t">Inspeccionar una ejecución</title>
<desc id="d">Inspeccionar una ejecución. Cada ejecución se lleva a cabo a ~/.spacr/runs con sus ajustes, entradas de hashed, salidas, advertencias, versiones y semillas.</desc>
