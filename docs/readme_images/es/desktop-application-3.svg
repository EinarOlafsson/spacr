<svg xmlns="http://www.w3.org/2000/svg" width="358" height="273" viewBox="0 0 358 273" role="img" aria-labelledby="t d" data-source-sha256="a3d7d33ee7a2372a4a80a9737b70b6ba549557829972bf173af0f07691edf93e">
<title id="t">spaCR</title>
<desc id="d">En macOS, abra el archivo .pkg. La beta actual no está notarizada; si Gatekeeper la bloquea, seleccione Ajustes del Sistema → Privacidad y seguridad → Abrir igualmente. Para obtener instrucciones de instalación, actualización, reinstalación, desinstalación, uso sin conexión y solución de problemas, consulte la guía de instalación actual de nightly (en inglés). Consulte los requisitos del sistema para ver recomendaciones sobre estaciones de trabajo y servidores y tablas de compatibilidad de GPU.</desc>
<style>@font-face{font-family:'spacr-os';font-weight:300;font-style:normal;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'spacr-os';font-weight:400;font-style:normal;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'spacr-symbols';font-weight:400;font-style:normal;src:url(data:font/woff2;base64,) format('woff2')}text{font-family:'spacr-os', 'spacr-script', 'spacr-symbols', 'Open Sans', sans-serif;font-kerning:normal}</style>
