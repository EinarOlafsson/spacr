<svg xmlns="http://www.w3.org/2000/svg" width="830" height="130" viewBox="0 0 830 130" role="img" aria-labelledby="t d" data-source-sha256="13e8b6f6b408e323807c0d246eabac955917dac84b086921afcb91047ddacc62">
<title id="t">Inspeccionar una ejecución</title>
<desc id="d">Inspeccionar una ejecución. Cada ejecución se registra en ~/.spacr/runs con su configuración, los hashes de las entradas, las salidas, las advertencias, las versiones y las semillas aleatorias.</desc>
