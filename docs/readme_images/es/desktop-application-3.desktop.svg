<title id="t">spaCR</title>
<desc id="d">En macOS, abra el archivo .pkg. La beta actual no está notarizada; si Gatekeeper la bloquea, seleccione Ajustes del Sistema → Privacidad y seguridad → Abrir igualmente. Consulte la guía de instalación para obtener instrucciones de actualización, desinstalación, uso sin conexión y solución de problemas, y los requisitos del sistema para ver recomendaciones sobre estaciones de trabajo y servidores, así como tablas de compatibilidad de GPU.</desc>
