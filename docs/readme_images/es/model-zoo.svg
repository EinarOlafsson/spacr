city=".12"/><text y="173.5" xml:space="preserve"><tspan x="19.0" font-size="13.6" font-weight="400" fill="#2ec4b6">toxoplasma_pv_v1</tspan><tspan x="137.9" font-size="13.6" font-weight="300" fill="#c9d1d9">. El modelo se descarga y se</tspan></text><text y="193.9" xml:space="preserve"><tspan x="16.0" font-size="13.6" font-weight="300" fill="#c9d1d9">verifica mediante su suma de comprobación la</tspan></text><text y="214.3" xml:space="preserve"><tspan x="16.0" font-size="13.6" font-weight="300" fill="#c9d1d9">primera vez que se necesita. Cada entrada publicada</tspan></text><text y="234.7" xml:space="preserve"><tspan x="16.0" font-size="13.6" font-weight="300" fill="#c9d1d9">incluye una suma SHA-256. Las entradas sin ella se</tspan></text><text y="255.1" xml:space="preserve"><tspan x="16.0" font-size="13.6" font-weight="300" fill="#c9d1d9">rechazan, ya que, de lo contrario, no se podría</tspan></text><text y="275.5" xml:space="preserve"><tspan x="16.0" font-size="13.6" font-weight="300" fill="#c9d1d9">distinguir un archivo de modelo incompleto o</tspan></text><text y="295.9" xml:space="preserve"><tspan x="16.0" font-size="13.6" font-weight="300" fill="#c9d1d9">sustituido del original.</tspan></text>
