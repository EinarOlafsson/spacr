<svg xmlns="http://www.w3.org/2000/svg" width="358" height="326" viewBox="0 0 358 326" role="img" aria-labelledby="t d" data-source-sha256="de5a73d20813e75092c86e3fa4296a17b1bfff630bdf67e1c756c710afb1190a">
<title id="t">Biblioteca de modelos</title>
<desc id="d">Biblioteca de modelos. spaCR incluye un catálogo de modelos entrenados y los descarga cuando se necesitan. Abra Model Zoo desde la pantalla de inicio para explorar e instalar modelos, o indique una clave en un archivo de configuración, como pathogen_model: toxoplasma_pv_v1. El modelo se descarga y se verifica mediante su suma de comprobación la primera vez que se necesita. Cada entrada publicada incluye una suma SHA-256. Las entradas sin ella se rechazan, ya que, de lo contrario, no se podría distinguir un archivo de modelo incompleto o sustituido del original.</desc>
<style>@font-face{font-family:'spacr-os';font-weight:300;font-style:normal;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'spacr-os';font-weight:400;font-style:normal;src:url(data:font/woff2;base64,) format('woff2')}text{font-family:'spacr-os', 'spacr-script', 'spacr-symbols', 'Open Sans', sans-serif;font-kerning:normal}</style>
