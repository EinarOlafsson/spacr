<svg xmlns="http://www.w3.org/2000/svg" width="880" height="197" viewBox="0 0 880 197" role="img" aria-labelledby="t d" data-source-sha256="e017bdbe0dc8e78ab45e2c2b70303a0ed6e332f7fadee6f17738737868bcd142">
<title id="t">spaCR</title>
<desc id="d">Saves to ~/.spacr/reports and prints the path. --quick skips the longer benchmarks; --out PATH sets the location. Reads no project data. Times imports, numeric libraries, window construction and animation, and reports x86_64 emulation on Apple Silicon and NumPy&#x27;s BLAS.</desc>
