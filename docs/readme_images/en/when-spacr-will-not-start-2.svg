<svg xmlns="http://www.w3.org/2000/svg" width="880" height="225" viewBox="0 0 880 225" role="img" aria-labelledby="t d" data-source-sha256="fd97fdcebe44342ebb19a23d7d5b02f84827606d84793646c3811ce097d11349">
<title id="t">spaCR</title>
<desc id="d">spacr-doctor prints one line per check, with a command to run for each failure. It also reports which spacr is on the path. safespacr reads every preference as its default and forces the backdrop, animations, verbose logging and preloading off. Use it when a saved preference breaks the launch. Preferences saved in safe mode are written normally and persist.</desc>
<style>@font-face{font-family:'spacr-os';font-weight:300;font-style:normal;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'spacr-os';font-weight:400;font-style:normal;src:url(data:font/woff2;base64,) format('woff2')}text{font-family:'spacr-os', 'spacr-script', 'spacr-symbols', 'Open Sans', sans-serif;font-kerning:normal}</style>
<filter id="swhen-spacr-will-not-start-2" x="-5%" y="-20%" width="110%" height="140%"><feDropShadow dx="0" dy="1" stdDeviation="1.2" flood-color="#1f2328" flood-opacity=".22"/></filter><rect x="6.5" y="1.5" width="867" height="213" rx="14" fill="#161b22" stroke="#30363d" filter="url(#swhen-spacr-will-not-start-2)"/><rect x="46.0" y="34.2" width="101.6" height="24.5" rx="5" fill="#2ec4b6" fill-opacity=".12"/><text y="50.0" xml:space="preserve"><tspan x="51.0" font-size="15.5" font-weight="400" fill="#2ec4b6">spacr-doctor</tspan><tspan x="147.6" font-size="17" font-weight="300" fill="#c9d1d9"> prints one line per check, with a command to run for each failure. It also reports which</tspan></text><rect x="46.0" y="62.2" width="49.2" height="24.5" rx="5" fill="#2ec4b6" fill-opacity=".12"/><text y="78.0" xml:space="preserve"><tspan x="51.0" font-size="15.5" font-weight="400" fill="#2ec4b6">spacr</tspan><tspan x="95.2" font-size="17" font-weight="300" fill="#c9d1d9"> is on the path.</tspan></text><rect x="46.0" y="104.2" width="79.2" height="24.5" rx="5" fill="#2ec4b6" fill-opacity=".12"/><text y="120.0" xml:space="preserve"><tspan x="51.0" font-size="15.5" font-weight="400" fill="#2ec4b6">safespacr</tspan><tspan x="125.2" font-size="17" font-weight="300" fill="#c9d1d9"> reads every preference as its default and forces the backdrop, animations, verbose logging</tspan></text><text y="148.0" xml:space="preserve"><tspan x="46.0" font-size="17" font-weight="300" fill="#c9d1d9">and preloading off. Use it when a saved preference breaks the launch. Preferences saved in safe mode</tspan></text><text y="176.0" xml:space="preserve"><tspan x="46.0" font-size="17" font-weight="300" fill="#c9d1d9">are written normally and persist.</tspan></text>
