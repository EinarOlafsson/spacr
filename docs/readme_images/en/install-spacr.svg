<svg xmlns="http://www.w3.org/2000/svg" width="880" height="334" viewBox="0 0 880 334" role="img" aria-labelledby="t d" data-source-sha256="bc23a8ffc6f66eda7c8ec681bab731ee885b67bb689e957650bfba322471f2d4">
<title id="t">Install spaCR</title>
<desc id="d">Install spaCR. Choose an install route: Desktop application: a Linux, macOS or Windows installer with its own Python. pip: python -m pip install spacr in a Conda environment. conda-forge: conda install conda-forge::spacr in a Conda environment. Docker: the command-line pipelines in a Linux container, from the CPU image or the NVIDIA GPU image:</desc>
