<svg xmlns="http://www.w3.org/2000/svg" width="358" height="314" viewBox="0 0 358 314" role="img" aria-labelledby="t d" data-source-sha256="d7e9f86e1b07e68ba94f5219bd1e9d4ca873a32ffb650aeafbfca16e76f3b747">
<title id="t">spaCR</title>
<desc id="d">--dir chooses the checkout path; --branch selects a branch or tag; --no-install fetches without installing; --help lists the options. packaging/source_install_excludes.txt lists every skipped path. The full nightly clone downloaded 9.25 GiB. Adding --filter=blob:none to the shallow clone does not reduce the checkout: its object store is still 2032 MB. Git does not report lazy blob fetches, so no download total was measured. The nightly tracked tree is a 720 MB checkout (measured 2026-10-21), excluding Git history. Download sizes and times vary with the branch.</desc>
