<svg xmlns="http://www.w3.org/2000/svg" width="358" height="253" viewBox="0 0 358 253" role="img" aria-labelledby="t d" data-source-sha256="a3c7bd13429275249367a92216e44e09e402d2ce805d5fb846b6999dea109ae0">
<title id="t">spaCR</title>
<desc id="d">spaCR supports Python 3.9 through 3.14, except Python 3.14.1, which torchvision excludes. Linux is recommended for the heaviest CUDA and ROCm workflows; macOS and Windows are also supported, and both use their GPUs — macOS through Metal, which covers Apple Silicon and the AMD cards in Intel Macs, and Windows through CUDA or DirectML. The standard installation includes the Qt desktop interface. For a server, cluster or CI runner, run the command-line pipelines without opening it:</desc>
