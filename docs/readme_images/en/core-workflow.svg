-driven grid and supports active-learning queues.</tspan></text><circle cx="52" cy="261.0" r="3" fill="#2ec4b6"/><text y="266.0" xml:space="preserve"><tspan x="70.0" font-size="17" font-weight="400" fill="#e6edf3">Classify</tspan><tspan x="129.2" font-size="17" font-weight="300" fill="#c9d1d9"> trains image or measurement-based models and records held-out performance with each</tspan></text><text y="294.0" xml:space="preserve"><tspan x="70.0" font-size="17" font-weight="300" fill="#c9d1d9">checkpoint.</tspan></text><circle cx="52" cy="323.0" r="3" fill="#2ec4b6"/><text y="328.0" xml:space="preserve"><tspan x="70.0" font-size="17" font-weight="400" fill="#e6edf3">Map Barcodes</tspan><tspan x="183.3" font-size="17" font-weight="300" fill="#c9d1d9"> maps FASTQ reads to wells and gRNAs, with abundance, collision and coverage QC.</tspan></text><circle cx="52" cy="357.0" r="3" fill="#2ec4b6"/><text y="362.0" xml:space="preserve"><tspan x="70.0" font-size="17" font-weight="400" fill="#e6edf3">Regression</tspan><tspan x="156.9" font-size="17" font-weight="300" fill="#c9d1d9"> estimates guide, gene, condition and control effects with model families suited to</tspan></text><text y="390.0" xml:space="preserve"><tspan x="70.0" font-size="17" font-weight="300" fill="#c9d1d9">continuous, fractional and count responses.</tspan></text>
