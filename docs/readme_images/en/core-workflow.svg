<svg xmlns="http://www.w3.org/2000/svg" width="880" height="439" viewBox="0 0 880 439" role="img" aria-labelledby="t d" data-source-sha256="592a4a7850b2e42e2f047d11e9b83526530cd1681d8c0d6a659f115a97bde059">
<title id="t">Core workflow</title>
<desc id="d">Core workflow. The primary workflow comprises six modules: Mask segments cells, nuclei, pathogens and organelles with Cellpose. Measure writes morphology, intensity, texture, spatial and colocalization features, together with object crops, to SQLite. Annotate labels crops in a keyboard-driven grid and supports active-learning queues. Classify trains image or measurement-based models and records held-out performance with each checkpoint. Map Barcodes maps FASTQ reads to wells and gRNAs, with abundance, collision and coverage QC. Regression estimates guide, gene, condition and control effects with model families suited to continuous, fractional and count responses.</desc>
<style>@font-face{font-family:'spacr-os';font-weight:300;font-style:normal;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'spacr-os';font-weight:400;font-style:normal;src:url(data:font/woff2;base64,) format('woff2')}text{font-family:'spacr-os', 'spacr-script', 'spacr-symbols', 'Open Sans', sans-serif;font-kerning:normal}</style>
