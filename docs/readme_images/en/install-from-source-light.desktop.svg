<svg xmlns="http://www.w3.org/2000/svg" width="830" height="169" viewBox="0 0 830 169" role="img" aria-labelledby="t d" data-source-sha256="820ce28a101158bf7745fec93048e49e50331a6af44b534c8f9b4771d9706e9c">
<title id="t">Install from source (light)</title>
<desc id="d">Install from source (light). Contributors need history; to run spaCR, choose below. Measurements: nightly at 05302fd5c on 2026-10-07, using packaging/measure_clone_forms.sh. Shallow clone: 2048 MB downloaded in 140 s. Only the latest commit is kept, so older history is unavailable to git log, git blame and git bisect. git pull works but stays shallow; git fetch --unshallow retrieves the full history.</desc>
