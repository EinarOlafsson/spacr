<svg xmlns="http://www.w3.org/2000/svg" width="880" height="246" viewBox="0 0 880 246" role="img" aria-labelledby="t d" data-source-sha256="e00d8fd07a315f48d9f2ebd9a7f614048e72ccfd8892bb1c68c129bae5ad4375">
<title id="t">Contributing and support</title>
<desc id="d">Contributing and support. Submit bug reports and focused feature requests through GitHub Issues. When reporting a failure, include the spaCR version, operating system, Python version, module settings and the relevant log excerpt. spacr-doctor collects most of this information; include the hardware report when reporting performance problems.</desc>
