pace="preserve"><tspan x="40.0" font-size="17" font-weight="300" fill="#c9d1d9">performance problems.</tspan></text><path d="M846 36l8-8M847.5 28h6.5v6.5" fill="none" stroke="#2ec4b6" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
