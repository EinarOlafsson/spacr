<svg xmlns="http://www.w3.org/2000/svg" width="830" height="108" viewBox="0 0 830 108" role="img" aria-labelledby="t d" data-source-sha256="457f905281c2beb4b06c71f4ad216a3d7f844de304426003c9d9eab8babdbef0">
<title id="t">spaCR</title>
<desc id="d">Runtime-only checkout: 104 MB on disk in 6 s (Git: 38 MB; files: 66 MB). It omits history, docs, tests, tools, features, example data and extended interface translations. --with-docs, --with-tests and --with-translations retain the corresponding documentation, tests and translations. The compact interface translations remain available.</desc>
