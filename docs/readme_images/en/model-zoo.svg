<svg xmlns="http://www.w3.org/2000/svg" width="358" height="285" viewBox="0 0 358 285" role="img" aria-labelledby="t d" data-source-sha256="a9cbbd2f1af976b321c3ccc85af1e1e13360ce64b08ddfe12c08b9dd522d54b7">
<title id="t">Model zoo</title>
<desc id="d">Model zoo. spaCR ships a catalogue of trained models and fetches them on demand. Open Model Zoo from the home screen to browse and install them, or name a key in a settings file -- pathogen_model: toxoplasma_pv_v1 -- and the model is downloaded and checksum-verified the first time it is needed. Every published entry carries a SHA-256; an entry without one is refused rather than installed, because a truncated or substituted checkpoint cannot be told from the real one.</desc>
<style>@font-face{font-family:'spacr-os';font-weight:300;font-style:normal;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'spacr-os';font-weight:400;font-style:normal;src:url(data:font/woff2;base64,) format('woff2')}text{font-family:'spacr-os', 'spacr-script', 'spacr-symbols', 'Open Sans', sans-serif;font-kerning:normal}</style>
<defs><linearGradient id="gmodel-zoo" x1="0" x2="1" y1="0" y2="0"><stop offset="0" stop-color="#2ec4b6"/><stop offset="1" stop-color="#6cb6ff"/></linearGradient><clipPath id="cmodel-zoo"><rect x="0" y="1" width="358" height="274" rx="12"/></clipPath></defs><filter id="smodel-zoo" x="-5%" y="-20%" width="110%" height="140%"><feDropShadow dx="0" dy="1" stdDeviation="1.2" flood-color="#1f2328" flood-opacity=".22"/></filter><rect x="0.5" y="1.5" width="357" height="273" rx="12" fill="#161b22" stroke="#30363d" filter="url(#smodel-zoo)"/><rect x="0" y="1" width="358" height="2" fill="url(#gmodel-zoo)" fill-opacity=".7" clip-path="url(#cmodel-zoo)"/><text y="32.2" xml:space="preserve"><tspan x="16.0" font-size="16" font-weight="400" fill="#e6edf3">Model zoo</tspan></text><rect x="16" y="44.0" width="24" height="2" rx="1" fill="#2ec4b6"/><text y="71.5" xml:space="preserve"><tspan x="16.0" font-size="13.6" font-weight="300" fill="#c9d1d9">spaCR ships a catalogue of trained models and</tspan></text><text y="91.9" xml:space="preserve"><tspan x="16.0" font-size="13.6" font-weight="300" fill="#c9d1d9">fetches them on demand. Open </tspan><tspan x="214.3" font-size="13.6" font-weight="400" fill="#e6edf3">Model Zoo</tspan><tspan x="281.7" font-size="13.6" font-weight="300" fill="#c9d1d9"> from the</tspan></text><text y="112.3" xml:space="preserve"><tspan x="16.0" font-size="13.6" font-weight="300" fill="#c9d1d9">home screen to browse and install them, or name a</tspan></text><rect x="149.7" y="118.8" width="119.8" height="22.6" rx="5" fill="#2ec4b6" fill-opacity=".12"/><text y="132.7" xml:space="preserve"><tspan x="16.0" font-size="13.6" font-weight="300" fill="#c9d1d9">key in a settings file -- </tspan><tspan x="152.7" font-size="13.6" font-weight="400" fill="#2ec4b6">pathogen_model:</tspan></text><rect x="16.0" y="139.2" width="121.9" height="22.6" rx="5" fill="#2ec4b6" fill-opacity=".12"/><text y="153.1" xml:space="preserve"><tspan x="19.0" font-size="13.6" font-weight="400" fill="#2ec4b6">toxoplasma_pv_v1</tspan><tspan x="137.9" font-size="13.6" font-weight="300" fill="#c9d1d9"> -- and the model is downloaded</tspan></text><text y="173.5" xml:space="preserve"><tspan x="16.0" font-size="13.6" font-weight="300" fill="#c9d1d9">and checksum-verified the first time it is needed.</tspan></text><text y="193.9" xml:space="preserve"><tspan x="16.0" font-size="13.6" font-weight="300" fill="#c9d1d9">Every published entry carries a SHA-256; an entry</tspan></text><text y="214.3" xml:space="preserve"><tspan x="16.0" font-size="13.6" font-weight="300" fill="#c9d1d9">without one is refused rather than installed, because</tspan></text><text y="234.7" xml:space="preserve"><tspan x="16.0" font-size="13.6" font-weight="300" fill="#c9d1d9">a truncated or substituted checkpoint cannot be told</tspan></text><text y="255.1" xml:space="preserve"><tspan x="16.0" font-size="13.6" font-weight="300" fill="#c9d1d9">from the real one.</tspan></text>
</svg>
