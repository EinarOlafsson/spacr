<svg xmlns="http://www.w3.org/2000/svg" width="880" height="274" viewBox="0 0 880 274" role="img" aria-labelledby="t d" data-source-sha256="1c622930cc13a43598f5a4aab699bf6cc025265a961bb6a0e1bafe1b6d19ad39">
<title id="t">Language &amp; translation</title>
<desc id="d">Language &amp; translation. The interface supports ten languages across navigation and Preferences. AI and LIVE controls, module descriptions and reviewed contextual help are also translated. Change the language under spaCR → Preferences → Language without restarting. Logs, paths, database values and measurements are never translated; scientific output remains canonical English. See the contextual-help policy.</desc>
