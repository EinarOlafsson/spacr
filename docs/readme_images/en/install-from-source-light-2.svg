<title id="t">spaCR</title>
<desc id="d">The full nightly clone downloaded 9.25 GiB. Adding --filter=blob:none to the shallow clone does not reduce the checkout: its object store is still 2032 MB. Git does not report lazy blob fetches, so no download total was measured. The nightly tracked tree is a 1178 MB checkout (measured 2026-10-20), excluding Git history. Download sizes and times vary with the branch.</desc>
