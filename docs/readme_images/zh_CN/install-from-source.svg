<defs><linearGradient id="ginstall-from-source" x1="0" x2="1" y1="0" y2="0"><stop offset="0" stop-color="#2ec4b6"/><stop offset="1" stop-color="#6cb6ff"/></linearGradient><clipPath id="cinstall-from-source"><rect x="0" y="1" width="880" height="132" rx="14"/></clipPath></defs><filter id="sinstall-from-source" x="-5%" y="-20%" width="110%" height="140%"><feDropShadow dx="0" dy="1" stdDeviation="1.2" flood-color="#1f2328" flood-opacity=".22"/></filter><rect x="0.5" y="1.5" width="879" height="131" rx="14" fill="#161b22" stroke="#30363d" filter="url(#sinstall-from-source)"/><rect x="0" y="1" width="880" height="2" fill="url(#ginstall-from-source)" fill-opacity=".7" clip-path="url(#cinstall-from-source)"/><text y="51.5" xml:space="preserve"><tspan x="40.0" font-size="21" font-weight="400" fill="#e6edf3">从源代码安装</tspan></text><text y="94.0" xml:space="preserve"><tspan x="40.0" font-size="17" font-weight="300" fill="#c9d1d9">克隆代码仓库并以可编辑模式安装。这样工作副本 </tspan><tspan x="418.4" font-size="17" font-weight="300" fill="#c9d1d9" font-style="italic">就是</tspan><tspan x="452.4" font-size="17" font-weight="300" fill="#c9d1d9"> 已安装的软件包，修改无需重新安装即可生效:</tspan></text>
