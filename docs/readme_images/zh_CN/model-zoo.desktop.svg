<svg xmlns="http://www.w3.org/2000/svg" width="830" height="171" viewBox="0 0 830 171" role="img" aria-labelledby="t d" data-source-sha256="07fc75cba297905a42d5300d451bd3204b7a100965fa8fcb855b16ee3ffd34ca">
<title id="t">模型库</title>
<desc id="d">模型库. spaCR ships a catalogue of trained models and fetches them on demand. Open Model Zoo from the home screen to browse and install them, or name a key in a settings file -- pathogen_model: toxoplasma_pv_v1 -- and the model is downloaded and checksum-verified the first time it is needed. Every published entry carries a SHA-256; an entry without one is refused rather than installed, because a truncated or substituted checkpoint cannot be told from the real one.</desc>
<style>@font-face{font-family:'spacr-os';font-weight:300;font-style:normal;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'spacr-os';font-weight:400;font-style:normal;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'spacr-script';font-weight:400;font-style:normal;src:url(data:font/woff2;base64,) format('woff2')}text{font-family:'spacr-os', 'spacr-script', 'spacr-symbols', 'Open Sans', sans-serif;font-kerning:normal}</style>
<defs><linearGradient id="gmodel-zoo" x1="0" x2="1" y1="0" y2="0"><stop offset="0" stop-color="#2ec4b6"/><stop offset="1" stop-color="#6cb6ff"/></linearGradient><clipPath id="cmodel-zoo"><rect x="0" y="1" width="830" height="160" rx="12"/></clipPath></defs><filter id="smodel-zoo" x="-5%" y="-20%" width="110%" height="140%"><feDropShadow dx="0" dy="1" stdDeviation="1.2" flood-color="#1f2328" flood-opacity=".22"/></filter><rect x="0.5" y="1.5" width="829" height="159" rx="12" fill="#161b22" stroke="#30363d" filter="url(#smodel-zoo)"/><rect x="0" y="1" width="830" height="2" fill="url(#gmodel-zoo)" fill-opacity=".7" clip-path="url(#cmodel-zoo)"/><text y="36.2" xml:space="preserve"><tspan x="24.0" font-size="16" font-weight="400" fill="#e6edf3">模型库</tspan></text><rect x="24" y="48.0" width="24" height="2" rx="1" fill="#2ec4b6"/><text y="75.5" xml:space="preserve"><tspan x="24.0" font-size="13.6" font-weight="300" fill="#c9d1d9">spaCR ships a catalogue of trained models and fetches them on demand. Open </tspan><tspan x="510.9" font-size="13.6" font-weight="400" fill="#e6edf3">Model Zoo</tspan><tspan x="578.3" font-size="13.6" font-weight="300" fill="#c9d1d9"> from the home screen to browse</tspan></text><rect x="327.7" y="82.0" width="235.7" height="22.6" rx="5" fill="#2ec4b6" fill-opacity=".12"/><text y="95.9" xml:space="preserve"><tspan x="24.0" font-size="13.6" font-weight="300" fill="#c9d1d9">and install them, or name a key in a settings file -- </tspan><tspan x="330.7" font-size="13.6" font-weight="400" fill="#2ec4b6">pathogen_model: toxoplasma_pv_v1</tspan><tspan x="563.4" font-size="13.6" font-weight="300" fill="#c9d1d9"> -- and the model is downloaded and</tspan></text><text y="116.3" xml:space="preserve"><tspan x="24.0" font-size="13.6" font-weight="300" fill="#c9d1d9">checksum-verified the first time it is needed. Every published entry carries a SHA-256; an entry without one is refused rather</tspan></text><text y="136.7" xml:space="preserve"><tspan x="24.0" font-size="13.6" font-weight="300" fill="#c9d1d9">than installed, because a truncated or substituted checkpoint cannot be told from the real one.</tspan></text>
</svg>
