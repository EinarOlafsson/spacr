<title id="t">spaCR</title>
<desc id="d">Enbart körningsfiler: 104 MB på disk på 6 s (Git: 38 MB; filer: 66 MB). Historik, docs, tests, tools, features, exempeldata och utökade gränssnittsöversättningar utelämnas. --with-docs, --with-tests och --with-translations behåller motsvarande dokumentation, tester och översättningar. De kompakta gränssnittsöversättningarna finns kvar.</desc>
