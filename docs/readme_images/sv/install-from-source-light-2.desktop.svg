<svg xmlns="http://www.w3.org/2000/svg" width="830" height="129" viewBox="0 0 830 129" role="img" aria-labelledby="t d" data-source-sha256="8ee49f6a11bc2d54c86f7ec0a18270dffa61aa74b39c388e6ca228f1dac82aea">
<title id="t">spaCR</title>
<desc id="d">Den fullständiga nightly-klonen laddade ner 9.25 GiB. Att lägga till --filter=blob:none till den grunda klonen minskar inte utcheckningen: dess Git-objektlager är fortfarande 2032 MB. Git rapporterar inte lata hämtningar av objekt, så ingen total nedladdning uppmättes. De versionshanterade filerna i nightly ger en utcheckning på 958 MB (uppmätt 2026-10-20), utan Git-historiken. Nedladdningens storlek och tid varierar med grenen.</desc>
<style>@font-face{font-family:'spacr-os';font-weight:300;font-style:normal;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'spacr-os';font-weight:400;font-style:normal;src:url(data:font/woff2;base64,) format('woff2')}text{font-family:'spacr-os', 'spacr-script', 'spacr-symbols', 'Open Sans', sans-serif;font-kerning:normal}</style>
