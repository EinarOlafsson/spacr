<svg xmlns="http://www.w3.org/2000/svg" width="830" height="179" viewBox="0 0 830 179" role="img" aria-labelledby="t d" data-source-sha256="65b9928a807d367b8609cc3713ee391d5f7d0b77d1e5442c2d2629fbd6ddd5af">
<title id="t">spaCR</title>
<desc id="d">--dir väljer klonens sökväg; --branch väljer gren eller tagg; --no-install hämtar utan att installera; --help visar alternativen. packaging/source_install_excludes.txt listar alla utelämnade sökvägar. Den fullständiga nightly-klonen laddade ner 9.25 GiB. Att lägga till --filter=blob:none till den grunda klonen minskar inte utcheckningen: dess Git-objektlager är fortfarande 2032 MB. Git rapporterar inte lata hämtningar av objekt, så ingen total nedladdning uppmättes. De versionshanterade filerna i nightly ger en utcheckning på 467 MB (uppmätt 2026-11-07), utan Git-historiken. Nedladdningens storlek och tid varierar med grenen.</desc>
