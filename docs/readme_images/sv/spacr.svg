3.6" font-weight="300" fill="#c9d1d9"> för varje verktyg.</tspan></text><text y="501.1" xml:space="preserve"><tspan x="16.0" font-size="13.6" font-weight="300" fill="#c9d1d9">Bilder, masker och bildutsnitt är filer på disk.</tspan></text><text y="521.5" xml:space="preserve"><tspan x="16.0" font-size="13.6" font-weight="300" fill="#c9d1d9">Mätningar, annoteringar och modellprediktioner</tspan></text><text y="541.9" xml:space="preserve"><tspan x="16.0" font-size="13.6" font-weight="300" fill="#c9d1d9">är tabeller i projektets SQLite-databas</tspan></text><rect x="16.0" y="548.4" width="121.9" height="22.6" rx="5" fill="#2ec4b6" fill-opacity=".12"/><text y="562.3" xml:space="preserve"><tspan x="19.0" font-size="13.6" font-weight="400" fill="#2ec4b6">measurements.db</tspan><tspan x="137.9" font-size="13.6" font-weight="300" fill="#c9d1d9">.</tspan></text><text y="592.7" xml:space="preserve"><tspan x="16.0" font-size="13.6" font-weight="300" fill="#c9d1d9">Körs som ett skrivbordsprogram eller utan</tspan></text><text y="613.1" xml:space="preserve"><tspan x="16.0" font-size="13.6" font-weight="300" fill="#c9d1d9">grafiskt gränssnitt på en arbetsstation, server eller</tspan></text><text y="633.5" xml:space="preserve"><tspan x="16.0" font-size="13.6" font-weight="300" fill="#c9d1d9">kluster.</tspan></text><path d="M342 26l8-8M343.5 18h6.5v6.5" fill="none" stroke="#2ec4b6" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
