<svg xmlns="http://www.w3.org/2000/svg" width="358" height="663" viewBox="0 0 358 663" role="img" aria-labelledby="t d" data-source-sha256="b81e5827dc5f3374d39a75799114df5d75915d4afc1acffa5ceb7944989cdf61">
<title id="t">spaCR</title>
<desc id="d">spaCR. Rumslig fenotypanalys av CRISPR-screeningar. spaCR segmenterar och mäter enskilda celler i mikroskopibilder, integrerar fenotyper per objekt med sekvenseringshärledd guideförekomst och uppskattar vilka gener som är associerade med fenotypiska förändringar. Med plattbilder och FASTQ-läsningar som utgångspunkt producerar programmet mätningar per objekt, tränade klassificerare, effektskattningar per guide och gen samt en rangordnad träfflista. Modulerna för segmentering, mätning, annotering och klassificering kan också köras utan någon sekvenseringsdel. Make Masks korrigerar segmenteringsmasker och annoterar oberoende, klassmärkta rektanglar med verktyget Box för YOLO-export. Rutorna har egna etiketter och egen historik utan att ändra källbilder eller masker. Se funktionsguiden för varje verktyg. Bilder, masker och bildutsnitt är filer på disk. Mätningar, annoteringar och modellprediktioner är tabeller i projektets SQLite-databas measurements.db. Körs som ett skrivbordsprogram eller utan grafiskt gränssnitt på en arbetsstation, server eller kluster.</desc>
