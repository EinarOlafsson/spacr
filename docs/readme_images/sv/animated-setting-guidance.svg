<title id="t">Animerad hjälp för inställningar</title>
<desc id="d">Animerad hjälp för inställningar. Inställningar med en visuell förklaring har kontrollen Animation i verktygstipset. Bläddra i galleriet med inställningsanimationer eller registret över inställningsanimationer.</desc>
