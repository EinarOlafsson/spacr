<title id="t">Tack</title>
<desc id="d">Tack. spaCR bygger på öppen vetenskaplig programvara, bland annat NumPy, pandas, scikit-image, scikit-learn, Cellpose, PyTorch och Qt. Se information om översättningsmodellerna för modellerna som användes till den flerspråkiga dokumentationen och gränssnittskatalogerna.</desc>
