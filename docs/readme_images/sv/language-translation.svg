<svg xmlns="http://www.w3.org/2000/svg" width="880" height="246" viewBox="0 0 880 246" role="img" aria-labelledby="t d" data-source-sha256="865a8bc9c93117ede1e3b2cbb7ddde8e7e9f5e316ca47c06d30aa98fd8860f59">
<title id="t">Språk och översättning</title>
<desc id="d">Språk och översättning. Gränssnittet stöder tio språk i navigering och inställningar. AI- och LIVE-kontroller, modulbeskrivningar och granskad kontexthjälp översätts också. Byt språk under spaCR → Inställningar → Språk utan att starta om. Loggar, sökvägar, databasvärden och mätningar översätts aldrig; vetenskapliga utdata förblir på kanonisk engelska. Se policyn för kontexthjälp.</desc>
