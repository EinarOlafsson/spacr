<title id="t">spaCR</title>
<desc id="d">Valfria integrationer installeras separat, till exempel spacr[zarr], spacr[omero], spacr[napari] och spacr[czi,nd2,lif]. Den fullständiga listan över tillägg och tabellen över kompatibla Python-versioner finns i installationsguiden (nightly, engelska).</desc>
