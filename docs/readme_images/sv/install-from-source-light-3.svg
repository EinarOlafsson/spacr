<svg xmlns="http://www.w3.org/2000/svg" width="358" height="335" viewBox="0 0 358 335" role="img" aria-labelledby="t d" data-source-sha256="bd00f56d4183f4267b1c4e5bc879845ed08c61a1813bdd5a7416dbec82ec6f1a">
<title id="t">spaCR</title>
<desc id="d">--dir väljer klonens sökväg; --branch väljer gren eller tagg; --no-install hämtar utan att installera; --help visar alternativen. packaging/source_install_excludes.txt listar alla utelämnade sökvägar. Den fullständiga nightly-klonen laddade ner 9.25 GiB. Att lägga till --filter=blob:none till den grunda klonen minskar inte utcheckningen: dess Git-objektlager är fortfarande 2032 MB. Git rapporterar inte lata hämtningar av objekt, så ingen total nedladdning uppmättes. De versionshanterade filerna i main ger en utcheckning på 735 MB (uppmätt 2026-10-21), utan Git-historiken. Nedladdningens storlek och tid varierar med grenen.</desc>
<style>@font-face{font-family:'spacr-os';font-weight:300;font-style:normal;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'spacr-os';font-weight:400;font-style:normal;src:url(data:font/woff2;base64,) format('woff2')}text{font-family:'spacr-os', 'spacr-script', 'spacr-symbols', 'Open Sans', sans-serif;font-kerning:normal}</style>
