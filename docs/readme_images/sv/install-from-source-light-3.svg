0" font-size="13.6" font-weight="300" fill="#c9d1d9">utelämnade sökvägar.</tspan></text><text y="141.5" xml:space="preserve"><tspan x="16.0" font-size="13.6" font-weight="300" fill="#c9d1d9">Den fullständiga nightly-klonen laddade ner 9.25 GiB.</tspan></text><rect x="89.3" y="148.0" width="116.3" height="22.6" rx="5" fill="#2ec4b6" fill-opacity=".12"/><text y="161.9" xml:space="preserve"><tspan x="16.0" font-size="13.6" font-weight="300" fill="#c9d1d9">Att lägga till </tspan><tspan x="92.3" font-size="13.6" font-weight="400" fill="#2ec4b6">--filter=blob:none</tspan><tspan x="205.6" font-size="13.6" font-weight="300" fill="#c9d1d9"> till den grunda klonen</tspan></text><text y="182.3" xml:space="preserve"><tspan x="16.0" font-size="13.6" font-weight="300" fill="#c9d1d9">minskar inte utcheckningen: dess Git-objektlager är</tspan></text><text y="202.7" xml:space="preserve"><tspan x="16.0" font-size="13.6" font-weight="300" fill="#c9d1d9">fortfarande 2032 MB. Git rapporterar inte lata</tspan></text><text y="223.1" xml:space="preserve"><tspan x="16.0" font-size="13.6" font-weight="300" fill="#c9d1d9">hämtningar av objekt, så ingen total nedladdning</tspan></text><text y="243.5" xml:space="preserve"><tspan x="16.0" font-size="13.6" font-weight="300" fill="#c9d1d9">uppmättes. De versionshanterade filerna i main ger</tspan></text><text y="263.9" xml:space="preserve"><tspan x="16.0" font-size="13.6" font-weight="300" fill="#c9d1d9">en utcheckning på 735 MB (uppmätt 2026-10-21),</tspan></text><text y="284.3" xml:space="preserve"><tspan x="16.0" font-size="13.6" font-weight="300" fill="#c9d1d9">utan Git-historiken. Nedladdningens storlek och tid</tspan></text><text y="304.7" xml:space="preserve"><tspan x="16.0" font-size="13.6" font-weight="300" fill="#c9d1d9">varierar med grenen.</tspan></text>
</svg>
