<svg xmlns="http://www.w3.org/2000/svg" width="880" height="274" viewBox="0 0 880 274" role="img" aria-labelledby="t d" data-source-sha256="c4a4cd8e98d104446c2fa1082260ce78f388649913b8bf47df870bfac936f341">
<title id="t">Modellbibliotek</title>
<desc id="d">Modellbibliotek. spaCR skickar en katalog med utbildade modeller och hämtar dem på begäran. Öppna Modellzoo från startskärmen för att bläddra och installera dem, eller namnge en nyckel i en inställningsfil -- pathogen_model: toxoplasma_pv_v1 -- och modellen laddas ner och kontrolleras första gången den behövs. Varje publicerad post innehåller en SHA-256; en post utan en nekas snarare än installeras, eftersom en trunkerad eller ersatt kontrollpunkt inte kan meddelas från den verkliga.</desc>
<style>@font-face{font-family:'spacr-os';font-weight:300;font-style:normal;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'spacr-os';font-weight:400;font-style:normal;src:url(data:font/woff2;base64,) format('woff2')}text{font-family:'spacr-os', 'spacr-script', 'spacr-symbols', 'Open Sans', sans-serif;font-kerning:normal}</style>
<defs><linearGradient id="gmodel-zoo" x1="0" x2="1" y1="0" y2="0"><stop offset="0" stop-color="#2ec4b6"/><stop offset="1" stop-color="#6cb6ff"/></linearGradient><clipPath id="cmodel-zoo"><rect x="6" y="1" width="868" height="263" rx="14"/></clipPath></defs><filter id="smodel-zoo" x="-5%" y="-20%" width="110%" height="140%"><feDropShadow dx="0" dy="1" stdDeviation="1.2" flood-color="#1f2328" flood-opacity=".22"/></filter><rect x="6.5" y="1.5" width="867" height="262" rx="14" fill="#161b22" stroke="#30363d" filter="url(#smodel-zoo)"/><rect x="6" y="1" width="868" height="2" fill="url(#gmodel-zoo)" fill-opacity=".7" clip-path="url(#cmodel-zoo)"/><text y="57.0" xml:space="preserve"><tspan x="46.0" font-size="26" font-weight="400" fill="#e6edf3">Modellbibliotek</tspan></text><rect x="46" y="76.0" width="36" height="3" rx="1.5" fill="#2ec4b6"/><text y="113.0" xml:space="preserve"><tspan x="46.0" font-size="17" font-weight="300" fill="#c9d1d9">spaCR skickar en katalog med utbildade modeller och hämtar dem på begäran. Öppna </tspan><tspan x="707.9" font-size="17" font-weight="400" fill="#e6edf3">Modellzoo</tspan><tspan x="790.4" font-size="17" font-weight="300" fill="#c9d1d9"> från</tspan></text><text y="141.0" xml:space="preserve"><tspan x="46.0" font-size="17" font-weight="300" fill="#c9d1d9">startskärmen för att bläddra och installera dem, eller namnge en nyckel i en inställningsfil --</tspan></text><rect x="46.0" y="153.2" width="271.8" height="24.5" rx="5" fill="#2ec4b6" fill-opacity=".12"/><text y="169.0" xml:space="preserve"><tspan x="51.0" font-size="15.5" font-weight="400" fill="#2ec4b6">pathogen_model: toxoplasma_pv_v1</tspan><tspan x="317.8" font-size="17" font-weight="300" fill="#c9d1d9"> -- och modellen laddas ner och kontrolleras första gången den</tspan></text><text y="197.0" xml:space="preserve"><tspan x="46.0" font-size="17" font-weight="300" fill="#c9d1d9">behövs. Varje publicerad post innehåller en SHA-256; en post utan en nekas snarare än installeras,</tspan></text><text y="225.0" xml:space="preserve"><tspan x="46.0" font-size="17" font-weight="300" fill="#c9d1d9">eftersom en trunkerad eller ersatt kontrollpunkt inte kan meddelas från den verkliga.</tspan></text>
</svg>
