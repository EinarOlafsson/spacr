<svg xmlns="http://www.w3.org/2000/svg" width="830" height="159" viewBox="0 0 830 159" role="img" aria-labelledby="t d" data-source-sha256="3a14e09446df4ac031db24d7c0d398a59628685bc05a98f600156e33809f8239">
<title id="t">spaCR</title>
<desc id="d">spacr-doctor skriver ut en rad per kontroll, med ett kommando att köra för varje fel. Det rapporterar också vilken spacr som finns på sökvägen. safespacr läser varje inställning som dess standardvärde och stänger av bakgrunden, animationerna, utförlig loggning och förladdning. Använd det när en sparad inställning hindrar programmet från att starta. Inställningar som sparas i säkert läge skrivs som vanligt och finns kvar.</desc>
