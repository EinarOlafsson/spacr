<svg xmlns="http://www.w3.org/2000/svg" width="358" height="161" viewBox="0 0 358 161" role="img" aria-labelledby="t d" data-source-sha256="1b1e271373706c16801651fd9676dbadb90d42eddec88c22ad8f4f9bdc4f5d50">
<title id="t">spaCR</title>
<desc id="d">De nio icke-engelska katalogerna är maskinskrivna och tekniskt recenserade snarare än lästa ända till slut av en infödd talare. De Översynens tillämpningsområde skivor som språken har haft ett mänskligt pass och varje term kvar på engelska av beslut.</desc>
