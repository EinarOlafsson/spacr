<svg xmlns="http://www.w3.org/2000/svg" width="830" height="139" viewBox="0 0 830 139" role="img" aria-labelledby="t d" data-source-sha256="e78636b2f0002df588b4cf7b9877addd02d8c55f9a6182e46b09429515793944">
<title id="t">spaCR</title>
<desc id="d">På macOS, öppna .pkg. Nuvarande beta notariseras inte. Om Gatekeeper blockerar den, välj Systeminställningar → Integritet &amp; Säkerhet → Öppna ändå. Se installationsguiden för instruktioner om uppdatering, avinstallation, offlineanvändning och felsökning, och systemkraven för rekommendationer om arbetsstationer och servrar samt tabeller över GPU-kompatibilitet.</desc>
