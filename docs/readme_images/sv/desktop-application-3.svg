<svg xmlns="http://www.w3.org/2000/svg" width="358" height="253" viewBox="0 0 358 253" role="img" aria-labelledby="t d" data-source-sha256="bce665c65b1c87d97c00f6417a5e09b50fb9c22b0911f9e278f75db4ee14dd57">
<title id="t">spaCR</title>
<desc id="d">På macOS, öppna .pkg. Den nuvarande betaversionen är inte notariserad. Om Gatekeeper blockerar den, välj Systeminställningar → Integritet &amp; Säkerhet → Öppna ändå. För installation, uppdatering, ominstallation, avinstallation, offlineanvändning och felsökning, se den aktuella installationsguiden på nightly (engelska). Se systemkraven för rekommendationer om arbetsstationer och servrar samt tabeller över GPU-kompatibilitet.</desc>
<style>@font-face{font-family:'spacr-os';font-weight:300;font-style:normal;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'spacr-os';font-weight:400;font-style:normal;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'spacr-symbols';font-weight:400;font-style:normal;src:url(data:font/woff2;base64,) format('woff2')}text{font-family:'spacr-os', 'spacr-script', 'spacr-symbols', 'Open Sans', sans-serif;font-kerning:normal}</style>
