<svg xmlns="http://www.w3.org/2000/svg" width="880" height="467" viewBox="0 0 880 467" role="img" aria-labelledby="t d" data-source-sha256="3de5edbe6220b69110f952b2cef4778b16d722d77ed01f7d422eaa9a0d6fd68f">
<title id="t">Kärnarbetsflöde</title>
<desc id="d">Kärnarbetsflöde. Det primära arbetsflödet består av sex moduler: Mask segmenterar celler, cellkärnor, patogener och organeller med Cellpose. Measure skriver morfologiska, intensitets-, textur-, rumsliga och kolokaliseringsmått samt objektutsnitt till SQLite. Annotate märker objektutsnitt i ett tangentbordsstyrt rutnät och stöder köer för aktiv inlärning. Classify tränar bild- eller mätningsbaserade modeller och sparar prestandan på undanhållna data med varje kontrollpunkt. Map Barcodes kopplar FASTQ-läsningar till brunnar och gRNA:er och rapporterar QC för förekomst, kollisioner och täckning. Regression skattar effekter för guider, gener, betingelser och kontroller med modellfamiljer för kontinuerliga data, andelar och antal.</desc>
<style>@font-face{font-family:'spacr-os';font-weight:300;font-style:normal;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'spacr-os';font-weight:400;font-style:normal;src:url(data:font/woff2;base64,) format('woff2')}text{font-family:'spacr-os', 'spacr-script', 'spacr-symbols', 'Open Sans', sans-serif;font-kerning:normal}</style>
