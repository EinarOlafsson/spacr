<title id="t">Bidrag och support</title>
<desc id="d">Bidrag och support. Skicka felrapporter och avgränsade funktionsförslag via GitHub-ärenden. Ange spaCR-version, operativsystem, Python-version, modulinställningar och relevant loggutdrag när du rapporterar ett fel. spacr-doctor samlar in det mesta av denna information; bifoga maskinvarurapporten vid prestandaproblem.</desc>
