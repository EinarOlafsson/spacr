<svg xmlns="http://www.w3.org/2000/svg" width="830" height="191" viewBox="0 0 830 191" role="img" aria-labelledby="t d" data-source-sha256="118f3b478e2b09f8ec9517c667295e7ce69b26724093f3783eeaa575df343fb4">
<title id="t">Modellbibliotek</title>
<desc id="d">Modellbibliotek. spaCR innehåller en katalog över tränade modeller och hämtar dem vid behov. Öppna Model Zoo från startskärmen för att bläddra bland och installera modellerna, eller ange en modellnyckel i en inställningsfil, till exempel pathogen_model: toxoplasma_pv_v1. Modellen laddas då ned och verifieras med en kontrollsumma första gången den behövs. Varje publicerad post har en SHA-256-kontrollsumma. En post utan kontrollsumma nekas, eftersom en ofullständig eller utbytt modellfil annars inte kan skiljas från den riktiga.</desc>
<style>@font-face{font-family:'spacr-os';font-weight:300;font-style:normal;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'spacr-os';font-weight:400;font-style:normal;src:url(data:font/woff2;base64,) format('woff2')}text{font-family:'spacr-os', 'spacr-script', 'spacr-symbols', 'Open Sans', sans-serif;font-kerning:normal}</style>
<defs><linearGradient id="gmodel-zoo" x1="0" x2="1" y1="0" y2="0"><stop offset="0" stop-color="#2ec4b6"/><stop offset="1" stop-color="#6cb6ff"/></linearGradient><clipPath id="cmodel-zoo"><rect x="0" y="1" width="830" height="180" rx="12"/></clipPath></defs><filter id="smodel-zoo" x="-5%" y="-20%" width="110%" height="140%"><feDropShadow dx="0" dy="1" stdDeviation="1.2" flood-color="#1f2328" flood-opacity=".22"/></filter><rect x="0.5" y="1.5" width="829" height="179" rx="12" fill="#161b22" stroke="#30363d" filter="url(#smodel-zoo)"/><rect x="0" y="1" width="830" height="2" fill="url(#gmodel-zoo)" fill-opacity=".7" clip-path="url(#cmodel-zoo)"/><text y="36.2" xml:space="preserve"><tspan x="24.0" font-size="16" font-weight="400" fill="#e6edf3">Modellbibliotek</tspan></text><rect x="24" y="48.0" width="24" height="2" rx="1" fill="#2ec4b6"/><text y="75.5" xml:space="preserve"><tspan x="24.0" font-size="13.6" font-weight="300" fill="#c9d1d9">spaCR innehåller en katalog över tränade modeller och hämtar dem vid behov. Öppna </tspan><tspan x="551.9" font-size="13.6" font-weight="400" fill="#e6edf3">Model Zoo</tspan><tspan x="619.4" font-size="13.6" font-weight="300" fill="#c9d1d9"> från startskärmen för att</tspan></text><rect x="622.4" y="82.0" width="119.8" height="22.6" rx="5" fill="#2ec4b6" fill-opacity=".12"/><text y="95.9" xml:space="preserve"><tspan x="24.0" font-size="13.6" font-weight="300" fill="#c9d1d9">bläddra bland och installera modellerna, eller ange en modellnyckel i en inställningsfil, till exempel </tspan><tspan x="625.4" font-size="13.6" font-weight="400" fill="#2ec4b6">pathogen_model:</tspan></text><rect x="24.0" y="102.4" width="121.9" height="22.6" rx="5" fill="#2ec4b6" fill-opacity=".12"/><text y="116.3" xml:space="preserve"><tspan x="27.0" font-size="13.6" font-weight="400" fill="#2ec4b6">toxoplasma_pv_v1</tspan><tspan x="145.9" font-size="13.6" font-weight="300" fill="#c9d1d9">. Modellen laddas då ned och verifieras med en kontrollsumma första gången den behövs. Varje publicerad</tspan></text><text y="136.7" xml:space="preserve"><tspan x="24.0" font-size="13.6" font-weight="300" fill="#c9d1d9">post har en SHA-256-kontrollsumma. En post utan kontrollsumma nekas, eftersom en ofullständig eller utbytt modellfil annars</tspan></text><text y="157.1" xml:space="preserve"><tspan x="24.0" font-size="13.6" font-weight="300" fill="#c9d1d9">inte kan skiljas från den riktiga.</tspan></text>
</svg>
