<svg xmlns="http://www.w3.org/2000/svg" width="830" height="139" viewBox="0 0 830 139" role="img" aria-labelledby="t d" data-source-sha256="76fa44bb12f94563012dc39925065ed3e7cac8842ab38ddb10b0784a94cbc82c">
<title id="t">spaCR</title>
<desc id="d">Sparar i ~/.spacr/reports och skriver ut sökvägen. --quick hoppar över de längre prestandatesterna; --out PATH anger platsen. Läser inga projektdata. Mäter tiden för importer, numeriska bibliotek, fönsterkonstruktion och animering, och rapporterar x86_64-emulering på Apple Silicon samt NumPys BLAS.</desc>
