<svg xmlns="http://www.w3.org/2000/svg" width="880" height="197" viewBox="0 0 880 197" role="img" aria-labelledby="t d" data-source-sha256="0691ca0c3d2bc5b57c2bb62b0acdd04263a9eaae78ced3722e56df16f9059a0e">
<title id="t">spaCR</title>
<desc id="d">Sparar till ~/.spacr/reports och skriver ut sökvägen. --quick hoppar över de längre riktmärkena; --out PATH anger platsen. Läser inga projektdata. Mäter tiden för importer, numeriska bibliotek, fönsterkonstruktion och animering, och rapporterar x86_64-emulering på Apple Silicon samt NumPys BLAS.</desc>
