<title id="t">spaCR</title>
<desc id="d">Linux (x86-64, ARM64): True 3D, provas i ordning Vulkan (wgpu), OpenGL, CPU. Windows (x64, ARM64): True 3D, provas i ordning Vulkan / Direct3D 12 (wgpu), OpenGL, CPU. macOS (Intel, Apple silicon): True 3D, provas i ordning Metal (wgpu), OpenGL, CPU. Utan wgpu: True 3D, provas i ordning OpenGL, CPU (Python 3.9, andra processorer, Linux med glibc äldre än 2.28 eller installerat utan wgpu).</desc>
