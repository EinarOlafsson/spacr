<title id="t">spaCR</title>
<desc id="d">Sur macOS, ouvrez le .pkg. La bêta actuelle n&#x27;est pas notariée; si Gatekeeper le bloque, choisissez Paramètres du système → Confidentialité et sécurité → Ouvrez de toute façon. Pour les instructions d’installation, de mise à jour, de réinstallation, de désinstallation, d’utilisation hors ligne et de dépannage, consultez le guide d’installation actuel de nightly (en anglais). Consultez la configuration requise pour les recommandations concernant les stations de travail et les serveurs ainsi que les tableaux de compatibilité GPU.</desc>
