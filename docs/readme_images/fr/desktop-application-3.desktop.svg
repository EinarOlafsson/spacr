<svg xmlns="http://www.w3.org/2000/svg" width="830" height="159" viewBox="0 0 830 159" role="img" aria-labelledby="t d" data-source-sha256="cc4ac44f145f4d3ebc5464b025dce0b42f7bb4038b8c5b9cb76185cc3b72f5be">
<title id="t">spaCR</title>
<desc id="d">Sur macOS, ouvrez le fichier .pkg. La version bêta actuelle n’est pas notariée. Si Gatekeeper la bloque, choisissez Réglages Système → Confidentialité et sécurité → Ouvrir quand même. Pour les instructions d’installation, de mise à jour, de réinstallation, de désinstallation, d’utilisation hors ligne et de dépannage, consultez le guide d’installation actuel de nightly (en anglais). Consultez la configuration requise pour les recommandations concernant les stations de travail et les serveurs ainsi que les tableaux de compatibilité GPU.</desc>
