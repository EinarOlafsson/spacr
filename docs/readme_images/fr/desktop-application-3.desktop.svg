<title id="t">spaCR</title>
<desc id="d">Sur macOS, ouvrez le .pkg. La bêta actuelle n&#x27;est pas notariée; si Gatekeeper le bloque, choisissez Paramètres du système → Confidentialité et sécurité → Ouvrez de toute façon. Consultez le guide d’installation pour les instructions de mise à jour, de désinstallation, d’utilisation hors ligne et de dépannage, et la configuration requise pour les recommandations concernant les stations de travail et les serveurs ainsi que les tableaux de compatibilité GPU.</desc>
