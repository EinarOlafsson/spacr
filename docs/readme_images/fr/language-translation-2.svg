<title id="t">spaCR</title>
<desc id="d">Les neuf catalogues non anglais sont rédigés par machine et revus techniquement plutôt que lus fin à fin par un locuteur natif. Le portée de l &#x27; examen enregistre quelles langues ont eu un passage humain et chaque terme laissé en anglais par décision.</desc>
