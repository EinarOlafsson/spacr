<svg xmlns="http://www.w3.org/2000/svg" width="358" height="212" viewBox="0 0 358 212" role="img" aria-labelledby="t d" data-source-sha256="45a413b8cf3be7c9001a533cebd355e7a8df5e83943c5166a1755aeb58af617a">
<title id="t">spaCR</title>
<desc id="d">Enregistre dans ~/.spacr/reports et imprime le chemin. --quick saute les points de repère plus longs; --out PATH définit l&#x27;emplacement. Ne lit aucune donnée du projet. Mesure le temps des imports, des bibliothèques numériques, de la construction des fenêtres et des animations, et signale l’émulation x86_64 sur Apple Silicon ainsi que l’implémentation BLAS utilisée par NumPy.</desc>
<style>@font-face{font-family:'spacr-os';font-weight:300;font-style:normal;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'spacr-os';font-weight:400;font-style:normal;src:url(data:font/woff2;base64,) format('woff2')}text{font-family:'spacr-os', 'spacr-script', 'spacr-symbols', 'Open Sans', sans-serif;font-kerning:normal}</style>
<filter id="sdiagnosing-performance-2" x="-5%" y="-20%" width="110%" height="140%"><feDropShadow dx="0" dy="1" stdDeviation="1.2" flood-color="#1f2328" flood-opacity=".22"/></filter><rect x="0.5" y="1.5" width="357" height="200" rx="12" fill="#161b22" stroke="#30363d" filter="url(#sdiagnosing-performance-2)"/><rect x="114.8" y="15.6" width="108.3" height="22.6" rx="5" fill="#2ec4b6" fill-opacity=".12"/><text y="29.5" xml:space="preserve"><tspan x="16.0" font-size="13.6" font-weight="300" fill="#c9d1d9">Enregistre dans </tspan><tspan x="117.8" font-size="13.6" font-weight="400" fill="#2ec4b6">~/.spacr/reports</tspan><tspan x="223.2" font-size="13.6" font-weight="300" fill="#c9d1d9"> et imprime le</tspan></text><rect x="67.8" y="36.0" width="48.5" height="22.6" rx="5" fill="#2ec4b6" fill-opacity=".12"/><text y="49.9" xml:space="preserve"><tspan x="16.0" font-size="13.6" font-weight="300" fill="#c9d1d9">chemin. </tspan><tspan x="70.8" font-size="13.6" font-weight="400" fill="#2ec4b6">--quick</tspan><tspan x="116.4" font-size="13.6" font-weight="300" fill="#c9d1d9"> saute les points de repère plus</tspan></text><rect x="55.3" y="56.4" width="74.0" height="22.6" rx="5" fill="#2ec4b6" fill-opacity=".12"/><text y="70.3" xml:space="preserve"><tspan x="16.0" font-size="13.6" font-weight="300" fill="#c9d1d9">longs; </tspan><tspan x="58.3" font-size="13.6" font-weight="400" fill="#2ec4b6">--out PATH</tspan><tspan x="129.2" font-size="13.6" font-weight="300" fill="#c9d1d9"> définit l&#x27;emplacement.</tspan></text><text y="100.7" xml:space="preserve"><tspan x="16.0" font-size="13.6" font-weight="300" fill="#c9d1d9">Ne lit aucune donnée du projet. Mesure le temps des</tspan></text><text y="121.1" xml:space="preserve"><tspan x="16.0" font-size="13.6" font-weight="300" fill="#c9d1d9">imports, des bibliothèques numériques, de la</tspan></text><text y="141.5" xml:space="preserve"><tspan x="16.0" font-size="13.6" font-weight="300" fill="#c9d1d9">construction des fenêtres et des animations, et</tspan></text><text y="161.9" xml:space="preserve"><tspan x="16.0" font-size="13.6" font-weight="300" fill="#c9d1d9">signale l’émulation x86_64 sur Apple Silicon ainsi que</tspan></text><text y="182.3" xml:space="preserve"><tspan x="16.0" font-size="13.6" font-weight="300" fill="#c9d1d9">l’implémentation BLAS utilisée par NumPy.</tspan></text>
</svg>
