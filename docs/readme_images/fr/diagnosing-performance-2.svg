<svg xmlns="http://www.w3.org/2000/svg" width="358" height="233" viewBox="0 0 358 233" role="img" aria-labelledby="t d" data-source-sha256="ade46cf15f5b21a38c28eec558b51b50c0b7b2a71d491a23f0bcb295684629de">
<title id="t">spaCR</title>
<desc id="d">Enregistre le rapport dans ~/.spacr/reports et affiche le chemin. --quick omet les tests de performance les plus longs ; --out PATH définit l’emplacement. Ne lit aucune donnée du projet. Mesure le temps des imports, des bibliothèques numériques, de la construction des fenêtres et des animations, et signale l’émulation x86_64 sur Apple Silicon ainsi que l’implémentation BLAS utilisée par NumPy.</desc>
