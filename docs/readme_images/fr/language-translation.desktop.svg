<svg xmlns="http://www.w3.org/2000/svg" width="830" height="171" viewBox="0 0 830 171" role="img" aria-labelledby="t d" data-source-sha256="ebe47d666fef412c4158437541d9077492710d43b4bcdb031279bd26ccc4cf32">
<title id="t">Langue et traduction</title>
<desc id="d">Langue et traduction. L’interface prend en charge dix langues dans la navigation et les préférences. Les commandes AI et LIVE, les descriptions des modules et l’aide contextuelle révisée sont également traduites. Changez de langue sous spaCR → Préférences → Langue sans redémarrer. Les journaux, chemins, valeurs de base de données et mesures ne sont jamais traduits ; les résultats scientifiques restent en anglais canonique. Consultez la politique d’aide contextuelle.</desc>
