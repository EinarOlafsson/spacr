<svg xmlns="http://www.w3.org/2000/svg" width="830" height="171" viewBox="0 0 830 171" role="img" aria-labelledby="t d" data-source-sha256="a61edfbdf1ffb792dfb43e0d8f7f53bb4d8b2f64df0de0e6c543f7c5d3ea4a26">
<title id="t">Bibliothèque de modèles</title>
<desc id="d">Bibliothèque de modèles. spaCR envoie un catalogue de modèles formés et les récupère sur demande. Ouvrez Modèle Zoo depuis l&#x27;écran d&#x27;accueil pour les parcourir et les installer, ou nommez une clé dans un fichier de paramètres -- pathogen_model: toxoplasma_pv_v1 -- et le modèle est téléchargé et vérifié la première fois qu&#x27;il est nécessaire. Chaque entrée publiée porte un SHA-256; une entrée sans un est refusée plutôt que installée, parce qu&#x27;un point de contrôle tronqué ou substitué ne peut pas être dit du vrai.</desc>
<style>@font-face{font-family:'spacr-os';font-weight:300;font-style:normal;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'spacr-os';font-weight:400;font-style:normal;src:url(data:font/woff2;base64,) format('woff2')}text{font-family:'spacr-os', 'spacr-script', 'spacr-symbols', 'Open Sans', sans-serif;font-kerning:normal}</style>
<defs><linearGradient id="gmodel-zoo" x1="0" x2="1" y1="0" y2="0"><stop offset="0" stop-color="#2ec4b6"/><stop offset="1" stop-color="#6cb6ff"/></linearGradient><clipPath id="cmodel-zoo"><rect x="0" y="1" width="830" height="160" rx="12"/></clipPath></defs><filter id="smodel-zoo" x="-5%" y="-20%" width="110%" height="140%"><feDropShadow dx="0" dy="1" stdDeviation="1.2" flood-color="#1f2328" flood-opacity=".22"/></filter><rect x="0.5" y="1.5" width="829" height="159" rx="12" fill="#161b22" stroke="#30363d" filter="url(#smodel-zoo)"/><rect x="0" y="1" width="830" height="2" fill="url(#gmodel-zoo)" fill-opacity=".7" clip-path="url(#cmodel-zoo)"/><text y="36.2" xml:space="preserve"><tspan x="24.0" font-size="16" font-weight="400" fill="#e6edf3">Bibliothèque de modèles</tspan></text><rect x="24" y="48.0" width="24" height="2" rx="1" fill="#2ec4b6"/><text y="75.5" xml:space="preserve"><tspan x="24.0" font-size="13.6" font-weight="300" fill="#c9d1d9">spaCR envoie un catalogue de modèles formés et les récupère sur demande. Ouvrez </tspan><tspan x="544.1" font-size="13.6" font-weight="400" fill="#e6edf3">Modèle Zoo</tspan><tspan x="619.2" font-size="13.6" font-weight="300" fill="#c9d1d9"> depuis l&#x27;écran d&#x27;accueil pour</tspan></text><rect x="519.3" y="82.0" width="235.7" height="22.6" rx="5" fill="#2ec4b6" fill-opacity=".12"/><text y="95.9" xml:space="preserve"><tspan x="24.0" font-size="13.6" font-weight="300" fill="#c9d1d9">les parcourir et les installer, ou nommez une clé dans un fichier de paramètres -- </tspan><tspan x="522.3" font-size="13.6" font-weight="400" fill="#2ec4b6">pathogen_model: toxoplasma_pv_v1</tspan><tspan x="755.0" font-size="13.6" font-weight="300" fill="#c9d1d9"> -- et le</tspan></text><text y="116.3" xml:space="preserve"><tspan x="24.0" font-size="13.6" font-weight="300" fill="#c9d1d9">modèle est téléchargé et vérifié la première fois qu&#x27;il est nécessaire. Chaque entrée publiée porte un SHA-256; une entrée sans</tspan></text><text y="136.7" xml:space="preserve"><tspan x="24.0" font-size="13.6" font-weight="300" fill="#c9d1d9">un est refusée plutôt que installée, parce qu&#x27;un point de contrôle tronqué ou substitué ne peut pas être dit du vrai.</tspan></text>
</svg>
