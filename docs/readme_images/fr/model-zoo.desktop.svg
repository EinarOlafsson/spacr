<svg xmlns="http://www.w3.org/2000/svg" width="830" height="191" viewBox="0 0 830 191" role="img" aria-labelledby="t d" data-source-sha256="72d656599c6846f00647b6ac90c74d461085a949d4ea74914c2b67d642e404a8">
<title id="t">Bibliothèque de modèles</title>
<desc id="d">Bibliothèque de modèles. spaCR inclut un catalogue de modèles entraînés et les télécharge à la demande. Ouvrez Model Zoo depuis l’écran d’accueil pour les parcourir et les installer, ou indiquez une clé dans un fichier de paramètres, par exemple pathogen_model: toxoplasma_pv_v1. Le modèle est téléchargé et sa somme de contrôle est vérifiée lors de sa première utilisation. Chaque entrée publiée comporte une somme SHA-256. Les entrées qui en sont dépourvues sont refusées, car un fichier de modèle incomplet ou remplacé ne pourrait sinon pas être distingué de l’original.</desc>
<style>@font-face{font-family:'spacr-os';font-weight:300;font-style:normal;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'spacr-os';font-weight:400;font-style:normal;src:url(data:font/woff2;base64,) format('woff2')}text{font-family:'spacr-os', 'spacr-script', 'spacr-symbols', 'Open Sans', sans-serif;font-kerning:normal}</style>
<defs><linearGradient id="gmodel-zoo" x1="0" x2="1" y1="0" y2="0"><stop offset="0" stop-color="#2ec4b6"/><stop offset="1" stop-color="#6cb6ff"/></linearGradient><clipPath id="cmodel-zoo"><rect x="0" y="1" width="830" height="180" rx="12"/></clipPath></defs><filter id="smodel-zoo" x="-5%" y="-20%" width="110%" height="140%"><feDropShadow dx="0" dy="1" stdDeviation="1.2" flood-color="#1f2328" flood-opacity=".22"/></filter><rect x="0.5" y="1.5" width="829" height="179" rx="12" fill="#161b22" stroke="#30363d" filter="url(#smodel-zoo)"/><rect x="0" y="1" width="830" height="2" fill="url(#gmodel-zoo)" fill-opacity=".7" clip-path="url(#cmodel-zoo)"/><text y="36.2" xml:space="preserve"><tspan x="24.0" font-size="16" font-weight="400" fill="#e6edf3">Bibliothèque de modèles</tspan></text><rect x="24" y="48.0" width="24" height="2" rx="1" fill="#2ec4b6"/><text y="75.5" xml:space="preserve"><tspan x="24.0" font-size="13.6" font-weight="300" fill="#c9d1d9">spaCR inclut un catalogue de modèles entraînés et les télécharge à la demande. Ouvrez </tspan><tspan x="561.2" font-size="13.6" font-weight="400" fill="#e6edf3">Model Zoo</tspan><tspan x="628.7" font-size="13.6" font-weight="300" fill="#c9d1d9"> depuis l’écran d’accueil pour</tspan></text><rect x="588.3" y="82.0" width="119.8" height="22.6" rx="5" fill="#2ec4b6" fill-opacity=".12"/><text y="95.9" xml:space="preserve"><tspan x="24.0" font-size="13.6" font-weight="300" fill="#c9d1d9">les parcourir et les installer, ou indiquez une clé dans un fichier de paramètres, par exemple </tspan><tspan x="591.3" font-size="13.6" font-weight="400" fill="#2ec4b6">pathogen_model:</tspan></text><rect x="24.0" y="102.4" width="121.9" height="22.6" rx="5" fill="#2ec4b6" fill-opacity=".12"/><text y="116.3" xml:space="preserve"><tspan x="27.0" font-size="13.6" font-weight="400" fill="#2ec4b6">toxoplasma_pv_v1</tspan><tspan x="145.9" font-size="13.6" font-weight="300" fill="#c9d1d9">. Le modèle est téléchargé et sa somme de contrôle est vérifiée lors de sa première utilisation. Chaque</tspan></text><text y="136.7" xml:space="preserve"><tspan x="24.0" font-size="13.6" font-weight="300" fill="#c9d1d9">entrée publiée comporte une somme SHA-256. Les entrées qui en sont dépourvues sont refusées, car un fichier de modèle</tspan></text><text y="157.1" xml:space="preserve"><tspan x="24.0" font-size="13.6" font-weight="300" fill="#c9d1d9">incomplet ou remplacé ne pourrait sinon pas être distingué de l’original.</tspan></text>
</svg>
