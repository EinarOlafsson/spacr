<svg xmlns="http://www.w3.org/2000/svg" width="830" height="129" viewBox="0 0 830 129" role="img" aria-labelledby="t d" data-source-sha256="c6ee24a906ec013a8e4556fbbaf657b2ae8ecae8045a33718a7656dbd8454041">
<title id="t">spaCR</title>
<desc id="d">Le clone complet de nightly a téléchargé 9.25 GiB. Ajouter --filter=blob:none au clone superficiel ne réduit pas la copie de travail : son magasin d’objets Git pèse encore 2032 MB. Git ne signale pas les récupérations différées d’objets, aucun total de téléchargement n’a donc été mesuré. Les fichiers suivis de nightly occupent 958 MB dans la copie de travail (mesurés le 2026-10-20), hors historique Git. La taille et la durée du téléchargement varient selon la branche.</desc>
<style>@font-face{font-family:'spacr-os';font-weight:300;font-style:normal;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'spacr-os';font-weight:400;font-style:normal;src:url(data:font/woff2;base64,) format('woff2')}text{font-family:'spacr-os', 'spacr-script', 'spacr-symbols', 'Open Sans', sans-serif;font-kerning:normal}</style>
