<svg xmlns="http://www.w3.org/2000/svg" width="358" height="765" viewBox="0 0 358 765" role="img" aria-labelledby="t d" data-source-sha256="04aa5615b1f4fd7c8e99b43e1e5bd31e199149047fcb08e6440479ab01711f70">
<title id="t">spaCR</title>
<desc id="d">spaCR. Analyse spatiale des phénotypes de criblages CRISPR. spaCR segmente et mesure les cellules individuelles dans des images de microscopie, intègre les phénotypes par objet à l’abondance des guides dérivée du séquençage et estime quels gènes sont associés aux changements phénotypiques. À partir d’images de plaques et de lectures FASTQ, il produit des mesures par objet, des classificateurs entraînés, des estimations d’effet par guide et par gène, ainsi qu’une liste de résultats classée. Les modules de segmentation, de mesure, d’annotation et de classification fonctionnent aussi sans composante de séquençage. Make Masks corrige les masques de segmentation et annote des rectangles indépendants avec des étiquettes de classe grâce à l’outil Box pour l’export YOLO. Les rectangles conservent leurs propres étiquettes et leur historique sans modifier les images ni les masques sources. Chaque outil est décrit dans le guide des fonctionnalités. Les images, masques et vignettes sont des fichiers sur disque. Les mesures, annotations et prédictions du modèle sont des tables de la base de données SQLite measurements.db du projet. Fonctionne comme une application de bureau ou sans interface graphique sur un poste de travail, un serveur ou un cluster.</desc>
