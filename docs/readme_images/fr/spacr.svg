>conservent leurs propres étiquettes et leur</tspan></text><text y="501.5" xml:space="preserve"><tspan x="16.0" font-size="13.6" font-weight="300" fill="#c9d1d9">historique sans modifier les images ni les</tspan></text><text y="521.9" xml:space="preserve"><tspan x="16.0" font-size="13.6" font-weight="300" fill="#c9d1d9">masques sources.</tspan></text><text y="552.3" xml:space="preserve"><tspan x="16.0" font-size="13.6" font-weight="300" fill="#c9d1d9">Chaque outil est décrit dans le </tspan><tspan x="204.7" font-size="13.6" font-weight="400" fill="#6cb6ff">guide des</tspan></text><text y="572.7" xml:space="preserve"><tspan x="16.0" font-size="13.6" font-weight="400" fill="#6cb6ff">fonctionnalités</tspan><tspan x="110.1" font-size="13.6" font-weight="300" fill="#c9d1d9">.</tspan></text><text y="603.1" xml:space="preserve"><tspan x="16.0" font-size="13.6" font-weight="300" fill="#c9d1d9">Les images, masques et vignettes sont des</tspan></text><text y="623.5" xml:space="preserve"><tspan x="16.0" font-size="13.6" font-weight="300" fill="#c9d1d9">fichiers sur disque. Les mesures, annotations et</tspan></text><text y="643.9" xml:space="preserve"><tspan x="16.0" font-size="13.6" font-weight="300" fill="#c9d1d9">prédictions du modèle sont des tables de la base</tspan></text><rect x="135.4" y="650.4" width="121.9" height="22.6" rx="5" fill="#2ec4b6" fill-opacity=".12"/><text y="664.3" xml:space="preserve"><tspan x="16.0" font-size="13.6" font-weight="300" fill="#c9d1d9">de données SQLite </tspan><tspan x="138.4" font-size="13.6" font-weight="400" fill="#2ec4b6">measurements.db</tspan><tspan x="257.4" font-size="13.6" font-weight="300" fill="#c9d1d9"> du projet.</tspan></text><text y="694.7" xml:space="preserve"><tspan x="16.0" font-size="13.6" font-weight="300" fill="#c9d1d9">Fonctionne comme une application de bureau ou</tspan></text><text y="715.1" xml:space="preserve"><tspan x="16.0" font-size="13.6" font-weight="300" fill="#c9d1d9">sans interface graphique sur un poste de travail,</tspan></text><text y="735.5" xml:space="preserve"><tspan x="16.0" font-size="13.6" font-weight="300" fill="#c9d1d9">un serveur ou un cluster.</tspan></text><path d="M342 26l8-8M343.5 18h6.5v6.5" fill="none" stroke="#2ec4b6" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
