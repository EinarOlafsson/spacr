<svg xmlns="http://www.w3.org/2000/svg" width="830" height="139" viewBox="0 0 830 139" role="img" aria-labelledby="t d" data-source-sha256="469a4c68a19cc42dd8113d27b2e79fdcc405ff479c051bcee13ff91890ed656c">
<title id="t">spaCR</title>
<desc id="d">Enregistre le rapport dans ~/.spacr/reports et affiche le chemin. --quick omet les tests de performance les plus longs ; --out PATH définit l’emplacement. Ne lit aucune donnée du projet. Mesure le temps des imports, des bibliothèques numériques, de la construction des fenêtres et des animations, et signale l’émulation x86_64 sur Apple Silicon ainsi que l’implémentation BLAS utilisée par NumPy.</desc>
<style>@font-face{font-family:'spacr-os';font-weight:300;font-style:normal;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'spacr-os';font-weight:400;font-style:normal;src:url(data:font/woff2;base64,) format('woff2')}text{font-family:'spacr-os', 'spacr-script', 'spacr-symbols', 'Open Sans', sans-serif;font-kerning:normal}</style>
