<title id="t">spaCR</title>
<desc id="d">Les intégrations facultatives s’installent séparément, par exemple spacr[zarr], spacr[omero], spacr[napari] et spacr[czi,nd2,lif]. Consultez le guide d’installation (nightly, en anglais) pour la liste complète des extras et le tableau de compatibilité des versions de Python.</desc>
