<svg xmlns="http://www.w3.org/2000/svg" width="358" height="142" viewBox="0 0 358 142" role="img" aria-labelledby="t d" data-source-sha256="5906cc9d1f2bc5c97d4606254fe0a540608ce27bce2244bf6542a378c3822bf1">
<title id="t">Inspecter une exécution</title>
<desc id="d">Inspecter une exécution. Chaque exécution est journalisée à ~/.spacr/runs avec ses paramètres, entrées hashées, sorties, avertissements, versions et graines.</desc>
<style>@font-face{font-family:'spacr-os';font-weight:300;font-style:normal;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'spacr-os';font-weight:400;font-style:normal;src:url(data:font/woff2;base64,) format('woff2')}text{font-family:'spacr-os', 'spacr-script', 'spacr-symbols', 'Open Sans', sans-serif;font-kerning:normal}</style>
<defs><linearGradient id="ginspecting-a-run" x1="0" x2="1" y1="0" y2="0"><stop offset="0" stop-color="#2ec4b6"/><stop offset="1" stop-color="#6cb6ff"/></linearGradient><clipPath id="cinspecting-a-run"><rect x="0" y="1" width="358" height="131" rx="12"/></clipPath></defs><filter id="sinspecting-a-run" x="-5%" y="-20%" width="110%" height="140%"><feDropShadow dx="0" dy="1" stdDeviation="1.2" flood-color="#1f2328" flood-opacity=".22"/></filter><rect x="0.5" y="1.5" width="357" height="130" rx="12" fill="#161b22" stroke="#30363d" filter="url(#sinspecting-a-run)"/><rect x="0" y="1" width="358" height="2" fill="url(#ginspecting-a-run)" fill-opacity=".7" clip-path="url(#cinspecting-a-run)"/><text y="32.2" xml:space="preserve"><tspan x="16.0" font-size="16" font-weight="400" fill="#e6edf3">Inspecter une exécution</tspan></text><rect x="16" y="44.0" width="24" height="2" rx="1" fill="#2ec4b6"/><rect x="233.3" y="57.6" width="90.5" height="22.6" rx="5" fill="#2ec4b6" fill-opacity=".12"/><text y="71.5" xml:space="preserve"><tspan x="16.0" font-size="13.6" font-weight="300" fill="#c9d1d9">Chaque exécution est journalisée à </tspan><tspan x="236.3" font-size="13.6" font-weight="400" fill="#2ec4b6">~/.spacr/runs</tspan></text><text y="91.9" xml:space="preserve"><tspan x="16.0" font-size="13.6" font-weight="300" fill="#c9d1d9">avec ses paramètres, entrées hashées, sorties,</tspan></text><text y="112.3" xml:space="preserve"><tspan x="16.0" font-size="13.6" font-weight="300" fill="#c9d1d9">avertissements, versions et graines.</tspan></text>
