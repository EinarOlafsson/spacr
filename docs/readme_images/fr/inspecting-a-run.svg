<svg xmlns="http://www.w3.org/2000/svg" width="358" height="163" viewBox="0 0 358 163" role="img" aria-labelledby="t d" data-source-sha256="5d52a0d90b756169bb7144fa0651f7b0104cf5dc24e5712eb18620949e1d3850">
<title id="t">Inspecter une exécution</title>
<desc id="d">Inspecter une exécution. Chaque exécution est consignée dans ~/.spacr/runs avec ses paramètres, les empreintes des entrées, les sorties, les avertissements, les versions et les valeurs d’initialisation aléatoire.</desc>
