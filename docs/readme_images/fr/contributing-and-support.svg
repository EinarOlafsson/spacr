<svg xmlns="http://www.w3.org/2000/svg" width="358" height="265" viewBox="0 0 358 265" role="img" aria-labelledby="t d" data-source-sha256="cf32aa8a9c954fe7262793fdc851f5b3278bf023ebfb810c1c7725eca504b933">
<title id="t">Contributions et assistance</title>
<desc id="d">Contributions et assistance. Soumettez les rapports de bogues et les demandes de fonctionnalités bien délimitées via GitHub Issues. Lorsque vous signalez un échec, indiquez la version de spaCR, le système d’exploitation, la version de Python, les paramètres du module et l’extrait de journal pertinent. spacr-doctor collecte la plupart de ces informations ; joignez le rapport matériel lorsque vous signalez un problème de performances.</desc>
