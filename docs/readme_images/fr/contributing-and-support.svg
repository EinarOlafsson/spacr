3" y="180.0" width="86.4" height="22.6" rx="5" fill="#2ec4b6" fill-opacity=".12"/><text y="193.9" xml:space="preserve"><tspan x="16.0" font-size="13.6" font-weight="300" fill="#c9d1d9">pertinent. </tspan><tspan x="82.3" font-size="13.6" font-weight="400" fill="#2ec4b6">spacr-doctor</tspan><tspan x="165.7" font-size="13.6" font-weight="300" fill="#c9d1d9"> collecte la plupart de ces</tspan></text><text y="214.3" xml:space="preserve"><tspan x="16.0" font-size="13.6" font-weight="300" fill="#c9d1d9">informations ; joignez le rapport matériel lorsque</tspan></text><text y="234.7" xml:space="preserve"><tspan x="16.0" font-size="13.6" font-weight="300" fill="#c9d1d9">vous signalez un problème de performances.</tspan></text><path d="M342 26l8-8M343.5 18h6.5v6.5" fill="none" stroke="#2ec4b6" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
