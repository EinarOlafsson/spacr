<svg xmlns="http://www.w3.org/2000/svg" width="880" height="334" viewBox="0 0 880 334" role="img" aria-labelledby="t d" data-source-sha256="e0bba83c13704a6ababe0924d084c70630fc4618a08b8c71d89293a36854dae5">
<title id="t">Installer spaCR</title>
<desc id="d">Installer spaCR. Choisissez une méthode d’installation : Application de bureau : un installateur pour Linux, macOS ou Windows avec son propre Python. pip : python -m pip install spacr dans un environnement Conda. conda-forge : conda install conda-forge::spacr dans un environnement Conda. Docker : les pipelines en ligne de commande dans un conteneur Linux, avec l’image CPU ou l’image pour GPU NVIDIA :</desc>
