</tspan><tspan x="659.3" font-size="13.6" font-weight="300" fill="#c9d1d9">.</tspan></text><text y="114.7" xml:space="preserve"><tspan x="24.0" font-size="13.6" font-weight="300" fill="#c9d1d9">Clone superficiel : 2048 MB téléchargés en 140 s. Seul le dernier commit est conservé ; l’historique antérieur n’est donc pas</tspan></text><rect x="100.3" y="121.2" width="44.2" height="22.6" rx="5" fill="#2ec4b6" fill-opacity=".12"/><rect x="150.9" y="121.2" width="64.7" height="22.6" rx="5" fill="#2ec4b6" fill-opacity=".12"/><rect x="234.7" y="121.2" width="62.4" height="22.6" rx="5" fill="#2ec4b6" fill-opacity=".12"/><rect x="303.9" y="121.2" width="48.7" height="22.6" rx="5" fill="#2ec4b6" fill-opacity=".12"/><rect x="618.5" y="121.2" width="134.0" height="22.6" rx="5" fill="#2ec4b6" fill-opacity=".12"/><text y="135.1" xml:space="preserve"><tspan x="24.0" font-size="13.6" font-weight="300" fill="#c9d1d9">accessible à </tspan><tspan x="103.3" font-size="13.6" font-weight="400" fill="#2ec4b6">git log</tspan><tspan x="144.5" font-size="13.6" font-weight="300" fill="#c9d1d9">, </tspan><tspan x="153.9" font-size="13.6" font-weight="400" fill="#2ec4b6">git blame</tspan><tspan x="215.6" font-size="13.6" font-weight="300" fill="#c9d1d9"> et </tspan><tspan x="237.7" font-size="13.6" font-weight="400" fill="#2ec4b6">git bisect</tspan><tspan x="297.2" font-size="13.6" font-weight="300" fill="#c9d1d9">. </tspan><tspan x="306.9" font-size="13.6" font-weight="400" fill="#2ec4b6">git pull</tspan><tspan x="352.7" font-size="13.6" font-weight="300" fill="#c9d1d9"> fonctionne, mais le clone reste superficiel ; </tspan><tspan x="621.5" font-size="13.6" font-weight="400" fill="#2ec4b6">git fetch --unshallow</tspan></text><text y="155.5" xml:space="preserve"><tspan x="24.0" font-size="13.6" font-weight="300" fill="#c9d1d9">récupère l’historique complet.</tspan></text>
