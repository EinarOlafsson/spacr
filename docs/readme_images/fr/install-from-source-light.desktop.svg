<svg xmlns="http://www.w3.org/2000/svg" width="830" height="189" viewBox="0 0 830 189" role="img" aria-labelledby="t d" data-source-sha256="6c89a540894ef9336df4c65c419f08adc6ee2bea9c9a1c04b4f16ddf71e54efd">
<title id="t">Installation depuis les sources (allégée)</title>
<desc id="d">Installation depuis les sources (allégée). Les contributeurs ont besoin de l’historique des versions ; pour simplement exécuter spaCR, choisissez une option ci-dessous. Mesures de nightly à 05302fd5c le 2026-10-07, effectuées avec packaging/measure_clone_forms.sh. Clone superficiel : 2048 MB téléchargés en 140 s. Seul le dernier commit est conservé ; l’historique antérieur n’est donc pas accessible à git log, git blame et git bisect. git pull fonctionne, mais le clone reste superficiel ; git fetch --unshallow récupère l’historique complet.</desc>
<style>@font-face{font-family:'spacr-os';font-weight:300;font-style:normal;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'spacr-os';font-weight:400;font-style:normal;src:url(data:font/woff2;base64,) format('woff2')}text{font-family:'spacr-os', 'spacr-script', 'spacr-symbols', 'Open Sans', sans-serif;font-kerning:normal}</style>
