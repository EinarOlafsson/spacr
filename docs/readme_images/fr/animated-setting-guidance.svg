<svg xmlns="http://www.w3.org/2000/svg" width="358" height="183" viewBox="0 0 358 183" role="img" aria-labelledby="t d" data-source-sha256="457add4cfc5b6c1114a5ce3801892e4e6512172984455bd256b49272b9c55d24">
<title id="t">Guide animé des paramètres</title>
<desc id="d">Guide animé des paramètres. Les paramètres accompagnés d’une explication visuelle proposent une commande Animation dans leur infobulle. Parcourez la galerie des animations de paramètres ou le registre des animations de paramètres.</desc>
