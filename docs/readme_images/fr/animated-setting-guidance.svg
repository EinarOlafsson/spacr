1" xml:space="preserve"><tspan x="16.0" font-size="13.6" font-weight="400" fill="#6cb6ff">paramètres</tspan><tspan x="89.7" font-size="13.6" font-weight="300" fill="#c9d1d9">.</tspan></text>
