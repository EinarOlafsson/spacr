<svg xmlns="http://www.w3.org/2000/svg" width="880" height="253" viewBox="0 0 880 253" role="img" aria-labelledby="t d" data-source-sha256="850ca6363c38eae6e25c9a07fee2c7af74512ed150e8060dcd275c80721818e1">
<title id="t">spaCR</title>
<desc id="d">spacr-doctor affiche une ligne par vérification, avec une commande à exécuter pour chaque échec. Il indique également quel spacr est sur le chemin. safespacr lit chaque préférence avec sa valeur par défaut et désactive l’arrière-plan, les animations, la journalisation détaillée et le préchargement. Utilisez-le lorsqu’une préférence enregistrée empêche le démarrage. Les préférences enregistrées en mode sans échec sont écrites normalement et sont conservées.</desc>
<style>@font-face{font-family:'spacr-os';font-weight:300;font-style:normal;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'spacr-os';font-weight:400;font-style:normal;src:url(data:font/woff2;base64,) format('woff2')}text{font-family:'spacr-os', 'spacr-script', 'spacr-symbols', 'Open Sans', sans-serif;font-kerning:normal}</style>
