<svg xmlns="http://www.w3.org/2000/svg" width="358" height="355" viewBox="0 0 358 355" role="img" aria-labelledby="t d" data-source-sha256="168635ff46b6a197e1a218baa14f01e2417f308b6adaee401e666a6e91d9817b">
<title id="t">spaCR</title>
<desc id="d">--dir choisit le chemin du clone ; --branch sélectionne une branche ou une étiquette ; --no-install télécharge sans installer ; --help affiche les options. packaging/source_install_excludes.txt répertorie tous les chemins omis. Le clone complet de nightly a téléchargé 9.25 GiB. Ajouter --filter=blob:none au clone superficiel ne réduit pas la copie de travail : son magasin d’objets Git pèse encore 2032 MB. Git ne signale pas les récupérations différées d’objets, aucun total de téléchargement n’a donc été mesuré. Les fichiers suivis de nightly occupent 467 MB dans la copie de travail (mesurés le 2026-11-07), hors historique Git. La taille et la durée du téléchargement varient selon la branche.</desc>
<style>@font-face{font-family:'spacr-os';font-weight:300;font-style:normal;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'spacr-os';font-weight:400;font-style:normal;src:url(data:font/woff2;base64,) format('woff2')}text{font-family:'spacr-os', 'spacr-script', 'spacr-symbols', 'Open Sans', sans-serif;font-kerning:normal}</style>
