<title id="t">Remerciements</title>
<desc id="d">Remerciements. spaCR repose sur des logiciels scientifiques ouverts, notamment NumPy, pandas, scikit-image, scikit-learn, Cellpose, PyTorch et Qt. Consultez l’attribution des modèles de traduction pour connaître les modèles utilisés dans la documentation multilingue et les catalogues de l’interface.</desc>
