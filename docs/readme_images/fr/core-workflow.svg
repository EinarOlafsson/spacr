"136.9" font-size="17" font-weight="300" fill="#c9d1d9"> annote les vignettes dans une grille pilotée au clavier et prend en charge les files</tspan></text><text y="260.0" xml:space="preserve"><tspan x="64.0" font-size="17" font-weight="300" fill="#c9d1d9">d’apprentissage actif.</tspan></text><circle cx="46" cy="289.0" r="3" fill="#2ec4b6"/><text y="294.0" xml:space="preserve"><tspan x="64.0" font-size="17" font-weight="400" fill="#e6edf3">Classify</tspan><tspan x="123.2" font-size="17" font-weight="300" fill="#c9d1d9"> entraîne des modèles fondés sur les images ou les mesures et enregistre, avec chaque</tspan></text><text y="322.0" xml:space="preserve"><tspan x="64.0" font-size="17" font-weight="300" fill="#c9d1d9">checkpoint, les performances sur les données réservées.</tspan></text><circle cx="46" cy="351.0" r="3" fill="#2ec4b6"/><text y="356.0" xml:space="preserve"><tspan x="64.0" font-size="17" font-weight="400" fill="#e6edf3">Map Barcodes</tspan><tspan x="177.3" font-size="17" font-weight="300" fill="#c9d1d9"> associe les lectures FASTQ aux puits et aux gRNA, avec un contrôle qualité de</tspan></text><text y="384.0" xml:space="preserve"><tspan x="64.0" font-size="17" font-weight="300" fill="#c9d1d9">l’abondance, des collisions et de la couverture.</tspan></text><circle cx="46" cy="413.0" r="3" fill="#2ec4b6"/><text y="418.0" xml:space="preserve"><tspan x="64.0" font-size="17" font-weight="400" fill="#e6edf3">Regression</tspan><tspan x="150.9" font-size="17" font-weight="300" fill="#c9d1d9"> estime les effets des guides, des gènes, des conditions et des contrôles avec des familles</tspan></text><text y="446.0" xml:space="preserve"><tspan x="64.0" font-size="17" font-weight="300" fill="#c9d1d9">de modèles adaptées aux réponses continues, fractionnelles et de comptage.</tspan></text>
