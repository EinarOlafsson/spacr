<svg xmlns="http://www.w3.org/2000/svg" width="880" height="495" viewBox="0 0 880 495" role="img" aria-labelledby="t d" data-source-sha256="8120e2d33cd60f5531b9116e63312e26afba4fd971a7e99ffa27e0270f831ae8">
<title id="t">Flux de travail principal</title>
<desc id="d">Flux de travail principal. Le flux de travail principal comprend six modules : Mask segmente les cellules, les noyaux, les agents pathogènes et les organites avec Cellpose. Measure enregistre dans SQLite les caractéristiques morphologiques, d’intensité, de texture, spatiales et de colocalisation, ainsi que les vignettes des objets. Annotate annote les vignettes dans une grille pilotée au clavier et prend en charge les files d’apprentissage actif. Classify entraîne des modèles fondés sur les images ou les mesures et enregistre, avec chaque checkpoint, les performances sur les données réservées. Map Barcodes associe les lectures FASTQ aux puits et aux gRNA, avec un contrôle qualité de l’abondance, des collisions et de la couverture. Regression estime les effets des guides, des gènes, des conditions et des contrôles avec des familles de modèles adaptées aux réponses continues, fractionnelles et de comptage.</desc>
