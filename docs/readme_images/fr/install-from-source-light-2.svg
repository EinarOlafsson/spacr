<svg xmlns="http://www.w3.org/2000/svg" width="358" height="202" viewBox="0 0 358 202" role="img" aria-labelledby="t d" data-source-sha256="ec0e74db81e47a50751a48676bf82a6d470927dcb106b43066702b58645529d4">
<title id="t">spaCR</title>
<desc id="d">Fichiers d’exécution uniquement : 104 MB sur disque en 6 s (Git : 38 MB ; fichiers : 66 MB). L’historique, docs, tests, tools, features, les données d’exemple et les traductions étendues de l’interface sont omis. --with-docs, --with-tests et --with-translations conservent respectivement la documentation, les tests et les traductions. Les traductions compactes de l’interface restent disponibles.</desc>
<style>@font-face{font-family:'spacr-os';font-weight:300;font-style:normal;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'spacr-os';font-weight:400;font-style:normal;src:url(data:font/woff2;base64,) format('woff2')}text{font-family:'spacr-os', 'spacr-script', 'spacr-symbols', 'Open Sans', sans-serif;font-kerning:normal}</style>
