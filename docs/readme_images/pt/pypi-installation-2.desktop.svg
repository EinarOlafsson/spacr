<svg xmlns="http://www.w3.org/2000/svg" width="830" height="179" viewBox="0 0 830 179" role="img" aria-labelledby="t d" data-source-sha256="9983488f98531a146ed398ef8b3c65b0957c23e4db872f7f321ee0f2a5289bbe">
<title id="t">spaCR</title>
<desc id="d">O spaCR oferece suporte ao Python 3.9 through 3.14, exceto ao Python 3.14.1, que é excluído pelo torchvision. Recomenda-se Linux para os fluxos de trabalho mais pesados com CUDA e ROCm; macOS e Windows também são compatíveis, e ambos utilizam suas GPUs — macOS por meio do Metal, que abrange o Apple Silicon e as placas gráficas AMD dos Macs Intel, e Windows por meio de CUDA ou DirectML. A instalação padrão inclui a interface de desktop Qt. Em um servidor, cluster ou executor de CI, execute os fluxos de trabalho de linha de comando sem abri-la:</desc>
