<title id="t">spaCR</title>
<desc id="d">Linux (x86-64, ARM64): True 3D, tentados em ordem Vulkan (wgpu), OpenGL, CPU. Windows (x64, ARM64): True 3D, tentados em ordem Vulkan / Direct3D 12 (wgpu), OpenGL, CPU. macOS (Intel, Apple silicon): True 3D, tentados em ordem Metal (wgpu), OpenGL, CPU. Sem wgpu: True 3D, tentados em ordem OpenGL, CPU (Python 3.9, outros processadores, Linux com glibc anterior a 2.28 ou instalado sem wgpu).</desc>
