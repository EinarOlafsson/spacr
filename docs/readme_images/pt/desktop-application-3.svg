<svg xmlns="http://www.w3.org/2000/svg" width="880" height="225" viewBox="0 0 880 225" role="img" aria-labelledby="t d" data-source-sha256="e7790d1b52a0d130a874a4621cac1ec3c2177dbbd1549d892d76a068ea7588a2">
<title id="t">spaCR</title>
<desc id="d">No macOS, abra o arquivo .pkg. A versão beta atual não é notarizada; se o Gatekeeper a bloquear, selecione Ajustes do Sistema → Privacidade e Segurança → Abrir Mesmo Assim. Consulte o guia de instalação para obter instruções de atualização, desinstalação, uso offline e solução de problemas, e os requisitos do sistema para recomendações sobre estações de trabalho e servidores e tabelas de compatibilidade de GPU.</desc>
