<svg xmlns="http://www.w3.org/2000/svg" width="358" height="273" viewBox="0 0 358 273" role="img" aria-labelledby="t d" data-source-sha256="a64dc87eb475c02705c5db65b73fae03a1f8437cc6b027e9360bd0461380244a">
<title id="t">spaCR</title>
<desc id="d">No macOS, abra o arquivo .pkg. A versão beta atual não é notarizada; se o Gatekeeper a bloquear, selecione Ajustes do Sistema → Privacidade e Segurança → Abrir Mesmo Assim. Para instruções de instalação, atualização, reinstalação, desinstalação, uso offline e solução de problemas, consulte o guia de instalação atual do nightly (em inglês). Consulte os requisitos do sistema para recomendações sobre estações de trabalho e servidores e tabelas de compatibilidade de GPU.</desc>
<style>@font-face{font-family:'spacr-os';font-weight:300;font-style:normal;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'spacr-os';font-weight:400;font-style:normal;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'spacr-symbols';font-weight:400;font-style:normal;src:url(data:font/woff2;base64,) format('woff2')}text{font-family:'spacr-os', 'spacr-script', 'spacr-symbols', 'Open Sans', sans-serif;font-kerning:normal}</style>
