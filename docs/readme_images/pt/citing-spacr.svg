<title id="t">Como citar o spaCR</title>
<desc id="d">Como citar o spaCR. Se o spaCR contribuir para sua pesquisa, cite: Olafsson EB, et al. Um pooled image-based CRISPR screen identifica o EAF1 como um modulador T. gondii da subversão ESCRT.</desc>
