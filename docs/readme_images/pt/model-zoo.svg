<svg xmlns="http://www.w3.org/2000/svg" width="358" height="265" viewBox="0 0 358 265" role="img" aria-labelledby="t d" data-source-sha256="f704a9aa2d3abaac43bf9435f127734bffe84b6e160308bf7352b6c294e202a0">
<title id="t">Biblioteca de modelos</title>
<desc id="d">Biblioteca de modelos. spaCR envia um catálogo de modelos treinados e os busca sob demanda. Abra Modelo Zoo da tela inicial para navegar e instalá-los, ou nomeie uma chave em um arquivo de configurações - pathogen_model: toxoplasma_pv_v1 - e o modelo é baixado e verificado na primeira vez que é necessário. Cada entrada publicada carrega um SHA-256; uma entrada real sem um é recusada em vez de instalada, porque um truncado não pode ser informado</desc>
<style>@font-face{font-family:'spacr-os';font-weight:300;font-style:normal;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'spacr-os';font-weight:400;font-style:normal;src:url(data:font/woff2;base64,) format('woff2')}text{font-family:'spacr-os', 'spacr-script', 'spacr-symbols', 'Open Sans', sans-serif;font-kerning:normal}</style>
<defs><linearGradient id="gmodel-zoo" x1="0" x2="1" y1="0" y2="0"><stop offset="0" stop-color="#2ec4b6"/><stop offset="1" stop-color="#6cb6ff"/></linearGradient><clipPath id="cmodel-zoo"><rect x="0" y="1" width="358" height="254" rx="12"/></clipPath></defs><filter id="smodel-zoo" x="-5%" y="-20%" width="110%" height="140%"><feDropShadow dx="0" dy="1" stdDeviation="1.2" flood-color="#1f2328" flood-opacity=".22"/></filter><rect x="0.5" y="1.5" width="357" height="253" rx="12" fill="#161b22" stroke="#30363d" filter="url(#smodel-zoo)"/><rect x="0" y="1" width="358" height="2" fill="url(#gmodel-zoo)" fill-opacity=".7" clip-path="url(#cmodel-zoo)"/><text y="32.2" xml:space="preserve"><tspan x="16.0" font-size="16" font-weight="400" fill="#e6edf3">Biblioteca de modelos</tspan></text><rect x="16" y="44.0" width="24" height="2" rx="1" fill="#2ec4b6"/><text y="71.5" xml:space="preserve"><tspan x="16.0" font-size="13.6" font-weight="300" fill="#c9d1d9">spaCR envia um catálogo de modelos treinados e os</tspan></text><text y="91.9" xml:space="preserve"><tspan x="16.0" font-size="13.6" font-weight="300" fill="#c9d1d9">busca sob demanda. Abra  </tspan><tspan x="182.3" font-size="13.6" font-weight="400" fill="#e6edf3">Modelo Zoo</tspan><tspan x="258.0" font-size="13.6" font-weight="300" fill="#c9d1d9"> da tela inicial</tspan></text><text y="112.3" xml:space="preserve"><tspan x="16.0" font-size="13.6" font-weight="300" fill="#c9d1d9">para navegar e instalá-los, ou nomeie uma chave em</tspan></text><rect x="208.6" y="118.8" width="119.8" height="22.6" rx="5" fill="#2ec4b6" fill-opacity=".12"/><text y="132.7" xml:space="preserve"><tspan x="16.0" font-size="13.6" font-weight="300" fill="#c9d1d9">um arquivo de configurações -  </tspan><tspan x="211.6" font-size="13.6" font-weight="400" fill="#2ec4b6">pathogen_model:</tspan></text><rect x="16.0" y="139.2" width="121.9" height="22.6" rx="5" fill="#2ec4b6" fill-opacity=".12"/><text y="153.1" xml:space="preserve"><tspan x="19.0" font-size="13.6" font-weight="400" fill="#2ec4b6">toxoplasma_pv_v1</tspan><tspan x="137.9" font-size="13.6" font-weight="300" fill="#c9d1d9"> - e o modelo é baixado e</tspan></text><text y="173.5" xml:space="preserve"><tspan x="16.0" font-size="13.6" font-weight="300" fill="#c9d1d9">verificado na primeira vez que é necessário. Cada</tspan></text><text y="193.9" xml:space="preserve"><tspan x="16.0" font-size="13.6" font-weight="300" fill="#c9d1d9">entrada publicada carrega um SHA-256; uma entrada</tspan></text><text y="214.3" xml:space="preserve"><tspan x="16.0" font-size="13.6" font-weight="300" fill="#c9d1d9">real sem um é recusada em vez de instalada, porque</tspan></text><text y="234.7" xml:space="preserve"><tspan x="16.0" font-size="13.6" font-weight="300" fill="#c9d1d9">um truncado não pode ser informado</tspan></text>
</svg>
