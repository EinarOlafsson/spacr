<svg xmlns="http://www.w3.org/2000/svg" width="358" height="305" viewBox="0 0 358 305" role="img" aria-labelledby="t d" data-source-sha256="d5a3e93313a20205f668ee2a9f8f5cff495540313b0f89fd403e1fcea79d112d">
<title id="t">Biblioteca de modelos</title>
<desc id="d">Biblioteca de modelos. O spaCR inclui um catálogo de modelos treinados e os baixa quando necessário. Abra Model Zoo na tela inicial para explorar e instalar modelos, ou indique uma chave no arquivo de configurações, como pathogen_model: toxoplasma_pv_v1. O modelo é baixado e verificado pela soma de verificação na primeira vez em que é necessário. Cada entrada publicada contém uma soma SHA-256. Entradas sem essa soma são recusadas, pois, sem ela, não seria possível distinguir um arquivo de modelo incompleto ou substituído do original.</desc>
<style>@font-face{font-family:'spacr-os';font-weight:300;font-style:normal;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'spacr-os';font-weight:400;font-style:normal;src:url(data:font/woff2;base64,) format('woff2')}text{font-family:'spacr-os', 'spacr-script', 'spacr-symbols', 'Open Sans', sans-serif;font-kerning:normal}</style>
<defs><linearGradient id="gmodel-zoo" x1="0" x2="1" y1="0" y2="0"><stop offset="0" stop-color="#2ec4b6"/><stop offset="1" stop-color="#6cb6ff"/></linearGradient><clipPath id="cmodel-zoo"><rect x="0" y="1" width="358" height="294" rx="12"/></clipPath></defs><filter id="smodel-zoo" x="-5%" y="-20%" width="110%" height="140%"><feDropShadow dx="0" dy="1" stdDeviation="1.2" flood-color="#1f2328" flood-opacity=".22"/></filter><rect x="0.5" y="1.5" width="357" height="293" rx="12" fill="#161b22" stroke="#30363d" filter="url(#smodel-zoo)"/><rect x="0" y="1" width="358" height="2" fill="url(#gmodel-zoo)" fill-opacity=".7" clip-path="url(#cmodel-zoo)"/><text y="32.2" xml:space="preserve"><tspan x="16.0" font-size="16" font-weight="400" fill="#e6edf3">Biblioteca de modelos</tspan></text><rect x="16" y="44.0" width="24" height="2" rx="1" fill="#2ec4b6"/><text y="71.5" xml:space="preserve"><tspan x="16.0" font-size="13.6" font-weight="300" fill="#c9d1d9">O spaCR inclui um catálogo de modelos treinados e</tspan></text><text y="91.9" xml:space="preserve"><tspan x="16.0" font-size="13.6" font-weight="300" fill="#c9d1d9">os baixa quando necessário. Abra </tspan><tspan x="225.4" font-size="13.6" font-weight="400" fill="#e6edf3">Model Zoo</tspan><tspan x="292.9" font-size="13.6" font-weight="300" fill="#c9d1d9"> na tela</tspan></text><text y="112.3" xml:space="preserve"><tspan x="16.0" font-size="13.6" font-weight="300" fill="#c9d1d9">inicial para explorar e instalar modelos, ou indique</tspan></text><text y="132.7" xml:space="preserve"><tspan x="16.0" font-size="13.6" font-weight="300" fill="#c9d1d9">uma chave no arquivo de configurações, como</tspan></text><rect x="16.0" y="139.2" width="235.7" height="22.6" rx="5" fill="#2ec4b6" fill-opacity=".12"/><text y="153.1" xml:space="preserve"><tspan x="19.0" font-size="13.6" font-weight="400" fill="#2ec4b6">pathogen_model: toxoplasma_pv_v1</tspan><tspan x="251.7" font-size="13.6" font-weight="300" fill="#c9d1d9">. O modelo é</tspan></text><text y="173.5" xml:space="preserve"><tspan x="16.0" font-size="13.6" font-weight="300" fill="#c9d1d9">baixado e verificado pela soma de verificação na</tspan></text><text y="193.9" xml:space="preserve"><tspan x="16.0" font-size="13.6" font-weight="300" fill="#c9d1d9">primeira vez em que é necessário. Cada entrada</tspan></text><text y="214.3" xml:space="preserve"><tspan x="16.0" font-size="13.6" font-weight="300" fill="#c9d1d9">publicada contém uma soma SHA-256. Entradas sem</tspan></text><text y="234.7" xml:space="preserve"><tspan x="16.0" font-size="13.6" font-weight="300" fill="#c9d1d9">essa soma são recusadas, pois, sem ela, não seria</tspan></text><text y="255.1" xml:space="preserve"><tspan x="16.0" font-size="13.6" font-weight="300" fill="#c9d1d9">possível distinguir um arquivo de modelo incompleto</tspan></text><text y="275.5" xml:space="preserve"><tspan x="16.0" font-size="13.6" font-weight="300" fill="#c9d1d9">ou substituído do original.</tspan></text>
</svg>
