<svg xmlns="http://www.w3.org/2000/svg" width="358" height="212" viewBox="0 0 358 212" role="img" aria-labelledby="t d" data-source-sha256="f37d6ce287afdebe583d26646a3650e43d1fea400977cb90813b1721036a27ef">
<title id="t">spaCR</title>
<desc id="d">Salva em ~/.spacr/reports e mostra o caminho. --quick ignora os testes de desempenho mais longos; --out PATH define o local. Não lê dados do projeto. Mede o tempo de importações, bibliotecas numéricas, criação de janelas e animação, e informa a emulação x86_64 no Apple Silicon e a implementação de BLAS usada pelo NumPy.</desc>
<style>@font-face{font-family:'spacr-os';font-weight:300;font-style:normal;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'spacr-os';font-weight:400;font-style:normal;src:url(data:font/woff2;base64,) format('woff2')}text{font-family:'spacr-os', 'spacr-script', 'spacr-symbols', 'Open Sans', sans-serif;font-kerning:normal}</style>
