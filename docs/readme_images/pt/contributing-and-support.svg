reserve"><tspan x="46.0" font-size="17" font-weight="300" fill="#c9d1d9">inclua o relatório de hardware ao relatar problemas de desempenho.</tspan></text><path d="M840 36l8-8M841.5 28h6.5v6.5" fill="none" stroke="#2ec4b6" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
