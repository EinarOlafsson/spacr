<svg xmlns="http://www.w3.org/2000/svg" width="880" height="246" viewBox="0 0 880 246" role="img" aria-labelledby="t d" data-source-sha256="1fc9a873996b370add2181ca0dd136738a42f825663d165deb12b96c60a85ebe">
<title id="t">Contribuições e suporte</title>
<desc id="d">Contribuições e suporte. Envie relatos de erros e solicitações de recursos bem delimitadas pelo GitHub Issues. Ao relatar uma falha, inclua a versão do spaCR, o sistema operacional, a versão do Python, as configurações do módulo e o trecho relevante do log. O spacr-doctor coleta a maior parte dessas informações; inclua o relatório de hardware ao relatar problemas de desempenho.</desc>
<style>@font-face{font-family:'spacr-os';font-weight:300;font-style:normal;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'spacr-os';font-weight:400;font-style:normal;src:url(data:font/woff2;base64,) format('woff2')}text{font-family:'spacr-os', 'spacr-script', 'spacr-symbols', 'Open Sans', sans-serif;font-kerning:normal}</style>
