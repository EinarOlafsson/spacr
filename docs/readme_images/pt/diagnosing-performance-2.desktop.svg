<svg xmlns="http://www.w3.org/2000/svg" width="830" height="118" viewBox="0 0 830 118" role="img" aria-labelledby="t d" data-source-sha256="66ce2330ad565c50249f046a9fba40b0e4497c040ef9f0775504f644c1dad361">
<title id="t">spaCR</title>
<desc id="d">Salva em ~/.spacr/reports e imprime o caminho. --quick pula os benchmarks mais longos; --out PATH define a localização. Não lê dados do projeto. Mede o tempo de importações, bibliotecas numéricas, criação de janelas e animação, e informa a emulação x86_64 no Apple Silicon e a implementação de BLAS usada pelo NumPy.</desc>
