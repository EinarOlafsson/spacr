<svg xmlns="http://www.w3.org/2000/svg" width="880" height="155" viewBox="0 0 880 155" role="img" aria-labelledby="t d" data-source-sha256="88b2a554a410b578ae1477fea177afb08c2b191008a353f6b9e543c2802bf91a">
<title id="t">spaCR</title>
<desc id="d">Os nove catálogos não ingleses são elaborados por máquina e tecnicamente revisados em vez de lidos de ponta a ponta por um falante nativo. Os registros âmbito de revisão que as línguas tiveram um passe humano e todos os termos deixados em inglês por decisão.</desc>
