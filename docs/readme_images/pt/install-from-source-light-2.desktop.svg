<svg xmlns="http://www.w3.org/2000/svg" width="830" height="129" viewBox="0 0 830 129" role="img" aria-labelledby="t d" data-source-sha256="1c6ef7479f37194c68e3eae72cc410356f82fa13272e5999e44f255de166f9c0">
<title id="t">spaCR</title>
<desc id="d">O clone completo de nightly baixou 9.25 GiB. Adicionar --filter=blob:none ao clone superficial não reduz a cópia de trabalho: seu armazenamento de objetos Git ainda ocupa 2032 MB. O Git não informa as transferências adiadas de objetos, por isso nenhum total de download foi medido. Os arquivos versionados de nightly ocupam 958 MB na cópia de trabalho (medidos em 2026-10-20), sem o histórico do Git. O tamanho e a duração da transferência variam conforme o ramo.</desc>
