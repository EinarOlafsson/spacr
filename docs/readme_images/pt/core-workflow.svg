="#c9d1d9"> rotula recortes em uma grade controlada pelo teclado e oferece suporte a filas de</tspan></text><text y="260.0" xml:space="preserve"><tspan x="64.0" font-size="17" font-weight="300" fill="#c9d1d9">aprendizado ativo.</tspan></text><circle cx="46" cy="289.0" r="3" fill="#2ec4b6"/><text y="294.0" xml:space="preserve"><tspan x="64.0" font-size="17" font-weight="400" fill="#e6edf3">Classify</tspan><tspan x="123.2" font-size="17" font-weight="300" fill="#c9d1d9"> treina modelos baseados em imagens ou medições e registra, em cada checkpoint, o</tspan></text><text y="322.0" xml:space="preserve"><tspan x="64.0" font-size="17" font-weight="300" fill="#c9d1d9">desempenho nos dados de validação reservados.</tspan></text><circle cx="46" cy="351.0" r="3" fill="#2ec4b6"/><text y="356.0" xml:space="preserve"><tspan x="64.0" font-size="17" font-weight="400" fill="#e6edf3">Map Barcodes</tspan><tspan x="177.3" font-size="17" font-weight="300" fill="#c9d1d9"> associa as leituras FASTQ aos poços e gRNAs, com controle de qualidade de</tspan></text><text y="384.0" xml:space="preserve"><tspan x="64.0" font-size="17" font-weight="300" fill="#c9d1d9">abundância, colisões e cobertura.</tspan></text><circle cx="46" cy="413.0" r="3" fill="#2ec4b6"/><text y="418.0" xml:space="preserve"><tspan x="64.0" font-size="17" font-weight="400" fill="#e6edf3">Regression</tspan><tspan x="150.9" font-size="17" font-weight="300" fill="#c9d1d9"> estima efeitos de guias, genes, condições e controles com famílias de modelos</tspan></text><text y="446.0" xml:space="preserve"><tspan x="64.0" font-size="17" font-weight="300" fill="#c9d1d9">adequadas a respostas contínuas, fracionárias e de contagem.</tspan></text>
</svg>
