<svg xmlns="http://www.w3.org/2000/svg" width="880" height="495" viewBox="0 0 880 495" role="img" aria-labelledby="t d" data-source-sha256="b3593253287ed3c7fa28a8b345985c8f308e88ab8dc7c18470721d31a3d94929">
<title id="t">Fluxo de trabalho principal</title>
<desc id="d">Fluxo de trabalho principal. O fluxo de trabalho principal compreende seis módulos: Mask segmenta células, núcleos, patógenos e organelas com Cellpose. Measure grava no SQLite características de morfologia, intensidade, textura, espaciais e de colocalização, além de recortes dos objetos. Annotate rotula recortes em uma grade controlada pelo teclado e oferece suporte a filas de aprendizado ativo. Classify treina modelos baseados em imagens ou medições e registra, em cada checkpoint, o desempenho nos dados de validação reservados. Map Barcodes associa as leituras FASTQ aos poços e gRNAs, com controle de qualidade de abundância, colisões e cobertura. Regression estima efeitos de guias, genes, condições e controles com famílias de modelos adequadas a respostas contínuas, fracionárias e de contagem.</desc>
<style>@font-face{font-family:'spacr-os';font-weight:300;font-style:normal;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'spacr-os';font-weight:400;font-style:normal;src:url(data:font/woff2;base64,) format('woff2')}text{font-family:'spacr-os', 'spacr-script', 'spacr-symbols', 'Open Sans', sans-serif;font-kerning:normal}</style>
