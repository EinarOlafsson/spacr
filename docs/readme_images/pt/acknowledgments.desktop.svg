<title id="t">Agradecimentos</title>
<desc id="d">Agradecimentos. O spaCR utiliza software científico aberto, incluindo NumPy, pandas, scikit-image, scikit-learn, Cellpose, PyTorch e Qt. Consulte a atribuição dos modelos de tradução para ver os modelos usados na documentação multilíngue e nos catálogos da interface.</desc>
