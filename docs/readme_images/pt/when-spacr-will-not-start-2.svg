<svg xmlns="http://www.w3.org/2000/svg" width="880" height="225" viewBox="0 0 880 225" role="img" aria-labelledby="t d" data-source-sha256="768139cbedf2b5cfc3dbd9bd47656160d68f469fda718cd06734313e96b6adec">
<title id="t">spaCR</title>
<desc id="d">spacr-doctor imprime uma linha por verificação, com um comando a ser executado para cada falha. Ele também informa qual spacr está no caminho. safespacr lê cada preferência com seu valor padrão e desativa o plano de fundo, as animações, o registro detalhado e o pré-carregamento. Use-o quando uma preferência salva impedir a inicialização. As preferências salvas no modo de segurança são gravadas normalmente e permanecem.</desc>
<style>@font-face{font-family:'spacr-os';font-weight:300;font-style:normal;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'spacr-os';font-weight:400;font-style:normal;src:url(data:font/woff2;base64,) format('woff2')}text{font-family:'spacr-os', 'spacr-script', 'spacr-symbols', 'Open Sans', sans-serif;font-kerning:normal}</style>
