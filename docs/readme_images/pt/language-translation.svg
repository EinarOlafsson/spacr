<svg xmlns="http://www.w3.org/2000/svg" width="880" height="274" viewBox="0 0 880 274" role="img" aria-labelledby="t d" data-source-sha256="b3ebff0a6836ed46e8fbf466afb950a286001af763e8b33ac12dcaaefb440196">
<title id="t">Idioma e tradução</title>
<desc id="d">Idioma e tradução. A interface oferece dez idiomas na navegação e nas preferências. Os controles AI e LIVE, as descrições dos módulos e a ajuda contextual revisada também são traduzidos. Altere o idioma em spaCR → Preferências → Idioma sem reiniciar. Logs, caminhos, valores de banco de dados e medições nunca são traduzidos; a saída científica permanece em inglês canônico. Consulte a política de ajuda contextual.</desc>
