<svg xmlns="http://www.w3.org/2000/svg" width="830" height="189" viewBox="0 0 830 189" role="img" aria-labelledby="t d" data-source-sha256="e14b9f0176a863f5e65773891c0be7324fd95283e2c0037f6578ce77f43678ec">
<title id="t">Instalação a partir do código-fonte (leve)</title>
<desc id="d">Instalação a partir do código-fonte (leve). Colaboradores precisam do histórico de versões; para executar o spaCR, escolha uma das opções abaixo. Medições de nightly em 05302fd5c no dia 2026-10-07, feitas com packaging/measure_clone_forms.sh. Clone superficial: 2048 MB baixados em 140 s. Apenas o commit mais recente é mantido; assim, o histórico anterior não está disponível para git log, git blame e git bisect. git pull funciona, mas o clone continua superficial; git fetch --unshallow obtém o histórico completo.</desc>
<style>@font-face{font-family:'spacr-os';font-weight:300;font-style:normal;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'spacr-os';font-weight:400;font-style:normal;src:url(data:font/woff2;base64,) format('woff2')}text{font-family:'spacr-os', 'spacr-script', 'spacr-symbols', 'Open Sans', sans-serif;font-kerning:normal}</style>
<defs><linearGradient id="ginstall-from-source-light" x1="0" x2="1" y1="0" y2="0"><stop offset="0" stop-color="#2ec4b6"/><stop offset="1" stop-color="#6cb6ff"/></linearGradient><clipPath id="cinstall-from-source-light"><rect x="0" y="1" width="830" height="178" rx="12"/></clipPath></defs><filter id="sinstall-from-source-light" x="-5%" y="-20%" width="110%" height="140%"><feDropShadow dx="0" dy="1" stdDeviation="1.2" flood-color="#1f2328" flood-opacity=".22"/></filter><rect x="0.5" y="1.5" width="829" height="177" rx="12" fill="#161b22" stroke="#30363d" filter="url(#sinstall-from-source-light)"/><rect x="0" y="1" width="830" height="2" fill="url(#ginstall-from-source-light)" fill-opacity=".7" clip-path="url(#cinstall-from-source-light)"/><text y="33.5" xml:space="preserve"><tspan x="24.0" font-size="13.6" font-weight="400" fill="#e6edf3">Instalação a partir do código-fonte (leve)</tspan></text><rect x="752.8" y="50.0" width="48.6" height="22.6" rx="5" fill="#2ec4b6" fill-opacity=".12"/><text y="63.9" xml:space="preserve"><tspan x="24.0" font-size="13.6" font-weight="300" fill="#c9d1d9">Colaboradores precisam do histórico de versões; para executar o spaCR, escolha uma das opções abaixo. Medições de </tspan><tspan x="755.8" font-size="13.6" font-weight="400" fill="#2ec4b6">nightly</tspan></text><rect x="47.0" y="70.4" width="72.1" height="22.6" rx="5" fill="#2ec4b6" fill-opacity=".12"/><rect x="307.6" y="70.4" width="232.2" height="22.6" rx="5" fill="#2ec4b6" fill-opacity=".12"/><text y="84.3" xml:space="preserve"><tspan x="24.0" font-size="13.6" font-weight="300" fill="#c9d1d9">em </tspan><tspan x="50.0" font-size="13.6" font-weight="400" fill="#2ec4b6">05302fd5c</tspan><tspan x="119.1" font-size="13.6" font-weight="300" fill="#c9d1d9"> no dia 2026-10-07, feitas com </tspan><tspan x="310.6" font-size="13.6" font-weight="400" fill="#2ec4b6">packaging/measure_clone_forms.sh</tspan><tspan x="539.8" font-size="13.6" font-weight="300" fill="#c9d1d9">.</tspan></text><text y="114.7" xml:space="preserve"><tspan x="24.0" font-size="13.6" font-weight="300" fill="#c9d1d9">Clone superficial: 2048 MB baixados em 140 s. Apenas o commit mais recente é mantido; assim, o histórico anterior não está</tspan></text><rect x="120.3" y="121.2" width="44.2" height="22.6" rx="5" fill="#2ec4b6" fill-opacity=".12"/><rect x="171.0" y="121.2" width="64.7" height="22.6" rx="5" fill="#2ec4b6" fill-opacity=".12"/><rect x="250.3" y="121.2" width="62.4" height="22.6" rx="5" fill="#2ec4b6" fill-opacity=".12"/><rect x="319.5" y="121.2" width="48.7" height="22.6" rx="5" fill="#2ec4b6" fill-opacity=".12"/><rect x="634.1" y="121.2" width="134.0" height="22.6" rx="5" fill="#2ec4b6" fill-opacity=".12"/><text y="135.1" xml:space="preserve"><tspan x="24.0" font-size="13.6" font-weight="300" fill="#c9d1d9">disponível para </tspan><tspan x="123.3" font-size="13.6" font-weight="400" fill="#2ec4b6">git log</tspan><tspan x="164.5" font-size="13.6" font-weight="300" fill="#c9d1d9">, </tspan><tspan x="174.0" font-size="13.6" font-weight="400" fill="#2ec4b6">git blame</tspan><tspan x="235.7" font-size="13.6" font-weight="300" fill="#c9d1d9"> e </tspan><tspan x="253.3" font-size="13.6" font-weight="400" fill="#2ec4b6">git bisect</tspan><tspan x="312.7" font-size="13.6" font-weight="300" fill="#c9d1d9">. </tspan><tspan x="322.5" font-size="13.6" font-weight="400" fill="#2ec4b6">git pull</tspan><tspan x="368.2" font-size="13.6" font-weight="300" fill="#c9d1d9"> funciona, mas o clone continua superficial; </tspan><tspan x="637.1" font-size="13.6" font-weight="400" fill="#2ec4b6">git fetch --unshallow</tspan></text><text y="155.5" xml:space="preserve"><tspan x="24.0" font-size="13.6" font-weight="300" fill="#c9d1d9">obtém o histórico completo.</tspan></text>
</svg>
