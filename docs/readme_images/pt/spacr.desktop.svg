nterface gráfica em uma estação de trabalho, servidor ou cluster.</tspan></text><path d="M806 30l8-8M807.5 22h6.5v6.5" fill="none" stroke="#2ec4b6" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
