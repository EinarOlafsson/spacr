<svg xmlns="http://www.w3.org/2000/svg" width="830" height="427" viewBox="0 0 830 427" role="img" aria-labelledby="t d" data-source-sha256="f5cbccdd4db858e02cd86489d07ef34a932da346583f887aeb547d7c4466f8b4">
<title id="t">spaCR</title>
<desc id="d">spaCR. Análise espacial de fenótipos em triagens CRISPR. O spaCR segmenta e mede células individuais em imagens de microscopia, integra fenótipos por objeto à abundância de guias derivada do sequenciamento e estima quais genes estão associados a alterações fenotípicas. A partir de imagens de placas e leituras FASTQ, ele produz medições por objeto, classificadores treinados, estimativas de efeito por guia e por gene e uma lista de resultados classificada. Os módulos de segmentação, medição, anotação e classificação também são executados sem um braço de sequenciamento. Make Masks corrige máscaras de segmentação e anota retângulos independentes com rótulos de classe usando a ferramenta Box para exportação YOLO. Os retângulos mantêm seus próprios rótulos e histórico sem alterar as imagens ou máscaras de origem. Consulte o guia de funcionalidades para conhecer cada ferramenta. Imagens, máscaras e recortes são arquivos em disco. Medições, anotações e previsões do modelo são tabelas do banco de dados SQLite measurements.db do projeto. É executado como um aplicativo de desktop ou sem interface gráfica em uma estação de trabalho, servidor ou cluster.</desc>
