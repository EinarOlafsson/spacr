<svg xmlns="http://www.w3.org/2000/svg" width="880" height="211" viewBox="0 0 880 211" role="img" aria-labelledby="t d" data-source-sha256="9a7843c32313b0dca0eaadad82e852e070537c6c8d9186b5fdfdf4fe86a1ee95">
<title id="t">spaCR</title>
<desc id="d">O clone completo de nightly baixou 9.25 GiB. Adicionar --filter=blob:none ao clone superficial não reduz a cópia de trabalho: seu armazenamento de objetos Git ainda ocupa 2032 MB. O Git não informa as transferências adiadas de objetos, por isso nenhum total de download foi medido. Os arquivos versionados de nightly ocupam 3416 MB na cópia de trabalho (medidos em 2026-10-08), sem o histórico do Git. O tamanho e a duração da transferência variam conforme o ramo.</desc>
