<svg xmlns="http://www.w3.org/2000/svg" width="358" height="202" viewBox="0 0 358 202" role="img" aria-labelledby="t d" data-source-sha256="58604ae4e5c9f1e2bc2b5862129a76d5bd839f0c8867b6e25e1733252ba886ed">
<title id="t">spaCR</title>
<desc id="d">Somente arquivos de execução: 104 MB em disco em 6 s (Git: 38 MB; arquivos: 66 MB). São omitidos o histórico, docs, tests, tools, features, os dados de exemplo e as traduções ampliadas da interface. --with-docs, --with-tests e --with-translations mantêm a documentação, os testes e as traduções correspondentes. As traduções compactas da interface continuam disponíveis.</desc>
