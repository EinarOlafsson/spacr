<title id="t">spaCR</title>
<desc id="d">As integrações opcionais são instaladas separadamente, por exemplo spacr[zarr], spacr[omero], spacr[napari] e spacr[czi,nd2,lif]. Consulte o guia de instalação (nightly, em inglês) para ver a lista completa de extras e a tabela de compatibilidade das versões do Python.</desc>
