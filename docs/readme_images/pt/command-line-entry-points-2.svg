<title id="t">spaCR</title>
<desc id="d">spacr-run --list lista os módulos com pontos de entrada de linha de comando para execução sem interface gráfica. Os módulos de anotação, curadoria, comparação e exploração disponíveis apenas na interface gráfica são omitidos.</desc>
