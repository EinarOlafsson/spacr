<svg xmlns="http://www.w3.org/2000/svg" width="830" height="130" viewBox="0 0 830 130" role="img" aria-labelledby="t d" data-source-sha256="f1d2a95d39186c43b5c5051763667d4658fe3f9c43e2c632ca0507d87a9270e0">
<title id="t">Guia animado de configurações</title>
<desc id="d">Guia animado de configurações. As configurações com uma explicação visual oferecem um controle Animation na dica de ferramenta. Consulte a galeria de animações de configurações ou o registro de animações de configurações.</desc>
