<svg xmlns="http://www.w3.org/2000/svg" width="358" height="355" viewBox="0 0 358 355" role="img" aria-labelledby="t d" data-source-sha256="813a4cd7fd642cc71fb668bb57005abf7db7b3138052285d6d955092e8099a60">
<title id="t">spaCR</title>
<desc id="d">--dir escolhe o caminho do clone; --branch seleciona uma ramificação ou tag; --no-install baixa sem instalar; --help mostra as opções. packaging/source_install_excludes.txt lista todos os caminhos omitidos. O clone completo de nightly baixou 9.25 GiB. Adicionar --filter=blob:none ao clone superficial não reduz a cópia de trabalho: seu armazenamento de objetos Git ainda ocupa 2032 MB. O Git não informa as transferências adiadas de objetos, por isso nenhum total de download foi medido. Os arquivos versionados de nightly ocupam 467 MB na cópia de trabalho (medidos em 2026-11-07), sem o histórico do Git. O tamanho e a duração da transferência variam conforme o ramo.</desc>
<style>@font-face{font-family:'spacr-os';font-weight:300;font-style:normal;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'spacr-os';font-weight:400;font-style:normal;src:url(data:font/woff2;base64,) format('woff2')}text{font-family:'spacr-os', 'spacr-script', 'spacr-symbols', 'Open Sans', sans-serif;font-kerning:normal}</style>
