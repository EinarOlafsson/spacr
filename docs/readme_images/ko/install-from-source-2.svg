<title id="t">spaCR</title>
<desc id="d">이 명령은 최신 릴리스가 담긴 기본 브랜치인 main 브랜치를 클론합니다. 개발은 nightly 브랜치에서 이루어지며, 대신 이 브랜치를 클론하려면 --branch nightly 옵션을 추가하십시오. 특정 릴리스를 클론하려면:</desc>
