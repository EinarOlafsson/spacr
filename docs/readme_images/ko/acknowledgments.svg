<svg xmlns="http://www.w3.org/2000/svg" width="880" height="218" viewBox="0 0 880 218" role="img" aria-labelledby="t d" data-source-sha256="66b95479b06451f1ce9e32e1ea35aebcc22f7fb4b3907e5f53fa6017298bb674">
<title id="t">감사의 말</title>
<desc id="d">감사의 말. spaCR는 NumPy, pandas, scikit-image, scikit-learn, Cellpose, PyTorch 및 Qt를 비롯한 개방형 과학 소프트웨어를 기반으로 합니다. 다국어 문서와 인터페이스 카탈로그 작성에 사용된 모델은 번역 모델 표기 문서에서 확인할 수 있습니다.</desc>
