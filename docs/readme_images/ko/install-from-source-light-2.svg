<svg xmlns="http://www.w3.org/2000/svg" width="358" height="202" viewBox="0 0 358 202" role="img" aria-labelledby="t d" data-source-sha256="fead29779b58dee51d06f7b56f0a5a29fbeff72767ae9f470b87b5b69052f369">
<title id="t">spaCR</title>
<desc id="d">nightly 전체 클론은 9.25 GiB를 다운로드했습니다. 얕은 클론에 --filter=blob:none을 추가해도 체크아웃 크기는 줄어들지 않습니다. Git 객체 저장소는 여전히 2032 MB입니다. Git은 필요할 때 나중에 가져오는 객체를 보고하지 않으므로 전체 다운로드 총량은 측정하지 않았습니다. nightly의 버전 관리 파일을 체크아웃하면 Git 이력을 제외하고 4657 MB를 차지합니다(2026-10-15 측정). 다운로드 크기와 시간은 브랜치에 따라 달라집니다.</desc>
<style>@font-face{font-family:'spacr-os';font-weight:300;font-style:normal;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'spacr-os';font-weight:400;font-style:normal;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'spacr-script';font-weight:300;font-style:normal;src:url(data:font/woff2;base64,) format('woff2')}text{font-family:'spacr-os', 'spacr-script', 'spacr-symbols', 'Open Sans', sans-serif;font-kerning:normal}</style>
<filter id="sinstall-from-source-light-2" x="-5%" y="-20%" width="110%" height="140%"><feDropShadow dx="0" dy="1" stdDeviation="1.2" flood-color="#1f2328" flood-opacity=".22"/></filter><rect x="0.5" y="1.5" width="357" height="190" rx="12" fill="#161b22" stroke="#30363d" filter="url(#sinstall-from-source-light-2)"/><text y="29.5" xml:space="preserve"><tspan x="16.0" font-size="13.6" font-weight="300" fill="#c9d1d9">nightly 전체 클론은 9.25 GiB를 다운로드했습니다. 얕은</tspan></text><rect x="57.1" y="36.0" width="116.3" height="22.6" rx="5" fill="#2ec4b6" fill-opacity=".12"/><text y="49.9" xml:space="preserve"><tspan x="16.0" font-size="13.6" font-weight="300" fill="#c9d1d9">클론에 </tspan><tspan x="60.1" font-size="13.6" font-weight="400" fill="#2ec4b6">--filter=blob:none</tspan><tspan x="173.4" font-size="13.6" font-weight="300" fill="#c9d1d9">을 추가해도 체크아웃 크기는</tspan></text><text y="70.3" xml:space="preserve"><tspan x="16.0" font-size="13.6" font-weight="300" fill="#c9d1d9">줄어들지 않습니다. Git 객체 저장소는 여전히 2032</tspan></text><text y="90.7" xml:space="preserve"><tspan x="16.0" font-size="13.6" font-weight="300" fill="#c9d1d9">MB입니다. Git은 필요할 때 나중에 가져오는 객체를</tspan></text><text y="111.1" xml:space="preserve"><tspan x="16.0" font-size="13.6" font-weight="300" fill="#c9d1d9">보고하지 않으므로 전체 다운로드 총량은 측정하지</tspan></text><text y="131.5" xml:space="preserve"><tspan x="16.0" font-size="13.6" font-weight="300" fill="#c9d1d9">않았습니다. nightly의 버전 관리 파일을 체크아웃하면 Git</tspan></text><text y="151.9" xml:space="preserve"><tspan x="16.0" font-size="13.6" font-weight="300" fill="#c9d1d9">이력을 제외하고 4657 MB를 차지합니다(2026-10-15</tspan></text><text y="172.3" xml:space="preserve"><tspan x="16.0" font-size="13.6" font-weight="300" fill="#c9d1d9">측정). 다운로드 크기와 시간은 브랜치에 따라 달라집니다.</tspan></text>
