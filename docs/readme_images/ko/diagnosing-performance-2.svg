<svg xmlns="http://www.w3.org/2000/svg" width="880" height="197" viewBox="0 0 880 197" role="img" aria-labelledby="t d" data-source-sha256="693610f72ead144f3d73541ec043d302eff60a246c691261301a48a8a95afdf9">
<title id="t">spaCR</title>
<desc id="d">~/.spacr/reports로 저장하고 경로를 인쇄합니다. --quick는 더 긴 좌표를 스키; --out PATH는 위치를 설정합니다. 프로젝트 데이터를 읽지 않습니다. 가져오기, 수치 라이브러리, 창 구성 및 애니메이션에 걸리는 시간을 측정하고 Apple Silicon의 x86_64 에뮬레이션과 NumPy의 BLAS 구현 정보를 보고합니다.</desc>
<style>@font-face{font-family:'spacr-os';font-weight:300;font-style:normal;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'spacr-os';font-weight:400;font-style:normal;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'spacr-script';font-weight:300;font-style:normal;src:url(data:font/woff2;base64,) format('woff2')}text{font-family:'spacr-os', 'spacr-script', 'spacr-symbols', 'Open Sans', sans-serif;font-kerning:normal}</style>
<filter id="sdiagnosing-performance-2" x="-5%" y="-20%" width="110%" height="140%"><feDropShadow dx="0" dy="1" stdDeviation="1.2" flood-color="#1f2328" flood-opacity=".22"/></filter><rect x="6.5" y="1.5" width="867" height="185" rx="14" fill="#161b22" stroke="#30363d" filter="url(#sdiagnosing-performance-2)"/><rect x="46.0" y="34.2" width="126.6" height="24.5" rx="5" fill="#2ec4b6" fill-opacity=".12"/><rect x="397.7" y="34.2" width="58.4" height="24.5" rx="5" fill="#2ec4b6" fill-opacity=".12"/><rect x="607.4" y="34.2" width="87.4" height="24.5" rx="5" fill="#2ec4b6" fill-opacity=".12"/><text y="50.0" xml:space="preserve"><tspan x="51.0" font-size="15.5" font-weight="400" fill="#2ec4b6">~/.spacr/reports</tspan><tspan x="172.6" font-size="17" font-weight="300" fill="#c9d1d9">로 저장하고 경로를 인쇄합니다. </tspan><tspan x="402.7" font-size="15.5" font-weight="400" fill="#2ec4b6">--quick</tspan><tspan x="456.1" font-size="17" font-weight="300" fill="#c9d1d9">는 더 긴 좌표를 스키; </tspan><tspan x="612.4" font-size="15.5" font-weight="400" fill="#2ec4b6">--out PATH</tspan><tspan x="694.8" font-size="17" font-weight="300" fill="#c9d1d9">는 위치를</tspan></text><text y="78.0" xml:space="preserve"><tspan x="46.0" font-size="17" font-weight="300" fill="#c9d1d9">설정합니다.</tspan></text><text y="120.0" xml:space="preserve"><tspan x="46.0" font-size="17" font-weight="300" fill="#c9d1d9">프로젝트 데이터를 읽지 않습니다. 가져오기, 수치 라이브러리, 창 구성 및 애니메이션에 걸리는 시간을 측정하고</tspan></text><text y="148.0" xml:space="preserve"><tspan x="46.0" font-size="17" font-weight="300" fill="#c9d1d9">Apple Silicon의 x86_64 에뮬레이션과 NumPy의 BLAS 구현 정보를 보고합니다.</tspan></text>
</svg>
