<svg xmlns="http://www.w3.org/2000/svg" width="358" height="192" viewBox="0 0 358 192" role="img" aria-labelledby="t d" data-source-sha256="7897b055f6f3d0c424d0897c5e211b6c873799a839a25cef0da140b26c11e644">
<title id="t">spaCR</title>
<desc id="d">~/.spacr/reports에 저장하고 경로를 출력합니다. --quick은 오래 걸리는 성능 검사를 생략하며, --out PATH는 저장 위치를 지정합니다. 프로젝트 데이터를 읽지 않습니다. 가져오기, 수치 라이브러리, 창 구성 및 애니메이션에 걸리는 시간을 측정하고 Apple Silicon의 x86_64 에뮬레이션과 NumPy의 BLAS 구현 정보를 보고합니다.</desc>
<style>@font-face{font-family:'spacr-os';font-weight:300;font-style:normal;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'spacr-os';font-weight:400;font-style:normal;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'spacr-script';font-weight:300;font-style:normal;src:url(data:font/woff2;base64,) format('woff2')}text{font-family:'spacr-os', 'spacr-script', 'spacr-symbols', 'Open Sans', sans-serif;font-kerning:normal}</style>
<filter id="sdiagnosing-performance-2" x="-5%" y="-20%" width="110%" height="140%"><feDropShadow dx="0" dy="1" stdDeviation="1.2" flood-color="#1f2328" flood-opacity=".22"/></filter><rect x="0.5" y="1.5" width="357" height="180" rx="12" fill="#161b22" stroke="#30363d" filter="url(#sdiagnosing-performance-2)"/><rect x="16.0" y="15.6" width="108.3" height="22.6" rx="5" fill="#2ec4b6" fill-opacity=".12"/><text y="29.5" xml:space="preserve"><tspan x="19.0" font-size="13.6" font-weight="400" fill="#2ec4b6">~/.spacr/reports</tspan><tspan x="124.3" font-size="13.6" font-weight="300" fill="#c9d1d9">에 저장하고 경로를 출력합니다.</tspan></text><rect x="16.0" y="36.0" width="48.5" height="22.6" rx="5" fill="#2ec4b6" fill-opacity=".12"/><rect x="276.3" y="36.0" width="39.7" height="22.6" rx="5" fill="#2ec4b6" fill-opacity=".12"/><text y="49.9" xml:space="preserve"><tspan x="19.0" font-size="13.6" font-weight="400" fill="#2ec4b6">--quick</tspan><tspan x="64.5" font-size="13.6" font-weight="300" fill="#c9d1d9">은 오래 걸리는 성능 검사를 생략하며, </tspan><tspan x="279.3" font-size="13.6" font-weight="400" fill="#2ec4b6">--out</tspan></text><rect x="16.0" y="56.4" width="40.3" height="22.6" rx="5" fill="#2ec4b6" fill-opacity=".12"/><text y="70.3" xml:space="preserve"><tspan x="19.0" font-size="13.6" font-weight="400" fill="#2ec4b6">PATH</tspan><tspan x="56.3" font-size="13.6" font-weight="300" fill="#c9d1d9">는 저장 위치를 지정합니다.</tspan></text><text y="100.7" xml:space="preserve"><tspan x="16.0" font-size="13.6" font-weight="300" fill="#c9d1d9">프로젝트 데이터를 읽지 않습니다. 가져오기, 수치</tspan></text><text y="121.1" xml:space="preserve"><tspan x="16.0" font-size="13.6" font-weight="300" fill="#c9d1d9">라이브러리, 창 구성 및 애니메이션에 걸리는 시간을</tspan></text><text y="141.5" xml:space="preserve"><tspan x="16.0" font-size="13.6" font-weight="300" fill="#c9d1d9">측정하고 Apple Silicon의 x86_64 에뮬레이션과</tspan></text><text y="161.9" xml:space="preserve"><tspan x="16.0" font-size="13.6" font-weight="300" fill="#c9d1d9">NumPy의 BLAS 구현 정보를 보고합니다.</tspan></text>
</svg>
