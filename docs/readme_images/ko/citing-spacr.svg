<title id="t">spaCR 인용</title>
<desc id="d">spaCR 인용. spaCR가 연구에 기여했다면 다음을 인용해 주세요: Olafsson EB, et al. 풀드 이미지 기반 CRISPR 스크린은 EAF1을 T. gondii의 ESCRT 기능 탈취 조절 인자로 규명합니다.</desc>
