<svg xmlns="http://www.w3.org/2000/svg" width="830" height="118" viewBox="0 0 830 118" role="img" aria-labelledby="t d" data-source-sha256="d0a9e153832365da49dce38252a0906d7eddeaa4a4943e6b30199b2e974bbf5d">
<title id="t">spaCR</title>
<desc id="d">~/.spacr/reports에 저장하고 경로를 출력합니다. --quick은 오래 걸리는 성능 검사를 생략하며, --out PATH는 저장 위치를 지정합니다. 프로젝트 데이터를 읽지 않습니다. 가져오기, 수치 라이브러리, 창 구성 및 애니메이션에 걸리는 시간을 측정하고 Apple Silicon의 x86_64 에뮬레이션과 NumPy의 BLAS 구현 정보를 보고합니다.</desc>
<style>@font-face{font-family:'spacr-os';font-weight:300;font-style:normal;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'spacr-os';font-weight:400;font-style:normal;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'spacr-script';font-weight:300;font-style:normal;src:url(data:font/woff2;base64,) format('woff2')}text{font-family:'spacr-os', 'spacr-script', 'spacr-symbols', 'Open Sans', sans-serif;font-kerning:normal}</style>
<filter id="sdiagnosing-performance-2" x="-5%" y="-20%" width="110%" height="140%"><feDropShadow dx="0" dy="1" stdDeviation="1.2" flood-color="#1f2328" flood-opacity=".22"/></filter><rect x="0.5" y="1.5" width="829" height="106" rx="12" fill="#161b22" stroke="#30363d" filter="url(#sdiagnosing-performance-2)"/><rect x="24.0" y="19.6" width="108.3" height="22.6" rx="5" fill="#2ec4b6" fill-opacity=".12"/><rect x="312.4" y="19.6" width="48.5" height="22.6" rx="5" fill="#2ec4b6" fill-opacity=".12"/><rect x="572.7" y="19.6" width="74.0" height="22.6" rx="5" fill="#2ec4b6" fill-opacity=".12"/><text y="33.5" xml:space="preserve"><tspan x="27.0" font-size="13.6" font-weight="400" fill="#2ec4b6">~/.spacr/reports</tspan><tspan x="132.3" font-size="13.6" font-weight="300" fill="#c9d1d9">에 저장하고 경로를 출력합니다. </tspan><tspan x="315.4" font-size="13.6" font-weight="400" fill="#2ec4b6">--quick</tspan><tspan x="360.9" font-size="13.6" font-weight="300" fill="#c9d1d9">은 오래 걸리는 성능 검사를 생략하며, </tspan><tspan x="575.7" font-size="13.6" font-weight="400" fill="#2ec4b6">--out PATH</tspan><tspan x="646.6" font-size="13.6" font-weight="300" fill="#c9d1d9">는 저장 위치를 지정합니다.</tspan></text><text y="63.9" xml:space="preserve"><tspan x="24.0" font-size="13.6" font-weight="300" fill="#c9d1d9">프로젝트 데이터를 읽지 않습니다. 가져오기, 수치 라이브러리, 창 구성 및 애니메이션에 걸리는 시간을 측정하고 Apple Silicon의 x86_64</tspan></text><text y="84.3" xml:space="preserve"><tspan x="24.0" font-size="13.6" font-weight="300" fill="#c9d1d9">에뮬레이션과 NumPy의 BLAS 구현 정보를 보고합니다.</tspan></text>
</svg>
