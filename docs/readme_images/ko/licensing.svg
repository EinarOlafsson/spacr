<title id="t">라이선스</title>
<desc id="d">라이선스. spaCR is released under the BSD 3 클래스 라이센스. spaCR이 출판된 작품에 기여한 경우, 인용문이 평가되고 라이센스의 조건이 아닙니다. - 아래의 `spaCR 인용`_을 참조하십시오.</desc>
