<svg xmlns="http://www.w3.org/2000/svg" width="358" height="173" viewBox="0 0 358 173" role="img" aria-labelledby="t d" data-source-sha256="b4beac9231f8ba7d655713094c5614c4444be41b376d9d26cc2454b740bde947">
<title id="t">라이선스</title>
<desc id="d">라이선스. spaCR는 BSD 3-Clause 라이선스로 배포됩니다. spaCR가 출판물에 기여했다면 인용해 주시면 감사하겠습니다. 인용은 라이선스의 조건이 아닙니다. 아래의 spaCR 인용을 참조하십시오.</desc>
