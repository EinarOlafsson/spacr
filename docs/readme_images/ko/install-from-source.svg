<svg xmlns="http://www.w3.org/2000/svg" width="880" height="171" viewBox="0 0 880 171" role="img" aria-labelledby="t d" data-source-sha256="9d3b9d6a2f8ceded0446391b266da05337838128de06ca5e4f28df3e5a2318bb">
<title id="t">소스 코드에서 설치</title>
<desc id="d">소스 코드에서 설치. 저장소를 클론한 뒤 편집 가능 모드로 설치하십시오. 그러면 작업 사본 자체가 설치된 패키지가 되어, 수정 사항이 재설치 없이 반영됩니다:</desc>
