<title id="t">애니메이션 설정 안내</title>
<desc id="d">애니메이션 설정 안내. 시각적 설명이 있는 설정은 도구 설명에 Animation 컨트롤을 제공합니다. 다음 리소스를 살펴보세요: 설정 애니메이션 갤러리 및 설정 애니메이션 레지스트리.</desc>
