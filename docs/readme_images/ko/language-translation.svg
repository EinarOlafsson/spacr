"13.6" font-weight="400" fill="#6cb6ff">상황별 도움말 정책</tspan><tspan x="192.5" font-size="13.6" font-weight="300" fill="#c9d1d9"> 문서를 참조하세요.</tspan></text><path d="M342 26l8-8M343.5 18h6.5v6.5" fill="none" stroke="#2ec4b6" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
