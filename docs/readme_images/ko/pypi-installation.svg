<title id="t">PyPI 설치</title>
<desc id="d">PyPI 설치. PyPI 릴리스는 Conda 환경 안에서 pip로 spaCR를 설치하세요. Python 3.12에서 선택 가능한 과학 패키지의 범위가 가장 넓습니다:</desc>
