- generated: language-picker
- h1: spaCR
- p: '**Rýmisbundin svipgerðargreining á CRISPR-skimunum.**'
- p: spaCR aðgreinir og mælir stakar frumur í smásjármyndum, samþættir svipgerðir
    einstakra viðfanga við magn leiðarsameinda sem fæst úr raðgreiningu og metur
    hvaða gen tengjast svipgerðarbreytingum. Út frá plötumyndum og FASTQ-röðum býr
    það til mælingar fyrir hvert viðfang, þjálfaða flokkara, áhrifamat fyrir hverja
    leiðarsameind og hvert gen og forgangsraðaðan lista yfir niðurstöður.
- p: Segmingu, mæling, notkun og flokksmiðju mótmælur virkar einnig án sekkunararms.
- p: Make Masks leiðréttir skiptingargrímur og merkir sjálfstæða rétthyrninga með
    flokkamerkjum með **Box** verkfærinu fyrir YOLO-útflutning. Rammarnir halda eigin
    merkjum og sögu án þess að breyta upprunamyndum eða grímum.
- p: Hvert verkfæri er útskýrt í `eiginleikahandbókinni <docs/source/features.rst>`_.
- p: Myndir, grímur og myndúrklippur eru skrár á diski. Mælingar, merkingar og spár
    líkana eru töflur í SQLite-gagnagrunni verkefnisins, ``measurements.db``.
- p: Keyrist sem skjáborðsforrit eða án grafísks viðmóts á vinnustöð, þjóni eða reikniklasa.
- h2: Prófa spaCR
- code: |-
    conda create -n spacr python=3.12 -y
    conda activate spacr
    python -m pip install spacr
    spacr
  lang: bash
- p: Notaðu **Hlaða prófunargögnum…** í Import, Make Masks, Annotate eða á greiningarskjá
    til að sækja sýnigögn. Notaðu ``spacr-download`` í skipanalínu.
- h2: Hardware aðstoð
- generated: hardware
- p: CPU execution is supported and can be slower. In one measurement on an Intel iMac (Core
    i5-10500, AMD Radeon Pro 5300 4 GB), Cellpose-SAM took 444.5 s on the CPU and 3.2 s on
    Metal for one 256×256 image, using torch 2.2.2, Python 3.12.11 and macOS 26.5.2. This is a
    historical example, not a speed guarantee. GPU acceleration requires a usable backend and
    compatible libraries. See the `recorded hardware measurement
    <features/new/319_use_non_nvidia_accelerators_where_they_exist.txt>`_.
- h2: Setja upp spaCR
- p: 'Veldu uppsetningarleið:'
- list:
  - '**Skjáborðsforrit**: uppsetningarforrit fyrir Linux, macOS eða Windows með eigið
    Python.'
  - '**pip**: ``python -m pip install spacr`` í Conda-umhverfi.'
  - '**conda-forge**: ``conda install conda-forge::spacr`` í Conda-umhverfi.'
  - '**Docker**: skipanalínuvinnslurnar í Linux-gámi, úr CPU-myndinni eða myndinni
    fyrir NVIDIA-skjákort:'
- code: |-
    docker run --rm ghcr.io/einarolafsson/spacr:1.5.1.4 spacr-run --list
    docker run --rm --gpus all ghcr.io/einarolafsson/spacr:1.5.1.4-cuda12.4 spacr-run --list
  lang: bash
- p: '`Docker-leiðbeiningarnar <docs/source/installer_guide.rst#container-images>`_
    fjalla um uppsetningu skjákorts, tengingu gagnamappa og skipanir fyrir vinnslurnar.'
- h3: Skjáborðsforrit
- p: Þessir uppbyggingar búnir eigin Python. Conda er ekki nauðsynlegt.
- generated: installer-links
- p: 'Í Linux skaltu gera skrána sem var sótt keyranlega og keyra hana:'
- code: |-
    chmod +x SpaCR-*-Linux-x86_64-Online.run
    ./SpaCR-*-Linux-x86_64-Online.run
  lang: bash
- p: Á macOS, opna ``.pkg``. Núverandi beta er ekki notarið; ef Gatekeeper blokkir
    það, velja **System Settings → Privacy & Security → Open Anyway**.
- p: Sjá `uppsetningarleiðbeiningarnar <docs/source/installer_guide.rst>`_ fyrir
    leiðbeiningar um uppfærslu, fjarlægingu, notkun án nettengingar og bilanagreiningu.
    Í `kerfiskröfunum <docs/source/system_requirements.rst>`_ eru ráðleggingar um
    vinnustöðvar og netþjóna og töflur um GPU-samhæfi.
- h3: Uppsetning frá PyPI
- p: 'Fyrir útgáfuna á PyPI skaltu setja spaCR upp með pip inni í Conda-umhverfi.
    Python 3.12 býður upp á mesta úrvalið af valfrjálsum vísindapökkum:'
- code: |-
    conda create -n spacr python=3.12 -y
    conda activate spacr
    python -m pip install --upgrade pip
    python -m pip install spacr
    spacr
  lang: bash
- p: spaCR styður Python **3.9 til 3.14**, nema Python 3.14.1, sem torchvision útilokar.
    Mælt er með Linux fyrir þyngstu CUDA- og ROCm-verkflæðin; macOS og Windows eru
    einnig studd og nýta bæði GPU sín — macOS í gegnum Metal, sem nær yfir Apple
    Silicon og AMD-kortin í Intel-Mac-tölvum, og Windows í gegnum CUDA eða DirectML.
- p: 'Hefðbundin uppsetning inniheldur Qt-skjáborðsviðmótið. Á þjóni, reikniklasa
    eða CI-keyrsluumhverfi má keyra skipanalínuverkflæðin án þess að opna það:'
- code: |-
    python -m pip install spacr
    spacr-run --list
  lang: bash
- p: Opinlegri samsetningar eru settar sérstakt, t.d. ``spacr[zarr]``, ``spacr[omero]``,``spacr[napari]``
    og ``spacr[czi,nd2,lif]``. Sjá `Uppsetningu leiðbeiningar <docs/source/installer_guide.rst>`_
    fyrir fullkomna útgáfur og Python-version samskipti tól.
- h3: Uppsetning með conda-forge
- p: 'Opinberi conda-forge-pakkinn setur spaCR og nauðsynlegar einingar skjáborðsforritsins
    upp í virka umhverfinu:'
- code: |-
    conda create -n spacr python=3.12 -y
    conda activate spacr
    conda install conda-forge::spacr
    spacr
  lang: bash
- h3: Uppsetning frá frumkóða
- p: 'Klónaðu kóðasafnið og settu það upp í breytanlegum ham, svo að vinnueintakið
    þitt *sé* uppsetti pakkinn og breytingar taki gildi án enduruppsetningar::'
- code: |-
    git clone https://github.com/EinarOlafsson/spacr.git
    cd spacr
    conda create -n spacr python=3.12 -y
    conda activate spacr
    pip install -e .
    spacr
  lang: bash
- p: 'Þetta klónar ``main``, sjálfgefnu greinina, sem geymir nýjustu útgáfuna. Þróunin
    fer fram á ``nightly``; bættu ``--branch nightly`` við til að klóna hana í staðinn.
    Fyrir tiltekna útgáfu::'
- code: git clone --branch v1.5.0.5 https://github.com/EinarOlafsson/spacr.git
  lang: bash
- p: 'Til að sækja síðari breytingar skaltu keyra inni í klóninu::'
- code: |-
    git pull
    pip install -e .
  lang: bash
- p: Settu upp aftur þegar háðir pakkar eða inngangspunktar breytast. Breytingar
    á Python-kóða taka gildi beint; ``spacr-doctor`` sýnir hvaða uppsetning er virk.
- h3: Uppsetning frá frumkóða (létt)
- p: 'Þátttakendur þurfa útgáfusöguna; veldu einn af kostunum hér fyrir neðan ef
    þú vilt aðeins keyra spaCR. Mælingar á ``nightly`` við ``05302fd5c`` þann 2026-10-07
    með ``packaging/measure_clone_forms.sh``::'
- code: |-
    # One commit instead of every version: 2048 MB downloaded, 140 s.
    # No history, so no git log, no git blame and no git bisect.
    # git pull still works, but stays shallow until git fetch --unshallow.
    git clone --depth 1 --branch nightly https://github.com/EinarOlafsson/spacr.git
    cd spacr && pip install -e .

    # Runtime files: 104 MB on disk, 6 s (Git: 38 MB; files: 66 MB).
    # No history, docs, tests, tools, features or example data.
    # --with-docs, --with-tests and --with-translations put those back;
    # --dir, --branch, --no-install and --help do the obvious things.
    # packaging/source_install_excludes.txt lists every skipped path.
    curl -fsSL https://raw.githubusercontent.com/EinarOlafsson/spacr/nightly/packaging/install_from_source.sh -o install_spacr.sh
    sh install_spacr.sh --branch nightly
  lang: bash
- p: 'Full klónun nightly sótti 9.25 GiB. Að bæta ``--filter=blob:none`` við grunna
    klónið minnkar ekki vinnueintakið: Git-hlutasafnið tekur enn 2032 MB. Git tilkynnir
    ekki um hluti sem eru sóttir síðar eftir þörfum, svo heildarniðurhal var ekki
    mælt. Útgáfustýrðu skrárnar í nightly taka 4657 MB í vinnueintakinu (mælt 2026-10-15),
    án Git-sögunnar. Stærð og tími niðurhals eru mismunandi eftir grein.'
- h2: Skipanalínuskipanir
- code: |-
    spacr                                      # launch the Qt application
    spacr-doctor                               # diagnose the installation
    spacr-run --list                           # list headless modules
    spacr-run --describe MODULE                # inspect a module contract
    spacr-run MODULE --settings settings.csv   # execute a module
    spacr-run validate --module MODULE \
        --settings settings.csv                # validate before running
    spacr-repro RUN_DIR                        # replay a recorded run
    spacr-download --list                      # what example data exists
    spacr-download measure annotate            # fetch example sets by name
    spacr-make-masks --folder DIR              # curate masks as a resumable queue
    spacr-make-masks --folder DIR --order easy --limit 50
  lang: bash
- p: '``spacr-run --list`` listar einingar sem hafa skipanalínuinngang til keyrslu
    án grafísks viðmóts. Einingum fyrir merkingu, gagnayfirferð, samanburð og könnun
    sem eingöngu eru í GUI er sleppt.'
- h3: Kjarnaverkflæði
- p: 'Aðalvinnuflæðið samanstendur af sex einingum:'
- list:
  - '**Mask** hlutgreinir frumur, frumukjarna, sýkla og frumulíffæri með Cellpose.'
  - '**Measure** skrifar lögunar-, styrkleika-, áferðar-, rúm- og samstaðsetningareiginleika
    ásamt myndúrklippum viðfanga í SQLite.'
  - '**Annotate** merkir myndúrklippur í lyklaborðsstýrðu hnitaneti og styður biðraðir
    virks náms.'
  - '**Classify** þjálfar líkön byggð á myndum eða mælingum og skráir frammistöðu
    á fráteknum gögnum með hverjum varðpunkti.'
  - '**Map Barcodes** varpar FASTQ-lestrum á brunna og gRNA og veitir gæðamat fyrir
    magn, árekstra og þekju.'
  - '**Regression** metur áhrif leiðarsameinda, gena, skilyrða og viðmiða með líkanafjölskyldum
    sem henta samfelldum gildum, hlutföllum og talningum.'
- h3: spaCR-einingar
- generated: workflow
- p: 'Allar einingar sem eiga reit á upphafsskjánum, í sömu röð og þar: fyrst sex
    einingar vinnslukeðjunnar, síðan hinar. Veldu reit til að opna API-síðu einingarinnar.'
- h2: Öll aðrar auðlindir
- list:
  - '`Gagnvirkt kennsluefni <https://einarolafsson.github.io/spacr/tutorials/>`_
    — leiðsögn um verkferla frá uppsetningu til rannsóknar á niðurstöðum skimunar.'
  - '`Python API snemma byrjun <docs/source/python_api.rst>`_ — hlaupa og staðfest
    pipelines frá skriptum, notebooks eða klúster.'
  - '`Leikstjóri <docs/source/features.rst>`_ — hæfileika, fullnægjandi og valfrjáls
    tengsl.'
  - '`Heilluð API reference <https://einarolafsson.github.io/spacr/api/index.html>`_
    — stuðlað innfangspunktur eftir verkefni, með fullkomna mótum tengslum einn hærra.'
  - '`Sjálf tungumál og þýðingu leiðbeining <docs/source/localization.rst>`_ — samskipti
    tungumál, kontext hjálp og vísindaleg útleiðslu.'
- h2: Tungumál og þýðingar
- p: Viðmótið styður tíu tungumál í leiðsögn og stillingum. AI- og LIVE-stýringar,
    lýsingar á einingum og yfirfarin samhengishjálp eru einnig þýdd. Skiptu um tungumál
    undir **spaCR → Stillingar → Tungumál** án endurræsingar. Annálar, slóðir, gagnagrunnsgildi
    og mælingar eru aldrei þýdd; vísindaleg úttök haldast á viðurkenndri ensku. Sjá
    `stefnu um samhengishjálp <docs/source/localization.rst#contextual-help>`_.
- p: Nín ekki Engleska sögu eru stutt og tæknilegt endurskoðað í stað þess að lesa
    end til end af heimilum tala. `Sjáðu skammt <docs/i18n/REVIEW_SCOPE_2026-09-04.md>`_
    skrá sem tungumálir hafa haft mannleg útgang og hvert orð eftir á Englesku eftir
    ákvörðun.
- h2: Hreyfimyndaleiðbeiningar fyrir stillingar
- p: Stillingar með sjónræna skýringu bjóða upp á **Animation**-stýringu í verkfæraábendingunni.
    Skoðaðu `myndasafn stillingahreyfimynda <https://einarolafsson.github.io/spacr/setting_animations.html>`_
    eða `skrá stillingahreyfimynda <https://einarolafsson.github.io/spacr/api/spacr/setting_animations/index.html>`_.
