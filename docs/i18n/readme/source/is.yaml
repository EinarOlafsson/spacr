- h2: Líkanasafn
- p: 'spaCR inniheldur skrá yfir þjálfuð líkön og sækir þau eftir þörfum. Opnaðu **Model Zoo**
    á upphafsskjánum til að skoða og setja upp líkön, eða tilgreindu líkanalykil í stillingaskrá,
    til dæmis ``pathogen_model: toxoplasma_pv_v1``. Líkanið er sótt og staðfest með gátsummu
    þegar fyrst er þörf á því. Hver birt færsla hefur SHA-256-gátsummu. Færslu án gátsummu
    er hafnað, þar sem annars væri ekki hægt að greina ófullkomna eða útskipta líkanaskrá
    frá upprunalegu skránni.'
- generated: model-zoo
- h3: Greining á afköstum
- p: 'Búðu til vélbúnaðarskýrslu og hengdu hana við mál um afköst::'
- code: python tools/spacr_hardware_report.py
  lang: bash
- p: Vistar í ``~/.spacr/reports`` og prentar slóðina. ``--quick`` sleppir lengri afkastaprófunum;
    ``--out PATH`` tilgreinir vistunarstað.
- p: Les engin verkefnisgögn. Mælir tímann sem innflutningur, töluleg söfn, gerð
    glugga og hreyfimyndir taka og greinir frá x86_64-hermun á Apple Silicon og BLAS-útfærslu
    NumPy.
- h3: Yfirlit yfir skipanalínu
- p: Allar skipanirnar hér fyrir neðan eru settar upp með ``pip install spacr`` og styðja
    ``--help``.
- h2: Ræsa forritið
- code: |-
    spacr              # the desktop application
    spacr-nav
    spacr-navigator
    spacr-tutorial     # the interactive tutorial library
    spacr-server       # no first-run setup screen, for unattended launches
  lang: bash
- h2: Þegar spaCR ræsist ekki
- code: |-
    spacr-doctor       # diagnose the installation and say how to fix it
    safespacr          # the least spaCR that can still change a setting
  lang: bash
- p: '``spacr-doctor`` prentar eina línu fyrir hverja athugun, með skipun til að
    keyra fyrir hverja bilun. Það segir einnig hvaða ``spacr`` er á slóðinni.'
- p: '``safespacr`` les hverja stillingu sem sjálfgefið gildi hennar og slekkur á
    bakgrunni, hreyfimyndum, ítarlegri skráningu og forhleðslu. Notaðu það þegar
    vistuð stilling kemur í veg fyrir að forritið ræsist. Stillingar sem vistaðar
    eru í öruggum ham eru skrifaðar eins og venjulega og haldast.'
- h2: Keyra einingar án grafísks viðmóts
- p: Án Qt og skjás — fyrir reikniklasa, netþjóna og CI.
- code: |-
    spacr-run --list                              # modules with a headless entry
    spacr-run --describe MODULE                   # what a module consumes and produces
    spacr-run validate --module MODULE \
        --settings settings.csv                   # check settings before spending the run
    spacr-run MODULE --settings settings.csv      # execute
    spacr-remote --help                           # submit and monitor SSH, Slurm or cloud jobs
  lang: bash
- p: '``validate`` les sömu stillingar og keyrslan myndi lesa og telur upp hvert
    vandamál, til dæmis stillingu sem vantar eða slóð sem er ekki til, ásamt lagfæringu.'
- h2: Skoða keyrslu
- p: Hver keyrsla er skráð í ``~/.spacr/runs`` með stillingum, tætigildum inntaksgagna, úttökum,
    viðvörunum, útgáfum og upphafsgildum slembitalna.
- code: |-
    spacr-repro RUN_DIR        # replay a recorded run from its journal
    spacr-workspace RUN_DIR    # what that run had open: databases, montages, views
  lang: bash
- h2: Yfirfara gögn og uppsetningu
- code: |-
    spacr-db-audit DB      # SQLite health, integrity, locking, reader/writer probe
    spacr-leakage          # classifier train/test leakage audit
    spacr-plugins          # installed plugin registry and failure diagnostics
  lang: bash
- h2: Umhverfi
- code: 'SPACR_LOG_LEVEL=DEBUG spacr      # verbose logging for one launch'
  lang: bash
- p: Annálar með reglulegri skráaskiptingu eru skrifaðir í ``~/.spacr/logs/spacr.log``. Láttu
    þá skrá fylgja villutilkynningu.
- h2: Framlög og aðstoð
- p: Sendu villutilkynningar og afmarkaðar óskir um eiginleika í gegnum `GitHub-mál
    <https://github.com/EinarOlafsson/spacr/issues>`_. Þegar bilun er tilkynnt skal
    tilgreina útgáfu spaCR, stýrikerfi, útgáfu Python, stillingar einingarinnar og
    viðeigandi hluta úr annálnum. ``spacr-doctor`` safnar flestum þessara upplýsinga;
    láttu vélbúnaðarskýrsluna fylgja þegar tilkynnt er um afkastavandamál.
- h2: Leyfi
- p: "Nýtt frumsamið spaCR-efni er gefið út undir `BSD 3-Clause with additional terms <https://github.com/EinarOlafsson/spacr/blob/nightly/LICENSE>`_. Notkun í viðskiptaskyni krefst sérstaks skriflegs leyfis; hafið samband við `olafsson@med.umich.com <mailto:olafsson@med.umich.com>`_. Eldri leyfisveitingar samkvæmt BSD og leyfi þriðju aðila halda gildi sínu; sjá LICENSE um gildissvið og tilkynningar."
- p: Ef spaCR nýttist við birt verk er tilvísun vel þegin, en hún er ekki skilyrði leyfisins;
    sjá `Tilvísun í spaCR`_ hér fyrir neðan.
- h2: Kennsluefni
- p: '`Gagnvirka spaCR-kennslusafnið <https://einarolafsson.github.io/spacr/tutorials/>`_
    leiðir þig í gegnum uppsetningu og notkun eininganna. Hver kennslustund tilgreinir
    hvaða upplestur og tungumál eru í boði.'
- h2: Tilvísun í spaCR
- p: 'Ef spaCR nýtist við rannsóknina skaltu vitna í:'
- p: Olafsson EB, *et al.* A sameiginlegur myndbönd sem er bastir á CRISPR skrefinn
    skilur EAF1 sem *T. gondii* modulator ESCRT subversion.
