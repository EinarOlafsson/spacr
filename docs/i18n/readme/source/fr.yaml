- h2: Bibliothèque de modèles
- p: 'spaCR inclut un catalogue de modèles entraînés et les télécharge à la demande. Ouvrez
    **Model Zoo** depuis l’écran d’accueil pour les parcourir et les installer, ou indiquez
    une clé dans un fichier de paramètres, par exemple ``pathogen_model: toxoplasma_pv_v1``.
    Le modèle est téléchargé et sa somme de contrôle est vérifiée lors de sa première utilisation.
    Chaque entrée publiée comporte une somme SHA-256. Les entrées qui en sont dépourvues sont
    refusées, car un fichier de modèle incomplet ou remplacé ne pourrait sinon pas être distingué
    de l’original.'
- generated: model-zoo
- h3: Diagnostic des performances
- p: 'Générez un rapport matériel et joignez-le à un ticket relatif aux performances::'
- code: python tools/spacr_hardware_report.py
  lang: bash
- p: Enregistre le rapport dans ``~/.spacr/reports`` et affiche le chemin. ``--quick`` omet
    les tests de performance les plus longs ; ``--out PATH`` définit l’emplacement.
- p: Ne lit aucune donnée du projet. Mesure le temps des imports, des bibliothèques
    numériques, de la construction des fenêtres et des animations, et signale l’émulation
    x86_64 sur Apple Silicon ainsi que l’implémentation BLAS utilisée par NumPy.
- h3: Référence en ligne de commande
- p: Toutes les commandes ci-dessous sont installées par ``pip install spacr`` et acceptent
    ``--help``.
- h2: Lancement de l'application
- code: |-
    spacr              # the desktop application
    spacr-tutorial     # the interactive tutorial library
    spacr-server       # no first-run setup screen, for unattended launches
  lang: bash
- h2: Lorsque spaCR ne démarre pas
- code: |-
    spacr-doctor       # diagnose the installation and say how to fix it
    safespacr          # the least spaCR that can still change a setting
  lang: bash
- p: '``spacr-doctor`` affiche une ligne par vérification, avec une commande à exécuter
    pour chaque échec. Il indique également quel ``spacr`` est sur le chemin.'
- p: '``safespacr`` lit chaque préférence avec sa valeur par défaut et désactive
    l’arrière-plan, les animations, la journalisation détaillée et le préchargement.
    Utilisez-le lorsqu’une préférence enregistrée empêche le démarrage. Les préférences
    enregistrées en mode sans échec sont écrites normalement et sont conservées.'
- h2: Exécuter des modules sans interface graphique
- p: Sans Qt ni affichage — pour les clusters, les serveurs et la CI.
- code: |-
    spacr-run --list                              # modules with a headless entry
    spacr-run --describe MODULE                   # what a module consumes and produces
    spacr-run validate --module MODULE \
        --settings settings.csv                   # check settings before spending the run
    spacr-run MODULE --settings settings.csv      # execute
    spacr-remote --help                           # submit and monitor SSH, Slurm or cloud jobs
  lang: bash
- p: '``validate`` lit les mêmes paramètres que l’exécution et liste chaque problème,
    par exemple un paramètre manquant ou un chemin inexistant, avec une correction.'
- h2: Inspecter une exécution
- p: Chaque exécution est consignée dans ``~/.spacr/runs`` avec ses paramètres, les empreintes
    des entrées, les sorties, les avertissements, les versions et les valeurs d’initialisation
    aléatoire.
- code: |-
    spacr-repro RUN_DIR        # replay a recorded run from its journal
    spacr-workspace RUN_DIR    # what that run had open: databases, montages, views
  lang: bash
- h2: Vérification des données et de l’installation
- code: |-
    spacr-db-audit DB      # SQLite health, integrity, locking, reader/writer probe
    spacr-leakage          # classifier train/test leakage audit
    spacr-plugins          # installed plugin registry and failure diagnostics
  lang: bash
- h2: Environnement
- code: 'SPACR_LOG_LEVEL=DEBUG spacr      # verbose logging for one launch'
  lang: bash
- p: Les journaux avec rotation sont écrits dans ``~/.spacr/logs/spacr.log``. Joignez ce fichier
    à un rapport de bogue.
- h2: Contributions et assistance
- p: Soumettez les rapports de bogues et les demandes de fonctionnalités bien délimitées
    via `GitHub Issues <https://github.com/EinarOlafsson/spacr/issues>`_. Lorsque
    vous signalez un échec, indiquez la version de spaCR, le système d’exploitation,
    la version de Python, les paramètres du module et l’extrait de journal pertinent.
    ``spacr-doctor`` collecte la plupart de ces informations ; joignez le rapport
    matériel lorsque vous signalez un problème de performances.
