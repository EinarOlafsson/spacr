- p: '`← Précédent <docs/source/_static/deck/pages/57.md>`_   `Suivant → <docs/source/_static/deck/pages/02.md>`_'
- generated: language-picker
- h1: spaCR
- p: '**Analyse spatiale des phénotypes de criblages CRISPR.**'
- p: spaCR segmente et mesure les cellules individuelles dans des images de microscopie,
    intègre les phénotypes par objet à l’abondance des guides dérivée du séquençage
    et estime quels gènes sont associés aux changements phénotypiques. À partir d’images
    de plaques et de lectures FASTQ, il produit des mesures par objet, des classificateurs
    entraînés, des estimations d’effet par guide et par gène, ainsi qu’une liste
    de résultats classée.
- p: Les modules de segmentation, de mesure, d’annotation et de classification fonctionnent
    aussi sans composante de séquençage.
- p: Make Masks corrige les masques de segmentation et annote des rectangles indépendants
    avec des étiquettes de classe grâce à l’outil **Box** pour l’export YOLO. Les
    rectangles conservent leurs propres étiquettes et leur historique sans modifier
    les images ni les masques sources.
- p: Chaque outil est décrit dans le `guide des fonctionnalités <docs/source/features.rst>`_.
- p: Les images, masques et vignettes sont des fichiers sur disque. Les mesures,
    annotations et prédictions du modèle sont des tables de la base de données SQLite
    ``measurements.db`` du projet.
- p: Fonctionne comme une application de bureau ou sans interface graphique sur un
    poste de travail, un serveur ou un cluster.
- h2: Essayer spaCR
- code: |-
    conda create -n spacr python=3.12 -y
    conda activate spacr
    python -m pip install spacr
    spacr
  lang: bash
- h2: Support matériel
- generated: hardware
  details:
  - 'Auto: True 3D dans Make Masks essaie les backends disponibles dans cet ordre : Linux
    : Vulkan → OpenGL → CPU ; Windows : Vulkan → Direct3D 12 → OpenGL → CPU ; macOS : Metal
    → Vulkan → OpenGL → CPU. Vulkan, Metal et Direct3D 12 utilisent wgpu. Si un backend GPU
    échoue ou est indisponible, le suivant est essayé ; le rendu sur CPU reste disponible.'
  - wgpu est installé par défaut avec Python 3.10 ou ultérieur sous Windows (x64, ARM64),
    macOS (Intel, Apple silicon) et Linux (x86-64, ARM64, glibc 2.28 ou ultérieure). Python
    3.9, les autres processeurs, Linux avec une ancienne glibc et les installations sans wgpu
    utilisent OpenGL, puis le CPU. Les cellules 3D violettes indiquent un support GPU implémenté,
    en attente de validation sur un véritable écran.
  - L’exécution sur CPU est prise en charge et peut être plus lente. Lors d’une mesure sur
    un Intel iMac (Core i5-10500, AMD Radeon Pro 5300 4 GB), Cellpose-SAM a pris 444.5 s sur
    CPU et 3.2 s avec Metal pour une image de 256×256, avec torch 2.2.2, Python 3.12.11 et
    macOS 26.5.2. Il s’agit d’un exemple historique, pas d’une garantie de vitesse. L’accélération
    GPU nécessite un backend utilisable et des bibliothèques compatibles. Consultez la `mesure
    matérielle enregistrée <features/new/319_use_non_nvidia_accelerators_where_they_exist.txt>`_.
- h2: Installer spaCR
- p: 'Choisissez une méthode d’installation :'
- list:
  - '**Application de bureau** : un installateur pour Linux, macOS ou Windows avec
    son propre Python.'
  - '**pip** : ``python -m pip install spacr`` dans un environnement Conda.'
  - '**conda-forge** : ``conda install conda-forge::spacr`` dans un environnement
    Conda.'
  - '**Docker** : les pipelines en ligne de commande dans un conteneur Linux, avec
    l’image CPU ou l’image pour GPU NVIDIA :'
- code: |-
    docker run --rm ghcr.io/einarolafsson/spacr:1.5.1.5 spacr-run --list
    docker run --rm --gpus all ghcr.io/einarolafsson/spacr:1.5.1.5-cuda12.4 spacr-run --list
  lang: bash
- p: Le `guide Docker (nightly, en anglais) <https://github.com/EinarOlafsson/spacr/blob/nightly/docs/source/installer_guide.rst#container-images>`_
    décrit la configuration du GPU, le montage des données et les commandes des pipelines.
- h3: Application de bureau
- p: Les programmes d’installation incluent leur propre environnement Python. Conda n’est
    pas nécessaire.
- generated: installer-links
- p: 'Sous Linux, rendez le fichier téléchargé exécutable, puis exécutez-le :'
- code: |-
    chmod +x SpaCR-*-Linux-x86_64-Online.run
    ./SpaCR-*-Linux-x86_64-Online.run
  lang: bash
- p: Sur macOS, ouvrez le fichier ``.pkg``. La version bêta actuelle n’est pas notariée. Si
    Gatekeeper la bloque, choisissez **Réglages Système → Confidentialité et sécurité → Ouvrir
    quand même**.
- p: Pour les instructions d’installation, de mise à jour, de réinstallation, de
    désinstallation, d’utilisation hors ligne et de dépannage, consultez le `guide
    d’installation actuel de nightly (en anglais) <https://github.com/EinarOlafsson/spacr/blob/nightly/docs/source/installer_guide.rst>`_.
    Consultez la `configuration requise <docs/source/system_requirements.rst>`_ pour
    les recommandations concernant les stations de travail et les serveurs ainsi
    que les tableaux de compatibilité GPU.
- h3: Installation depuis PyPI
- p: 'Pour la version publiée sur PyPI, installez spaCR avec pip dans un environnement
    Conda. Python 3.12 offre le plus grand choix de paquets scientifiques facultatifs
    :'
- code: |-
    conda create -n spacr python=3.12 -y
    conda activate spacr
    python -m pip install --upgrade pip
    python -m pip install spacr
    spacr
  lang: bash
- p: spaCR prend en charge Python **3.9 à 3.14**, à l'exception de Python 3.14.1,
    que torchvision exclut. Linux est recommandé pour les flux de travail CUDA et
    ROCm les plus lourds; macOS et Windows sont également pris en charge, et tous
    deux utilisent leurs GPUs — macOS via Metal, qui couvre Apple Silicon et les
    cartes AMD des Mac Intel, et Windows via CUDA ou DirectML.
- p: 'L’installation standard inclut l’interface de bureau Qt. Sur un serveur, un
    cluster ou un exécuteur CI, lancez les pipelines en ligne de commande sans l’ouvrir
    :'
- code: |-
    python -m pip install spacr
    spacr-run --list
  lang: bash
- p: Les intégrations facultatives s’installent séparément, par exemple ``spacr[zarr]``, ``spacr[omero]``,
    ``spacr[napari]`` et ``spacr[czi,nd2,lif]``. Consultez le `guide d’installation (nightly,
    en anglais) <https://github.com/EinarOlafsson/spacr/blob/nightly/docs/source/installer_guide.rst>`_
    pour la liste complète des extras et le tableau de compatibilité des versions de Python.
- h3: Installation avec conda-forge
- p: 'Le paquet conda-forge officiel installe spaCR et les dépendances de son application
    de bureau dans l’environnement actif :'
- code: |-
    conda create -n spacr python=3.12 -y
    conda activate spacr
    conda install conda-forge::spacr
    spacr
  lang: bash
- h3: Installation depuis les sources
- p: 'Clonez le dépôt et installez-le en mode éditable : votre copie de travail *est*
    alors le paquet installé, et vos modifications prennent effet sans réinstallation::'
- code: |-
    git clone https://github.com/EinarOlafsson/spacr.git
    cd spacr
    conda create -n spacr python=3.12 -y
    conda activate spacr
    pip install -e .
    spacr
  lang: bash
- p: 'Cette commande clone ``main``, la branche par défaut, qui contient la dernière
    version publiée. Le développement se fait sur ``nightly`` ; ajoutez ``--branch
    nightly`` pour cloner cette branche à la place. Pour une version précise::'
- code: git clone --branch v1.5.0.5 https://github.com/EinarOlafsson/spacr.git
  lang: bash
- p: 'Pour récupérer les modifications ultérieures, exécutez depuis le clone::'
- code: |-
    git pull
    pip install -e .
  lang: bash
- p: Réinstallez lorsque les dépendances ou les points d’entrée changent. Les modifications
    du code Python prennent effet directement ; ``spacr-doctor`` identifie l’installation
    active.
- h3: Installation depuis les sources (allégée)
- p: Les contributeurs ont besoin de l’historique des versions ; pour simplement exécuter
    spaCR, choisissez une option ci-dessous. Mesures de ``nightly`` à ``05302fd5c`` le 2026-10-07,
    effectuées avec ``packaging/measure_clone_forms.sh``.
- p: 'Clone superficiel : 2048 MB téléchargés en 140 s. Seul le dernier commit est conservé
    ; l’historique antérieur n’est donc pas accessible à ``git log``, ``git blame`` et ``git
    bisect``. ``git pull`` fonctionne, mais le clone reste superficiel ; ``git fetch --unshallow``
    récupère l’historique complet.'
- code: |-
    git clone --depth 1 --branch nightly https://github.com/EinarOlafsson/spacr.git
    cd spacr && pip install -e .
  lang: bash
- p: 'Fichiers d’exécution uniquement : 104 MB sur disque en 6 s (Git : 38 MB ; fichiers :
    66 MB). L’historique, docs, tests, tools, features, les données d’exemple et les traductions
    étendues de l’interface sont omis. ``--with-docs``, ``--with-tests`` et ``--with-translations``
    conservent respectivement la documentation, les tests et les traductions. Les traductions
    compactes de l’interface restent disponibles.'
- code: |-
    curl -fsSL https://raw.githubusercontent.com/EinarOlafsson/spacr/nightly/packaging/install_from_source.sh -o install_spacr.sh
    sh install_spacr.sh --branch nightly
  lang: bash
- p: '``--dir`` choisit le chemin du clone ; ``--branch`` sélectionne une branche ou une étiquette
    ; ``--no-install`` télécharge sans installer ; ``--help`` affiche les options. ``packaging/source_install_excludes.txt``
    répertorie tous les chemins omis.'
- p: 'Le clone complet de nightly a téléchargé 9.25 GiB. Ajouter ``--filter=blob:none`` au
    clone superficiel ne réduit pas la copie de travail : son magasin d’objets Git pèse encore
    2032 MB. Git ne signale pas les récupérations différées d’objets, aucun total de téléchargement
    n’a donc été mesuré. Les fichiers suivis de main occupent 1265 MB dans la copie de travail
    (mesurés le 2026-10-21), hors historique Git. La taille et la durée du téléchargement
    varient selon la branche.'
- h2: Points d’entrée en ligne de commande
- code: |-
    spacr                                      # launch the Qt application
    spacr-doctor                               # diagnose the installation
    spacr-run --list                           # list headless modules
    spacr-run --describe MODULE                # inspect a module contract
    spacr-run MODULE --settings settings.csv   # execute a module
    spacr-run validate --module MODULE \
        --settings settings.csv                # validate before running
    spacr-repro RUN_DIR                        # replay a recorded run
    spacr-download --list                      # what example data exists
    spacr-download measure annotate            # fetch example sets by name
    spacr-make-masks --folder DIR              # curate masks as a resumable queue
    spacr-make-masks --folder DIR --order easy --limit 50
  lang: bash
- p: '``spacr-run --list`` répertorie les modules dotés de points d’entrée en ligne
    de commande pour une exécution sans interface graphique. Les modules d’annotation,
    de curation, de comparaison et d’exploration disponibles uniquement dans l’interface
    graphique sont omis.'
- h3: Flux de travail principal
- p: 'Le flux de travail principal comprend six modules :'
- list:
  - '**Mask** segmente les cellules, les noyaux, les agents pathogènes et les organites
    avec Cellpose.'
  - '**Measure** enregistre dans SQLite les caractéristiques morphologiques, d’intensité,
    de texture, spatiales et de colocalisation, ainsi que les vignettes des objets.'
  - '**Annotate** annote les vignettes dans une grille pilotée au clavier et prend
    en charge les files d’apprentissage actif.'
  - '**Classify** entraîne des modèles fondés sur les images ou les mesures et enregistre,
    avec chaque checkpoint, les performances sur les données réservées.'
  - '**Map Barcodes** associe les lectures FASTQ aux puits et aux gRNA, avec un contrôle
    qualité de l’abondance, des collisions et de la couverture.'
  - '**Regression** estime les effets des guides, des gènes, des conditions et des
    contrôles avec des familles de modèles adaptées aux réponses continues, fractionnelles
    et de comptage.'
- h3: Modules spaCR
- generated: workflow
- p: 'Tous les modules ayant une tuile sur l’écran d’accueil, dans l’ordre de cet
    écran : d’abord les six modules du pipeline, puis les autres. Sélectionnez une
    tuile pour ouvrir la page API du module.'
