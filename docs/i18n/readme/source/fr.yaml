- list:
  - '`Tutoriels interactifs <https://einarolafsson.github.io/spacr/tutorials/>`_ — parcours
    guidés de l’installation à l’étude des résultats positifs du criblage.'
  - '`Prise en main de l’API Python <docs/source/python_api.rst>`_ — exécuter et valider des
    pipelines à partir de scripts, de notebooks ou d’un cluster.'
  - '`Guide des fonctionnalités <docs/source/features.rst>`_ — capacités, maturité et intégrations
    facultatives.'
  - '`Référence sélectionnée de l’API <https://einarolafsson.github.io/spacr/api/index.html>`_
    — points d’entrée pris en charge, classés par tâche, avec la référence complète des modules
    un niveau plus bas.'
  - '`Guide des langues et de la traduction <docs/source/localization.rst>`_ — langues de
    l’interface, aide contextuelle et politique des résultats scientifiques.'
- h2: Langue et traduction
- p: L’interface prend en charge dix langues dans la navigation et les préférences.
    Les commandes AI et LIVE, les descriptions des modules et l’aide contextuelle
    révisée sont également traduites. Changez de langue sous **spaCR → Préférences
    → Langue** sans redémarrer. Les journaux, chemins, valeurs de base de données
    et mesures ne sont jamais traduits ; les résultats scientifiques restent en anglais
    canonique. Consultez la `politique d’aide contextuelle <docs/source/localization.rst#contextual-help>`_.
- h2: Guide animé des paramètres
- p: Les paramètres accompagnés d’une explication visuelle proposent une commande
    **Animation** dans leur infobulle. Parcourez la `galerie des animations de paramètres
    <https://einarolafsson.github.io/spacr/setting_animations.html>`_ ou le `registre
    des animations de paramètres <https://einarolafsson.github.io/spacr/api/spacr/setting_animations/index.html>`_.
