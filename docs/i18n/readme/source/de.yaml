- generated: language-picker
- h1: spaCR
- p: '**Räumliche Phänotypanalyse von CRISPR-Screens.**'
- p: spaCR segmentiert und vermisst einzelne Zellen in Mikroskopiebildern, integriert
    Phänotypen einzelner Objekte mit sequenzierungsbasierten Guide-Häufigkeiten und
    schätzt, welche Gene mit phänotypischen Veränderungen assoziiert sind. Ausgehend
    von Plattenbildern und FASTQ-Reads erzeugt es Messungen pro Objekt, trainierte
    Klassifikatoren, Effektschätzungen pro Guide und Gen sowie eine Rangliste der
    Treffer.
- p: Die Module für Segmentierung, Messung, Annotation und Klassifizierung können auch ohne
    einen Sequenzierungsteil verwendet werden.
- p: Make Masks korrigiert Segmentierungsmasken und annotiert mit dem Werkzeug **Box**
    unabhängige Rechtecke mit Klassenlabels für den YOLO-Export. Die Rechtecke behalten
    ihre eigenen Labels und ihren Verlauf, ohne Quellbilder oder Masken zu ändern.
- p: Einzelheiten zu jedem Werkzeug stehen im `Funktionsleitfaden <docs/source/features.rst>`_.
- p: Bilder, Masken und Bildausschnitte sind Dateien auf der Festplatte. Messungen,
    Annotationen und Modellvorhersagen sind Tabellen in der SQLite-Datenbank ``measurements.db``
    des Projekts.
- p: Läuft als Desktop-Anwendung oder ohne grafische Oberfläche auf einer Workstation,
    einem Server oder Cluster.
- h2: spaCR ausprobieren
- code: |-
    conda create -n spacr python=3.12 -y
    conda activate spacr
    python -m pip install spacr
    spacr
  lang: bash
- h2: Hardware-Unterstützung
- generated: hardware
  details:
  - 'Auto: True 3D in Make Masks versucht die verfügbaren Backends der Reihe nach: Linux:
    Vulkan → OpenGL → CPU; Windows: Vulkan → Direct3D 12 → OpenGL → CPU; macOS: Metal → Vulkan
    → OpenGL → CPU. Vulkan, Metal und Direct3D 12 verwenden wgpu. Ist ein GPU-Backend nicht
    verfügbar oder schlägt es fehl, folgt das nächste; CPU-Rendering bleibt verfügbar.'
  - wgpu wird standardmäßig mit Python 3.10 oder neuer unter Windows (x64, ARM64), macOS (Intel,
    Apple silicon) und Linux (x86-64, ARM64, glibc 2.28 oder neuer) installiert. Python 3.9,
    andere Prozessoren, Linux mit älterer glibc und Installationen ohne wgpu verwenden OpenGL,
    dann CPU. Die violetten 3D-Zellen kennzeichnen implementierte GPU-Unterstützung, deren
    Abnahme an einem echten Bildschirm noch aussteht.
  - Die Ausführung auf der CPU wird unterstützt und kann langsamer sein. Bei einer Messung
    auf einem Intel iMac (Core i5-10500, AMD Radeon Pro 5300 4 GB) benötigte Cellpose-SAM
    444.5 s auf der CPU und 3.2 s mit Metal für ein Bild mit 256×256 Pixeln, mit torch 2.2.2,
    Python 3.12.11 und macOS 26.5.2. Dies ist ein historisches Beispiel, keine Geschwindigkeitsgarantie.
    GPU-Beschleunigung erfordert ein nutzbares Backend und kompatible Bibliotheken. Siehe
    die `aufgezeichnete Hardwaremessung <features/new/319_use_non_nvidia_accelerators_where_they_exist.txt>`_.
- h2: spaCR installieren
- p: 'Wählen Sie einen Installationsweg:'
- list:
  - '**Desktopanwendung**: ein Installationsprogramm für Linux, macOS oder Windows
    mit eigenem Python.'
  - '**pip**: ``python -m pip install spacr`` in einer Conda-Umgebung.'
  - '**conda-forge**: ``conda install conda-forge::spacr`` in einer Conda-Umgebung.'
  - '**Docker**: die Kommandozeilen-Pipelines in einem Linux-Container, mit dem CPU-Image
    oder dem Image für NVIDIA-GPUs:'
- code: |-
    docker run --rm ghcr.io/einarolafsson/spacr:1.5.1.6 spacr-run --list
    docker run --rm --gpus all ghcr.io/einarolafsson/spacr:1.5.1.6-cuda12.4 spacr-run --list
  lang: bash
- p: Die `Docker-Anleitung (nightly, Englisch) <https://github.com/EinarOlafsson/spacr/blob/nightly/docs/source/installer_guide.rst#container-images>`_
    beschreibt die GPU-Einrichtung, das Einbinden von Daten und die Pipeline-Befehle.
- h3: Desktopanwendung
- p: Die Installationsprogramme enthalten eine eigene Python-Umgebung. Conda ist nicht erforderlich.
- generated: installer-links
- p: 'Machen Sie die heruntergeladene Datei unter Linux ausführbar und führen Sie
    sie aus:'
- code: |-
    chmod +x SpaCR-*-Linux-x86_64-Online.run
    ./SpaCR-*-Linux-x86_64-Online.run
  lang: bash
- p: Öffnen Sie unter macOS die Datei ``.pkg``. Die aktuelle Beta ist nicht notarisiert. Wenn
    Gatekeeper sie blockiert, wählen Sie **Systemeinstellungen → Datenschutz & Sicherheit
    → Dennoch öffnen**.
- p: Anleitungen zur Installation, Aktualisierung, Neuinstallation, Deinstallation,
    zum Offlinebetrieb und zur Fehlerbehebung finden Sie in der `aktuellen Installationsanleitung
    auf nightly (Englisch) <https://github.com/EinarOlafsson/spacr/blob/nightly/docs/source/installer_guide.rst>`_.
    Die `Systemanforderungen <docs/source/system_requirements.rst>`_ enthalten Empfehlungen
    für Arbeitsstationen und Server sowie Tabellen zur GPU-Kompatibilität.
- h3: Installation über PyPI
- p: 'Installieren Sie die PyPI-Veröffentlichung von spaCR mit pip in einer Conda-Umgebung.
    Python 3.12 bietet die größte Auswahl an optionalen wissenschaftlichen Paketen:'
- code: |-
    conda create -n spacr python=3.12 -y
    conda activate spacr
    python -m pip install --upgrade pip
    python -m pip install spacr
    spacr
  lang: bash
- p: spaCR unterstützt Python **3.9 through 3.14**, außer Python 3.14.1, das von
    torchvision ausgeschlossen wird. Linux wird für die anspruchsvollsten CUDA- und
    ROCm-Workflows empfohlen; macOS und Windows werden ebenfalls unterstützt und
    nutzen beide ihre GPUs — macOS über Metal, das Apple Silicon und die AMD-Karten
    in Intel Macs abdeckt, und Windows über CUDA oder DirectML.
- p: 'Die Standardinstallation enthält die Qt-Desktopoberfläche. Auf einem Server,
    Cluster oder CI-Runner können Sie die Befehlszeilen-Pipelines ausführen, ohne
    sie zu öffnen:'
- code: |-
    python -m pip install spacr
    spacr-run --list
  lang: bash
- p: Optionale Integrationen werden separat installiert, zum Beispiel ``spacr[zarr]``, ``spacr[omero]``,
    ``spacr[napari]`` und ``spacr[czi,nd2,lif]``. Die vollständige Liste der Extras und die
    Kompatibilitätstabelle für Python-Versionen finden Sie in der `Installationsanleitung
    (nightly, Englisch) <https://github.com/EinarOlafsson/spacr/blob/nightly/docs/source/installer_guide.rst>`_.
- h3: Installation mit conda-forge
- p: 'Das offizielle conda-forge-Paket installiert spaCR und seine Desktop-Abhängigkeiten
    in der aktiven Umgebung:'
- code: |-
    conda create -n spacr python=3.12 -y
    conda activate spacr
    conda install conda-forge::spacr
    spacr
  lang: bash
- h3: Installation aus dem Quellcode
- p: 'Klonen Sie das Repository und installieren Sie es im editierbaren Modus. Ihre
    Arbeitskopie *ist* dann das installierte Paket, und Änderungen werden ohne Neuinstallation
    wirksam::'
- code: |-
    git clone https://github.com/EinarOlafsson/spacr.git
    cd spacr
    conda create -n spacr python=3.12 -y
    conda activate spacr
    pip install -e .
    spacr
  lang: bash
- p: 'Dieser Befehl klont ``main``, den Standard-Branch mit der neuesten Version.
    Entwickelt wird auf ``nightly``; fügen Sie ``--branch nightly`` hinzu, um stattdessen
    diesen Branch zu klonen. Für eine bestimmte Version::'
- code: git clone --branch v1.5.0.5 https://github.com/EinarOlafsson/spacr.git
  lang: bash
- p: 'Um spätere Änderungen zu übernehmen, führen Sie im Klon aus::'
- code: |-
    git pull
    pip install -e .
  lang: bash
- p: Installieren Sie neu, wenn sich Abhängigkeiten oder Einstiegspunkte ändern.
    Änderungen am Python-Code gelten direkt; ``spacr-doctor`` zeigt die aktive Installation
    an.
- h3: Installation aus dem Quellcode (schlank)
- p: Mitwirkende benötigen die Versionshistorie; um spaCR nur auszuführen, wählen Sie eine
    der folgenden Optionen. Messungen von ``nightly`` bei ``05302fd5c`` am 2026-10-07 mit
    ``packaging/measure_clone_forms.sh``.
- p: 'Flacher Klon: 2048 MB in 140 s heruntergeladen. Nur der neueste Commit bleibt erhalten;
    ältere Historie steht ``git log``, ``git blame`` und ``git bisect`` daher nicht zur Verfügung.
    ``git pull`` funktioniert, der Klon bleibt jedoch flach; ``git fetch --unshallow`` lädt
    die vollständige Historie.'
- code: |-
    git clone --depth 1 --branch nightly https://github.com/EinarOlafsson/spacr.git
    cd spacr && pip install -e .
  lang: bash
- p: 'Nur Laufzeitdateien: 104 MB auf dem Datenträger in 6 s (Git: 38 MB; Dateien: 66 MB).
    Historie, docs, tests, tools, features, Beispieldaten und erweiterte Oberflächenübersetzungen
    werden ausgelassen. ``--with-docs``, ``--with-tests`` und ``--with-translations`` behalten
    die entsprechende Dokumentation, Tests und Übersetzungen bei. Die kompakten Oberflächenübersetzungen
    bleiben verfügbar.'
- code: |-
    curl -fsSL https://raw.githubusercontent.com/EinarOlafsson/spacr/nightly/packaging/install_from_source.sh -o install_spacr.sh
    sh install_spacr.sh --branch nightly
  lang: bash
- p: '``--dir`` wählt den Pfad des Klons; ``--branch`` wählt einen Branch oder Tag; ``--no-install``
    lädt die Dateien ohne Installation; ``--help`` zeigt die Optionen. ``packaging/source_install_excludes.txt``
    führt alle ausgelassenen Pfade auf.'
- p: 'Der vollständige nightly-Klon lud 9.25 GiB herunter. ``--filter=blob:none`` zum flachen
    Klon hinzuzufügen verkleinert das ausgecheckte Arbeitsverzeichnis nicht: Sein Git-Objektspeicher
    umfasst weiterhin 2032 MB. Git meldet bei Bedarf nachgeladene Objekte nicht, daher wurde
    keine Gesamtgröße des Downloads gemessen. Die versionierten Dateien von nightly belegen
    im ausgecheckten Arbeitsverzeichnis 720 MB (gemessen am 2026-10-21), ohne Git-Historie.
    Downloadgröße und Dauer hängen vom Branch ab.'
- h2: Befehle für die Kommandozeile
- code: |-
    spacr                                      # launch the Qt application
    spacr-doctor                               # diagnose the installation
    spacr-run --list                           # list headless modules
    spacr-run --describe MODULE                # inspect a module contract
    spacr-run MODULE --settings settings.csv   # execute a module
    spacr-run validate --module MODULE \
        --settings settings.csv                # validate before running
    spacr-repro RUN_DIR                        # replay a recorded run
    spacr-download --list                      # what example data exists
    spacr-download measure annotate            # fetch example sets by name
    spacr-make-masks --folder DIR              # curate masks as a resumable queue
    spacr-make-masks --folder DIR --order easy --limit 50
  lang: bash
- p: '``spacr-run --list`` listet Module mit Befehlszeileneinstiegspunkten für die
    Ausführung ohne grafische Oberfläche auf. Reine GUI-Module für Annotation, Kuratierung,
    Vergleich und Exploration werden nicht aufgeführt.'
- h3: Kern-Workflow
- p: 'Der primäre Arbeitsablauf umfasst sechs Module:'
- list:
  - '**Mask** segmentiert Zellen, Zellkerne, Pathogene und Organellen mit Cellpose.'
  - '**Measure** schreibt Morphologie-, Intensitäts-, Textur-, räumliche und Kolokalisationsmerkmale
    sowie Objektausschnitte nach SQLite.'
  - '**Annotate** beschriftet Objektausschnitte in einem tastaturgesteuerten Raster
    und unterstützt Active-Learning-Warteschlangen.'
  - '**Classify** trainiert bild- oder messwertbasierte Modelle und speichert mit
    jedem Checkpoint die Leistung auf zurückgehaltenen Daten.'
  - '**Map Barcodes** ordnet FASTQ-Reads Wells und gRNAs zu und liefert QC für Häufigkeit,
    Kollisionen und Abdeckung.'
  - '**Regression** schätzt Guide-, Gen-, Bedingungs- und Kontrolleffekte mit Modellfamilien
    für kontinuierliche Werte, Anteile und Zähldaten.'
- h3: spaCR-Module
- generated: workflow
- p: 'Alle Module mit einer Kachel auf der Startseite, in deren Reihenfolge: zuerst
    die sechs Pipeline-Module, dann die übrigen. Wählen Sie eine Kachel, um die API-Seite
    des Moduls zu öffnen.'
