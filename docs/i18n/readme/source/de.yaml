  - '`Kuratierte API-Referenz <https://einarolafsson.github.io/spacr/api/index.html>`_ — unterstützte
    Einstiegspunkte nach Aufgabe; die vollständige Modulreferenz liegt eine Ebene tiefer.'
  - '`Sprach- und Übersetzungsleitfaden <docs/source/localization.rst>`_ — Oberflächensprachen,
    kontextbezogene Hilfe und Richtlinien für wissenschaftliche Ausgaben.'
- h2: Sprache und Übersetzung
- p: Die Oberfläche unterstützt zehn Sprachen in der Navigation und den Einstellungen.
    AI- und LIVE-Steuerelemente, Modulbeschreibungen und geprüfte Kontexthilfe werden
    ebenfalls übersetzt. Ändern Sie die Sprache unter **spaCR → Einstellungen → Sprache**,
    ohne neu zu starten. Protokolle, Pfade, Datenbankwerte und Messungen werden nie
    übersetzt; wissenschaftliche Ausgaben bleiben im kanonischen Englisch. Siehe
    die `Richtlinie zur Kontexthilfe <docs/source/localization.rst#contextual-help>`_.
- h2: Animierte Einstellungshilfe
- p: Einstellungen mit einer visuellen Erklärung bieten in ihrem Tooltip die Schaltfläche
    **Animation**. Durchsuchen Sie die `Galerie der Einstellungsanimationen <https://einarolafsson.github.io/spacr/setting_animations.html>`_
    oder das `Register der Einstellungsanimationen <https://einarolafsson.github.io/spacr/api/spacr/setting_animations/index.html>`_.
