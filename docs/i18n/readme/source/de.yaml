- h2: Modellzoo
- p: 'spaCR liefert einen Katalog von ausgebildeten Modellen und holt sie auf Anfrage
    ab. Öffnen Sie **Model Zoo** vom Home-Bildschirm, um sie zu durchsuchen und zu
    installieren, oder benennen Sie einen Schlüssel in einer Einstellungsdatei --
    ``pathogen_model: toxoplasma_pv_v1`` -- und das Modell wird heruntergeladen und
    Checksummen-verifiziert, wenn es zum ersten Mal benötigt wird. Jeder veröffentlichte
    Eintrag trägt eine SHA-256; ein Eintrag ohne einen wird abgelehnt, anstatt installiert,
    weil ein verkürzter oder ersetzter Checkpoint nicht vom realen angezeigt werden
    kann.'
- generated: model-zoo
- h3: Leistungsdiagnose
- p: 'Erzeugen Sie einen Hardwarebericht und fügen Sie ihn einem leistungsbezogenen
    GitHub-Issue bei::'
- code: python tools/spacr_hardware_report.py
  lang: bash
- p: Speichert auf ``~/.spacr/reports`` und druckt den Pfad. ``--quick`` überspringt
    die längeren Benchmarks; ``--out PATH`` setzt den Speicherort.
- p: Liest keine Projektdaten. Misst die Dauer von Importen, numerischen Bibliotheksoperationen,
    Fensteraufbau und Animation und meldet x86_64-Emulation auf Apple Silicon sowie
    die BLAS-Implementierung von NumPy.
- h3: Befehlszeilenreferenz
- p: Jeder Befehl unten wird von ``pip install spacr`` installiert. Alle von ihnen
    akzeptieren ``--help``.
- h2: Start der Anwendung
- code: |-
    spacr              # the desktop application
    spacr-tutorial     # the interactive tutorial library
    spacr-server       # no first-run setup screen, for unattended launches
  lang: bash
- h2: Wenn spaCR nicht startet
- code: |-
    spacr-doctor       # diagnose the installation and say how to fix it
    safespacr          # the least spaCR that can still change a setting
  lang: bash
- p: '``spacr-doctor`` gibt pro Prüfung eine Zeile aus, mit einem Befehl, der bei
    jedem Fehler auszuführen ist. Außerdem meldet es, welches ``spacr`` im Pfad liegt.'
- p: '``safespacr`` liest jede Einstellung mit ihrem Standardwert und schaltet Hintergrund,
    Animationen, ausführliche Protokollierung und Vorabladen ab. Verwenden Sie es,
    wenn eine gespeicherte Einstellung den Start verhindert. Im abgesicherten Modus
    gespeicherte Einstellungen werden normal geschrieben und bleiben erhalten.'
- h2: Laufende Module ohne grafische Oberfläche
- p: Kein Qt, kein Display — für Cluster, Server und CI.
- code: |-
    spacr-run --list                              # modules with a headless entry
    spacr-run --describe MODULE                   # what a module consumes and produces
    spacr-run validate --module MODULE \
        --settings settings.csv                   # check settings before spending the run
    spacr-run MODULE --settings settings.csv      # execute
    spacr-remote --help                           # submit and monitor SSH, Slurm or cloud jobs
  lang: bash
- p: '``validate`` liest dieselben Einstellungen wie der Lauf und listet jedes Problem
    auf, etwa eine fehlende Einstellung oder einen nicht vorhandenen Pfad, jeweils
    mit einer Abhilfe.'
- h2: Einen Lauf untersuchen
- p: Jeder Lauf wird mit seinen Einstellungen, Hash-Eingängen, Ausgängen, Warnungen,
    Versionen und Samen auf ``~/.spacr/runs`` tagebucht.
- code: |-
    spacr-repro RUN_DIR        # replay a recorded run from its journal
    spacr-workspace RUN_DIR    # what that run had open: databases, montages, views
  lang: bash
- h2: Prüfungsdaten und Installation
- code: |-
    spacr-db-audit DB      # SQLite health, integrity, locking, reader/writer probe
    spacr-leakage          # classifier train/test leakage audit
    spacr-plugins          # installed plugin registry and failure diagnostics
  lang: bash
- h2: Umgebung
- code: 'SPACR_LOG_LEVEL=DEBUG spacr      # verbose logging for one launch'
  lang: bash
- p: Drehprotokolle werden auf ``~/.spacr/logs/spacr.log`` geschrieben. Fügen Sie
    diese Datei einem Fehlerbericht bei.
- h2: Beiträge und Support
- p: Übermitteln Sie Fehlerberichte und klar abgegrenzte Funktionswünsche über `GitHub
    Issues <https://github.com/EinarOlafsson/spacr/issues>`_. Geben Sie bei einer
    Fehlermeldung die spaCR-Version, das Betriebssystem, die Python-Version, die
    Moduleinstellungen und den relevanten Protokollauszug an. ``spacr-doctor`` erfasst
    den Großteil dieser Angaben; fügen Sie bei Leistungsproblemen den Hardwarebericht
    bei.
- h2: Lizenz
- p: spaCR is released under the `BSD 3-Clause-Lizenz <https://github.com/EinarOlafsson/spacr/blob/main/LICENSE>`_.
- p: Wenn spaCR zu veröffentlichten Arbeiten beigetragen hat, wird ein Zitat geschätzt
    und ist keine Bedingung der Lizenz — siehe `spaCR zitieren`_ unten.
- h2: Tutorials
- p: Die `interaktive spaCR-Tutorialbibliothek <https://einarolafsson.github.io/spacr/tutorials/>`_
    führt durch die Installation und die Verwendung der Module. Verfügbare Vertonungen
    und Sprachen werden für jede Lektion angegeben.
- h2: spaCR zitieren
- p: 'Wenn spaCR zu Ihrer Forschung beiträgt, zitieren Sie:'
- p: Olafsson EB, *et al.* Ein gepoolter Bild-basierter CRISPR Screening identifiziert
    EAF1 als einen *T. gondii* Modulator der ESCRT-Subversion.
- p: '`Vordruck bioRxiv <https://www.biorxiv.org/content/10.64898/2026.07.08.737057v1>`_
    · `Software-Archiv <https://doi.org/10.5281/zenodo.21343316>`_'
- h2: Sonstige Arbeiten unter Angabe von spaCR
- list:
  - '`Metabolische Anpassungsfähigkeit und Nährstoffverschrottung in Toxoplasma gondii:
    Erkenntnisse aus ingestionsweg-defizienten Mutanten. <https://journals.asm.org/doi/full/10.1128/msphere.01011-24>`_'
  - '`IRE1α fördert den Phagosomal-Calcium-Fluss zur Verbesserung der makrophagenfungiziden
    Aktivität. <https://www.cell.com/cell-reports/fulltext/S2211-1247(25)00465-6>`_'
  - '`Toxoplasma GRA8 greift das Wirts-ESCRT-Zubehörprotein ALG-2 auf und ist für
    die metabolische Integrität des Parasiten notwendig. <https://www.biorxiv.org/content/10.64898/2026.07.20.739547v1.abstract>`_'
  - '`Hydrogen sulfide dynamically upregulates copper uptake and localization. <https://www.biorxiv.org/content/10.64898/2026.07.30.741779v1>`_'
  - '`spaCR: Räumliche Phänotypanalyse von CRISPR-Cas9-Bildschirmen (Vordruckversion
    1). <https://www.researchsquare.com/article/rs-7368254/v1>`_'
  marker: citing-papers
- h2: Danksagung
- p: spaCR baut auf offener wissenschaftlicher Software auf, darunter NumPy, pandas,
    scikit-image, scikit-learn, Cellpose, PyTorch und Qt. Die für die mehrsprachige
    Dokumentation und die Oberflächenkataloge verwendeten Modelle sind in der `Attribution
    der Übersetzungsmodelle <docs/i18n/TRANSLATION_MODELS.md>`_ aufgeführt.
