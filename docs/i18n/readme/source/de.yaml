- h2: Modellzoo
- p: 'spaCR enthält einen Katalog trainierter Modelle und lädt sie bei Bedarf herunter. Öffnen
    Sie **Model Zoo** auf der Startseite, um Modelle zu durchsuchen und zu installieren, oder
    geben Sie einen Modellschlüssel in einer Einstellungsdatei an, etwa ``pathogen_model:
    toxoplasma_pv_v1``. Das Modell wird bei der ersten Verwendung heruntergeladen und anhand
    seiner Prüfsumme verifiziert. Jeder veröffentlichte Eintrag enthält eine SHA-256-Prüfsumme.
    Ein Eintrag ohne Prüfsumme wird abgelehnt, da eine unvollständige oder ausgetauschte Checkpoint-Datei
    sonst nicht vom Original unterschieden werden kann.'
- generated: model-zoo
- h3: Leistungsdiagnose
- p: 'Erzeugen Sie einen Hardwarebericht und fügen Sie ihn einem leistungsbezogenen
    GitHub-Issue bei::'
- code: python tools/spacr_hardware_report.py
  lang: bash
- p: Speichert unter ``~/.spacr/reports`` und gibt den Pfad aus. ``--quick`` überspringt die
    längeren Leistungstests; ``--out PATH`` legt den Speicherort fest.
- p: Liest keine Projektdaten. Misst die Dauer von Importen, numerischen Bibliotheksoperationen,
    Fensteraufbau und Animation und meldet x86_64-Emulation auf Apple Silicon sowie
    die BLAS-Implementierung von NumPy.
- h3: Befehlszeilenreferenz
- p: Alle folgenden Befehle werden mit ``pip install spacr`` installiert und unterstützen
    ``--help``.
- h2: Start der Anwendung
- code: |-
    spacr              # the desktop application
    spacr-tutorial     # the interactive tutorial library
    spacr-server       # no first-run setup screen, for unattended launches
  lang: bash
- h2: Wenn spaCR nicht startet
- code: |-
    spacr-doctor       # diagnose the installation and say how to fix it
    safespacr          # the least spaCR that can still change a setting
  lang: bash
- p: '``spacr-doctor`` gibt pro Prüfung eine Zeile aus, mit einem Befehl, der bei
    jedem Fehler auszuführen ist. Außerdem meldet es, welches ``spacr`` im Pfad liegt.'
- p: '``safespacr`` liest jede Einstellung mit ihrem Standardwert und schaltet Hintergrund,
    Animationen, ausführliche Protokollierung und Vorabladen ab. Verwenden Sie es,
    wenn eine gespeicherte Einstellung den Start verhindert. Im abgesicherten Modus
    gespeicherte Einstellungen werden normal geschrieben und bleiben erhalten.'
- h2: Module ohne grafische Oberfläche ausführen
- p: Kein Qt, kein Display — für Cluster, Server und CI.
- code: |-
    spacr-run --list                              # modules with a headless entry
    spacr-run --describe MODULE                   # what a module consumes and produces
    spacr-run validate --module MODULE \
        --settings settings.csv                   # check settings before spending the run
    spacr-run MODULE --settings settings.csv      # execute
    spacr-remote --help                           # submit and monitor SSH, Slurm or cloud jobs
  lang: bash
- p: '``validate`` liest dieselben Einstellungen wie der Lauf und listet jedes Problem
    auf, etwa eine fehlende Einstellung oder einen nicht vorhandenen Pfad, jeweils
    mit einer Abhilfe.'
- h2: Einen Lauf untersuchen
- p: Jeder Lauf wird unter ``~/.spacr/runs`` mit Einstellungen, Hashwerten der Eingaben, Ausgaben,
    Warnungen, Versionen und Zufallsstartwerten protokolliert.
- code: |-
    spacr-repro RUN_DIR        # replay a recorded run from its journal
    spacr-workspace RUN_DIR    # what that run had open: databases, montages, views
  lang: bash
- h2: Daten und Installation prüfen
- code: |-
    spacr-db-audit DB      # SQLite health, integrity, locking, reader/writer probe
    spacr-leakage          # classifier train/test leakage audit
    spacr-plugins          # installed plugin registry and failure diagnostics
  lang: bash
- h2: Umgebung
- code: 'SPACR_LOG_LEVEL=DEBUG spacr      # verbose logging for one launch'
  lang: bash
- p: Rotierende Protokolle werden nach ``~/.spacr/logs/spacr.log`` geschrieben. Fügen Sie
    diese Datei einem Fehlerbericht bei.
- h2: Beiträge und Support
- p: Übermitteln Sie Fehlerberichte und klar abgegrenzte Funktionswünsche über `GitHub
    Issues <https://github.com/EinarOlafsson/spacr/issues>`_. Geben Sie bei einer
    Fehlermeldung die spaCR-Version, das Betriebssystem, die Python-Version, die
    Moduleinstellungen und den relevanten Protokollauszug an. ``spacr-doctor`` erfasst
    den Großteil dieser Angaben; fügen Sie bei Leistungsproblemen den Hardwarebericht
    bei.
- h2: Lizenz
- p: spaCR wird unter der `BSD3-Clause-Lizenz <https://github.com/EinarOlafsson/spacr/blob/main/LICENSE>`_
    veröffentlicht.
- p: Wenn spaCR zu einer Veröffentlichung beigetragen hat, freuen wir uns über eine Quellenangabe.
    Sie ist keine Bedingung der Lizenz; siehe unten unter `spaCR zitieren`_.
- h2: Tutorials
- p: Die `interaktive spaCR-Tutorialbibliothek <https://einarolafsson.github.io/spacr/tutorials/>`_
    führt durch die Installation und die Verwendung der Module. Verfügbare Vertonungen
    und Sprachen werden für jede Lektion angegeben.
