- h2: 模型库
- p: 'spaCR ships a catalogue of trained models and fetches them on demand. Open
    **Model Zoo** from the home screen to browse and install them, or name a key
    in a settings file -- ``pathogen_model: toxoplasma_pv_v1`` -- and the model is
    downloaded and checksum-verified the first time it is needed. Every published
    entry carries a SHA-256; an entry without one is refused rather than installed,
    because a truncated or substituted checkpoint cannot be told from the real one.'
- generated: model-zoo
- h3: 性能诊断
- p: '生成硬件报告并将其附到性能相关问题中::'
- code: python tools/spacr_hardware_report.py
  lang: bash
- p: 节省到 ``~/.spacr/reports`` 并打印路径. ``--quick`` 将更长的基准标志; ``--out PATH`` 设置位置。
- p: 不读取项目数据。测量导入、数值库运算、窗口构建和动画的耗时，并报告 Apple Silicon 上的 x86_64 仿真情况以及 NumPy 使用的 BLAS
    实现。
- h3: 命令线参考
- p: 下面的每个命令都以 ``pip install spacr`` 安装,所有命令都会接受 ``--help``。
- h2: 启动申请
- code: |-
    spacr              # the desktop application
    spacr-tutorial     # the interactive tutorial library
    spacr-server       # no first-run setup screen, for unattended launches
  lang: bash
- h2: 当 spaCR 不开始时
- code: |-
    spacr-doctor       # diagnose the installation and say how to fix it
    safespacr          # the least spaCR that can still change a setting
  lang: bash
- p: '``spacr-doctor`` 每项检查输出一行，并为每个失败项给出一条可运行的命令。它还会报告路径上的是哪个 ``spacr``。'
- p: '``safespacr`` 以默认值读取每项偏好设置，并关闭背景、动画、详细日志和预加载。当已保存的偏好设置导致程序无法启动时使用它。在安全模式下保存的偏好设置会正常写入并保留。'
- h2: 无图形界面发运行模块
- p: 没有 Qt,没有显示器 - 用于集群、服务器和CI。
- code: |-
    spacr-run --list                              # modules with a headless entry
    spacr-run --describe MODULE                   # what a module consumes and produces
    spacr-run validate --module MODULE \
        --settings settings.csv                   # check settings before spending the run
    spacr-run MODULE --settings settings.csv      # execute
    spacr-remote --help                           # submit and monitor SSH, Slurm or cloud jobs
  lang: bash
- p: '``validate`` 读取运行时会读取的同一组设置，并列出每个问题（例如缺少的设置或不存在的路径）及其修复方法。'
- h2: 检查一次运行
- p: 每个运行记录为 ``~/.spacr/runs`` 与其设置,加密输入,输出,警告,版本和种子。
- code: |-
    spacr-repro RUN_DIR        # replay a recorded run from its journal
    spacr-workspace RUN_DIR    # what that run had open: databases, montages, views
  lang: bash
- h2: 数据审计与安装
- code: |-
    spacr-db-audit DB      # SQLite health, integrity, locking, reader/writer probe
    spacr-leakage          # classifier train/test leakage audit
    spacr-plugins          # installed plugin registry and failure diagnostics
  lang: bash
- h2: 环境
- code: 'SPACR_LOG_LEVEL=DEBUG spacr      # verbose logging for one launch'
  lang: bash
- p: 旋转日志写为 ``~/.spacr/logs/spacr.log``. 将此文件添加到错误报告中。
- h2: 贡献与支持
- p: 请通过 `GitHub Issues <https://github.com/EinarOlafsson/spacr/issues>`_ 提交错误报告和范围明确的功能请求。报告故障时，请提供
    spaCR 版本、操作系统、Python 版本、模块设置和相关日志片段。``spacr-doctor`` 会收集其中的大部分信息；报告性能问题时还应附上硬件报告。
- h2: 许可
- p: spaCR is released under the `BSD 3 条款许可证 <https://github.com/EinarOlafsson/spacr/blob/main/LICENSE>`_.
- p: 如果 spaCR 有助于发表作品,则引用被评估,并且不符合许可的条件,请参见下面的 `引用 spaCR`_。
- h2: 教程
- p: '`spaCR 交互式教程库 <https://einarolafsson.github.io/spacr/tutorials/>`_ 提供安装和模块使用的分步教程。每节课程均列出可用的旁白和语言。'
