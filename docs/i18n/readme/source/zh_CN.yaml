- generated: language-picker
- h1: spaCR
- p: '**CRISPR 筛选的空间表型分析。**'
- p: spaCR 对显微镜图像中的单细胞进行分割和测量，将逐对象表型与测序得到的向导 RNA 丰度整合，并估计哪些基因与表型变化相关。以孔板图像和 FASTQ
    读段为输入，它生成逐对象测量值、训练后的分类器、逐向导 RNA 和逐基因效应估计值，以及按优先级排序的命中结果列表。
- p: 分区、测量、标记和分类模块也没有序列手臂运行。
- p: Make Masks 修正分割掩膜，并使用 **Box** 工具标注带类别标签的独立矩形以进行 YOLO 导出。框保留自己的标签和历史记录，不会更改原始图像或掩膜。
- p: 各工具的说明见 `功能指南 <docs/source/features.rst>`_。
- p: 图像、掩膜和裁剪图像块是磁盘上的文件。测量值、标注和模型预测是项目 SQLite 数据库 ``measurements.db`` 中的表。
- p: 可作为桌面应用程序运行，也可在工作站、服务器或集群上以无图形界面方式运行。
- h2: 试用 spaCR
- code: |-
    conda create -n spacr python=3.12 -y
    conda activate spacr
    python -m pip install spacr
    spacr
  lang: bash
- h2: 硬件支持
- generated: hardware
  details:
  - 'Auto: Make Masks 的 True 3D 按以下顺序尝试可用后端：Linux：Vulkan → OpenGL → CPU；Windows：Vulkan → Direct3D
    12 → OpenGL → CPU；macOS：Metal → Vulkan → OpenGL → CPU。Vulkan、Metal 和 Direct3D 12 使用 wgpu。如果
    GPU 后端不可用或失败，则尝试下一个后端；CPU 渲染始终可用。'
  - 在 Windows（x64、ARM64）、macOS（Intel、Apple silicon）和 Linux（x86-64、ARM64、glibc 2.28 或更高版本）上，Python
    3.10 或更高版本默认安装 wgpu。Python 3.9、其他处理器、使用旧版 glibc 的 Linux，以及未安装 wgpu 的环境会先使用 OpenGL，再回退到
    CPU。紫色的 3D 单元格表示已实现 GPU 支持，但仍待真实显示器验收。
  - 支持 CPU 执行，但速度可能较慢。在 Intel iMac（Core i5-10500、AMD Radeon Pro 5300 4 GB）上的一次测量中，使用 torch
    2.2.2、Python 3.12.11 和 macOS 26.5.2 时，Cellpose-SAM 处理一张 256×256 图像在 CPU 上耗时 444.5 s，在
    Metal 上耗时 3.2 s。这是历史示例，并非速度保证。GPU 加速需要可用的后端和兼容的库。请参阅`已记录的硬件测量 <features/new/319_use_non_nvidia_accelerators_where_they_exist.txt>`_。
- h2: 安装 spaCR
- p: 请选择安装方式：
- list:
  - '**桌面应用程序**：适用于 Linux、macOS 或 Windows 的安装程序，自带 Python。'
  - '**pip**：在 Conda 环境中运行 ``python -m pip install spacr``。'
  - '**conda-forge**：在 Conda 环境中运行 ``conda install conda-forge::spacr``。'
  - '**Docker**：在 Linux 容器中运行命令行处理流程，可使用 CPU 镜像或 NVIDIA GPU 镜像：'
- code: |-
    docker run --rm ghcr.io/einarolafsson/spacr:1.5.1.5 spacr-run --list
    docker run --rm --gpus all ghcr.io/einarolafsson/spacr:1.5.1.5-cuda12.4 spacr-run --list
  lang: bash
- p: '`Docker 指南（nightly，英文） <https://github.com/EinarOlafsson/spacr/blob/nightly/docs/source/installer_guide.rst#container-images>`_
    介绍了 GPU 设置、数据挂载和处理流程命令。'
- h3: 桌面应用程序
- p: 安装器包装自己的 Python. Conda 不需要。
- generated: installer-links
- p: 在 Linux 上，将下载的文件设为可执行文件并运行：
- code: |-
    chmod +x SpaCR-*-Linux-x86_64-Online.run
    ./SpaCR-*-Linux-x86_64-Online.run
  lang: bash
- p: 在 macOS 中,打开 ``.pkg``. 目前的 beta 没有通知; 如果 Gatekeeper 阻止它,请选择 **系统设置 → 隐私和安全 →
    打开 无论如何**。
- p: 有关安装、更新、重新安装、卸载、离线使用和故障排查的说明，请参阅 `nightly 分支上的当前安装指南（英文） <https://github.com/EinarOlafsson/spacr/blob/nightly/docs/source/installer_guide.rst>`_。有关工作站和服务器的配置建议以及
    GPU 兼容性表，请参阅 `系统要求 <docs/source/system_requirements.rst>`_。
- h3: 使用 PyPI 安装
- p: 如需使用 PyPI 版本，请在 Conda 环境中通过 pip 安装 spaCR。Python 3.12 可选择的科学计算扩展包最为丰富：
- code: |-
    conda create -n spacr python=3.12 -y
    conda activate spacr
    python -m pip install --upgrade pip
    python -m pip install spacr
    spacr
  lang: bash
- p: spaCR 支持 Python **3.9 through 3.14**，但 Python 3.14.1 除外，torchvision 不包含该版本。最繁重的
    CUDA 和 ROCm 工作流程建议使用 Linux；macOS 和 Windows 也受支持，两者都会使用各自的 GPU — macOS 通过 Metal，它涵盖
    Apple Silicon 和 Intel Mac 中的 AMD 显卡，Windows 则通过 CUDA 或 DirectML。
- p: 标准安装包含 Qt 桌面界面。在服务器、集群或 CI 运行器上，可运行命令行流程而不打开该界面：
- code: |-
    python -m pip install spacr
    spacr-run --list
  lang: bash
- p: 可选集成单独安装,例如 ``spacr[zarr]``、 ``spacr[omero]``、``spacr[napari]`` 和 ``spacr[czi,nd2,lif]``.
    查看完整的附件和 Python 版本兼容性表的 `安装指南（nightly，英文） <https://github.com/EinarOlafsson/spacr/blob/nightly/docs/source/installer_guide.rst>`_。
- h3: 使用 conda-forge 安装
- p: 官方 conda-forge 软件包会将 spaCR 及其桌面应用依赖项安装到当前环境中：
- code: |-
    conda create -n spacr python=3.12 -y
    conda activate spacr
    conda install conda-forge::spacr
    spacr
  lang: bash
- h3: 从源代码安装
- p: '克隆代码仓库并以可编辑模式安装。这样工作副本 *就是* 已安装的软件包，修改无需重新安装即可生效::'
- code: |-
    git clone https://github.com/EinarOlafsson/spacr.git
    cd spacr
    conda create -n spacr python=3.12 -y
    conda activate spacr
    pip install -e .
    spacr
  lang: bash
- p: '这会克隆默认分支 ``main``，即最新的发布版本。开发在 ``nightly`` 分支上进行；如需改为克隆该分支，请添加 ``--branch nightly``。如需克隆特定版本::'
- code: git clone --branch v1.5.0.5 https://github.com/EinarOlafsson/spacr.git
  lang: bash
- p: '之后如需拉取更新，请在克隆目录中运行::'
- code: |-
    git pull
    pip install -e .
  lang: bash
- p: 依赖项或入口点变化时才需重新安装。Python 代码修改会直接生效； ``spacr-doctor`` 可确定当前使用的安装。
- h3: 从源代码安装（精简版）
- p: '贡献者需要版本历史；如果只需运行 spaCR，可选择下列方式。测量于 2026-10-07 对 ``nightly`` 的 ``05302fd5c``
    提交进行，使用 ``packaging/measure_clone_forms.sh``::'
- code: |-
    # One commit instead of every version: 2048 MB downloaded, 140 s.
    # No history, so no git log, no git blame and no git bisect.
    # git pull still works, but stays shallow until git fetch --unshallow.
    git clone --depth 1 --branch nightly https://github.com/EinarOlafsson/spacr.git
    cd spacr && pip install -e .

    # Runtime files: 104 MB on disk, 6 s (Git: 38 MB; files: 66 MB).
    # No history, docs, tests, tools, features or example data.
    # --with-docs, --with-tests and --with-translations put those back;
    # --dir, --branch, --no-install and --help do the obvious things.
    # packaging/source_install_excludes.txt lists every skipped path.
    curl -fsSL https://raw.githubusercontent.com/EinarOlafsson/spacr/nightly/packaging/install_from_source.sh -o install_spacr.sh
    sh install_spacr.sh --branch nightly
  lang: bash
- p: nightly 的完整克隆下载了 9.25 GiB。向浅克隆添加 ``--filter=blob:none`` 不会缩小检出文件：其 Git 对象存储仍占用
    2032 MB。Git 不报告按需延迟获取的对象，因此没有测得下载总量。nightly 的版本控制文件检出后占用 958 MB（2026-10-20 测得），不含
    Git 历史。下载大小和耗时随分支而变化。
- h2: 命令行入口
- code: |-
    spacr                                      # launch the Qt application
    spacr-doctor                               # diagnose the installation
    spacr-run --list                           # list headless modules
    spacr-run --describe MODULE                # inspect a module contract
    spacr-run MODULE --settings settings.csv   # execute a module
    spacr-run validate --module MODULE \
        --settings settings.csv                # validate before running
    spacr-repro RUN_DIR                        # replay a recorded run
    spacr-download --list                      # what example data exists
    spacr-download measure annotate            # fetch example sets by name
    spacr-make-masks --folder DIR              # curate masks as a resumable queue
    spacr-make-masks --folder DIR --order easy --limit 50
  lang: bash
- p: '``spacr-run --list`` 会列出具有无界面命令行入口的模块。仅在 GUI 中提供的标注、数据整理、比较和探索模块不会列出。'
- h3: 核心工作流程
- p: 主要工作流程由六个模块组成：
- list:
  - '**Mask** 使用 Cellpose 分割细胞、细胞核、病原体和细胞器。'
  - '**Measure** 将形态、强度、纹理、空间和共定位特征以及对象图像裁剪写入 SQLite。'
  - '**Annotate** 在键盘驱动的网格中标注图像裁剪，并支持主动学习队列。'
  - '**Classify** 训练基于图像或测量值的模型，并在每个检查点记录留出数据上的性能。'
  - '**Map Barcodes** 将 FASTQ 读段映射到孔位和 gRNA，并提供丰度、碰撞和覆盖度质控。'
  - '**Regression** 使用适合连续值、比例和计数响应的模型族估计向导 RNA、基因、条件和对照效应。'
- h3: spaCR 模块
