- h2: 모델 라이브러리
- p: 'spaCR는 훈련 된 모델의 카탈로그를 배치하고 수요에 따라 그들을 잡습니다. **모델 동물원** 홈 화면에서 탐색하고 설치하거나 설정을
    파일에 키를 지정하십시오 - ``pathogen_model: toxoplasma_pv_v1`` - 그리고 모델이 다운로드되고 처음으로 필요합니다.
    각 게시 된 입력은 SHA-256을 가지고; 하나가없는 입력은 설치되지 않고 거부됩니다, 왜냐하면 흔들리거나 대체 된 체크 포인트가 실제로
    말할 수 없기 때문에.'
- generated: model-zoo
- h3: 성능 진단
- p: '하드웨어 보고서를 생성하여 성능 관련 이슈에 첨부하세요::'
- code: python tools/spacr_hardware_report.py
  lang: bash
- p: '``~/.spacr/reports``로 저장하고 경로를 인쇄합니다. ``--quick``는 더 긴 좌표를 스키; ``--out PATH``는
    위치를 설정합니다.'
- p: 프로젝트 데이터를 읽지 않습니다. 가져오기, 수치 라이브러리, 창 구성 및 애니메이션에 걸리는 시간을 측정하고 Apple Silicon의
    x86_64 에뮬레이션과 NumPy의 BLAS 구현 정보를 보고합니다.
- h3: 명령선 참조
- p: Every command below is installed by ``pip install spacr``. All of them accept
    ``--help``.
- h2: 신청을 시작하는 방법
- code: |-
    spacr              # the desktop application
    spacr-tutorial     # the interactive tutorial library
    spacr-server       # no first-run setup screen, for unattended launches
  lang: bash
- h2: spaCR 시작하지 않을 때
- code: |-
    spacr-doctor       # diagnose the installation and say how to fix it
    safespacr          # the least spaCR that can still change a setting
  lang: bash
- p: '``spacr-doctor``\ 는 검사마다 한 줄을 출력하며, 실패한 항목마다 실행할 명령을 함께 보여 줍니다. 경로에 있는 ``spacr``
    가 어느 것인지도 알려 줍니다.'
- p: '``safespacr``\ 는 모든 환경설정을 기본값으로 읽고 배경, 애니메이션, 상세 로깅, 미리 불러오기를 끕니다. 저장된 환경설정
    때문에 프로그램이 시작되지 않을 때 사용하세요. 안전 모드에서 저장한 환경설정은 평소처럼 기록되며 유지됩니다.'
- h2: 모듈을 끊임없이 실행하는 방법
- p: Qt 없으며, 클러스터, 서버 및 CI를 위한 디스플레이가 없습니다.
- code: |-
    spacr-run --list                              # modules with a headless entry
    spacr-run --describe MODULE                   # what a module consumes and produces
    spacr-run validate --module MODULE \
        --settings settings.csv                   # check settings before spending the run
    spacr-run MODULE --settings settings.csv      # execute
    spacr-remote --help                           # submit and monitor SSH, Slurm or cloud jobs
  lang: bash
- p: '``validate``\ 는 실행 시 읽을 설정과 같은 설정을 읽고, 누락된 설정이나 존재하지 않는 경로 같은 각 문제를 해결 방법과
    함께 나열합니다.'
- h2: 실행 살펴보기
- p: 각 라운드는 ``~/.spacr/runs``로 기록되며 설정, 해시된 입력, 출력, 경고, 버전 및 씨앗이 있습니다.
- code: |-
    spacr-repro RUN_DIR        # replay a recorded run from its journal
    spacr-workspace RUN_DIR    # what that run had open: databases, montages, views
  lang: bash
- h2: 데이터 검토 및 설치
- code: |-
    spacr-db-audit DB      # SQLite health, integrity, locking, reader/writer probe
    spacr-leakage          # classifier train/test leakage audit
    spacr-plugins          # installed plugin registry and failure diagnostics
  lang: bash
- h2: 환경
- code: 'SPACR_LOG_LEVEL=DEBUG spacr      # verbose logging for one launch'
  lang: bash
- p: 회전 기록은 ``~/.spacr/logs/spacr.log``로 작성됩니다.이 파일을 오류 보고서에 붙여 넣으십시오.
- h2: 기여 및 지원
- p: 버그 보고와 범위가 명확한 기능 요청은 `GitHub Issues <https://github.com/EinarOlafsson/spacr/issues>`_\
    를 통해 제출하세요. 오류를 보고할 때는 spaCR 버전, 운영 체제, Python 버전, 모듈 설정 및 관련 로그 일부를 포함하십시오.
    ``spacr-doctor``\ 가 이 정보의 대부분을 수집합니다. 성능 문제를 보고할 때는 하드웨어 보고서도 포함하십시오.
- h2: 라이선스
- p: spaCR is released under the `BSD 3 클래스 라이센스 <https://github.com/EinarOlafsson/spacr/blob/main/LICENSE>`_.
- p: spaCR이 출판된 작품에 기여한 경우, 인용문이 평가되고 라이센스의 조건이 아닙니다. - 아래의 `spaCR 인용`_을 참조하십시오.
- h2: 튜토리얼
- p: '`spaCR 대화형 튜토리얼 라이브러리 <https://einarolafsson.github.io/spacr/tutorials/>`_는
    설치와 모듈 사용을 단계별로 안내합니다. 각 강의에는 사용 가능한 내레이션과 언어가 표시됩니다.'
- h2: spaCR 인용
- p: 'spaCR가 연구에 기여했다면 다음을 인용해 주세요:'
- p: Olafsson EB, *et al.* 풀드 이미지 기반 CRISPR 스크린은 EAF1을 *T. gondii*\ 의 ESCRT 기능 탈취
    조절 인자로 규명합니다.
- p: '`BioRxiv 프리프린트 <https://www.biorxiv.org/content/10.64898/2026.07.08.737057v1>`_
    · `소프트웨어 아카이브 <https://doi.org/10.5281/zenodo.21343316>`_'
- h2: 다른 작품은 spaCR을 인용합니다.
- list:
  - '`Toxoplasma gondii에서 신진 대사 적응성 및 영양 탐색 : 섭취 경로 결핍 돌연변이의 인식. <https://journals.asm.org/doi/full/10.1128/msphere.01011-24>`_'
  - '`IRE1α는 마크로파지 곰팡이 활동을 향상시키기 위해 파고소마 칼슘 흐름을 촉진합니다. <https://www.cell.com/cell-reports/fulltext/S2211-1247(25)00465-6>`_'
  - '`Toxoplasma GRA8은 호스트 ESCRT 액세서리 단백질 ALG-2를 포함하고 기생충의 신진 대사 무결성을 위해 필요합니다. <https://www.biorxiv.org/content/10.64898/2026.07.20.739547v1.abstract>`_'
  - '`Hydrogen sulfide dynamically upregulates copper uptake and localization. <https://www.biorxiv.org/content/10.64898/2026.07.30.741779v1>`_'
  - '`spaCR: CRISPR-Cas9 스크린의 공간 현상 분석 (프리 프린트 버전 1). <https://www.researchsquare.com/article/rs-7368254/v1>`_'
  marker: citing-papers
- h2: 감사의 말
- p: spaCR는 NumPy, pandas, scikit-image, scikit-learn, Cellpose, PyTorch 및 Qt를 비롯한
    개방형 과학 소프트웨어를 기반으로 합니다. 다국어 문서와 인터페이스 카탈로그 작성에 사용된 모델은 `번역 모델 표기 <docs/i18n/TRANSLATION_MODELS.md>`_
    문서에서 확인할 수 있습니다.
