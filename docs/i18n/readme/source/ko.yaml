- generated: language-picker
- h1: spaCR
- p: '**CRISPR 스크리닝의 공간 표현형 분석.**'
- p: spaCR는 현미경 영상에서 단일 세포를 분할하고 측정하며, 객체별 표현형을 시퀀싱에서 산출한 가이드 풍부도와 통합하고, 어떤 유전자가
    표현형 변화와 연관되는지 추정합니다. 플레이트 영상과 FASTQ 리드에서 시작하여 객체별 측정값, 학습된 분류기, 가이드별·유전자별 효과
    추정치, 우선순위가 지정된 히트 목록을 생성합니다.
- p: 분류, 측정, 기록 및 분류 모듈은 또한 순서 팔없이 실행됩니다.
- p: Make Masks는 분할 마스크를 수정하고 YOLO 내보내기를 위해 **Box** 도구로 클래스 라벨이 있는 독립적인 사각형을 주석 처리합니다.
    박스는 원본 이미지나 마스크를 변경하지 않고 자체 라벨과 편집 이력을 유지합니다.
- p: 각 도구에 대한 설명은 `기능 가이드 <docs/source/features.rst>`_ 문서를 참조하십시오.
- p: 이미지, 마스크, 크롭은 디스크에 있는 파일입니다. 측정값, 주석, 모델 예측은 프로젝트의 SQLite 데이터베이스 ``measurements.db``\
    에 있는 테이블입니다.
- p: 데스크톱 애플리케이션으로 실행되거나 워크스테이션, 서버 또는 클러스터에서 헤드리스로 실행됩니다.
- h2: spaCR 사용해 보기
- code: |-
    conda create -n spacr python=3.12 -y
    conda activate spacr
    python -m pip install spacr
    spacr
  lang: bash
- h2: 하드웨어 지원
- generated: hardware
  details:
  - 'Auto: Make Masks의 True 3D는 사용 가능한 백엔드를 다음 순서로 시도합니다. Linux: Vulkan → OpenGL → CPU; Windows:
    Vulkan → Direct3D 12 → OpenGL → CPU; macOS: Metal → Vulkan → OpenGL → CPU. Vulkan, Metal,
    Direct3D 12는 wgpu를 사용합니다. GPU 백엔드를 사용할 수 없거나 실패하면 다음 백엔드를 시도하며 CPU 렌더링은 계속 사용할 수 있습니다.'
  - Windows(x64, ARM64), macOS(Intel, Apple silicon), Linux(x86-64, ARM64, glibc 2.28 이상)에서
    Python 3.10 이상은 wgpu를 기본으로 설치합니다. Python 3.9, 기타 프로세서, 이전 glibc를 사용하는 Linux 및 wgpu 없이
    설치한 환경은 OpenGL을 사용한 뒤 CPU로 전환합니다. 보라색 3D 셀은 GPU 지원이 구현되었으나 실제 디스플레이에서의 검증이 남아 있음을 뜻합니다.
  - CPU 실행을 지원하며 속도가 느릴 수 있습니다. Intel iMac(Core i5-10500, AMD Radeon Pro 5300 4 GB)에서 torch
    2.2.2, Python 3.12.11, macOS 26.5.2를 사용한 한 측정에서 Cellpose-SAM은 256×256 이미지 한 장에 CPU에서 444.5
    s, Metal에서 3.2 s가 걸렸습니다. 이는 과거의 예이며 속도를 보장하지 않습니다. GPU 가속에는 사용 가능한 백엔드와 호환 라이브러리가 필요합니다.
    `기록된 하드웨어 측정 <features/new/319_use_non_nvidia_accelerators_where_they_exist.txt>`_ 을 참고하세요.
- h2: spaCR 설치
- p: '설치 방법을 선택하세요:'
- list:
  - '**데스크톱 애플리케이션**: 자체 Python이 포함된 Linux, macOS 또는 Windows용 설치 프로그램입니다.'
  - '**pip**: Conda 환경에서 ``python -m pip install spacr`` 명령을 실행합니다.'
  - '**conda-forge**: Conda 환경에서 ``conda install conda-forge::spacr`` 명령을 실행합니다.'
  - '**Docker**: CPU 이미지 또는 NVIDIA GPU 이미지를 사용해 Linux 컨테이너에서 명령줄 파이프라인을 실행합니다:'
- code: |-
    docker run --rm ghcr.io/einarolafsson/spacr:1.5.1.5 spacr-run --list
    docker run --rm --gpus all ghcr.io/einarolafsson/spacr:1.5.1.5-cuda12.4 spacr-run --list
  lang: bash
- p: '`Docker 가이드 (nightly, 영어) <https://github.com/EinarOlafsson/spacr/blob/nightly/docs/source/installer_guide.rst#container-images>`_\
    에서 GPU 설정, 데이터 마운트, 파이프라인 명령을 설명합니다.'
- h3: 데스크톱 애플리케이션
- p: 설치자는 자신의 Python을 묶습니다.Conda는 필요하지 않습니다.
- generated: installer-links
- p: 'Linux에서는 다운로드한 파일에 실행 권한을 부여한 후 실행합니다:'
- code: |-
    chmod +x SpaCR-*-Linux-x86_64-Online.run
    ./SpaCR-*-Linux-x86_64-Online.run
  lang: bash
- p: macOS에서는 ``.pkg``\ 를 여세요. 현재 베타는 공증되지 않았습니다. Gatekeeper가 차단하면 **시스템 설정 → 개인정보
    보호 및 보안 → 그래도 열기**\ 를 선택하세요.
- p: 설치, 업데이트, 재설치, 제거, 오프라인 사용 및 문제 해결 지침은 `nightly 브랜치의 최신 설치 안내서(영어) <https://github.com/EinarOlafsson/spacr/blob/nightly/docs/source/installer_guide.rst>`_\
    를 참조하십시오. 워크스테이션과 서버 권장 사항 및 GPU 호환성 표는 `시스템 요구 사항 <docs/source/system_requirements.rst>`_\
    을 참조하십시오.
- h3: PyPI 설치
- p: 'PyPI 릴리스는 Conda 환경 안에서 pip로 spaCR를 설치하세요. Python 3.12에서 선택 가능한 과학 패키지의 범위가
    가장 넓습니다:'
- code: |-
    conda create -n spacr python=3.12 -y
    conda activate spacr
    python -m pip install --upgrade pip
    python -m pip install spacr
    spacr
  lang: bash
- p: spaCR는 Python **3.9 through 3.14** 버전을 지원하며, torchvision이 제외하는 Python 3.14.1은
    예외입니다. 가장 부하가 큰 CUDA 및 ROCm 워크플로에는 Linux를 권장합니다. macOS와 Windows도 지원되며, 두 플랫폼
    모두 GPU를 사용합니다 — macOS는 Apple Silicon과 Intel Mac의 AMD 카드를 모두 포괄하는 Metal을 통해, Windows는
    CUDA 또는 DirectML을 통해 GPU를 사용합니다.
- p: '표준 설치에는 Qt 데스크톱 인터페이스가 포함됩니다. 서버, 클러스터 또는 CI 실행기에서는 인터페이스를 열지 않고 명령줄 파이프라인을
    실행하세요:'
- code: |-
    python -m pip install spacr
    spacr-run --list
  lang: bash
- p: 선택적 통합 기능은 ``spacr[zarr]``, ``spacr[omero]``, ``spacr[napari]`` 및 ``spacr[czi,nd2,lif]``\
    과 같이 별도로 설치합니다. 전체 추가 기능 목록과 Python 버전 호환성 표는 `설치 안내서 (nightly, 영어) <https://github.com/EinarOlafsson/spacr/blob/nightly/docs/source/installer_guide.rst>`_\
    를 참조하십시오.
- h3: conda-forge 설치
- p: '공식 conda-forge 패키지는 활성 환경에 spaCR 및 데스크톱 실행에 필요한 종속성을 설치합니다:'
- code: |-
    conda create -n spacr python=3.12 -y
    conda activate spacr
    conda install conda-forge::spacr
    spacr
  lang: bash
- h3: 소스 코드에서 설치
- p: '저장소를 클론한 뒤 편집 가능 모드로 설치하십시오. 그러면 작업 사본 *자체가* 설치된 패키지가 되어, 수정 사항이 재설치 없이 반영됩니다::'
- code: |-
    git clone https://github.com/EinarOlafsson/spacr.git
    cd spacr
    conda create -n spacr python=3.12 -y
    conda activate spacr
    pip install -e .
    spacr
  lang: bash
- p: '이 명령은 최신 릴리스가 담긴 기본 브랜치인 ``main`` 브랜치를 클론합니다. 개발은 ``nightly`` 브랜치에서 이루어지며,
    대신 이 브랜치를 클론하려면 ``--branch nightly`` 옵션을 추가하십시오. 특정 릴리스를 클론하려면::'
- code: git clone --branch v1.5.0.5 https://github.com/EinarOlafsson/spacr.git
  lang: bash
- p: '이후 변경 사항을 가져오려면 클론한 디렉터리 안에서 다음을 실행하십시오::'
- code: |-
    git pull
    pip install -e .
  lang: bash
- p: 의존성이나 진입점이 바뀌면 다시 설치하세요. Python 코드 변경은 바로 적용되며, ``spacr-doctor`` 로 현재 사용 중인
    설치를 확인할 수 있습니다.
- h3: 소스 코드에서 설치 (경량)
- p: '기여자는 버전 이력이 필요합니다. spaCR를 실행하기만 하려면 아래 방법 중 하나를 선택하세요. ``packaging/measure_clone_forms.sh``
    를 사용하여 2026-10-07에 ``nightly`` 의 ``05302fd5c`` 커밋을 측정했습니다::'
- code: |-
    # One commit instead of every version: 2048 MB downloaded, 140 s.
    # No history, so no git log, no git blame and no git bisect.
    # git pull still works, but stays shallow until git fetch --unshallow.
    git clone --depth 1 --branch nightly https://github.com/EinarOlafsson/spacr.git
    cd spacr && pip install -e .

    # Runtime files: 104 MB on disk, 6 s (Git: 38 MB; files: 66 MB).
    # No history, docs, tests, tools, features or example data.
    # --with-docs, --with-tests and --with-translations put those back;
    # --dir, --branch, --no-install and --help do the obvious things.
    # packaging/source_install_excludes.txt lists every skipped path.
    curl -fsSL https://raw.githubusercontent.com/EinarOlafsson/spacr/nightly/packaging/install_from_source.sh -o install_spacr.sh
    sh install_spacr.sh --branch nightly
  lang: bash
- p: nightly 전체 클론은 9.25 GiB를 다운로드했습니다. 얕은 클론에 ``--filter=blob:none``\ 을 추가해도 체크아웃
    크기는 줄어들지 않습니다. Git 객체 저장소는 여전히 2032 MB입니다. Git은 필요할 때 나중에 가져오는 객체를 보고하지 않으므로
    전체 다운로드 총량은 측정하지 않았습니다. nightly의 버전 관리 파일을 체크아웃하면 Git 이력을 제외하고 958 MB를 차지합니다(2026-10-20
    측정). 다운로드 크기와 시간은 브랜치에 따라 달라집니다.
- h2: 명령줄 진입점
- code: |-
    spacr                                      # launch the Qt application
    spacr-doctor                               # diagnose the installation
    spacr-run --list                           # list headless modules
    spacr-run --describe MODULE                # inspect a module contract
    spacr-run MODULE --settings settings.csv   # execute a module
    spacr-run validate --module MODULE \
        --settings settings.csv                # validate before running
    spacr-repro RUN_DIR                        # replay a recorded run
    spacr-download --list                      # what example data exists
    spacr-download measure annotate            # fetch example sets by name
    spacr-make-masks --folder DIR              # curate masks as a resumable queue
    spacr-make-masks --folder DIR --order easy --limit 50
  lang: bash
- p: '``spacr-run --list``\ 는 그래픽 인터페이스 없이 실행할 수 있는 명령줄 진입점이 있는 모듈을 나열합니다. GUI에서만
    제공되는 주석, 큐레이션, 비교 및 탐색 모듈은 목록에서 제외됩니다.'
- h3: 핵심 워크플로
- p: '기본 워크플로는 6개 모듈로 구성됩니다:'
- list:
  - '**Mask** Cellpose로 세포, 핵, 병원체 및 세포소기관을 분할합니다.'
  - '**Measure** 형태, 강도, 텍스처, 공간 및 공위치 특성과 객체 크롭을 SQLite에 저장합니다.'
  - '**Annotate** 키보드로 조작하는 격자에서 크롭에 라벨을 지정하고 능동 학습 대기열을 지원합니다.'
  - '**Classify** 이미지 또는 측정값 기반 모델을 학습하고 각 체크포인트에 홀드아웃 데이터 성능을 기록합니다.'
  - '**Map Barcodes** FASTQ 리드를 웰과 gRNA에 매핑하고 풍부도, 충돌 및 커버리지 QC를 제공합니다.'
  - '**Regression** 연속형, 비율형 및 계수형 반응에 적합한 모델 계열로 가이드, 유전자, 조건 및 대조군 효과를 추정합니다.'
- h3: spaCR 모듈
- generated: workflow
- p: 홈 화면에 타일이 있는 모든 모듈을 홈 화면 순서대로 표시합니다. 먼저 여섯 파이프라인 모듈이 나오고 나머지 모듈이 이어집니다. 타일을
    선택하면 해당 모듈의 API 페이지가 열립니다.
- h2: 다른 자원
- list:
  - '`대화형 튜토리얼 <https://einarolafsson.github.io/spacr/tutorials/>`_ — 설치부터 스크리닝 히트
    조사까지 안내하는 작업 흐름.'
  - '`Python API 빠른 시작 <docs/source/python_api.rst>`_ - 스크립트, 노트북 또는 클러스터에서 튜브를 실행하고
    검증합니다.'
  - '`특징 가이드 <docs/source/features.rst>`_ - 능력, 성숙성 및 선택적 통합.'
  - '`정리된 API 참조 <https://einarolafsson.github.io/spacr/api/index.html>`_ - 작업에 따라
    지원되는 입력 포인트, 전체 모듈 참조 1 레벨 더 깊습니다.'
  - '`언어 & 번역 가이드 <docs/source/localization.rst>`_ - 인터페이스 언어, 컨텍스트 지원 및 과학 출력 정책.'
- h2: 언어 및 번역
- p: 인터페이스는 탐색 및 환경 설정에서 10개 언어를 지원합니다. AI 및 LIVE 컨트롤, 모듈 설명과 검토된 상황별 도움말도 번역됩니다.
    다시 시작하지 않고 **spaCR → 환경 설정 → 언어** 메뉴에서 언어를 변경할 수 있습니다. 로그, 경로, 데이터베이스 값과 측정값은
    번역하지 않으며 과학적 출력은 표준 영어로 유지됩니다. `상황별 도움말 정책 <docs/source/localization.rst#contextual-help>`_
    문서를 참조하세요.
- h2: 애니메이션 설정 안내
- p: '시각적 설명이 있는 설정은 도구 설명에 **Animation** 컨트롤을 제공합니다. 다음 리소스를 살펴보세요: `설정 애니메이션 갤러리
    <https://einarolafsson.github.io/spacr/setting_animations.html>`_ 및 `설정 애니메이션
    레지스트리 <https://einarolafsson.github.io/spacr/api/spacr/setting_animations/index.html>`_.'
