- list:
  - '`Tutoriales interactivos <https://einarolafsson.github.io/spacr/tutorials/>`_ — flujos
    de trabajo guiados desde la instalación hasta la investigación de resultados positivos.'
  - '`Inicio rápido de la API de Python <docs/source/python_api.rst>`_ — ejecute y valide
    flujos de procesamiento desde scripts, cuadernos o un clúster.'
  - '`Guía de funciones <docs/source/features.rst>`_ — capacidades, madurez e integraciones
    opcionales.'
  - '`Referencia seleccionada de la API <https://einarolafsson.github.io/spacr/api/index.html>`_
    — puntos de entrada compatibles por tarea, con la referencia completa de los módulos un
    nivel más abajo.'
  - '`Guía de idiomas y traducción <docs/source/localization.rst>`_ — idiomas de la interfaz,
    ayuda contextual y política de resultados científicos.'
- h2: Idioma y traducción
- p: La interfaz admite diez idiomas en la navegación y las preferencias. Los controles
    AI y LIVE, las descripciones de los módulos y la ayuda contextual revisada también
    se traducen. Cambie el idioma en **spaCR → Preferencias → Idioma** sin reiniciar.
    Los registros, las rutas, los valores de la base de datos y las mediciones nunca
    se traducen; los resultados científicos permanecen en inglés canónico. Consulte
    la `política de ayuda contextual <docs/source/localization.rst#contextual-help>`_.
- h2: Guía animada de ajustes
- p: Los ajustes con una explicación visual incluyen un control **Animación** en
    su información emergente. Consulte la `galería de animaciones de ajustes <https://einarolafsson.github.io/spacr/setting_animations.html>`_
    o el `registro de animaciones de ajustes <https://einarolafsson.github.io/spacr/api/spacr/setting_animations/index.html>`_.
