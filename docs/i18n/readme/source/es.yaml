- h2: Biblioteca de modelos
- p: 'spaCR incluye un catálogo de modelos entrenados y los descarga cuando se necesitan.
    Abra **Model Zoo** desde la pantalla de inicio para explorar e instalar modelos, o indique
    una clave en un archivo de configuración, como ``pathogen_model: toxoplasma_pv_v1``. El
    modelo se descarga y se verifica mediante su suma de comprobación la primera vez que se
    necesita. Cada entrada publicada incluye una suma SHA-256. Las entradas sin ella se rechazan,
    ya que, de lo contrario, no se podría distinguir un archivo de modelo incompleto o sustituido
    del original.'
- generated: model-zoo
- h3: Diagnóstico del rendimiento
- p: 'Genere un informe de hardware y adjúntelo a una incidencia relacionada con
    el rendimiento::'
- code: python tools/spacr_hardware_report.py
  lang: bash
- p: Guarda el informe en ``~/.spacr/reports`` y muestra la ruta. ``--quick`` omite las pruebas
    de rendimiento más largas; ``--out PATH`` establece la ubicación.
- p: No lee datos del proyecto. Mide el tiempo de las importaciones, las bibliotecas
    numéricas, la creación de ventanas y la animación, e informa de la emulación
    x86_64 en Apple Silicon y de la implementación de BLAS que usa NumPy.
- h3: Referencia de la línea de órdenes
- p: Cada comando de abajo está instalado por ``pip install spacr``. Todos aceptan
    ``--help``.
- h2: Lanzamiento de la aplicación
- code: |-
    spacr              # the desktop application
    spacr-tutorial     # the interactive tutorial library
    spacr-server       # no first-run setup screen, for unattended launches
  lang: bash
- h2: Cuando spaCR no se inicia
- code: |-
    spacr-doctor       # diagnose the installation and say how to fix it
    safespacr          # the least spaCR that can still change a setting
  lang: bash
- p: '``spacr-doctor`` imprime una línea por comprobación, con un comando para ejecutar
    por cada fallo. También informa qué ``spacr`` está en la ruta.'
- p: '``safespacr`` lee cada preferencia con su valor predeterminado y desactiva
    el fondo, las animaciones, el registro detallado y la precarga. Úselo cuando
    una preferencia guardada impide el inicio. Las preferencias guardadas en modo
    seguro se escriben normalmente y se conservan.'
- h2: Ejecutar módulos sin interfaz gráfica
- p: Sin Qt ni pantalla — para clústeres, servidores y CI.
- code: |-
    spacr-run --list                              # modules with a headless entry
    spacr-run --describe MODULE                   # what a module consumes and produces
    spacr-run validate --module MODULE \
        --settings settings.csv                   # check settings before spending the run
    spacr-run MODULE --settings settings.csv      # execute
    spacr-remote --help                           # submit and monitor SSH, Slurm or cloud jobs
  lang: bash
- p: '``validate`` lee la misma configuración que leería la ejecución y enumera cada
    problema, como un ajuste ausente o una ruta que no existe, junto con una solución.'
- h2: Inspeccionar una ejecución
- p: Cada ejecución se registra en ``~/.spacr/runs`` con su configuración, los hashes de las
    entradas, las salidas, las advertencias, las versiones y las semillas aleatorias.
- code: |-
    spacr-repro RUN_DIR        # replay a recorded run from its journal
    spacr-workspace RUN_DIR    # what that run had open: databases, montages, views
  lang: bash
- h2: Auditar los datos y la instalación
- code: |-
    spacr-db-audit DB      # SQLite health, integrity, locking, reader/writer probe
    spacr-leakage          # classifier train/test leakage audit
    spacr-plugins          # installed plugin registry and failure diagnostics
  lang: bash
- h2: Entorno
- code: 'SPACR_LOG_LEVEL=DEBUG spacr      # verbose logging for one launch'
  lang: bash
- p: Los registros con rotación se guardan en ``~/.spacr/logs/spacr.log``. Adjunte ese archivo
    al informe de errores.
- h2: Contribuciones y soporte
- p: Envíe informes de errores y solicitudes de funciones concretas mediante `GitHub
    Issues <https://github.com/EinarOlafsson/spacr/issues>`_. Al informar de un fallo,
    incluya la versión de spaCR, el sistema operativo, la versión de Python, los
    ajustes del módulo y el fragmento de registro pertinente. ``spacr-doctor`` recopila
    la mayor parte de esta información; incluya el informe de hardware cuando notifique
    problemas de rendimiento.
- h2: Licencia
- p: spaCR se distribuye bajo la `licencia BSD3-Clause <https://github.com/EinarOlafsson/spacr/blob/main/LICENSE>`_.
- p: Si spaCR contribuyó a un trabajo publicado, se agradece una cita, aunque no es una condición
    de la licencia; véase `Citar spaCR`_ más abajo.
- h2: Tutoriales
- p: La `biblioteca de tutoriales interactivos de spaCR <https://einarolafsson.github.io/spacr/tutorials/>`_
    ofrece guías de instalación y uso de los módulos. Cada lección indica la narración
    y los idiomas disponibles.
