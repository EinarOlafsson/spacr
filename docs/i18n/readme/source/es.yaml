- generated: language-picker
- h1: spaCR
- p: '**Análisis espacial del fenotipo en cribados CRISPR.**'
- p: spaCR segmenta y mide células individuales en imágenes de microscopía, integra
    los fenotipos por objeto con la abundancia de guías derivada de la secuenciación
    y estima qué genes están asociados con cambios fenotípicos. A partir de imágenes
    de placas y lecturas FASTQ, produce mediciones por objeto, clasificadores entrenados,
    estimaciones del efecto por guía y por gen y una lista ordenada de resultados.
- p: Los módulos de segmentación, medición, anotación y clasificación también se pueden usar
    sin un componente de secuenciación.
- p: Make Masks corrige máscaras de segmentación y anota rectángulos independientes
    con etiquetas de clase mediante la herramienta **Box** para exportarlos a YOLO.
    Los recuadros conservan sus propias etiquetas e historial sin modificar las imágenes
    ni las máscaras de origen.
- p: Consulte la `guía de funciones <docs/source/features.rst>`_ para conocer cada
    herramienta.
- p: Las imágenes, máscaras y recortes son archivos en disco. Las mediciones, anotaciones
    y predicciones del modelo son tablas de la base de datos SQLite ``measurements.db``
    del proyecto.
- p: Se ejecuta como una aplicación de escritorio o sin interfaz gráfica en una estación
    de trabajo, servidor o clúster.
- h2: Probar spaCR
- code: |-
    conda create -n spacr python=3.12 -y
    conda activate spacr
    python -m pip install spacr
    spacr
  lang: bash
- h2: Soporte de hardware
- generated: hardware
  details:
  - 'Auto: True 3D de Make Masks prueba los backends disponibles en este orden: Linux: Vulkan
    → OpenGL → CPU; Windows: Vulkan → Direct3D 12 → OpenGL → CPU; macOS: Metal → Vulkan →
    OpenGL → CPU. Vulkan, Metal y Direct3D 12 usan wgpu. Si un backend de GPU falla o no está
    disponible, se prueba el siguiente; el renderizado en CPU sigue disponible.'
  - wgpu se instala de forma predeterminada con Python 3.10 o posterior en Windows (x64, ARM64),
    macOS (Intel, Apple silicon) y Linux (x86-64, ARM64, glibc 2.28 o posterior). Python 3.9,
    otros procesadores, Linux con glibc anterior y las instalaciones sin wgpu usan OpenGL
    y después CPU. Las celdas moradas de 3D indican soporte de GPU implementado, pendiente
    de validación en una pantalla real.
  - Se admite la ejecución en CPU, que puede ser más lenta. En una medición en un Intel iMac
    (Core i5-10500, AMD Radeon Pro 5300 4 GB), Cellpose-SAM tardó 444.5 s en CPU y 3.2 s con
    Metal para una imagen de 256×256, con torch 2.2.2, Python 3.12.11 y macOS 26.5.2. Es un
    ejemplo histórico, no una garantía de velocidad. La aceleración por GPU requiere un backend
    utilizable y bibliotecas compatibles. Consulte la `medición de hardware registrada <features/new/319_use_non_nvidia_accelerators_where_they_exist.txt>`_.
- h2: Instalar spaCR
- p: 'Elija una vía de instalación:'
- list:
  - '**Aplicación de escritorio**: un instalador para Linux, macOS o Windows con
    su propio Python.'
  - '**pip**: ``python -m pip install spacr`` en un entorno de Conda.'
  - '**conda-forge**: ``conda install conda-forge::spacr`` en un entorno de Conda.'
  - '**Docker**: los flujos de procesamiento de línea de comandos en un contenedor
    Linux, con la imagen para CPU o la imagen para GPU NVIDIA:'
- code: |-
    docker run --rm ghcr.io/einarolafsson/spacr:1.5.1.5 spacr-run --list
    docker run --rm --gpus all ghcr.io/einarolafsson/spacr:1.5.1.5-cuda12.4 spacr-run --list
  lang: bash
- p: La `guía de Docker (nightly, en inglés) <https://github.com/EinarOlafsson/spacr/blob/nightly/docs/source/installer_guide.rst#container-images>`_
    explica la configuración de la GPU, el montaje de datos y los comandos de los
    flujos de procesamiento.
- h3: Aplicación de escritorio
- p: Los instaladores incluyen su propio entorno de Python. No se necesita Conda.
- generated: installer-links
- p: 'En Linux, marque el archivo descargado como ejecutable y ejecútelo:'
- code: |-
    chmod +x SpaCR-*-Linux-x86_64-Online.run
    ./SpaCR-*-Linux-x86_64-Online.run
  lang: bash
- p: En macOS, abra el archivo ``.pkg``. La beta actual no está notarizada; si Gatekeeper
    la bloquea, seleccione **Ajustes del Sistema → Privacidad y seguridad → Abrir
    igualmente**.
- p: Para obtener instrucciones de instalación, actualización, reinstalación, desinstalación,
    uso sin conexión y solución de problemas, consulte la `guía de instalación actual
    de nightly (en inglés) <https://github.com/EinarOlafsson/spacr/blob/nightly/docs/source/installer_guide.rst>`_.
    Consulte los `requisitos del sistema <docs/source/system_requirements.rst>`_
    para ver recomendaciones sobre estaciones de trabajo y servidores y tablas de
    compatibilidad de GPU.
- h3: Instalación desde PyPI
- p: 'Para la versión de PyPI, instale spaCR con pip dentro de un entorno Conda.
    Python 3.12 ofrece la mayor variedad de paquetes científicos opcionales:'
- code: |-
    conda create -n spacr python=3.12 -y
    conda activate spacr
    python -m pip install --upgrade pip
    python -m pip install spacr
    spacr
  lang: bash
- p: spaCR admite Python **3.9 through 3.14**, salvo Python 3.14.1, que torchvision
    excluye. Se recomienda Linux para los flujos de trabajo CUDA y ROCm más exigentes;
    macOS y Windows también son compatibles, y ambos usan sus GPU — macOS mediante
    Metal, que cubre Apple Silicon y las tarjetas AMD de los Mac con Intel, y Windows
    mediante CUDA o DirectML.
- p: 'La instalación estándar incluye la interfaz de escritorio Qt. En un servidor,
    clúster o ejecutor de CI, ejecute los flujos de trabajo de línea de comandos
    sin abrirla:'
- code: |-
    python -m pip install spacr
    spacr-run --list
  lang: bash
- p: Las integraciones opcionales se instalan por separado, por ejemplo ``spacr[zarr]``, ``spacr[omero]``,
    ``spacr[napari]`` y ``spacr[czi,nd2,lif]``. Consulte la `guía de instalación (nightly,
    en inglés) <https://github.com/EinarOlafsson/spacr/blob/nightly/docs/source/installer_guide.rst>`_
    para ver la lista completa de extras y la tabla de compatibilidad de versiones de Python.
- h3: Instalación con conda-forge
- p: 'El paquete oficial de conda-forge instala spaCR y sus dependencias de escritorio
    en el entorno activo:'
- code: |-
    conda create -n spacr python=3.12 -y
    conda activate spacr
    conda install conda-forge::spacr
    spacr
  lang: bash
- h3: Instalación desde el código fuente
- p: 'Clone el repositorio e instálelo en modo editable, de modo que su copia de
    trabajo *sea* el paquete instalado y los cambios surtan efecto sin reinstalar::'
- code: |-
    git clone https://github.com/EinarOlafsson/spacr.git
    cd spacr
    conda create -n spacr python=3.12 -y
    conda activate spacr
    pip install -e .
    spacr
  lang: bash
- p: 'Así se clona ``main``, la rama predeterminada, que contiene la última versión
    publicada. El desarrollo se hace en ``nightly``; añada ``--branch nightly`` para
    clonar esa rama en su lugar. Para una versión concreta::'
- code: git clone --branch v1.5.0.5 https://github.com/EinarOlafsson/spacr.git
  lang: bash
- p: 'Para incorporar cambios posteriores, ejecute desde dentro del clon::'
- code: |-
    git pull
    pip install -e .
  lang: bash
- p: Reinstale cuando cambien las dependencias o los puntos de entrada. Los cambios
    en el código Python se aplican directamente; ``spacr-doctor`` identifica la instalación
    activa.
- h3: Instalación desde el código fuente (ligera)
- p: Los colaboradores necesitan el historial de versiones; para ejecutar spaCR, elija una
    de las opciones siguientes. Mediciones de ``nightly`` en ``05302fd5c`` el 2026-10-07,
    realizadas con ``packaging/measure_clone_forms.sh``.
- p: 'Clon superficial: 2048 MB descargados en 140 s. Solo se conserva el último commit, por
    lo que ``git log``, ``git blame`` y ``git bisect`` no tienen acceso al historial anterior.
    ``git pull`` funciona, pero el clon sigue siendo superficial; ``git fetch --unshallow``
    obtiene el historial completo.'
- code: |-
    git clone --depth 1 --branch nightly https://github.com/EinarOlafsson/spacr.git
    cd spacr && pip install -e .
  lang: bash
- p: 'Solo archivos de ejecución: 104 MB en disco en 6 s (Git: 38 MB; archivos: 66 MB). Se
    omiten el historial, docs, tests, tools, features, los datos de ejemplo y las traducciones
    ampliadas de la interfaz. ``--with-docs``, ``--with-tests`` y ``--with-translations``
    conservan la documentación, las pruebas y las traducciones correspondientes. Las traducciones
    compactas de la interfaz siguen disponibles.'
- code: |-
    curl -fsSL https://raw.githubusercontent.com/EinarOlafsson/spacr/nightly/packaging/install_from_source.sh -o install_spacr.sh
    sh install_spacr.sh --branch nightly
  lang: bash
- p: '``--dir`` elige la ruta del clon; ``--branch`` selecciona una rama o etiqueta; ``--no-install``
    descarga sin instalar; ``--help`` muestra las opciones. ``packaging/source_install_excludes.txt``
    enumera todas las rutas omitidas.'
- p: 'El clon completo de nightly descargó 9.25 GiB. Añadir ``--filter=blob:none`` al clon
    superficial no reduce la copia de trabajo: su almacén de objetos Git aún ocupa 2032 MB.
    Git no informa de las descargas diferidas de objetos, por lo que no se midió un total
    de descarga. Los archivos versionados de nightly ocupan 720 MB en la copia de trabajo
    (medidos el 2026-10-21), sin el historial de Git. El tamaño y la duración de la descarga
    varían según la rama.'
- h2: Comandos de línea de comandos
- code: |-
    spacr                                      # launch the Qt application
    spacr-doctor                               # diagnose the installation
    spacr-run --list                           # list headless modules
    spacr-run --describe MODULE                # inspect a module contract
    spacr-run MODULE --settings settings.csv   # execute a module
    spacr-run validate --module MODULE \
        --settings settings.csv                # validate before running
    spacr-repro RUN_DIR                        # replay a recorded run
    spacr-download --list                      # what example data exists
    spacr-download measure annotate            # fetch example sets by name
    spacr-make-masks --folder DIR              # curate masks as a resumable queue
    spacr-make-masks --folder DIR --order easy --limit 50
  lang: bash
- p: '``spacr-run --list`` enumera los módulos con puntos de entrada de línea de
    comandos para ejecutarse sin interfaz gráfica. Se omiten los módulos de anotación,
    curación, comparación y exploración disponibles únicamente en la interfaz gráfica.'
- h3: Flujo de trabajo principal
- p: 'El flujo de trabajo principal comprende seis módulos:'
- list:
  - '**Mask** segmenta células, núcleos, patógenos y orgánulos con Cellpose.'
  - '**Measure** guarda en SQLite características morfológicas, de intensidad, textura,
    espaciales y de colocalización, junto con recortes de objetos.'
  - '**Annotate** etiqueta recortes en una cuadrícula controlada con el teclado y
    admite colas de aprendizaje activo.'
  - '**Classify** entrena modelos basados en imágenes o mediciones y registra con
    cada punto de control el rendimiento en los datos reservados.'
  - '**Map Barcodes** asigna las lecturas FASTQ a los pocillos y los gRNA, con controles
    de calidad de abundancia, colisiones y cobertura.'
  - '**Regression** estima los efectos de guías, genes, condiciones y controles con
    familias de modelos adecuadas para respuestas continuas, fraccionarias y de recuento.'
- h3: Módulos de spaCR
- generated: workflow
- p: 'Todos los módulos con una tarjeta en la pantalla de inicio, en el orden de
    esa pantalla: primero los seis módulos de la secuencia de procesamiento y después
    los demás. Seleccione una tarjeta para abrir la página de API del módulo.'
