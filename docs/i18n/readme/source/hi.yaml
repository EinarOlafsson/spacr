- h2: मॉडल लाइब्रेरी
- p: 'spaCR प्रशिक्षित मॉडलों का एक कैटलॉग भेजता है और उन्हें मांग पर पकड़ता है.
    होम स्क्रीन से ब्राउज़ करने और स्थापित करने के लिए **मॉडल Zoo** खोलें, या सेटिंग्स
    फ़ाइल में एक कुंजी नामित करें - ``pathogen_model: toxoplasma_pv_v1`` - और मॉडल
    को डाउनलोड किया जाता है और पहली बार जांच की जाती है. प्रत्येक प्रकाशित प्रविष्टि
    में एक SHA-256 होता है; एक के बिना एक प्रविष्ट को अस्वीकार कर दिया जाता है, बल्कि
    स्थापित किया जा सकता है, क्योंकि एक ट्रिगर या प्रतिस्थापित चेकपॉइंट को वास्तविक
    से नहीं बताया जा सकता।'
- generated: model-zoo
- h3: प्रदर्शन का निदान
- p: 'हार्डवेयर रिपोर्ट बनाएँ और उसे प्रदर्शन-संबंधी इश्यू के साथ संलग्न करें::'
- code: python tools/spacr_hardware_report.py
  lang: bash
- p: '``~/.spacr/reports`` पर बचत करें और मार्ग प्रिंट करें. ``--quick`` लंबे संदर्भ
    संकेतों को स्काइप करता है; ``--out PATH`` स्थान निर्धारित करता है.'
- p: प्रोजेक्ट का कोई डेटा नहीं पढ़ता। इम्पोर्ट, संख्यात्मक लाइब्रेरी, विंडो निर्माण
    और एनीमेशन में लगने वाला समय मापता है, और Apple Silicon पर x86_64 इम्यूलेशन तथा
    NumPy के BLAS कार्यान्वयन की जानकारी देता है।
- h3: कमांड लाइन संदर्भ
- p: नीचे दिए गए प्रत्येक कमांड को ``pip install spacr`` द्वारा स्थापित किया जाता
    है. उनमें से सभी ``--help`` को स्वीकार करते हैं.
- h2: आवेदन शुरू करने के लिए
- code: |-
    spacr              # the desktop application
    spacr-tutorial     # the interactive tutorial library
    spacr-server       # no first-run setup screen, for unattended launches
  lang: bash
- h2: जब spaCR शुरू नहीं होता है
- code: |-
    spacr-doctor       # diagnose the installation and say how to fix it
    safespacr          # the least spaCR that can still change a setting
  lang: bash
- p: '``spacr-doctor`` प्रत्येक जाँच के लिए एक पंक्ति प्रिंट करता है, और प्रत्येक
    विफलता के लिए चलाने का एक कमांड देता है। यह यह भी बताता है कि पथ पर कौन-सा ``spacr``
    है।'
- p: '``safespacr`` हर प्राथमिकता को उसके डिफ़ॉल्ट मान से पढ़ता है और पृष्ठभूमि,
    एनिमेशन, विस्तृत लॉगिंग और प्रीलोडिंग बंद कर देता है। जब कोई सहेजी गई प्राथमिकता
    प्रोग्राम को शुरू होने से रोके, तब इसका उपयोग करें। सुरक्षित मोड में सहेजी गई
    प्राथमिकताएँ सामान्य रूप से लिखी जाती हैं और बनी रहती हैं।'
- h2: मॉड्यूल बेहोश रूप से चलाएं
- p: कोई Qt, कोई डिस्प्ले नहीं - क्लस्टर, सर्वर और सीआई के लिए।
- code: |-
    spacr-run --list                              # modules with a headless entry
    spacr-run --describe MODULE                   # what a module consumes and produces
    spacr-run validate --module MODULE \
        --settings settings.csv                   # check settings before spending the run
    spacr-run MODULE --settings settings.csv      # execute
    spacr-remote --help                           # submit and monitor SSH, Slurm or cloud jobs
  lang: bash
- p: '``validate`` वही सेटिंग्स पढ़ता है जो रन पढ़ता, और हर समस्या को, जैसे कोई छूटी
    हुई सेटिंग या ऐसा पथ जो मौजूद नहीं है, सुधार के साथ सूचीबद्ध करता है।'
- h2: किसी रन की जाँच
- p: प्रत्येक रन ``~/.spacr/runs`` में रिकॉर्ड किया जाता है, जिसमें इसकी सेटिंग्स,
    हैश किए गए इनपुट, आउटपुट्स, चेतावनी, संस्करण और बीज होते हैं।
- code: |-
    spacr-repro RUN_DIR        # replay a recorded run from its journal
    spacr-workspace RUN_DIR    # what that run had open: databases, montages, views
  lang: bash
- h2: डेटा की जांच और स्थापना
- code: |-
    spacr-db-audit DB      # SQLite health, integrity, locking, reader/writer probe
    spacr-leakage          # classifier train/test leakage audit
    spacr-plugins          # installed plugin registry and failure diagnostics
  lang: bash
- h2: परिवेश
- code: 'SPACR_LOG_LEVEL=DEBUG spacr      # verbose logging for one launch'
  lang: bash
- p: रूटिंग लॉग ``~/.spacr/logs/spacr.log`` में लिखे जाते हैं. उस फ़ाइल को एक बग
    रिपोर्ट में जोड़ें.
- h2: योगदान और सहायता
- p: बग रिपोर्ट और स्पष्ट रूप से सीमित फ़ीचर अनुरोध `GitHub Issues <https://github.com/EinarOlafsson/spacr/issues>`_
    के माध्यम से भेजें। किसी विफलता की रिपोर्ट करते समय spaCR संस्करण, ऑपरेटिंग सिस्टम,
    Python संस्करण, मॉड्यूल सेटिंग्स और संबंधित लॉग अंश शामिल करें। ``spacr-doctor``
    इनमें से अधिकांश जानकारी एकत्र करता है; प्रदर्शन संबंधी समस्या की रिपोर्ट करते
    समय हार्डवेयर रिपोर्ट भी शामिल करें।
- h2: लाइसेंस
- p: spaCR is released under the `BSD 3 क्लास लाइसेंस <https://github.com/EinarOlafsson/spacr/blob/main/LICENSE>`_.
- p: यदि spaCR प्रकाशित कार्य में योगदान देता है, तो एक उद्धरण का मूल्यांकन किया
    जाता है और लाइसेंस की शर्त नहीं है - नीचे `spaCR का संदर्भ`_ देखें।
- h2: ट्यूटोरियल
- p: '`spaCR की इंटरैक्टिव ट्यूटोरियल लाइब्रेरी <https://einarolafsson.github.io/spacr/tutorials/>`_
    में इंस्टॉलेशन और मॉड्यूल के उपयोग की चरण-दर-चरण जानकारी है। हर पाठ में उपलब्ध
    नैरेशन और भाषाएँ दी गई हैं।'
- h2: spaCR का संदर्भ
- p: 'यदि spaCR आपके शोध में योगदान देता है, तो इसका उद्धरण दें:'
