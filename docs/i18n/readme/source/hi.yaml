- h2: आभार
- p: spaCR NumPy, pandas, scikit-image, scikit-learn, Cellpose, PyTorch और Qt सहित
    मुक्त वैज्ञानिक सॉफ़्टवेयर पर आधारित है। बहुभाषी दस्तावेज़ और इंटरफ़ेस कैटलॉग
    तैयार करने में उपयोग किए गए मॉडल के लिए `अनुवाद मॉडल श्रेय <docs/i18n/TRANSLATION_MODELS.md>`_
    देखें।
