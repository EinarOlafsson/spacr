- generated: language-picker
- h1: spaCR
- p: '**CRISPR स्क्रीनिंग का स्थानिक फीनोटाइप विश्लेषण।**'
- p: spaCR माइक्रोस्कोपी छवियों में एकल कोशिकाओं का विभाजन और मापन करता है, प्रति-वस्तु
    फीनोटाइप को अनुक्रमण से प्राप्त गाइड प्रचुरता के साथ एकीकृत करता है और अनुमान
    लगाता है कि कौन-से जीन फीनोटाइपिक परिवर्तनों से जुड़े हैं। प्लेट छवियों और FASTQ
    रीड से शुरू करके, यह प्रति-वस्तु मापन, प्रशिक्षित वर्गीकारक, प्रति-गाइड और प्रति-जीन
    प्रभाव अनुमान तथा प्राथमिकता के अनुसार क्रमित हिट सूची बनाता है।
- p: segmentation, measurement, annotation और classification modules भी एक sequencing
    arm के बिना चलता है।
- p: Make Masks सेगमेंटेशन मास्क सुधारता है और YOLO निर्यात के लिए **Box** टूल से
    स्वतंत्र, क्लास-लेबल वाले आयतों का एनोटेशन करता है। ये बॉक्स स्रोत इमेज या मास्क
    बदले बिना अपने लेबल और इतिहास रखते हैं।
- p: हर टूल का विवरण `सुविधा गाइड <docs/source/features.rst>`_ में देखें।
- p: छवियाँ, मास्क और क्रॉप डिस्क पर फ़ाइलें हैं। मापन, एनोटेशन और मॉडल पूर्वानुमान
    परियोजना के SQLite डेटाबेस ``measurements.db`` में तालिकाएँ हैं।
- p: यह डेस्कटॉप एप्लिकेशन के रूप में, या वर्कस्टेशन, सर्वर या क्लस्टर पर हेडलेस
    रूप में चलता है।
- h2: spaCR आज़माएँ
- code: |-
    conda create -n spacr python=3.12 -y
    conda activate spacr
    python -m pip install spacr
    spacr
  lang: bash
- p: उदाहरण डेटा डाउनलोड करने के लिए Import, Make Masks, Annotate या किसी असे स्क्रीन
    में **टेस्ट डेटा लोड करें…** का उपयोग करें। टर्मिनल से ``spacr-download`` का
    उपयोग करें।
- h2: हार्डवेयर समर्थन
- generated: hardware
- p: CPU execution is supported and can be slower. In one measurement on an Intel iMac (Core
    i5-10500, AMD Radeon Pro 5300 4 GB), Cellpose-SAM took 444.5 s on the CPU and 3.2 s on
    Metal for one 256×256 image, using torch 2.2.2, Python 3.12.11 and macOS 26.5.2. This is a
    historical example, not a speed guarantee. GPU acceleration requires a usable backend and
    compatible libraries. See the `recorded hardware measurement
    <features/new/319_use_non_nvidia_accelerators_where_they_exist.txt>`_.
- h2: spaCR इंस्टॉल करें
- p: 'इंस्टॉलेशन का तरीका चुनें:'
- list:
  - '**डेस्कटॉप एप्लिकेशन**: Linux, macOS या Windows के लिए इंस्टॉलर, जिसमें अपना
    Python शामिल है।'
  - '**pip**: Conda परिवेश में ``python -m pip install spacr`` चलाएँ।'
  - '**conda-forge**: Conda परिवेश में ``conda install conda-forge::spacr`` चलाएँ।'
  - '**Docker**: Linux कंटेनर में कमांड-लाइन पाइपलाइन, CPU इमेज या NVIDIA GPU इमेज
    से:'
- code: |-
    docker run --rm ghcr.io/einarolafsson/spacr:1.5.1.4 spacr-run --list
    docker run --rm --gpus all ghcr.io/einarolafsson/spacr:1.5.1.4-cuda12.4 spacr-run --list
  lang: bash
- p: '`Docker गाइड <docs/source/installer_guide.rst#container-images>`_ में GPU सेटअप,
    डेटा माउंट और पाइपलाइन कमांड बताए गए हैं।'
- h3: डेस्कटॉप एप्लिकेशन
- p: इंस्टॉलर अपने स्वयं के Python को जोड़ते हैं. कॉन्डा की आवश्यकता नहीं है.
- generated: installer-links
- p: 'Linux पर डाउनलोड की गई फ़ाइल को निष्पादन योग्य बनाएँ और चलाएँ:'
- code: |-
    chmod +x SpaCR-*-Linux-x86_64-Online.run
    ./SpaCR-*-Linux-x86_64-Online.run
  lang: bash
- p: macOS पर, ``.pkg`` खोलें. वर्तमान बीटा नोटिस नहीं किया गया है; यदि Gatekeeper
    इसे ब्लॉक करता है, तो **सिस्टम सेटिंग्स → गोपनीयता और सुरक्षा → किसी भी तरह से
    खोलें** का चयन करें.
- p: अपडेट, अनइंस्टॉल, ऑफ़लाइन उपयोग और समस्या निवारण के निर्देशों के लिए `इंस्टॉलेशन
    गाइड <docs/source/installer_guide.rst>`_ देखें। वर्कस्टेशन और सर्वर संबंधी सुझावों
    तथा GPU संगतता तालिकाओं के लिए `सिस्टम आवश्यकताएँ <docs/source/system_requirements.rst>`_
    देखें।
- h3: PyPI से इंस्टॉलेशन
- p: 'PyPI रिलीज़ के लिए, Conda वातावरण के भीतर pip से spaCR इंस्टॉल करें। Python
    3.12 में वैकल्पिक वैज्ञानिक पैकेजों की सबसे व्यापक उपलब्धता है:'
- code: |-
    conda create -n spacr python=3.12 -y
    conda activate spacr
    python -m pip install --upgrade pip
    python -m pip install spacr
    spacr
  lang: bash
- p: spaCR, Python **3.9 through 3.14** का समर्थन करता है, Python 3.14.1 को छोड़कर,
    जिसे torchvision बाहर रखता है। सबसे भारी CUDA और ROCm कार्यप्रवाहों के लिए Linux
    की अनुशंसा की जाती है; macOS और Windows भी समर्थित हैं, और दोनों अपने GPU का
    उपयोग करते हैं — macOS, Metal के माध्यम से, जो Apple Silicon और Intel Mac में
    लगे AMD कार्डों को कवर करता है, और Windows, CUDA या DirectML के माध्यम से।
- p: 'मानक इंस्टॉलेशन में Qt डेस्कटॉप इंटरफ़ेस शामिल है। सर्वर, क्लस्टर या CI रनर
    पर इसे खोले बिना कमांड-लाइन पाइपलाइन चलाएँ:'
- code: |-
    python -m pip install spacr
    spacr-run --list
  lang: bash
- p: वैकल्पिक एकीकरण अलग से स्थापित किए जाते हैं, उदाहरण के लिए ``spacr[zarr]``,
    ``spacr[omero]``,``spacr[napari]`` और ``spacr[czi,nd2,lif]``. पूर्ण अतिरिक्त
    और Python संस्करण संगतता तालिका में `स्थापना गाइड <docs/source/installer_guide.rst>`_
    देखें.
- h3: conda-forge से इंस्टॉलेशन
- p: 'आधिकारिक conda-forge पैकेज सक्रिय वातावरण में spaCR और उसकी डेस्कटॉप निर्भरताएँ
    इंस्टॉल करता है:'
- code: |-
    conda create -n spacr python=3.12 -y
    conda activate spacr
    conda install conda-forge::spacr
    spacr
  lang: bash
- h3: सोर्स कोड से इंस्टॉलेशन
- p: 'रिपॉज़िटरी को क्लोन करें और उसे एडिटेबल मोड में इंस्टॉल करें, ताकि आपकी वर्किंग
    कॉपी *ही* इंस्टॉल किया गया पैकेज हो और बदलाव दोबारा इंस्टॉल किए बिना लागू हो
    जाएँ::'
- code: |-
    git clone https://github.com/EinarOlafsson/spacr.git
    cd spacr
    conda create -n spacr python=3.12 -y
    conda activate spacr
    pip install -e .
    spacr
  lang: bash
- p: 'यह ``main`` को क्लोन करता है, जो डिफ़ॉल्ट ब्रांच है और जिसमें नवीनतम रिलीज़
    रहती है। विकास ``nightly`` पर होता है; इसके बजाय वह ब्रांच क्लोन करने के लिए
    ``--branch nightly`` जोड़ें। किसी विशिष्ट रिलीज़ के लिए::'
- code: git clone --branch v1.5.0.5 https://github.com/EinarOlafsson/spacr.git
  lang: bash
- p: 'बाद के बदलाव लाने के लिए, क्लोन के अंदर से चलाएँ::'
- code: |-
    git pull
    pip install -e .
  lang: bash
- p: निर्भरताएँ या प्रवेश बिंदु बदलने पर फिर से इंस्टॉल करें। Python कोड में बदलाव
    सीधे लागू होते हैं; ``spacr-doctor`` सक्रिय इंस्टॉलेशन की पहचान करता है।
- h3: सोर्स कोड से इंस्टॉलेशन (हल्का)
- p: 'योगदानकर्ताओं को संस्करण इतिहास चाहिए; केवल spaCR चलाने के लिए नीचे दिए विकल्पों
    में से चुनें। ``nightly`` के ``05302fd5c`` कमिट की माप 2026-10-07 को ``packaging/measure_clone_forms.sh``
    से की गई::'
- code: |-
    # One commit instead of every version: 2048 MB downloaded, 140 s.
    # No history, so no git log, no git blame and no git bisect.
    # git pull still works, but stays shallow until git fetch --unshallow.
    git clone --depth 1 --branch nightly https://github.com/EinarOlafsson/spacr.git
    cd spacr && pip install -e .

    # Runtime files: 104 MB on disk, 6 s (Git: 38 MB; files: 66 MB).
    # No history, docs, tests, tools, features or example data.
    # --with-docs, --with-tests and --with-translations put those back;
    # --dir, --branch, --no-install and --help do the obvious things.
    # packaging/source_install_excludes.txt lists every skipped path.
    curl -fsSL https://raw.githubusercontent.com/EinarOlafsson/spacr/nightly/packaging/install_from_source.sh -o install_spacr.sh
    sh install_spacr.sh --branch nightly
  lang: bash
- p: 'nightly के पूर्ण क्लोन ने 9.25 GiB डाउनलोड किया। उथले क्लोन में ``--filter=blob:none``
    जोड़ने से चेकआउट छोटा नहीं होता: उसका Git ऑब्जेक्ट भंडार अब भी 2032 MB है। Git
    आवश्यकता पड़ने पर बाद में लाए गए ऑब्जेक्ट की सूचना नहीं देता, इसलिए कुल डाउनलोड
    नहीं मापा गया। nightly की संस्करण-नियंत्रित फ़ाइलें चेकआउट में 3416 MB लेती हैं
    (2026-10-08 को मापी गईं), जिसमें Git इतिहास शामिल नहीं है। डाउनलोड का आकार और
    समय शाखा के अनुसार बदलते हैं।'
- h2: कमांड-लाइन प्रवेश बिंदु
- code: |-
    spacr                                      # launch the Qt application
    spacr-doctor                               # diagnose the installation
    spacr-run --list                           # list headless modules
    spacr-run --describe MODULE                # inspect a module contract
    spacr-run MODULE --settings settings.csv   # execute a module
    spacr-run validate --module MODULE \
        --settings settings.csv                # validate before running
    spacr-repro RUN_DIR                        # replay a recorded run
    spacr-download --list                      # what example data exists
    spacr-download measure annotate            # fetch example sets by name
    spacr-make-masks --folder DIR              # curate masks as a resumable queue
    spacr-make-masks --folder DIR --order easy --limit 50
  lang: bash
- p: '``spacr-run --list`` उन मॉड्यूलों की सूची दिखाता है जिनके पास ग्राफ़िकल इंटरफ़ेस
    के बिना चलाने के लिए कमांड-लाइन प्रवेश बिंदु हैं। केवल GUI में उपलब्ध एनोटेशन,
    क्यूरेशन, तुलना और अन्वेषण मॉड्यूल इस सूची में शामिल नहीं होते।'
- h3: मुख्य वर्कफ़्लो
- p: 'मुख्य कार्यप्रवाह में छह मॉड्यूल हैं:'
- list:
  - '**Mask** Cellpose से कोशिकाओं, नाभिकों, रोगजनकों और कोशिकांगों का विभाजन करता
    है।'
  - '**Measure** आकृति-विज्ञान, तीव्रता, टेक्सचर, स्थानिक और सह-स्थानीकरण विशेषताओं
    के साथ ऑब्जेक्ट क्रॉप को SQLite में लिखता है।'
  - '**Annotate** कीबोर्ड से संचालित ग्रिड में क्रॉप को लेबल करता है और सक्रिय-अधिगम
    कतारों का समर्थन करता है।'
  - '**Classify** छवि- या मापन-आधारित मॉडल प्रशिक्षित करता है और प्रत्येक चेकपॉइंट
    के साथ होल्ड-आउट डेटा पर प्रदर्शन दर्ज करता है।'
  - '**Map Barcodes** FASTQ रीड को वेल और gRNA से मैप करता है तथा प्रचुरता, टकराव
    और कवरेज का QC प्रदान करता है।'
  - '**Regression** सतत, भिन्नात्मक और गणना प्रतिक्रियाओं के अनुकूल मॉडल परिवारों
    से गाइड, जीन, स्थिति और नियंत्रण प्रभावों का अनुमान लगाता है।'
- h3: spaCR मॉड्यूल
- generated: workflow
- p: 'होम स्क्रीन पर टाइल वाले सभी मॉड्यूल उसी स्क्रीन के क्रम में दिए गए हैं: पहले
    पाइपलाइन के छह मॉड्यूल, फिर बाकी। किसी मॉड्यूल का API पृष्ठ खोलने के लिए उसकी
    टाइल चुनें।'
- h2: अन्य संसाधन
- list:
  - '`इंटरैक्टिव ट्यूटोरियल <https://einarolafsson.github.io/spacr/tutorials/>`_
    — इंस्टॉलेशन से लेकर स्क्रीनिंग में मिले हिट की जाँच तक के निर्देशित कार्यप्रवाह।'
  - '`Python API त्वरित प्रारंभ <docs/source/python_api.rst>`_ - स्क्रिप्ट, नोटबुक
    या एक क्लस्टर से पाइपलाइन चलाएं और वैध करें।'
  - '`सुविधा गाइड <docs/source/features.rst>`_ — क्षमताओं, परिपक्वता और वैकल्पिक
    एकीकरण।'
  - '`शुद्ध API संदर्भ <https://einarolafsson.github.io/spacr/api/index.html>`_ -
    कार्य के आधार पर समर्थित प्रवेश बिंदु, पूर्ण मॉड्यूल संदर्भ एक स्तर गहरा है।'
  - '`भाषा और अनुवाद गाइड <docs/source/localization.rst>`_ — इंटरफ़ेस भाषाएं, संदर्भ
    सहायता और वैज्ञानिक-आउटपुट नीति।'
- h2: भाषा और अनुवाद
- p: इंटरफ़ेस नेविगेशन और प्राथमिकताओं में दस भाषाओं का समर्थन करता है। AI और LIVE
    नियंत्रण, मॉड्यूल विवरण और समीक्षित संदर्भ सहायता भी अनुवादित हैं। पुनः आरंभ
    किए बिना **spaCR → प्राथमिकताएँ → भाषा** में भाषा बदलें। लॉग, पथ, डेटाबेस मान
    और मापन कभी अनुवादित नहीं होते; वैज्ञानिक आउटपुट मानक अंग्रेज़ी में रहता है।
    `संदर्भ-सहायता नीति <docs/source/localization.rst#contextual-help>`_ देखें।
- p: नौ गैर-अंग्रेजी कैटलॉग मशीन-ड्राइंग और तकनीकी रूप से समीक्षा के बजाय एक स्वदेशी
    वक्ता द्वारा समाप्त पढ़ने के लिए. `समीक्षा स्कोप <docs/i18n/REVIEW_SCOPE_2026-09-04.md>`_
    रिकॉर्ड जिन भाषाओं ने एक मानव पास किया है और प्रत्येक शब्द अंग्रेजी में छोड़
    दिया है निर्णय द्वारा.
- h2: एनिमेटेड सेटिंग मार्गदर्शन
- p: दृश्य व्याख्या वाली सेटिंग के टूलटिप में **Animation** नियंत्रण मिलता है। `सेटिंग
    एनिमेशन गैलरी <https://einarolafsson.github.io/spacr/setting_animations.html>`_
    या `सेटिंग एनिमेशन रजिस्ट्री <https://einarolafsson.github.io/spacr/api/spacr/setting_animations/index.html>`_
    देखें।
