- generated: language-picker
- h1: spaCR
- p: '**Análise espacial de fenótipos em triagens CRISPR.**'
- p: O spaCR segmenta e mede células individuais em imagens de microscopia, integra
    fenótipos por objeto à abundância de guias derivada do sequenciamento e estima
    quais genes estão associados a alterações fenotípicas. A partir de imagens de
    placas e leituras FASTQ, ele produz medições por objeto, classificadores treinados,
    estimativas de efeito por guia e por gene e uma lista de resultados classificada.
- p: Os módulos de segmentação, medição, anotação e classificação também são executados
    sem um braço de sequenciamento.
- p: Make Masks corrige máscaras de segmentação e anota retângulos independentes
    com rótulos de classe usando a ferramenta **Box** para exportação YOLO. Os retângulos
    mantêm seus próprios rótulos e histórico sem alterar as imagens ou máscaras de
    origem.
- p: Consulte o `guia de funcionalidades <docs/source/features.rst>`_ para conhecer
    cada ferramenta.
- p: Imagens, máscaras e recortes são arquivos em disco. Medições, anotações e previsões
    do modelo são tabelas do banco de dados SQLite ``measurements.db`` do projeto.
- p: É executado como um aplicativo de desktop ou sem interface gráfica em uma estação
    de trabalho, servidor ou cluster.
- h2: Experimente o spaCR
- code: |-
    conda create -n spacr python=3.12 -y
    conda activate spacr
    python -m pip install spacr
    spacr
  lang: bash
- h2: Suporte de hardware
- generated: hardware
  details:
  - 'Auto: O True 3D do Make Masks testa os backends disponíveis nesta ordem: Linux: Vulkan
    → OpenGL → CPU; Windows: Vulkan → Direct3D 12 → OpenGL → CPU; macOS: Metal → Vulkan →
    OpenGL → CPU. Vulkan, Metal e Direct3D 12 usam wgpu. Se um backend de GPU falhar ou não
    estiver disponível, o próximo é testado; a renderização na CPU continua disponível.'
  - wgpu é instalado por padrão com Python 3.10 ou posterior no Windows (x64, ARM64), macOS
    (Intel, Apple silicon) e Linux (x86-64, ARM64, glibc 2.28 ou posterior). Python 3.9, outros
    processadores, Linux com glibc anterior e instalações sem wgpu usam OpenGL, depois CPU.
    As células roxas de 3D indicam suporte de GPU implementado, aguardando validação em uma
    tela real.
  - A execução na CPU é compatível e pode ser mais lenta. Em uma medição em um Intel iMac
    (Core i5-10500, AMD Radeon Pro 5300 4 GB), o Cellpose-SAM levou 444.5 s na CPU e 3.2 s
    com Metal para uma imagem de 256×256, usando torch 2.2.2, Python 3.12.11 e macOS 26.5.2.
    Este é um exemplo histórico, não uma garantia de velocidade. A aceleração por GPU requer
    um backend utilizável e bibliotecas compatíveis. Consulte a `medição de hardware registrada
    <features/new/319_use_non_nvidia_accelerators_where_they_exist.txt>`_.
- h2: Instalar o spaCR
- p: 'Escolha uma forma de instalação:'
- list:
  - '**Aplicativo para desktop**: um instalador para Linux, macOS ou Windows com
    Python próprio.'
  - '**pip**: ``python -m pip install spacr`` em um ambiente Conda.'
  - '**conda-forge**: ``conda install conda-forge::spacr`` em um ambiente Conda.'
  - '**Docker**: os fluxos de processamento de linha de comando em um contêiner Linux,
    com a imagem para CPU ou a imagem para GPU NVIDIA:'
- code: |-
    docker run --rm ghcr.io/einarolafsson/spacr:1.5.1.4 spacr-run --list
    docker run --rm --gpus all ghcr.io/einarolafsson/spacr:1.5.1.4-cuda12.4 spacr-run --list
  lang: bash
- p: O `guia do Docker <docs/source/installer_guide.rst#container-images>`_ explica
    a configuração da GPU, a montagem de dados e os comandos dos fluxos de processamento.
- h3: Aplicativo para desktop
- p: Os instaladores empacotam seus próprios Python. Conda não é necessário.
- generated: installer-links
- p: 'No Linux, torne o arquivo baixado executável e execute-o:'
- code: |-
    chmod +x SpaCR-*-Linux-x86_64-Online.run
    ./SpaCR-*-Linux-x86_64-Online.run
  lang: bash
- p: No macOS, abra o arquivo ``.pkg``. A versão beta atual não é notarizada; se
    o Gatekeeper a bloquear, selecione **Ajustes do Sistema → Privacidade e Segurança
    → Abrir Mesmo Assim**.
- p: Consulte o `guia de instalação <docs/source/installer_guide.rst>`_ para obter
    instruções de atualização, desinstalação, uso offline e solução de problemas,
    e os `requisitos do sistema <docs/source/system_requirements.rst>`_ para recomendações
    sobre estações de trabalho e servidores e tabelas de compatibilidade de GPU.
- h3: Instalação pelo PyPI
- p: 'Para usar a versão publicada no PyPI, instale o spaCR com pip em um ambiente
    Conda. O Python 3.12 oferece a maior variedade de pacotes científicos opcionais:'
- code: |-
    conda create -n spacr python=3.12 -y
    conda activate spacr
    python -m pip install --upgrade pip
    python -m pip install spacr
    spacr
  lang: bash
- p: O spaCR oferece suporte ao Python **3.9 through 3.14**, exceto ao Python 3.14.1,
    que é excluído pelo torchvision. Recomenda-se Linux para os fluxos de trabalho
    mais pesados com CUDA e ROCm; macOS e Windows também são compatíveis, e ambos
    utilizam suas GPUs — macOS por meio do Metal, que abrange o Apple Silicon e as
    placas gráficas AMD dos Macs Intel, e Windows por meio de CUDA ou DirectML.
- p: 'A instalação padrão inclui a interface de desktop Qt. Em um servidor, cluster
    ou executor de CI, execute os fluxos de trabalho de linha de comando sem abri-la:'
- code: |-
    python -m pip install spacr
    spacr-run --list
  lang: bash
- p: As integrações opcionais são instaladas separadamente, por exemplo ``spacr[zarr]``,  ``spacr[omero]``,``spacr[napari]``
    e ``spacr[czi,nd2,lif]``. Veja a tabela de compatibilidade  `guia de instalação
    <docs/source/installer_guide.rst>`_ para os extras completos e ?Python-versão.
- h3: Instalação com conda-forge
- p: 'O pacote oficial do conda-forge instala o spaCR e suas dependências de desktop
    no ambiente ativo:'
- code: |-
    conda create -n spacr python=3.12 -y
    conda activate spacr
    conda install conda-forge::spacr
    spacr
  lang: bash
- h3: Instalação a partir do código-fonte
- p: 'Clone o repositório e instale-o no modo editável, para que sua cópia de trabalho
    *seja* o pacote instalado e as alterações passem a valer sem reinstalar::'
- code: |-
    git clone https://github.com/EinarOlafsson/spacr.git
    cd spacr
    conda create -n spacr python=3.12 -y
    conda activate spacr
    pip install -e .
    spacr
  lang: bash
- p: 'Isso clona ``main``, o branch padrão, que contém a versão mais recente. O desenvolvimento
    acontece em ``nightly``; adicione ``--branch nightly`` para clonar esse branch
    no lugar dele. Para uma versão específica::'
- code: git clone --branch v1.5.0.5 https://github.com/EinarOlafsson/spacr.git
  lang: bash
- p: 'Para obter alterações posteriores, execute de dentro do clone::'
- code: |-
    git pull
    pip install -e .
  lang: bash
- p: Reinstale quando as dependências ou os pontos de entrada mudarem. As alterações
    no código Python têm efeito direto; ``spacr-doctor`` identifica a instalação
    ativa.
- h3: Instalação a partir do código-fonte (leve)
- p: 'Colaboradores precisam do histórico de versões; para executar o spaCR, escolha
    uma das opções abaixo. Medições de ``nightly`` em ``05302fd5c`` no dia 2026-10-07,
    feitas com ``packaging/measure_clone_forms.sh``::'
- code: |-
    # One commit instead of every version: 2048 MB downloaded, 140 s.
    # No history, so no git log, no git blame and no git bisect.
    # git pull still works, but stays shallow until git fetch --unshallow.
    git clone --depth 1 --branch nightly https://github.com/EinarOlafsson/spacr.git
    cd spacr && pip install -e .

    # Runtime files: 104 MB on disk, 6 s (Git: 38 MB; files: 66 MB).
    # No history, docs, tests, tools, features or example data.
    # --with-docs, --with-tests and --with-translations put those back;
    # --dir, --branch, --no-install and --help do the obvious things.
    # packaging/source_install_excludes.txt lists every skipped path.
    curl -fsSL https://raw.githubusercontent.com/EinarOlafsson/spacr/nightly/packaging/install_from_source.sh -o install_spacr.sh
    sh install_spacr.sh --branch nightly
  lang: bash
- p: 'O clone completo de nightly baixou 9.25 GiB. Adicionar ``--filter=blob:none``
    ao clone superficial não reduz a cópia de trabalho: seu armazenamento de objetos
    Git ainda ocupa 2032 MB. O Git não informa as transferências adiadas de objetos,
    por isso nenhum total de download foi medido. Os arquivos versionados de nightly
    ocupam 4657 MB na cópia de trabalho (medidos em 2026-10-15), sem o histórico
    do Git. O tamanho e a duração da transferência variam conforme o ramo.'
- h2: Comandos de linha de comando
- code: |-
    spacr                                      # launch the Qt application
    spacr-doctor                               # diagnose the installation
    spacr-run --list                           # list headless modules
    spacr-run --describe MODULE                # inspect a module contract
    spacr-run MODULE --settings settings.csv   # execute a module
    spacr-run validate --module MODULE \
        --settings settings.csv                # validate before running
    spacr-repro RUN_DIR                        # replay a recorded run
    spacr-download --list                      # what example data exists
    spacr-download measure annotate            # fetch example sets by name
    spacr-make-masks --folder DIR              # curate masks as a resumable queue
    spacr-make-masks --folder DIR --order easy --limit 50
  lang: bash
- p: '``spacr-run --list`` lista os módulos com pontos de entrada de linha de comando
    para execução sem interface gráfica. Os módulos de anotação, curadoria, comparação
    e exploração disponíveis apenas na interface gráfica são omitidos.'
- h3: Fluxo de trabalho principal
- p: 'O fluxo de trabalho principal compreende seis módulos:'
- list:
  - '**Mask** segmenta células, núcleos, patógenos e organelas com Cellpose.'
  - '**Measure** grava no SQLite características de morfologia, intensidade, textura,
    espaciais e de colocalização, além de recortes dos objetos.'
  - '**Annotate** rotula recortes em uma grade controlada pelo teclado e oferece
    suporte a filas de aprendizado ativo.'
  - '**Classify** treina modelos baseados em imagens ou medições e registra, em cada
    checkpoint, o desempenho nos dados de validação reservados.'
  - '**Map Barcodes** associa as leituras FASTQ aos poços e gRNAs, com controle de
    qualidade de abundância, colisões e cobertura.'
  - '**Regression** estima efeitos de guias, genes, condições e controles com famílias
    de modelos adequadas a respostas contínuas, fracionárias e de contagem.'
- h3: Módulos do spaCR
- generated: workflow
- p: 'Todos os módulos com um bloco na tela inicial, na ordem dessa tela: primeiro
