- h2: Biblioteca de modelos
- p: 'spaCR envia um catálogo de modelos treinados e os busca sob demanda. Abra  **Modelo
    Zoo** da tela inicial para navegar e instalá-los, ou nomeie uma chave em um arquivo
    de configurações -  ``pathogen_model: toxoplasma_pv_v1`` - e o modelo é baixado
    e verificado na primeira vez que é necessário. Cada entrada publicada carrega
    um SHA-256; uma entrada real sem um é recusada em vez de instalada, porque um
    truncado não pode ser informado'
- generated: model-zoo
- h3: Diagnóstico de desempenho
- p: 'Gere um relatório de hardware e anexe-o a uma issue relacionada ao desempenho::'
- code: python tools/spacr_hardware_report.py
  lang: bash
- p: Salva em ``~/.spacr/reports`` e imprime o caminho.  ``--quick`` pula os benchmarks
    mais longos;  ``--out PATH`` define a localização.
- p: Não lê dados do projeto. Mede o tempo de importações, bibliotecas numéricas,
    criação de janelas e animação, e informa a emulação x86_64 no Apple Silicon e
    a implementação de BLAS usada pelo NumPy.
- h3: Referência da linha de comando
- p: Cada comando abaixo é instalado por ``pip install spacr``. Todos eles aceitam  ``--help``.
- h2: Lançamento do aplicativo
- code: |-
    spacr              # the desktop application
    spacr-tutorial     # the interactive tutorial library
    spacr-server       # no first-run setup screen, for unattended launches
  lang: bash
- h2: Quando spaCR não será iniciado
- code: |-
    spacr-doctor       # diagnose the installation and say how to fix it
    safespacr          # the least spaCR that can still change a setting
  lang: bash
- p: '``spacr-doctor`` imprime uma linha por verificação, com um comando a ser executado
    para cada falha. Ele também informa qual ``spacr`` está no caminho.'
- p: '``safespacr`` lê cada preferência com seu valor padrão e desativa o plano de
    fundo, as animações, o registro detalhado e o pré-carregamento. Use-o quando
    uma preferência salva impedir a inicialização. As preferências salvas no modo
    de segurança são gravadas normalmente e permanecem.'
- h2: Módulos em execução sem interface gráfica
- p: No Qt, no display para clusters, servidores e CI.
- code: |-
    spacr-run --list                              # modules with a headless entry
    spacr-run --describe MODULE                   # what a module consumes and produces
    spacr-run validate --module MODULE \
        --settings settings.csv                   # check settings before spending the run
    spacr-run MODULE --settings settings.csv      # execute
    spacr-remote --help                           # submit and monitor SSH, Slurm or cloud jobs
  lang: bash
- p: '``validate`` lê as mesmas configurações que a execução leria e lista cada problema,
    como uma configuração ausente ou um caminho que não existe, com uma correção.'
- h2: Inspecionar uma execução
- p: Cada execução é registrada para ``~/.spacr/runs`` com suas configurações, entradas
    hashed, saídas, avisos, versões e sementes.
- code: |-
    spacr-repro RUN_DIR        # replay a recorded run from its journal
    spacr-workspace RUN_DIR    # what that run had open: databases, montages, views
  lang: bash
- h2: Auditoria de dados e instalação
- code: |-
    spacr-db-audit DB      # SQLite health, integrity, locking, reader/writer probe
    spacr-leakage          # classifier train/test leakage audit
    spacr-plugins          # installed plugin registry and failure diagnostics
  lang: bash
- h2: Ambiente
- code: 'SPACR_LOG_LEVEL=DEBUG spacr      # verbose logging for one launch'
  lang: bash
- p: Os logs rotativos são gravados em ``~/.spacr/logs/spacr.log``. Anexe esse arquivo
    a um relatório de bug.
- h2: Contribuições e suporte
- p: Envie relatos de erros e solicitações de recursos bem delimitadas pelo `GitHub
    Issues <https://github.com/EinarOlafsson/spacr/issues>`_. Ao relatar uma falha,
    inclua a versão do spaCR, o sistema operacional, a versão do Python, as configurações
    do módulo e o trecho relevante do log. O ``spacr-doctor`` coleta a maior parte
    dessas informações; inclua o relatório de hardware ao relatar problemas de desempenho.
- h2: Licença
- p: spaCR é lançado sob o  `Licença BSD 3-Clause <https://github.com/EinarOlafsson/spacr/blob/main/LICENSE>`_.
- p: Se spaCR contribuiu para o trabalho publicado, uma citação é apreciada e não
    é uma condição da licença veja  `Como citar o spaCR`_ abaixo.
- h2: Tutoriais
- p: A `biblioteca de tutoriais interativos do spaCR <https://einarolafsson.github.io/spacr/tutorials/>`_
    oferece guias de instalação e uso dos módulos. Cada aula indica a narração e
    os idiomas disponíveis.
- h2: Como citar o spaCR
- p: 'Se o spaCR contribuir para sua pesquisa, cite:'
- p: Olafsson EB, *et al.* Um pooled image-based  CRISPR screen identifica o EAF1
    como um modulador *T. gondii* da subversão ESCRT.
- p: '`bioRxiv pré-impressão <https://www.biorxiv.org/content/10.64898/2026.07.08.737057v1>`_
    · `arquivo de software <https://doi.org/10.5281/zenodo.21343316>`_'
