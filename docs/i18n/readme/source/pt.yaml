- h2: Idioma e tradução
- p: A interface oferece dez idiomas na navegação e nas preferências. Os controles
    AI e LIVE, as descrições dos módulos e a ajuda contextual revisada também são
    traduzidos. Altere o idioma em **spaCR → Preferências → Idioma** sem reiniciar.
    Logs, caminhos, valores de banco de dados e medições nunca são traduzidos; a
    saída científica permanece em inglês canônico. Consulte a `política de ajuda
    contextual <docs/source/localization.rst#contextual-help>`_.
- p: Os nove catálogos não ingleses são elaborados por máquina e tecnicamente revisados
    em vez de lidos de ponta a ponta por um falante nativo. Os registros `âmbito
    de revisão <docs/i18n/REVIEW_SCOPE_2026-09-04.md>`_ que as línguas tiveram um
    passe humano e todos os termos deixados em inglês por decisão.
- h2: Guia animado de configurações
- p: As configurações com uma explicação visual oferecem um controle **Animation**
    na dica de ferramenta. Consulte a `galeria de animações de configurações <https://einarolafsson.github.io/spacr/setting_animations.html>`_
    ou o `registro de animações de configurações <https://einarolafsson.github.io/spacr/api/spacr/setting_animations/index.html>`_.
