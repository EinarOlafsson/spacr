- h2: Modellbibliotek
- p: 'spaCR innehåller en katalog över tränade modeller och hämtar dem vid behov. Öppna **Model
    Zoo** från startskärmen för att bläddra bland och installera modellerna, eller ange en
    modellnyckel i en inställningsfil, till exempel ``pathogen_model: toxoplasma_pv_v1``.
    Modellen laddas då ned och verifieras med en kontrollsumma första gången den behövs. Varje
    publicerad post har en SHA-256-kontrollsumma. En post utan kontrollsumma nekas, eftersom
    en ofullständig eller utbytt modellfil annars inte kan skiljas från den riktiga.'
- generated: model-zoo
- h3: Prestandadiagnostik
- p: 'Skapa en maskinvarurapport och bifoga den till ett prestandarelaterat ärende::'
- code: python tools/spacr_hardware_report.py
  lang: bash
- p: Sparar i ``~/.spacr/reports`` och skriver ut sökvägen. ``--quick`` hoppar över de längre
    prestandatesterna; ``--out PATH`` anger platsen.
- p: Läser inga projektdata. Mäter tiden för importer, numeriska bibliotek, fönsterkonstruktion
    och animering, och rapporterar x86_64-emulering på Apple Silicon samt NumPys
    BLAS.
- h3: Kommandoradsreferens
- p: Varje kommando nedan installeras av ``pip install spacr``. Alla av dem accepterar
    ``--help``.
- h2: Starta programmet
- code: |-
    spacr              # the desktop application
    spacr-tutorial     # the interactive tutorial library
    spacr-server       # no first-run setup screen, for unattended launches
  lang: bash
- h2: När spaCR inte startar
- code: |-
    spacr-doctor       # diagnose the installation and say how to fix it
    safespacr          # the least spaCR that can still change a setting
  lang: bash
- p: '``spacr-doctor`` skriver ut en rad per kontroll, med ett kommando att köra
    för varje fel. Det rapporterar också vilken ``spacr`` som finns på sökvägen.'
- p: '``safespacr`` läser varje inställning som dess standardvärde och stänger av
    bakgrunden, animationerna, utförlig loggning och förladdning. Använd det när
    en sparad inställning hindrar programmet från att starta. Inställningar som sparas
    i säkert läge skrivs som vanligt och finns kvar.'
- h2: Köra moduler utan grafiskt gränssnitt
- p: Utan Qt eller bildskärm — för kluster, servrar och CI.
- code: |-
    spacr-run --list                              # modules with a headless entry
    spacr-run --describe MODULE                   # what a module consumes and produces
    spacr-run validate --module MODULE \
        --settings settings.csv                   # check settings before spending the run
    spacr-run MODULE --settings settings.csv      # execute
    spacr-remote --help                           # submit and monitor SSH, Slurm or cloud jobs
  lang: bash
- p: '``validate`` läser samma inställningar som körningen skulle läsa och listar
    varje problem, till exempel en saknad inställning eller en sökväg som inte finns,
    tillsammans med en åtgärd.'
- h2: Inspektera en körning
- p: Varje körning journalförs i ``~/.spacr/runs`` med inställningar, hashvärden för indata,
    utdata, varningar, versioner och slumpfrön.
- code: |-
    spacr-repro RUN_DIR        # replay a recorded run from its journal
    spacr-workspace RUN_DIR    # what that run had open: databases, montages, views
  lang: bash
- h2: Granskning av data och installation
- code: |-
    spacr-db-audit DB      # SQLite health, integrity, locking, reader/writer probe
    spacr-leakage          # classifier train/test leakage audit
    spacr-plugins          # installed plugin registry and failure diagnostics
  lang: bash
- h2: Miljö
- code: 'SPACR_LOG_LEVEL=DEBUG spacr      # verbose logging for one launch'
  lang: bash
- p: Roterande loggar skrivs till ``~/.spacr/logs/spacr.log``. Bifoga filen till
    en felrapport.
- h2: Bidrag och support
- p: Skicka felrapporter och avgränsade funktionsförslag via `GitHub-ärenden <https://github.com/EinarOlafsson/spacr/issues>`_.
    Ange spaCR-version, operativsystem, Python-version, modulinställningar och relevant
    loggutdrag när du rapporterar ett fel. ``spacr-doctor`` samlar in det mesta av
    denna information; bifoga maskinvarurapporten vid prestandaproblem.
