- generated: language-picker
- h1: spaCR
- p: '**Rumslig fenotypanalys av CRISPR-screeningar.**'
- p: spaCR segmenterar och mäter enskilda celler i mikroskopibilder, integrerar fenotyper
    per objekt med sekvenseringshärledd guideförekomst och uppskattar vilka gener
    som är associerade med fenotypiska förändringar. Med plattbilder och FASTQ-läsningar
    som utgångspunkt producerar programmet mätningar per objekt, tränade klassificerare,
    effektskattningar per guide och gen samt en rangordnad träfflista.
- p: Modulerna för segmentering, mätning, annotering och klassificering kan också köras utan
    någon sekvenseringsdel.
- p: Make Masks korrigerar segmenteringsmasker och annoterar oberoende, klassmärkta
    rektanglar med verktyget **Box** för YOLO-export. Rutorna har egna etiketter
    och egen historik utan att ändra källbilder eller masker.
- p: Se `funktionsguiden <docs/source/features.rst>`_ för varje verktyg.
- p: Bilder, masker och bildutsnitt är filer på disk. Mätningar, annoteringar och
    modellprediktioner är tabeller i projektets SQLite-databas ``measurements.db``.
- p: Körs som ett skrivbordsprogram eller utan grafiskt gränssnitt på en arbetsstation,
    server eller kluster.
- h2: Prova spaCR
- code: |-
    conda create -n spacr python=3.12 -y
    conda activate spacr
    python -m pip install spacr
    spacr
  lang: bash
- h2: Hårdvarustöd
- generated: hardware
  details:
  - 'Auto: True 3D i Make Masks provar tillgängliga renderingsmotorer i ordning: Linux: Vulkan
    → OpenGL → CPU; Windows: Vulkan → Direct3D 12 → OpenGL → CPU; macOS: Metal → Vulkan →
    OpenGL → CPU. Vulkan, Metal och Direct3D 12 använder wgpu. Om en GPU-motor saknas eller
    misslyckas provas nästa; rendering på CPU finns alltid kvar.'
  - wgpu installeras som standard med Python 3.10 eller senare på Windows (x64, ARM64), macOS
    (Intel, Apple silicon) och Linux (x86-64, ARM64, glibc 2.28 eller senare). Python 3.9,
    andra processorer, Linux med äldre glibc och installationer utan wgpu använder OpenGL,
    sedan CPU. De lila 3D-cellerna anger implementerat GPU-stöd som väntar på verifiering
    på en riktig skärm.
  - Körning på CPU stöds och kan vara långsammare. Vid en mätning på en Intel iMac (Core i5-10500,
    AMD Radeon Pro 5300 4 GB) tog Cellpose-SAM 444.5 s på CPU och 3.2 s på Metal för en bild
    på 256×256, med torch 2.2.2, Python 3.12.11 och macOS 26.5.2. Detta är ett historiskt
    exempel, ingen hastighetsgaranti. GPU-acceleration kräver en fungerande backend och kompatibla
    bibliotek. Se den `dokumenterade hårdvarumätningen <features/new/319_use_non_nvidia_accelerators_where_they_exist.txt>`_.
- h2: Installera spaCR
- p: 'Välj en installationsväg:'
- list:
  - '**Skrivbordsprogram**: ett installationsprogram för Linux, macOS eller Windows
    med egen Python.'
  - '**pip**: ``python -m pip install spacr`` i en Conda-miljö.'
  - '**conda-forge**: ``conda install conda-forge::spacr`` i en Conda-miljö.'
  - '**Docker**: kommandoradens bearbetningsflöden i en Linux-container, från CPU-avbildningen
    eller avbildningen för NVIDIA-GPU:er:'
- code: |-
    docker run --rm ghcr.io/einarolafsson/spacr:1.5.1.6 spacr-run --list
    docker run --rm --gpus all ghcr.io/einarolafsson/spacr:1.5.1.6-cuda12.4 spacr-run --list
  lang: bash
- p: '`Docker-guiden (nightly, engelska) <https://github.com/EinarOlafsson/spacr/blob/nightly/docs/source/installer_guide.rst#container-images>`_
    beskriver GPU-inställning, montering av data och kommandon för bearbetningsflödena.'
- h3: Skrivbordsprogram
- p: Installationsprogrammen innehåller en egen Python-miljö. Conda behövs inte.
- generated: installer-links
- p: 'Gör den hämtade filen körbar i Linux och kör den:'
- code: |-
    chmod +x SpaCR-*-Linux-x86_64-Online.run
    ./SpaCR-*-Linux-x86_64-Online.run
  lang: bash
- p: På macOS, öppna ``.pkg``. Den nuvarande betaversionen är inte notariserad. Om Gatekeeper
    blockerar den, välj **Systeminställningar → Integritet & Säkerhet → Öppna ändå**.
- p: För installation, uppdatering, ominstallation, avinstallation, offlineanvändning
    och felsökning, se den `aktuella installationsguiden på nightly (engelska) <https://github.com/EinarOlafsson/spacr/blob/nightly/docs/source/installer_guide.rst>`_.
    Se `systemkraven <docs/source/system_requirements.rst>`_ för rekommendationer
    om arbetsstationer och servrar samt tabeller över GPU-kompatibilitet.
- h3: Installation från PyPI
- p: 'För PyPI-utgåvan installerar du spaCR med pip i en Conda-miljö. Python 3.12
    ger det största urvalet av valfria vetenskapliga paket:'
- code: |-
    conda create -n spacr python=3.12 -y
    conda activate spacr
    python -m pip install --upgrade pip
    python -m pip install spacr
    spacr
  lang: bash
- p: spaCR stöder Python **3.9 through 3.14**, utom Python 3.14.1, som torchvision
    utesluter. Linux rekommenderas för de tyngsta CUDA- och ROCm-arbetsflödena; macOS
    och Windows stöds också, och båda använder sina GPU:er — macOS via Metal, som
    täcker Apple Silicon och AMD-korten i Intel-Mac-datorer, och Windows via CUDA
    eller DirectML.
- p: 'Standardinstallationen innehåller Qt-gränssnittet för skrivbordet. På en server,
    ett kluster eller en CI-körmiljö kan du köra kommandoradspipelines utan att öppna
    det:'
- code: |-
    python -m pip install spacr
    spacr-run --list
  lang: bash
- p: Valfria integrationer installeras separat, till exempel ``spacr[zarr]``, ``spacr[omero]``,
    ``spacr[napari]`` och ``spacr[czi,nd2,lif]``. Den fullständiga listan över tillägg och
    tabellen över kompatibla Python-versioner finns i `installationsguiden (nightly, engelska)
    <https://github.com/EinarOlafsson/spacr/blob/nightly/docs/source/installer_guide.rst>`_.
- h3: Installation med conda-forge
- p: 'Det officiella conda-forge-paketet installerar spaCR och dess skrivbordsberoenden
    i den aktiva miljön:'
- code: |-
    conda create -n spacr python=3.12 -y
    conda activate spacr
    conda install conda-forge::spacr
    spacr
  lang: bash
- h3: Installation från källkod
- p: 'Klona kodförrådet och installera det i redigerbart läge, så att din arbetskopia
    *är* det installerade paketet och ändringar börjar gälla utan ominstallation::'
- code: |-
    git clone https://github.com/EinarOlafsson/spacr.git
    cd spacr
    conda create -n spacr python=3.12 -y
    conda activate spacr
    pip install -e .
    spacr
  lang: bash
- p: 'Detta klonar ``main``, standardgrenen, som innehåller den senaste utgåvan.
    Utvecklingen sker på ``nightly``; lägg till ``--branch nightly`` för att klona
    den i stället. För en specifik utgåva::'
- code: git clone --branch v1.5.0.5 https://github.com/EinarOlafsson/spacr.git
  lang: bash
- p: 'För att hämta senare ändringar kör du inifrån klonen::'
- code: |-
    git pull
    pip install -e .
  lang: bash
- p: Installera om när beroenden eller kommandostarter ändras. Ändringar i Python-koden
    gäller direkt; ``spacr-doctor`` visar vilken installation som används.
- h3: Installation från källkod (lättviktig)
- p: Bidragsgivare behöver versionshistoriken; välj ett alternativ nedan om du bara vill köra
    spaCR. Mätningarna gäller ``nightly`` vid ``05302fd5c`` den 2026-10-07 och gjordes med
    ``packaging/measure_clone_forms.sh``.
- p: 'Ytlig klon: 2048 MB hämtades på 140 s. Endast den senaste incheckningen behålls, så
    äldre historik är inte tillgänglig för ``git log``, ``git blame`` eller ``git bisect``.
    ``git pull`` fungerar men klonen förblir ytlig; ``git fetch --unshallow`` hämtar hela
    historiken.'
- code: |-
    git clone --depth 1 --branch nightly https://github.com/EinarOlafsson/spacr.git
    cd spacr && pip install -e .
  lang: bash
- p: 'Enbart körningsfiler: 104 MB på disk på 6 s (Git: 38 MB; filer: 66 MB). Historik, docs,
    tests, tools, features, exempeldata och utökade gränssnittsöversättningar utelämnas. ``--with-docs``,
    ``--with-tests`` och ``--with-translations`` behåller motsvarande dokumentation, tester
    och översättningar. De kompakta gränssnittsöversättningarna finns kvar.'
- code: |-
    curl -fsSL https://raw.githubusercontent.com/EinarOlafsson/spacr/nightly/packaging/install_from_source.sh -o install_spacr.sh
    sh install_spacr.sh --branch nightly
  lang: bash
- p: '``--dir`` väljer klonens sökväg; ``--branch`` väljer gren eller tagg; ``--no-install``
    hämtar utan att installera; ``--help`` visar alternativen. ``packaging/source_install_excludes.txt``
    listar alla utelämnade sökvägar.'
- p: 'Den fullständiga nightly-klonen laddade ner 9.25 GiB. Att lägga till ``--filter=blob:none``
    till den grunda klonen minskar inte utcheckningen: dess Git-objektlager är fortfarande
    2032 MB. Git rapporterar inte lata hämtningar av objekt, så ingen total nedladdning uppmättes.
    De versionshanterade filerna i nightly ger en utcheckning på 720 MB (uppmätt 2026-10-21),
    utan Git-historiken. Nedladdningens storlek och tid varierar med grenen.'
- h2: Kommandoradskommandon
- code: |-
    spacr                                      # launch the Qt application
    spacr-doctor                               # diagnose the installation
    spacr-run --list                           # list headless modules
    spacr-run --describe MODULE                # inspect a module contract
    spacr-run MODULE --settings settings.csv   # execute a module
    spacr-run validate --module MODULE \
        --settings settings.csv                # validate before running
    spacr-repro RUN_DIR                        # replay a recorded run
    spacr-download --list                      # what example data exists
    spacr-download measure annotate            # fetch example sets by name
    spacr-make-masks --folder DIR              # curate masks as a resumable queue
    spacr-make-masks --folder DIR --order easy --limit 50
  lang: bash
- p: '``spacr-run --list`` listar moduler med kommandoradsposter för körning utan
    grafiskt gränssnitt. GUI-bundna moduler för annotering, kurering, jämförelse
    och utforskning utelämnas.'
- h3: Kärnarbetsflöde
- p: 'Det primära arbetsflödet består av sex moduler:'
- list:
  - '**Mask** segmenterar celler, cellkärnor, patogener och organeller med Cellpose.'
  - '**Measure** skriver morfologiska, intensitets-, textur-, rumsliga och kolokaliseringsmått
    samt objektutsnitt till SQLite.'
  - '**Annotate** märker objektutsnitt i ett tangentbordsstyrt rutnät och stöder
    köer för aktiv inlärning.'
  - '**Classify** tränar bild- eller mätningsbaserade modeller och sparar prestandan
    på undanhållna data med varje kontrollpunkt.'
  - '**Map Barcodes** kopplar FASTQ-läsningar till brunnar och gRNA:er och rapporterar
    QC för förekomst, kollisioner och täckning.'
  - '**Regression** skattar effekter för guider, gener, betingelser och kontroller
    med modellfamiljer för kontinuerliga data, andelar och antal.'
- h3: spaCR-moduler
- generated: workflow
- p: 'Alla moduler med en ruta på startskärmen, i startskärmens ordning: först de
    sex pipelinemodulerna, sedan resten. Välj en ruta för att öppna modulens API-sida.'
- h2: Övriga resurser
- list:
  - '`Interaktiva handledningar <https://einarolafsson.github.io/spacr/tutorials/>`_ — guidade
    arbetsflöden från installation till undersökning av träffar.'
  - '`Snabbstart för Python-API:t <docs/source/python_api.rst>`_ — kör och validera bearbetningsflöden
    från skript, anteckningsböcker eller ett kluster.'
  - '`Funktionsguide <docs/source/features.rst>`_ — funktioner, mognadsgrad och valfria integrationer.'
  - '`Utvald API-referens <https://einarolafsson.github.io/spacr/api/index.html>`_ — stödda
    ingångspunkter ordnade efter uppgift, med den fullständiga modulreferensen en nivå djupare.'
  - '`Språk- och översättningsguide <docs/source/localization.rst>`_ — gränssnittsspråk, kontextuell
    hjälp och policy för vetenskapliga resultat.'
- h2: Språk och översättning
- p: Gränssnittet stöder tio språk i navigering och inställningar. AI- och LIVE-kontroller,
    modulbeskrivningar och granskad kontexthjälp översätts också. Byt språk under
    **spaCR → Inställningar → Språk** utan att starta om. Loggar, sökvägar, databasvärden
    och mätningar översätts aldrig; vetenskapliga utdata förblir på kanonisk engelska.
    Se `policyn för kontexthjälp <docs/source/localization.rst#contextual-help>`_.
- h2: Animerad hjälp för inställningar
- p: Inställningar med en visuell förklaring har kontrollen **Animation** i verktygstipset.
    Bläddra i `galleriet med inställningsanimationer <https://einarolafsson.github.io/spacr/setting_animations.html>`_
    eller `registret över inställningsanimationer <https://einarolafsson.github.io/spacr/api/spacr/setting_animations/index.html>`_.
