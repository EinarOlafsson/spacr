    villkor för licensen – se `Citera spaCR`_ nedan.
- h2: Handledningar
- p: Det `interaktiva biblioteket med spaCR-handledningar <https://einarolafsson.github.io/spacr/tutorials/>`_
    visar installation och användning av moduler steg för steg. Tillgänglig berättarröst
    och språk anges för varje lektion.
- h2: Citera spaCR
- p: 'Om spaCR bidrar till din forskning, citera:'
