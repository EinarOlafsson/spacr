- h2: Model zoo
- p: 'spaCR ships a catalogue of trained models and fetches them on demand. Open
    **Model Zoo** from the home screen to browse and install them, or name a key
    in a settings file -- ``pathogen_model: toxoplasma_pv_v1`` -- and the model is
    downloaded and checksum-verified the first time it is needed. Every published
    entry carries a SHA-256; an entry without one is refused rather than installed,
    because a truncated or substituted checkpoint cannot be told from the real one.'
- generated: model-zoo
- h3: Diagnosing performance
- p: 'Generate a hardware report and attach it to a performance-related issue::'
- code: python tools/spacr_hardware_report.py
  lang: bash
- p: Saves to ``~/.spacr/reports`` and prints the path. ``--quick`` skips the longer
    benchmarks; ``--out PATH`` sets the location.
- p: Reads no project data. Times imports, numeric libraries, window construction
    and animation, and reports x86_64 emulation on Apple Silicon and NumPy's BLAS.
- h3: Command-line reference
- p: Every command below is installed by ``pip install spacr``. All of them accept
    ``--help``.
- h2: Launching the application
- code: |-
    spacr              # the desktop application
    spacr-tutorial     # the interactive tutorial library
    spacr-server       # no first-run setup screen, for unattended launches
  lang: bash
- h2: When spaCR will not start
- code: |-
    spacr-doctor       # diagnose the installation and say how to fix it
    safespacr          # the least spaCR that can still change a setting
  lang: bash
- p: '``spacr-doctor`` prints one line per check, with a command to run for each
    failure. It also reports which ``spacr`` is on the path.'
- p: '``safespacr`` reads every preference as its default and forces the backdrop,
    animations, verbose logging and preloading off. Use it when a saved preference
    breaks the launch. Preferences saved in safe mode are written normally and persist.'
- h2: Running modules headlessly
- p: No Qt, no display — for clusters, servers and CI.
- code: |-
    spacr-run --list                              # modules with a headless entry
    spacr-run --describe MODULE                   # what a module consumes and produces
    spacr-run validate --module MODULE \
        --settings settings.csv                   # check settings before spending the run
    spacr-run MODULE --settings settings.csv      # execute
    spacr-remote --help                           # submit and monitor SSH, Slurm or cloud jobs
  lang: bash
- p: '``validate`` reads the same settings the run would and lists each problem,
    such as a missing setting or a path that does not exist, with a fix.'
- h2: Inspecting a run
- p: Every run is journalled to ``~/.spacr/runs`` with its settings, hashed inputs,
    outputs, warnings, versions and seeds.
- code: |-
    spacr-repro RUN_DIR        # replay a recorded run from its journal
    spacr-workspace RUN_DIR    # what that run had open: databases, montages, views
  lang: bash
- h2: Auditing data and installation
- code: |-
    spacr-db-audit DB      # SQLite health, integrity, locking, reader/writer probe
    spacr-leakage          # classifier train/test leakage audit
    spacr-plugins          # installed plugin registry and failure diagnostics
  lang: bash
- h2: Environment
- code: 'SPACR_LOG_LEVEL=DEBUG spacr      # verbose logging for one launch'
  lang: bash
- p: Rotating logs are written to ``~/.spacr/logs/spacr.log``. Attach that file to
    a bug report.
- h2: Contributing and support
- p: Submit bug reports and focused feature requests through `GitHub Issues <https://github.com/EinarOlafsson/spacr/issues>`_.
    When reporting a failure, include the spaCR version, operating system, Python
    version, module settings and the relevant log excerpt. ``spacr-doctor`` collects
    most of this information; include the hardware report when reporting performance
    problems.
- h2: Licensing
- p: spaCR is released under the `BSD 3-Clause License <https://github.com/EinarOlafsson/spacr/blob/main/LICENSE>`_.
- p: If spaCR contributed to published work, a citation is appreciated and is not
    a condition of the licence — see `Citing spaCR`_ below.
- h2: Tutorials
- p: The `interactive spaCR tutorial library <https://einarolafsson.github.io/spacr/tutorials/>`_
    provides installation and module walkthroughs. Available narration and languages
    are listed for each lesson.
- h2: Citing spaCR
- p: 'If spaCR contributes to your research, cite:'
- p: Olafsson EB, *et al.* A pooled image-based CRISPR screen identifies EAF1 as
    a *T. gondii* modulator of ESCRT subversion.
- p: '`bioRxiv preprint <https://www.biorxiv.org/content/10.64898/2026.07.08.737057v1>`_
    · `software archive <https://doi.org/10.5281/zenodo.21343316>`_'
- h2: Other work citing spaCR
