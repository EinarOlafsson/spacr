- generated: language-picker
- h1: spaCR
- p: '**Spatial phenotype analysis of CRISPR screens.**'
- p: spaCR segments and measures single cells in microscopy images, integrates per-object
    phenotypes with sequencing-derived guide abundance, and estimates which genes
    are associated with phenotypic changes. Starting from plate images and FASTQ
    reads, it produces per-object measurements, trained classifiers, per-guide and
    per-gene effect estimates, and a ranked hit list.
- p: The segmentation, measurement, annotation and classification modules also run
    without a sequencing arm.
- p: Make Masks corrects segmentation masks and annotates independent, class-labelled
    rectangles with the **Box** tool for YOLO export. Boxes keep their own labels
    and history without changing source images or masks.
- p: See the `feature guide <docs/source/features.rst>`_ for each tool.
- p: Images, masks and crops are files on disk. Measurements, annotations and model
    predictions are tables in the project's ``measurements.db`` SQLite database.
- p: Runs as a desktop application or headlessly on a workstation, server or cluster.
- h2: Try spaCR
- code: |-
    conda create -n spacr python=3.12 -y
    conda activate spacr
    python -m pip install spacr
    spacr
  lang: bash
- h2: Hardware support
- generated: hardware
  details:
  - 'Auto: True 3D in Make Masks tries each available backend in order: Linux: Vulkan → OpenGL
    → CPU; Windows: Vulkan → Direct3D 12 → OpenGL → CPU; macOS: Metal → Vulkan → OpenGL →
    CPU. Vulkan, Metal and Direct3D 12 use wgpu. A failed or unavailable GPU backend falls
    back to the next backend; CPU rendering remains available.'
  - wgpu is installed by default with Python 3.10 or later on Windows (x64, ARM64), macOS
    (Intel, Apple silicon) and Linux (x86-64, ARM64, glibc 2.28 or later). Python 3.9, other
    processors, Linux with older glibc and installations made without wgpu use OpenGL, then
    CPU. The purple 3D cells indicate implemented GPU support awaiting real-display acceptance.
  - CPU execution is supported and can be slower. In one measurement on an Intel iMac (Core
    i5-10500, AMD Radeon Pro 5300 4 GB), Cellpose-SAM took 444.5 s on the CPU and 3.2 s on
    Metal for one 256×256 image, using torch 2.2.2, Python 3.12.11 and macOS 26.5.2. This
    is a historical example, not a speed guarantee. GPU acceleration requires a usable backend
    and compatible libraries. See the `recorded hardware measurement <features/new/319_use_non_nvidia_accelerators_where_they_exist.txt>`_.
- h2: Install spaCR
- p: 'Choose an install route:'
- list:
  - '**Desktop application**: a Linux, macOS or Windows installer with its own Python.'
  - '**pip**: ``python -m pip install spacr`` in a Conda environment.'
  - '**conda-forge**: ``conda install conda-forge::spacr`` in a Conda environment.'
  - '**Docker**: the command-line pipelines in a Linux container, from the CPU image
    or the NVIDIA GPU image:'
- code: |-
    docker run --rm ghcr.io/einarolafsson/spacr:1.5.1.4 spacr-run --list
    docker run --rm --gpus all ghcr.io/einarolafsson/spacr:1.5.1.4-cuda12.4 spacr-run --list
  lang: bash
- p: The `Docker guide (nightly, English) <https://github.com/EinarOlafsson/spacr/blob/nightly/docs/source/installer_guide.rst#container-images>`_
    covers GPU setup, data mounts and pipeline commands.
- h3: Desktop application
- p: The installers bundle their own Python. Conda is not required.
- generated: installer-links
- p: 'On Linux, make the downloaded file executable and run it:'
- code: |-
    chmod +x SpaCR-*-Linux-x86_64-Online.run
    ./SpaCR-*-Linux-x86_64-Online.run
  lang: bash
- p: On macOS, open the ``.pkg``. The current beta is not notarized; if Gatekeeper
    blocks it, choose **System Settings → Privacy & Security → Open Anyway**.
- p: For installation, updates, reinstallation, uninstallation, offline use and troubleshooting,
    see the `current nightly installer guide (English) <https://github.com/EinarOlafsson/spacr/blob/nightly/docs/source/installer_guide.rst>`_.
    See `system requirements <docs/source/system_requirements.rst>`_ for workstation
    and server recommendations and GPU compatibility tables.
- h3: PyPI installation
- p: 'For the PyPI release, install spaCR with pip inside a Conda environment. Python
    3.12 has the widest choice of optional scientific packages:'
- code: |-
    conda create -n spacr python=3.12 -y
    conda activate spacr
    python -m pip install --upgrade pip
    python -m pip install spacr
    spacr
  lang: bash
- p: spaCR supports Python **3.9 through 3.14**, except Python 3.14.1, which torchvision
    excludes. Linux is recommended for the heaviest CUDA and ROCm workflows; macOS
    and Windows are also supported, and both use their GPUs — macOS through Metal,
    which covers Apple Silicon and the AMD cards in Intel Macs, and Windows through
    CUDA or DirectML.
- p: 'The standard installation includes the Qt desktop interface. For a server,
    cluster or CI runner, run the command-line pipelines without opening it:'
- code: |-
    python -m pip install spacr
    spacr-run --list
  lang: bash
- p: Optional integrations are installed separately, for example ``spacr[zarr]``,
    ``spacr[omero]``, ``spacr[napari]`` and ``spacr[czi,nd2,lif]``. See the `installation
    guide (nightly, English) <https://github.com/EinarOlafsson/spacr/blob/nightly/docs/source/installer_guide.rst>`_
    for the complete extras and Python-version compatibility table.
- h3: Conda-forge installation
- p: 'The official conda-forge package installs spaCR and its desktop dependencies
    into the active environment:'
- code: |-
    conda create -n spacr python=3.12 -y
    conda activate spacr
    conda install conda-forge::spacr
    spacr
  lang: bash
- h3: Install from source
- p: 'Clone the repository and install it in editable mode, so your working copy
    *is* the installed package and edits take effect without reinstalling::'
- code: |-
    git clone https://github.com/EinarOlafsson/spacr.git
    cd spacr
    conda create -n spacr python=3.12 -y
    conda activate spacr
    pip install -e .
    spacr
  lang: bash
- p: 'This clones ``main``, the default branch, which carries the latest release.
    Development happens on ``nightly``; add ``--branch nightly`` to clone it instead.
    For a specific release::'
- code: git clone --branch v1.5.0.5 https://github.com/EinarOlafsson/spacr.git
  lang: bash
- p: 'To pull later changes, from inside the clone::'
- code: |-
    git pull
    pip install -e .
  lang: bash
- p: Reinstall when dependencies or entry points change. Python edits take effect
    directly; ``spacr-doctor`` identifies the active installation.
- h3: Install from source (light)
- p: 'Contributors need history; to run spaCR, choose below. Measurements: ``nightly``
    at ``05302fd5c`` on 2026-10-07, using ``packaging/measure_clone_forms.sh``::'
- code: |-
    # One commit instead of every version: 2048 MB downloaded, 140 s.
    # No history, so no git log, no git blame and no git bisect.
    # git pull still works, but stays shallow until git fetch --unshallow.
    git clone --depth 1 --branch nightly https://github.com/EinarOlafsson/spacr.git
    cd spacr && pip install -e .

    # Runtime files: 104 MB on disk, 6 s (Git: 38 MB; files: 66 MB).
    # No history, docs, tests, tools, features or example data.
    # --with-docs, --with-tests and --with-translations put those back;
    # --dir, --branch, --no-install and --help do the obvious things.
    # packaging/source_install_excludes.txt lists every skipped path.
    curl -fsSL https://raw.githubusercontent.com/EinarOlafsson/spacr/nightly/packaging/install_from_source.sh -o install_spacr.sh
    sh install_spacr.sh --branch nightly
  lang: bash
- p: 'The full nightly clone downloaded 9.25 GiB. Adding ``--filter=blob:none`` to
    the shallow clone does not reduce the checkout: its object store is still 2032
    MB. Git does not report lazy blob fetches, so no download total was measured.
    The nightly tracked tree is a 4657 MB checkout (measured 2026-10-15), excluding
    Git history. Download sizes and times vary with the branch.'
- h2: Command-line entry points
- code: |-
    spacr                                      # launch the Qt application
    spacr-doctor                               # diagnose the installation
    spacr-run --list                           # list headless modules
    spacr-run --describe MODULE                # inspect a module contract
    spacr-run MODULE --settings settings.csv   # execute a module
    spacr-run validate --module MODULE \
        --settings settings.csv                # validate before running
    spacr-repro RUN_DIR                        # replay a recorded run
    spacr-download --list                      # what example data exists
    spacr-download measure annotate            # fetch example sets by name
    spacr-make-masks --folder DIR              # curate masks as a resumable queue
    spacr-make-masks --folder DIR --order easy --limit 50
  lang: bash
- p: '``spacr-run --list`` lists modules with headless command-line entry points.
    GUI-only annotation, curation, comparison and exploration modules are omitted.'
- h3: Core workflow
- p: 'The primary workflow comprises six modules:'
- list:
  - '**Mask** segments cells, nuclei, pathogens and organelles with Cellpose.'
  - '**Measure** writes morphology, intensity, texture, spatial and colocalization
    features, together with object crops, to SQLite.'
  - '**Annotate** labels crops in a keyboard-driven grid and supports active-learning
    queues.'
  - '**Classify** trains image or measurement-based models and records held-out performance
    with each checkpoint.'
  - '**Map Barcodes** maps FASTQ reads to wells and gRNAs, with abundance, collision
    and coverage QC.'
  - '**Regression** estimates guide, gene, condition and control effects with model
    families suited to continuous, fractional and count responses.'
- h3: spaCR modules
- generated: workflow
- p: 'Every module with a Home tile, in Home''s order: the six pipeline modules first,
    then the rest. Select a tile to open that module''s API page.'
- h2: Other resources
- list:
  - '`Interactive tutorials <https://einarolafsson.github.io/spacr/tutorials/>`_
    — guided workflows from installation through hit investigation.'
  - '`Python API quickstart <docs/source/python_api.rst>`_ — run and validate pipelines
    from scripts, notebooks or a cluster.'
  - '`Feature guide <docs/source/features.rst>`_ — capabilities, maturity and optional
    integrations.'
  - '`Curated API reference <https://einarolafsson.github.io/spacr/api/index.html>`_
    — supported entry points by task, with the complete module reference one level
    deeper.'
  - '`Language & translation guide <docs/source/localization.rst>`_ — interface languages,
    contextual help and scientific-output policy.'
- h2: Language & translation
- p: The interface supports ten languages across navigation and Preferences. AI and
    LIVE controls, module descriptions and reviewed contextual help are also translated.
    Change the language under **spaCR → Preferences → Language** without restarting.
    Logs, paths, database values and measurements are never translated; scientific
    output remains canonical English. See the `contextual-help policy <docs/source/localization.rst#contextual-help>`_.
- p: The nine non-English catalogs are machine-drafted and technically reviewed rather
    than read end to end by a native speaker. The `review scope <docs/i18n/REVIEW_SCOPE_2026-09-04.md>`_
    records which languages have had a human pass and every term left in English
    by decision.
- h2: Animated setting guidance
- p: Settings with a visual explanation offer an **Animation** control in their tooltip.
    Browse the `setting animation gallery <https://einarolafsson.github.io/spacr/setting_animations.html>`_
    or the `Setting animation registry <https://einarolafsson.github.io/spacr/api/spacr/setting_animations/index.html>`_.
